# Permanent redirects for legacy /projects/* public HTML/PWA paths → root.
# Live NDIC traffic snapshot overlay via R2 when LIVE_TRAFFIC_ENABLED=true.
name = "infouzel-site-redirects"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "577868e9aac9c289e9323100f68fad16"
workers_dev = false

[[routes]]
pattern = "infouzel.cz/projects*"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/projects*"
zone_name = "infouzel.cz"

[vars]
# Cutover: R2 is authoritative for traffic_offline_snapshot when true (Pages fallback if R2 empty).
LIVE_TRAFFIC_ENABLED = "true"

[[r2_buckets]]
binding = "TRAFFIC_LIVE"
bucket_name = "iu-ndic-traffic-live"

[observability]
enabled = true
