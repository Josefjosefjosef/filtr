# Permanent redirects for legacy /projects/* public HTML/PWA paths → root.
# Live NDIC traffic snapshot overlay via R2 when LIVE_TRAFFIC_ENABLED=true.
name = "infouzel-site-redirects"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "577868e9aac9c289e9323100f68fad16"
workers_dev = false

[[routes]]
pattern = "infouzel.cz/projects*"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/projects*"
zone_name = "infouzel.cz"

# XSS-CSP-01/02: HTML documents — promote meta CSP to HTTP response header.
# Assets (/assets/*, /sw.js, JSON) are intentionally NOT routed here.
[[routes]]
pattern = "infouzel.cz/"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/"
zone_name = "infouzel.cz"

[[routes]]
pattern = "infouzel.cz/index.html"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/index.html"
zone_name = "infouzel.cz"

[[routes]]
pattern = "infouzel.cz/statistiky*"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/statistiky*"
zone_name = "infouzel.cz"

[[routes]]
pattern = "infouzel.cz/zdroje-a-licence*"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/zdroje-a-licence*"
zone_name = "infouzel.cz"

[[routes]]
pattern = "infouzel.cz/bot*"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/bot*"
zone_name = "infouzel.cz"

# EXT-CSP-SECONDARY-01: SW offline fallback document
[[routes]]
pattern = "infouzel.cz/offline.html"
zone_name = "infouzel.cz"

[[routes]]
pattern = "www.infouzel.cz/offline.html"
zone_name = "infouzel.cz"

[vars]
# Cutover: R2 is authoritative for traffic_offline_snapshot when true (Pages fallback if R2 empty).
LIVE_TRAFFIC_ENABLED = "true"

[[r2_buckets]]
binding = "TRAFFIC_LIVE"
bucket_name = "iu-ndic-traffic-live"

# NOTE: [limits] cpu_ms is Paid-only; Free plan rejects deploy (API 100328).
# Mitigations for empty-body 503: snapshot-raw-v1 wire (no Worker JSON.parse of ~8MiB)
# + client bounded retry for true transient edge failures.

[observability]
enabled = true
