# Target URL: https://steep-term-ba60.josef-zmrhal.workers.dev
# Worker name MUST match subdomain label (steep-term-ba60).
# Entrypoint MUST be src/index.mjs (decodeVinHandler + /health).
#
# Live proof after deploy:
#   GET /health  -> {"ok":true,"worker":"up"}  (NOT {"error":"Not found"})
#   GET /vin?vin=123 -> JSON with "success":false and Czech VIN message (NOT {"error":"Invalid VIN"})
