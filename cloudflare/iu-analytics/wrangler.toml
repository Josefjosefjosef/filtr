# InfoUzel Analytics — serverless anonymous aggregate stats (Workers).
# Site hosting: GitHub Pages. Analytics backend: Cloudflare Workers.
# Source of truth: Cloudflare D1 (binding DB). HTTP Cache-Control only for public GET.
# Deploy workflow injects real database_id + applies migrations before wrangler deploy.
# Secret: ADMIN_TOKEN
#
# account_id is required for Account API tokens that cannot call User /memberships.
name = "infouzel-analytics"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "577868e9aac9c289e9323100f68fad16"

[observability]
enabled = true

[vars]
PUBLIC_CACHE_SECONDS = "60"
# Exact browser origins only (comma-separated). Never use "*" (fail-closed → production defaults).
CORS_ALLOW_ORIGIN = "https://infouzel.cz,https://www.infouzel.cz"

# Placeholder id replaced by deploy workflow after D1 create/list.
[[d1_databases]]
binding = "DB"
database_name = "iu-analytics"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
