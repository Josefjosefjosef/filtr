# InfoUzel Analytics — serverless anonymous aggregate stats (Workers).
# Site hosting: GitHub Pages. Analytics backend: Cloudflare Workers.
# Storage: Cache API aggregates by default (no D1 permission required).
# Optional future: bind D1 when CLOUDFLARE_API_TOKEN has D1:Edit.
# Deploy: npm ci && npx wrangler deploy
# Secret: ADMIN_TOKEN (optional until set)
name = "infouzel-analytics"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[observability]
enabled = true

[vars]
PUBLIC_CACHE_SECONDS = "300"
CORS_ALLOW_ORIGIN = "*"
