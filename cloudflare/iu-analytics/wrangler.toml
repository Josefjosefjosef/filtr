# InfoUzel Analytics — serverless anonymous aggregate stats (Workers).
# Site hosting: GitHub Pages. Analytics backend: Cloudflare Workers.
# Storage: Workers KV (preferred, durable) → Cache API fallback → optional D1 later.
# Deploy: npm ci && npx wrangler deploy
# Secret: ADMIN_TOKEN (optional until set)
name = "infouzel-analytics"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[observability]
enabled = true

[vars]
PUBLIC_CACHE_SECONDS = "60"
CORS_ALLOW_ORIGIN = "*"

# Binding id is injected by deploy workflow (Ensure KV namespace step).
# Local / missing id → Worker falls back to Cache API store.
# [[kv_namespaces]]
# binding = "ANALYTICS_KV"
# id = "REPLACE_AT_DEPLOY"
