# CJ affiliate archive controlled deploy — same Worker name, alternate entry + D1 migration dir.
name = "infouzel-ads"
main = "src/index-cj-affiliate-archive.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "577868e9aac9c289e9323100f68fad16"
workers_dev = false

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[observability]
enabled = true

[vars]
ADS_SAFE_MODE = "true"
ADS_PUBLIC_DELIVERY_ENABLED = "false"
ADS_ADMIN_API_ENABLED = "false"
ADS_CLIENT_API_ENABLED = "false"
ADS_CJ_AFFILIATE_ARCHIVE_ENABLED = "false"
CORS_ALLOW_ORIGIN = "https://infouzel.cz"
PREMIUM_DEV_OPERATIONAL_RESET_ENABLED = "1"

[[d1_databases]]
binding = "DB"
database_name = "iu-ads"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations-cj-affiliate-archive"

[[r2_buckets]]
binding = "CREATIVES"
bucket_name = "iu-ads-creatives"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "iu-ads-documents"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "iu-ads-backups"

[triggers]
crons = ["0 */6 * * *"]
