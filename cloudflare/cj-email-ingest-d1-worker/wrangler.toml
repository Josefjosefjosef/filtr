# Staging-only CJ email ingest D1 Worker — DO NOT deploy without approval.
name = "iu-cj-email-ingest-d1-staging"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "staging"

[[d1_databases]]
binding = "DB"
database_name = "iu-cj-email-ingest-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secret (not in repo): wrangler secret put IU_CJ_D1_WORKER_INGEST_TOKEN

# Optional isolated staging env (requires Cloudflare GO to create D1/R2 resources).
[env.staging]
name = "iu-cj-email-ingest-d1-staging"
account_id = "577868e9aac9c289e9323100f68fad16"

# Single source of truth for staging plain-text vars (including GO flags).
# Arm/disarm patches this table then deploys WITHOUT --keep-vars.
# Secrets (PAT/ingest) are never listed here and are preserved by wrangler.
[env.staging.vars]
ENVIRONMENT = "staging"
IU_CJ_STAGING_ONLY = "1"
CJ_STAGING_ARCHIVE_ONLY = "1"
IU_CJ_PUBLISHER_CID = "7667828"
IU_CJ_WEBSITE_PID = "101883843"
IU_CJ_STAGING_CJ_API_PROBE_APPROVED = "0"
IU_CJ_CJ_API_HTTP_EXECUTE = "0"
IU_CJ_STAGING_CJ_API_PROBE_EXECUTE = "0"
IU_CJ_CJ_API_MAX_REQUESTS_PER_PROBE = "1"
IU_CJ_STAGING_PROBE_LOCK_KEY = "link_search_coupon_v1"

# Secrets (Dashboard or wrangler secret put --env staging): IU_CJ_D1_WORKER_INGEST_TOKEN, CJ_API_PAT

[[env.staging.d1_databases]]
binding = "DB"
database_name = "iu-cj-email-ingest-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "BANNER_ASSETS"
bucket_name = "iu-cj-banner-assets-staging"
preview_bucket_name = "iu-cj-banner-assets-staging-preview"
