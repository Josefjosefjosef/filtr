<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Zprávy  náhled">
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="0.55" stop-color="#1b3550"/>
      <stop offset="1" stop-color="#0b1f33"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background: studio gradient -->
  <rect width="640" height="420" fill="url(#g0)"/>

  <!-- Soft bokeh lights -->
  <g opacity="0.55" filter="url(#blur)">
    <circle cx="520" cy="110" r="62" fill="#ffd36a"/>
    <circle cx="455" cy="165" r="34" fill="#7dd3fc"/>
    <circle cx="560" cy="205" r="46" fill="#fb7185"/>
    <circle cx="390" cy="120" r="26" fill="#a7f3d0"/>
  </g>

  <!-- Silhouette: reporter + podium -->
  <g opacity="0.9">
    <path d="M278 152c20 0 36 16 36 36s-16 36-36 36-36-16-36-36 16-36 36-36z" fill="rgba(255,255,255,0.10)"/>
    <path d="M228 340c10-56 38-88 86-88s76 32 86 88" fill="rgba(255,255,255,0.10)"/>
    <rect x="240" y="272" width="160" height="120" rx="14" fill="rgba(255,255,255,0.08)"/>
  </g>

  <!-- Microphones cluster -->
  <g filter="url(#soft)">
    <g opacity="0.95">
      <rect x="285" y="238" width="14" height="74" rx="6" fill="rgba(255,255,255,0.14)"/>
      <rect x="319" y="232" width="14" height="80" rx="6" fill="rgba(255,255,255,0.16)"/>
      <rect x="353" y="240" width="14" height="72" rx="6" fill="rgba(255,255,255,0.14)"/>
      <path d="M277 242c0-18 30-28 50-28s50 10 50 28c0 14-22 22-50 22s-50-8-50-22z" fill="rgba(255,255,255,0.16)"/>
      <path d="M290 246c0-10 18-16 37-16s37 6 37 16c0 8-16 13-37 13s-37-5-37-13z" fill="rgba(0,0,0,0.18)"/>
    </g>
  </g>

  <!-- Subtle top sheen -->
  <rect width="640" height="220" fill="url(#g1)" opacity="0.8"/>
</svg>
