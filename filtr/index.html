<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>infoUzel.cz</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --bg:#ffffff;
      --text:rgba(11,27,43,0.92);
      --muted:rgba(11,27,43,0.62);
      --hair:rgba(20,40,70,0.12);
      --card:#ffffff;
      --radius:14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    html,body{height:100%;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--sans);
    }
    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:18px 14px 60px;
    }
    header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      padding:8px 2px 14px;
      border-bottom:1px solid var(--hair);
      margin-bottom:16px;
    }
    h1{
      margin:0;
      font-size:22px;
      letter-spacing:0.2px;
    }
    .statusLine{
      font-size:13px;
      color:var(--muted);
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      text-align:right;
    }
    .pill{
      border:1px solid var(--hair);
      border-radius:999px;
      padding:4px 10px;
      background:rgba(0,0,0,0.02);
      color:var(--muted);
      font-size:12px;
      line-height:1;
      user-select:none;
    }
    .btn{
      border:1px solid var(--hair);
      background:var(--card);
      color:var(--text);
      border-radius:10px;
      padding:7px 10px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:hover{ background:rgba(0,0,0,0.03); }
    .feed{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--hair);
      border-radius:var(--radius);
      padding:12px 12px;
    }
    .titleRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .card h2{
      margin:0;
      font-size:16px;
      line-height:1.25;
    }
    .meta{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .meta a{ color:inherit; }
    .empty{
      border:1px dashed var(--hair);
      border-radius:var(--radius);
      padding:16px;
      color:var(--muted);
      background:rgba(0,0,0,0.015);
    }
    .debug{
      margin-top:14px;
      border:1px solid var(--hair);
      border-radius:var(--radius);
      overflow:hidden;
      display:none;
    }
    .debugHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      background:rgba(0,0,0,0.03);
      border-bottom:1px solid var(--hair);
      color:var(--muted);
      font-size:12px;
    }
    .debug pre{
      margin:0;
      padding:12px;
      font-family:var(--mono);
      font-size:12px;
      line-height:1.35;
      max-height:380px;
      overflow:auto;
      background:#fbfbfb;
    }
    footer{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>infoUzel.cz</h1>
      </div>
      <div class="statusLine">
        <span class="pill" id="dataStatus">Stav dat: načítám…</span>
        <button class="btn" id="toggleDebugBtn" type="button">Zapnout debug</button>
      </div>
    </header>

    <main id="feed" class="feed"></main>

    <section id="debugPanel" class="debug" aria-label="Debug panel">
      <div class="debugHead">
        <span>Režim práce s daty (debug)</span>
        <span id="debugHint">?debug=1 nebo localStorage iu:debug=1</span>
      </div>
      <pre id="debugOut"></pre>
    </section>

    <footer>
      <div>Data se načítají z <code>./data/articles.json</code>. Pokud soubor dočasně neexistuje, stránka se stále zobrazí a nabídne debug.</div>
    </footer>
  </div>

  <script defer src="./assets/app.js"></script>
</body>
</html>
