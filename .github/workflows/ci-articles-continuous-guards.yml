# Continuous articles aggregation guards: schedule model, watchdog, prod liveness.
name: CI - Articles continuous guards

on:
  workflow_dispatch: {}
  schedule:
    - cron: "25 */4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-articles.yml"
      - ".github/workflows/ci-articles-continuous-guards.yml"
      - "scripts/articles-continuous-update-guard.mjs"
      - "scripts/articles-schedule-guard.mjs"
      - "scripts/articles-watchdog-guard.mjs"
      - "scripts/source-rotation-guard.mjs"
      - "scripts/source-frequency-guard.mjs"
      - "scripts/incremental-publish-guard.mjs"
      - "scripts/priority-source-freshness-guard.mjs"
      - "scripts/crawler-identity-guard.mjs"
      - "scripts/robots-compliance-guard.mjs"
      - "scripts/backpressure-guard.mjs"
      - "scripts/publish-continuity-guard.mjs"
      - "scripts/same-topic-overexposure-guard.mjs"
      - "scripts/topic-dedupe-false-positive-guard.mjs"
      - "scripts/duplicate-metadata-guard.mjs"
      - "scripts/content-freshness-guard.mjs"
      - "scripts/content-freshness-guard-lib.mjs"
      - "scripts/content-freshness-guard-policy-unit.mjs"
      - "scripts/active-article-trace-guard.mjs"
      - "scripts/production-liveness-guard.mjs"
      - "scripts/release-freshness-gate.mjs"
      - "scripts/p0-source-starvation-guard.mjs"
      - "scripts/p0-source-coverage-guard.mjs"
      - "scripts/pipeline-runtime-guard.mjs"
      - "scripts/test_iu_registry_p0_freshness.py"
      - "scripts/aggregator-legacy-cleanup-guard.mjs"
      - "scripts/archive/deprecated/aggregator-v2/**"
      - "scripts/iu_topic_dedupe.py"
      - "scripts/test_iu_topic_dedupe.py"
      - "scripts/iu_crawler.py"
      - "scripts/iu_backpressure.py"
      - "scripts/iu_registry.py"
      - "scripts/source_rotation_inventory.py"
      - "projects/data/source_rotation_inventory.json"
      - "cloudflare/articles-watchdog/**"
  pull_request:
    paths:
      - ".github/workflows/update-articles.yml"
      - ".github/workflows/ci-articles-continuous-guards.yml"
      - "scripts/articles-continuous-update-guard.mjs"
      - "scripts/articles-schedule-guard.mjs"
      - "scripts/articles-watchdog-guard.mjs"
      - "scripts/source-rotation-guard.mjs"
      - "scripts/source-frequency-guard.mjs"
      - "scripts/incremental-publish-guard.mjs"
      - "scripts/priority-source-freshness-guard.mjs"
      - "scripts/crawler-identity-guard.mjs"
      - "scripts/robots-compliance-guard.mjs"
      - "scripts/backpressure-guard.mjs"
      - "scripts/publish-continuity-guard.mjs"
      - "scripts/same-topic-overexposure-guard.mjs"
      - "scripts/topic-dedupe-false-positive-guard.mjs"
      - "scripts/duplicate-metadata-guard.mjs"
      - "scripts/content-freshness-guard.mjs"
      - "scripts/content-freshness-guard-lib.mjs"
      - "scripts/content-freshness-guard-policy-unit.mjs"
      - "scripts/active-article-trace-guard.mjs"
      - "scripts/production-liveness-guard.mjs"
      - "scripts/release-freshness-gate.mjs"
      - "scripts/p0-source-starvation-guard.mjs"
      - "scripts/p0-source-coverage-guard.mjs"
      - "scripts/pipeline-runtime-guard.mjs"
      - "scripts/test_iu_registry_p0_freshness.py"
      - "scripts/aggregator-legacy-cleanup-guard.mjs"
      - "scripts/archive/deprecated/aggregator-v2/**"
      - "scripts/iu_topic_dedupe.py"
      - "scripts/test_iu_topic_dedupe.py"
      - "scripts/iu_crawler.py"
      - "scripts/iu_backpressure.py"
      - "scripts/iu_registry.py"
      - "scripts/source_rotation_inventory.py"
      - "projects/data/source_rotation_inventory.json"
      - "cloudflare/articles-watchdog/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-articles-continuous-guards
  cancel-in-progress: false

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Articles schedule guard
        run: node scripts/articles-schedule-guard.mjs

  watchdog-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Articles watchdog guard
        env:
          WATCHDOG_HEALTH_URL: ${{ vars.ARTICLES_WATCHDOG_HEALTH_URL }}
          REQUIRE_ARTICLES_WATCHDOG: ${{ vars.REQUIRE_ARTICLES_WATCHDOG }}
        run: node scripts/articles-watchdog-guard.mjs

  continuous-update-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Articles continuous update guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WATCHDOG_HEALTH_URL: ${{ vars.ARTICLES_WATCHDOG_HEALTH_URL }}
          REQUIRE_AUTOMATIC_TRIGGER: ${{ vars.REQUIRE_ARTICLES_WATCHDOG }}
        run: node scripts/articles-continuous-update-guard.mjs

  source-rotation-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate source rotation inventory
        run: python scripts/source_rotation_inventory.py
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Source rotation guard
        run: node scripts/source-rotation-guard.mjs
      - name: Source frequency guard
        run: node scripts/source-frequency-guard.mjs
      - name: Incremental publish guard
        env:
          REQUIRE_INCREMENTAL_PUBLISH_ENV: "1"
        run: node scripts/incremental-publish-guard.mjs
      - name: Priority source freshness guard
        env:
          ARTICLES_JSON_PATH: ${{ github.workspace }}/projects/data/articles.json
        run: node scripts/priority-source-freshness-guard.mjs

      - name: Crawler identity guard
        run: node scripts/crawler-identity-guard.mjs

      - name: Robots compliance guard
        run: node scripts/robots-compliance-guard.mjs

      - name: Backpressure guard
        run: node scripts/backpressure-guard.mjs

      - name: Publish continuity guard
        run: node scripts/publish-continuity-guard.mjs

      - name: Topic dedupe false-positive guard
        run: node scripts/topic-dedupe-false-positive-guard.mjs

      - name: Content freshness policy unit tests
        run: node scripts/content-freshness-guard-policy-unit.mjs

      - name: Duplicate metadata guard
        run: node scripts/duplicate-metadata-guard.mjs

      - name: Aggregator legacy cleanup guard
        run: node scripts/aggregator-legacy-cleanup-guard.mjs

      - name: Content freshness guard (prod articles.json)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTICLES_JSON_URL: https://infouzel.cz/projects/data/articles.json
          CONTENT_FRESHNESS_WARN_MINUTES: "60"
          CONTENT_FRESHNESS_FAIL_MINUTES: "120"
        run: node scripts/content-freshness-guard.mjs

      - name: Active article trace guard (prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTICLES_JSON_URL: https://infouzel.cz/projects/data/articles.json
          TRACE_SAMPLE_COUNT: "5"
          TRACE_MAX_AGE_HOURS: "6"
        run: node scripts/active-article-trace-guard.mjs

      - name: Production liveness guard (prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTICLES_JSON_URL: https://infouzel.cz/projects/data/articles.json
          LIVENESS_WINDOWS_HOURS: "1,2,4"
          LIVENESS_MIN_PER_SECTION_2H: "1"
        run: node scripts/production-liveness-guard.mjs

      - name: P0 source coverage guard (prod)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARTICLES_JSON_URL: https://infouzel.cz/projects/data/articles.json
          P0_COVERAGE_MAX_AGE_HOURS: "4"
          P0_COVERAGE_MIN_ARTICLES: "1"
        run: node scripts/p0-source-coverage-guard.mjs

      - name: Pipeline runtime guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PIPELINE_RUNTIME_WARN_MINUTES: "45"
          PIPELINE_RUNTIME_FAIL_MINUTES: "60"
        run: node scripts/pipeline-runtime-guard.mjs

      - name: P0 source starvation guard (local scheduler when present)
        env:
          SCHEDULER_STATE_PATH: ${{ github.workspace }}/projects/data/scheduler_state.json
          FEED_HEALTH_PATH: ${{ github.workspace }}/projects/data/feed_health.json
          P0_STARVATION_ALLOW_MISSING_STATE: "1"
          P0_STARVATION_WARN_MINUTES: "60"
          P0_STARVATION_FAIL_MINUTES: "120"
        run: node scripts/p0-source-starvation-guard.mjs
