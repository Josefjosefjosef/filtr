# Phase 3I: create dedicated R2 bucket iu-cj-managed-public-live (no worker deploy).
# Isolated from NDIC TRAFFIC_LIVE / CHMI / CNB. Does not arm CJ public live.
name: Ensure CJ managed-public R2 bucket

on:
  workflow_dispatch: {}

concurrency:
  group: ensure-cj-managed-public-r2-bucket
  cancel-in-progress: false

jobs:
  ensure-bucket:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare/iu-site-redirects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-site-redirects/package-lock.json

      - name: Install
        run: npm ci

      - name: Ensure R2 bucket iu-cj-managed-public-live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ADS_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_ADS_API_TOKEN:-}" ]; then
            echo "BLOCKER=CLOUDFLARE_API_TOKEN_MISSING"
            exit 1
          fi
          R2_TOKEN="${CLOUDFLARE_ADS_API_TOKEN:-$CLOUDFLARE_API_TOKEN}"
          BUCKET="iu-cj-managed-public-live"
          LIST_OUT="$(CLOUDFLARE_API_TOKEN="$R2_TOKEN" npx wrangler r2 bucket list 2>/tmp/r2-list.err || true)"
          if printf '%s' "$LIST_OUT" | grep -q "$BUCKET"; then
            echo "R2_BUCKET_EXISTS=$BUCKET"
            echo "COST_NOTE=no_new_bucket_no_new_paid_plan"
            exit 0
          fi
          if CLOUDFLARE_API_TOKEN="$R2_TOKEN" npx wrangler r2 bucket create "$BUCKET"; then
            echo "R2_BUCKET_CREATED=$BUCKET"
            echo "COST_NOTE=standard_r2_bucket_within_existing_account"
            exit 0
          fi
          echo "R2_BUCKET_CREATE_FAILED"
          if [ -s /tmp/r2-list.err ]; then
            # Never print tokens; only wrangler error class
            grep -E 'Error|code|Paid|permission|Unauthorized|forbidden' /tmp/r2-list.err | head -n 20 || true
          fi
          exit 1
