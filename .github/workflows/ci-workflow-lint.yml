name: CI - Workflow Lint

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"

permissions:
  contents: read

concurrency:
  group: ci-workflow-lint
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -e
          curl -sSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/latest/download/actionlint_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint workflows
        run: |
          actionlint -color
