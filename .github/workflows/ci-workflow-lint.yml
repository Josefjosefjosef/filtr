name: CI - Workflow Lint

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"

permissions:
  contents: read

concurrency:
  group: ci-workflow-lint
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Anti-log scan
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            "Error: Process completed"
            "Run set -euo pipefail"
            "/home/runner/work/_temp/"
          )
          for pattern in "${patterns[@]}"; do
            if grep -qF "$pattern" .github/workflows/*.yml; then
              echo "FAIL: forbidden log signature found in workflows: $pattern"
              exit 1
            fi
          done

      - name: Install actionlint (stable installer)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color
