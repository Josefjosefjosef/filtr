name: CI workflow lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Run yamllint on workflows
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/yamllint.yml <<'EOF'
extends: default
rules:
  line-length: disable
EOF
          yamllint -c /tmp/yamllint.yml .github/workflows

      - name: Validate bash snippets (basic)
        shell: bash
        run: |
          set -euo pipefail
          # Validate only inline bash scripts inside YAML blocks with "shell: bash" + "run: |"
          # This avoids false positives and weird parsing across multiple steps/files.
          python - <<'PY'
import pathlib
import re
import subprocess
import sys
from tempfile import NamedTemporaryFile

root = pathlib.Path(".github/workflows")
files = sorted(root.glob("*.yml")) + sorted(root.glob("*.yaml"))

block_re = re.compile(r'^[ \t]*run:\s*\|\s*$')
shell_bash_re = re.compile(r'^[ \t]*shell:\s*bash\s*$')
indent_re = re.compile(r'^([ \t]+)')

def extract_blocks(text: str):
    lines = text.splitlines()
    i = 0
    blocks = []
    while i < len(lines):
        # Look for "shell: bash" near "run: |" (same step)
        if shell_bash_re.match(lines[i]):
            # Scan forward a bit for run: |
            j = i + 1
            while j < len(lines) and j <= i + 10:
                if block_re.match(lines[j]):
                    # Determine indentation of the run block content
                    j += 1
                    if j >= len(lines):
                        break
                    m = indent_re.match(lines[j])
                    if not m:
                        break
                    base_indent = m.group(1)
                    script_lines = []
                    while j < len(lines):
                        if lines[j].startswith(base_indent) or lines[j].strip() == "":
                            # strip exactly base_indent if present
                            if lines[j].startswith(base_indent):
                                script_lines.append(lines[j][len(base_indent):])
                            else:
                                script_lines.append("")
                            j += 1
                        else:
                            break
                    blocks.append("\n".join(script_lines).rstrip() + "\n")
                    i = j
                    break
                j += 1
        i += 1
    return blocks

had_error = False

for fp in files:
    text = fp.read_text(encoding="utf-8", errors="replace")
    blocks = extract_blocks(text)
    if not blocks:
        continue
    for idx, script in enumerate(blocks, start=1):
        with NamedTemporaryFile("w", delete=False, suffix=".sh") as tmp:
            tmp.write(script)
            tmp_path = tmp.name
        proc = subprocess.run(["bash", "-n", tmp_path], capture_output=True, text=True)
        if proc.returncode != 0:
            had_error = True
            sys.stderr.write(f"\nBash syntax error in {fp} (block #{idx}):\n")
            sys.stderr.write(proc.stderr or proc.stdout)
            sys.stderr.write("\n")
if had_error:
    sys.exit(1)
print("OK: bash snippets look syntactically valid for blocks with shell: bash + run: |")
PY
