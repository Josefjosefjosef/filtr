name: CI - Workflow Lint

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"

permissions:
  contents: read

concurrency:
  group: ci-workflow-lint
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Anti-log scan (only forbidden tokens)
        shell: bash
        run: |
          set -euo pipefail

          # Scan all workflow files EXCEPT this file itself
          if grep -RIn --line-number --fixed-strings "GET required:" .github/workflows \
             | grep -v "ci-workflow-lint.yml"; then
            echo "FAIL: found forbidden token 'GET required:' in workflows"
            exit 1
          fi

          if grep -RIn --line-number --fixed-strings "GET optional:" .github/workflows \
             | grep -v "ci-workflow-lint.yml"; then
            echo "FAIL: found forbidden token 'GET optional:' in workflows"
            exit 1
          fi

      - name: Install actionlint (stable installer)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'

