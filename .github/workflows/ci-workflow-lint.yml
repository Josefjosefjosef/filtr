name: CI - Workflow Lint

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"

permissions:
  contents: read

concurrency:
  group: ci-workflow-lint
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Anti-log scan (only dangerous tokens)
        shell: bash
        run: |
          set -euo pipefail

          # Only block patterns that we NEVER want to accidentally commit into workflows.
          # (Do NOT block generic runner errors like "Error: Process completed" — those appear in logs normally.)
          if grep -RIn --line-number --fixed-strings "GET required:" .github/workflows; then
            echo "FAIL: found forbidden token 'GET required:' in workflows"
            exit 1
          fi

          if grep -RIn --line-number --fixed-strings "GET optional:" .github/workflows; then
            echo "FAIL: found forbidden token 'GET optional:' in workflows"
            exit 1
          fi

          echo "OK: anti-log scan clean"

      - name: Install actionlint (stable installer)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          sudo mv ./actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color
