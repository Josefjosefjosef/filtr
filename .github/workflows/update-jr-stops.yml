name: Update JR Stops (CIS JR)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build JR stops
        run: node scripts/build_jr_stops_all.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add projects/data/jr_stops_all_min.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update JR stops (hourly)"
          git push

