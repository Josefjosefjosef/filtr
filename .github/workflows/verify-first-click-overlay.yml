name: Verify first-click overlay (prod)

on:
  workflow_dispatch:
  push:
    branches: [test/verify-first-click-overlay]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run production first-click overlay verify
        id: verify
        continue-on-error: true
        run: |
          node tools/verify-first-click-overlay.mjs
          echo $? > /tmp/verify_exit.txt

      - name: Ensure artifacts dir and verdict
        run: |
          mkdir -p tools/_artifacts
          if [ ! -f tools/_artifacts/verdict.txt ]; then
            echo "FIRST CLICK OVERLAY: FAIL — script crashed or no verdict" > tools/_artifacts/verdict.txt
          fi

      - name: Show verdict
        run: cat tools/_artifacts/verdict.txt

      - uses: actions/upload-artifact@v4
        with:
          name: first-click-overlay-artifacts
          path: tools/_artifacts/

      - name: Fail job if overlay verify failed
        run: exit "$(cat /tmp/verify_exit.txt 2>/dev/null || echo 1)"
