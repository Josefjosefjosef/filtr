name: Verify first-click overlay (prod)

on:
  workflow_dispatch:
  push:
    branches: [test/verify-first-click-overlay]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run verify
        id: verify
        continue-on-error: true
        run: node tools/verify-first-click-overlay.mjs

      - name: Show verdict
        run: cat tools/_artifacts/verdict.txt 2>/dev/null || echo "FIRST CLICK OVERLAY: FAIL — no verdict file"

      - name: Ensure artifacts dir exists
        if: always()
        run: |
          mkdir -p tools/_artifacts
          [ -f tools/_artifacts/verdict.txt ] || echo "FIRST CLICK OVERLAY: FAIL — no verdict file" > tools/_artifacts/verdict.txt
          [ -f tools/_artifacts/prod_console_errors.txt ] || echo "NO_CONSOLE_ERRORS" > tools/_artifacts/prod_console_errors.txt
          [ -f tools/_artifacts/prod_final_url.txt ] || echo "NO_URL (crash before navigation)" > tools/_artifacts/prod_final_url.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-click-overlay-artifacts
          path: tools/_artifacts/
