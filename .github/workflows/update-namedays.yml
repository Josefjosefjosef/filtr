name: Update Namedays

on:
  workflow_dispatch:
  schedule:
    - cron: "5 23 * * *"  # cca 00:05 Praha (v zimě), v létě se posune – nevadí

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure output folders
        run: |
          mkdir -p filtr/data

      - name: Run updater (namedays)
        env:
          OUTPUT_DIR: filtr/data
        run: node scripts/update-weather-namedays.js namedays

      - name: Sanity check
        run: |
          ls -la filtr/data
          head -c 200 filtr/data/namedays.json || true
          if [ -f filtr/data/namedays.json ]; then
            echo "OK: filtr/data/namedays.json exists"
          else
            echo "ERROR: namedays.json missing"
            exit 1
          fi

      - name: Validate generated JSON (publish root)
        run: |
          if python3 -c "import json; json.load(open('filtr/data/namedays.json','r',encoding='utf-8'))"; then
            echo "OK namedays"
          else
            echo "ERROR: filtr/data/namedays.json is not valid JSON"
            exit 1
          fi

      - name: Commit and push filtr/data/namedays.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add filtr/data/namedays.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update namedays"
          git push
