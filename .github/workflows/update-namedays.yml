name: Update Namedays

concurrency:
  group: data-writers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "5 23 * * *"  # cca 00:05 Praha (v zimě), v létě se posune – nevadí

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ensure output folders
        run: |
          mkdir -p projects/data

      - name: Debug script version
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Current branch: $(git branch --show-current)"
          node -e "const fs=require('fs'); const s=fs.readFileSync('scripts/update-weather-namedays.js','utf8'); console.log(s.includes('namedays-cz.json') && !s.includes('svatky.adresa.info') ? 'SCRIPT=NEW (offline)' : 'SCRIPT=OLD (has external URL)');"

      - name: Run updater (namedays)
        env:
          OUTPUT_DIR: projects/data
        run: node scripts/update-weather-namedays.js namedays

      - name: Sanity check
        run: |
          ls -la projects/data
          head -n 5 projects/data/namedays.json || true
          if [ -f projects/data/namedays.json ]; then
            echo "OK: projects/data/namedays.json exists"
            KEY_COUNT=$(python3 -c "import json; print(len(json.load(open('projects/data/namedays.json','r',encoding='utf-8'))))")
            echo "KEYS: $KEY_COUNT"
            if [ "$KEY_COUNT" -lt 300 ]; then
              echo "WARNING: Only $KEY_COUNT keys, expected >=300"
              exit 1
            fi
          else
            echo "ERROR: namedays.json missing"
            exit 1
          fi

      - name: Validate generated JSON (publish root)
        run: |
          if python3 -c "import json; json.load(open('projects/data/namedays.json','r',encoding='utf-8'))"; then
            echo "OK namedays"
          else
            echo "ERROR: projects/data/namedays.json is not valid JSON"
            exit 1
          fi

      - name: Commit & push (safe, rebase + retry)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "[DATA] No changes to commit."
            exit 0
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "[DATA] Nothing staged after add."
            exit 0
          fi

          git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true

          BRANCH="main"
          for i in 1 2 3; do
            echo "[PUSH] Attempt $i/3"
            git fetch origin "${BRANCH}"

            git rebase "origin/${BRANCH}" || (git rebase --abort && exit 1)

            if git push origin "HEAD:${BRANCH}"; then
              echo "[PUSH] Success."
              exit 0
            fi

            echo "[PUSH] Failed, retrying..."
            sleep 2
          done

          echo "[PUSH] Failed after retries."
          exit 1
