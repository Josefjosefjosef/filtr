name: CJ Affiliate email ingest (Forpsi IMAP)

# 24/7 without a local PC: GitHub Actions schedule.
# Live IMAP requires IU_FORPSI_IMAP_CONNECT_APPROVED=1 + USER/SECRET.
# Read-only EXAMINE + BODY.PEEK. Email = EMAIL_HINT_REQUIRES_CJ_RECONCILE only.
# CJ API remains the only authority for partner lifecycle changes.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest mode (periodic|historical)"
        required: false
        default: periodic
      run_forpsi_offline_cycle:
        description: "Also run FORPSI mock ingest via unattended runner (1=yes)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: cj-affiliate-email-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IU_FORPSI_IMAP_USER: ${{ secrets.IU_FORPSI_IMAP_USER }}
      IU_FORPSI_IMAP_SECRET: ${{ secrets.IU_FORPSI_IMAP_SECRET }}
      IU_FORPSI_IMAP_CONNECT_APPROVED: ${{ vars.IU_FORPSI_IMAP_CONNECT_APPROVED }}
      IU_FORPSI_IMAP_CREDENTIAL_SOURCE: process_env
      IU_FORPSI_IMAP_CHECKPOINT_DIR: ${{ github.workspace }}/.iu-forpsi-imap-checkpoint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Phase 3Q IMAP poll selftest (offline mock)
        run: node scripts/iu-cj-affiliate-phase3q-forpsi-live-imap-poll-v1-selftest.mjs

      - name: Forpsi operator gate (never prints secrets)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase3p-forpsi-operator-runbook-v1.mjs
          APPROVED="${IU_FORPSI_IMAP_CONNECT_APPROVED:-}"
          HAS_USER="0"
          HAS_SECRET="0"
          if [ -n "${IU_FORPSI_IMAP_USER:-}" ]; then HAS_USER="1"; fi
          if [ -n "${IU_FORPSI_IMAP_SECRET:-}" ]; then HAS_SECRET="1"; fi
          echo "CONNECT_APPROVED_SET=$([ "$APPROVED" = "1" ] && echo yes || echo no)"
          echo "IMAP_USER_CONFIGURED=$HAS_USER"
          echo "IMAP_SECRET_CONFIGURED=$HAS_SECRET"
          if [ "$APPROVED" != "1" ] || [ "$HAS_USER" != "1" ] || [ "$HAS_SECRET" != "1" ]; then
            echo "LIVE_IMAP=BLOCKED"
            echo "LIVE_IMAP_BLOCKED=1" >> "$GITHUB_ENV"
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_IMAP=AUTHORIZED_FLAGS_PRESENT"
            echo "LIVE_IMAP_BLOCKED=0" >> "$GITHUB_ENV"
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore IMAP checkpoint cache
        if: env.LIVE_IMAP_BLOCKED == '0'
        uses: actions/cache@v4
        with:
          path: .iu-forpsi-imap-checkpoint
          key: forpsi-imap-checkpoint-v1-${{ github.run_id }}
          restore-keys: |
            forpsi-imap-checkpoint-v1-

      - name: Offline mock ingest (when live blocked)
        if: env.LIVE_IMAP_BLOCKED == '1'
        shell: bash
        env:
          IU_CJ_EMAIL_INGEST_OFFLINE: "1"
          IU_CJ_GITHUB_INGEST_DRY_RUN: "1"
          IU_CJ_EMAIL_INGEST_MODE: ${{ github.event.inputs.mode || 'periodic' }}
          IU_CJ_OFFLINE_FIXTURE: "default"
          IU_CJ_D1_BACKEND: "mock"
          IU_CJ_D1_MOCK_PATH: ${{ github.workspace }}/.iu-cj-email-d1-checkpoint.json
          PRODUCTION_SIGNING_ENABLED: "false"
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-github-actions-ingest-runner.mjs

      - name: Optional FORPSI mock via unattended runner
        if: env.LIVE_IMAP_BLOCKED == '1' && github.event.inputs.run_forpsi_offline_cycle == '1'
        shell: bash
        env:
          IU_CJ_UNATTENDED_IMPORT_OFFLINE: "1"
          IU_CJ_UNATTENDED_RUN_FORPSI_OFFLINE: "1"
          IU_CJ_EMAIL_INGEST_OFFLINE: "1"
          IU_CJ_GITHUB_INGEST_DRY_RUN: "1"
          IU_CJ_D1_BACKEND: "mock"
          PRODUCTION_SIGNING_ENABLED: "false"
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-unattended-import-runner-v1.mjs

      - name: Live Forpsi IMAP poll (EXAMINE + BODY.PEEK; hint-only)
        if: env.LIVE_IMAP_BLOCKED == '0'
        id: live_poll
        shell: bash
        env:
          PRODUCTION_SIGNING_ENABLED: "false"
        run: |
          set -euo pipefail
          mkdir -p "$IU_FORPSI_IMAP_CHECKPOINT_DIR"
          set +e
          node scripts/iu-cj-affiliate-phase3q-forpsi-live-imap-poll-v1.mjs > /tmp/iu-forpsi-live-poll.json
          CODE=$?
          set -e
          # Never echo secrets; summary only (no message bodies).
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("/tmp/iu-forpsi-live-poll.json","utf8"));
            const summary={
              schema:j.schema,
              ok:j.ok,
              status:j.status,
              imapConnected:j.imapConnected,
              authSuccess:j.authSuccess,
              messagesChecked:j.messagesChecked,
              messagesInBatch:j.messagesInBatch,
              relevantHints:j.relevantHints,
              duplicates:j.duplicates,
              quarantined:j.quarantined,
              errors:j.errors,
              checkpointComplete:j.checkpoint&&j.checkpoint.complete,
              pendingAfterBatch:j.checkpoint&&j.checkpoint.pendingAfterBatch,
              uidvalidity:j.checkpoint&&j.checkpoint.uidvalidity,
              cjApiFollowUp:j.cjApiFollowUp,
              mutatePartners:j.mutatePartners,
              liveEnabled:j.liveEnabled,
              publishArmed:j.publishArmed,
              reason:j.reason||null
            };
            console.log(JSON.stringify(summary,null,2));
            fs.writeFileSync("/tmp/iu-forpsi-live-poll-summary.json", JSON.stringify(summary,null,2));
          '
          echo "IMAP_CONNECTED=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-forpsi-live-poll-summary.json","utf8")).imapConnected)')"
          echo "AUTH_SUCCESS=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-forpsi-live-poll-summary.json","utf8")).authSuccess)')"
          echo "MESSAGES_CHECKED=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-forpsi-live-poll-summary.json","utf8")).messagesChecked)')"
          echo "RELEVANT_HINTS=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-forpsi-live-poll-summary.json","utf8")).relevantHints)')"
          if [ "$CODE" -ne 0 ]; then
            echo "LIVE_IMAP_POLL=FAILED exit=$CODE"
            exit "$CODE"
          fi
          echo "LIVE_IMAP_POLL=OK"
          echo "Authority=CJ_API_ONLY"
          echo "False PASS forbidden: connect+auth+poll evidenced above"

      - name: Upload IMAP poll summary + checkpoint (no secrets / no bodies)
        if: always() && env.LIVE_IMAP_BLOCKED == '0'
        uses: actions/upload-artifact@v4
        with:
          name: iu-forpsi-live-imap-poll
          path: |
            /tmp/iu-forpsi-live-poll-summary.json
            .iu-forpsi-imap-checkpoint/
          if-no-files-found: warn
          retention-days: 14

      - name: Live ingest gate summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Live catalog mutation from email: FORBIDDEN"
          echo "Mailbox target: affiliate@infouzel.cz via imap.forpsi.com:993 TLS"
          echo "Required: IU_FORPSI_IMAP_CONNECT_APPROVED=1 + secrets IU_FORPSI_IMAP_USER/SECRET"
          echo "CJ API remains the only authority for partner lifecycle changes."
