name: CJ Affiliate email ingest (Forpsi IMAP)

# 24/7 without a local PC: GitHub Actions schedule.
# Phase 3R: IMAP drain → Workers AI events → CJ reconcile hints (DISARMED).
# Live IMAP requires IU_FORPSI_IMAP_CONNECT_APPROVED=1 + USER/SECRET.
# Read-only EXAMINE + BODY.PEEK. Email/AI never alone mutate catalog.
# CJ API remains the only authority for partner lifecycle changes.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest mode (periodic|historical)"
        required: false
        default: periodic
      run_forpsi_offline_cycle:
        description: "Also run FORPSI mock ingest via unattended runner (1=yes)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: cj-affiliate-email-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IU_FORPSI_IMAP_USER: ${{ secrets.IU_FORPSI_IMAP_USER }}
      IU_FORPSI_IMAP_SECRET: ${{ secrets.IU_FORPSI_IMAP_SECRET }}
      IU_FORPSI_IMAP_CONNECT_APPROVED: ${{ vars.IU_FORPSI_IMAP_CONNECT_APPROVED }}
      IU_FORPSI_IMAP_CREDENTIAL_SOURCE: process_env
      IU_FORPSI_IMAP_CHECKPOINT_DIR: ${{ github.workspace }}/.iu-forpsi-imap-checkpoint
      IU_FORPSI_IMAP_BATCH_SIZE: "80"
      IU_FORPSI_IMAP_MAX_BATCHES_PER_RUN: "4"
      # Cloudflare Workers AI (free Neurons; no new paid commitment)
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IU_CJ_WORKERS_AI_ENABLED: "1"
      IU_CJ_WORKERS_AI_HTTP_EXECUTE: "1"
      IU_CJ_AI_MAX_CALLS_PER_RUN: "40"
      IU_CJ_AI_MAX_CALLS_PER_DAY: "80"
      IU_CJ_WORKERS_AI_MODEL: "@cf/meta/llama-3.1-8b-instruct"
      # CJ API read verify (never publish)
      IU_CJ_PAT: ${{ secrets.IU_CJ_PAT }}
      IU_CJ_PUBLISHER_CID: ${{ secrets.IU_CJ_PUBLISHER_CID }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
      IU_CJ_CJ_API_ENABLED: "1"
      IU_CJ_CJ_API_HTTP_EXECUTE: "1"
      PRODUCTION_SIGNING_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Phase 3Q IMAP poll selftest (offline mock)
        run: node scripts/iu-cj-affiliate-phase3q-forpsi-live-imap-poll-v1-selftest.mjs

      - name: Phase 3R AI + reconcile + pipeline selftests (offline)
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase3r-ai-email-event-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3r-ai-to-cj-reconcile-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3r-pipeline-v1-selftest.mjs

      - name: Forpsi operator gate (never prints secrets)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase3p-forpsi-operator-runbook-v1.mjs
          APPROVED="${IU_FORPSI_IMAP_CONNECT_APPROVED:-}"
          HAS_USER="0"
          HAS_SECRET="0"
          if [ -n "${IU_FORPSI_IMAP_USER:-}" ]; then HAS_USER="1"; fi
          if [ -n "${IU_FORPSI_IMAP_SECRET:-}" ]; then HAS_SECRET="1"; fi
          echo "CONNECT_APPROVED_SET=$([ "$APPROVED" = "1" ] && echo yes || echo no)"
          echo "IMAP_USER_CONFIGURED=$HAS_USER"
          echo "IMAP_SECRET_CONFIGURED=$HAS_SECRET"
          if [ "$APPROVED" != "1" ] || [ "$HAS_USER" != "1" ] || [ "$HAS_SECRET" != "1" ]; then
            echo "LIVE_IMAP=BLOCKED"
            echo "LIVE_IMAP_BLOCKED=1" >> "$GITHUB_ENV"
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_IMAP=AUTHORIZED_FLAGS_PRESENT"
            echo "LIVE_IMAP_BLOCKED=0" >> "$GITHUB_ENV"
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore IMAP checkpoint cache
        if: env.LIVE_IMAP_BLOCKED == '0'
        uses: actions/cache@v4
        with:
          path: .iu-forpsi-imap-checkpoint
          key: forpsi-imap-checkpoint-v2-${{ github.run_id }}
          restore-keys: |
            forpsi-imap-checkpoint-v2-
            forpsi-imap-checkpoint-v1-

      - name: Restore durable checkpoint from prior successful artifact
        if: env.LIVE_IMAP_BLOCKED == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .iu-forpsi-imap-checkpoint
          # Prefer prior artifact over empty cache (cache can be evicted).
          PREV="$(gh run list --workflow=cj-affiliate-email-ingest.yml --status completed --limit 15 --json databaseId,conclusion,event -q '[.[] | select(.conclusion=="success")][0].databaseId' || true)"
          echo "PREV_SUCCESS_RUN=${PREV:-none}"
          if [ -n "${PREV:-}" ] && [ "$PREV" != "null" ]; then
            rm -rf /tmp/iu-prev-ckpt
            mkdir -p /tmp/iu-prev-ckpt
            if gh run download "$PREV" -n iu-forpsi-live-imap-poll -D /tmp/iu-prev-ckpt 2>/tmp/iu-prev-ckpt-err.txt; then
              if [ -d /tmp/iu-prev-ckpt/.iu-forpsi-imap-checkpoint ]; then
                cp -a /tmp/iu-prev-ckpt/.iu-forpsi-imap-checkpoint/. .iu-forpsi-imap-checkpoint/
                echo "DURABLE_CHECKPOINT_RESTORE=artifact_run_$PREV"
              elif [ -d /tmp/iu-prev-ckpt ]; then
                # artifact may flatten paths
                find /tmp/iu-prev-ckpt -type f -name '*.json' | head -n 20 || true
                if [ -f /tmp/iu-prev-ckpt/forpsi-sync-state.json ]; then
                  cp -a /tmp/iu-prev-ckpt/. .iu-forpsi-imap-checkpoint/ 2>/dev/null || true
                fi
                # common layout: downloaded files under nested folder
                if [ -d /tmp/iu-prev-ckpt/.iu-forpsi-imap-checkpoint ] || ls /tmp/iu-prev-ckpt/**/.iu-forpsi-imap-checkpoint 2>/dev/null; then
                  echo "DURABLE_CHECKPOINT_RESTORE=nested"
                fi
                echo "DURABLE_CHECKPOINT_RESTORE=attempted_run_$PREV"
              fi
            else
              echo "DURABLE_CHECKPOINT_RESTORE=no_artifact"
              cat /tmp/iu-prev-ckpt-err.txt 2>/dev/null || true
            fi
          else
            echo "DURABLE_CHECKPOINT_RESTORE=no_prior_success"
          fi
          # Never print message bodies; only file names.
          find .iu-forpsi-imap-checkpoint -type f -printf '%f\n' 2>/dev/null | head -n 20 || true

      - name: Offline mock ingest (when live blocked)
        if: env.LIVE_IMAP_BLOCKED == '1'
        shell: bash
        env:
          IU_CJ_EMAIL_INGEST_OFFLINE: "1"
          IU_CJ_GITHUB_INGEST_DRY_RUN: "1"
          IU_CJ_EMAIL_INGEST_MODE: ${{ github.event.inputs.mode || 'periodic' }}
          IU_CJ_OFFLINE_FIXTURE: "default"
          IU_CJ_D1_BACKEND: "mock"
          IU_CJ_D1_MOCK_PATH: ${{ github.workspace }}/.iu-cj-email-d1-checkpoint.json
          IU_CJ_WORKERS_AI_HTTP_EXECUTE: "0"
          IU_CJ_CJ_API_HTTP_EXECUTE: "0"
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-github-actions-ingest-runner.mjs

      - name: Optional FORPSI mock via unattended runner
        if: env.LIVE_IMAP_BLOCKED == '1' && github.event.inputs.run_forpsi_offline_cycle == '1'
        shell: bash
        env:
          IU_CJ_UNATTENDED_IMPORT_OFFLINE: "1"
          IU_CJ_UNATTENDED_RUN_FORPSI_OFFLINE: "1"
          IU_CJ_EMAIL_INGEST_OFFLINE: "1"
          IU_CJ_GITHUB_INGEST_DRY_RUN: "1"
          IU_CJ_D1_BACKEND: "mock"
          IU_CJ_WORKERS_AI_HTTP_EXECUTE: "0"
          IU_CJ_CJ_API_HTTP_EXECUTE: "0"
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-unattended-import-runner-v1.mjs

      - name: Workers AI health probe (no email bodies)
        if: env.LIVE_IMAP_BLOCKED == '0'
        id: ai_probe
        shell: bash
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase3r-workers-ai-probe-v1.mjs | tee /tmp/iu-workers-ai-probe.json
          PROBE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-workers-ai-probe.json","utf8")).probe)')
          echo "WORKERS_AI_PROBE=$PROBE"
          echo "WORKERS_AI_PROBE=$PROBE" >> "$GITHUB_ENV"

      - name: Phase 3R live pipeline (IMAP drain + Workers AI + CJ reconcile hints)
        if: env.LIVE_IMAP_BLOCKED == '0'
        id: live_pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IU_FORPSI_IMAP_CHECKPOINT_DIR"
          set +e
          node scripts/iu-cj-affiliate-phase3r-pipeline-v1.mjs > /tmp/iu-phase3r-pipeline.json
          CODE=$?
          set -e
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("/tmp/iu-phase3r-pipeline.json","utf8"));
            let probe=null;
            try{probe=JSON.parse(fs.readFileSync("/tmp/iu-workers-ai-probe.json","utf8"));}catch{}
            const summary={
              schema:j.schema,
              ok:j.ok,
              status:j.status,
              imapConnected:j.imapConnected,
              authSuccess:j.authSuccess,
              mailboxInventory:j.mailboxInventory,
              messagesRead:j.messagesRead,
              messagesClassified:j.messagesClassified,
              relevantHints:j.relevantHints,
              duplicates:j.duplicates,
              quarantined:j.quarantined,
              errors:j.errors,
              batches:j.batches,
              checkpointComplete:j.checkpoint&&j.checkpoint.complete,
              pendingAfterBatch:j.checkpoint&&j.checkpoint.pendingAfterBatch,
              uidvalidity:j.checkpoint&&j.checkpoint.uidvalidity,
              workersAiProbe:probe&&probe.probe,
              workersAiProbeReason:probe&&probe.reason,
              aiActuallyRan:j.ai&&j.ai.aiActuallyRan,
              aiHttpAttempted:j.ai&&j.ai.aiHttpAttempted,
              aiBackend:j.ai&&j.ai.backend,
              aiModel:j.ai&&j.ai.model,
              aiCallsUsed:j.ai&&j.ai.callsUsed,
              aiSuccessCount:j.ai&&j.ai.successCount,
              aiFallbackCount:j.ai&&j.ai.fallbackCount,
              aiSkippedOverCap:j.ai&&j.ai.skippedOverCap,
              aiErrorCounts:j.ai&&j.ai.errorCounts,
              cjPassedToRobot:j.cjReconcile&&j.cjReconcile.passedToRobot,
              cjVerifiedViaApi:j.cjReconcile&&j.cjReconcile.verifiedViaCjApi,
              stagingAddPlans:j.cjReconcile&&j.cjReconcile.stagingAddPlans,
              stagingUpdatePlans:j.cjReconcile&&j.cjReconcile.stagingUpdatePlans,
              stagingEndedPlans:j.cjReconcile&&j.cjReconcile.stagingEndedPlans,
              cjApiFollowUp:j.cjApiFollowUp,
              mutatePartners:j.mutatePartners,
              liveEnabled:j.liveEnabled,
              publishArmed:j.publishArmed,
              cjLivePublishing:j.cjLivePublishing,
              reason:j.reason||null
            };
            console.log(JSON.stringify(summary,null,2));
            fs.writeFileSync("/tmp/iu-phase3r-pipeline-summary.json", JSON.stringify(summary,null,2));
            fs.writeFileSync("/tmp/iu-forpsi-live-poll-summary.json", JSON.stringify(summary,null,2));
          '
          echo "IMAP_CONNECTED=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).imapConnected)')"
          echo "AUTH_SUCCESS=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).authSuccess)')"
          echo "MESSAGES_READ=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).messagesRead)')"
          echo "MESSAGES_CLASSIFIED=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).messagesClassified)')"
          echo "RELEVANT_HINTS=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).relevantHints)')"
          echo "AI_ACTUALLY_RAN=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).aiActuallyRan)')"
          echo "AI_BACKEND=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).aiBackend)')"
          echo "CJ_PASSED=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).cjPassedToRobot)')"
          echo "CJ_VERIFIED=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/iu-phase3r-pipeline-summary.json","utf8")).cjVerifiedViaApi)')"
          if [ "$CODE" -ne 0 ]; then
            echo "PHASE3R_PIPELINE=FAILED exit=$CODE"
            exit "$CODE"
          fi
          echo "PHASE3R_PIPELINE=OK"
          echo "LIVE_IMAP_POLL=OK"
          echo "Authority=CJ_API_ONLY"
          echo "CJ LIVE PUBLISHING=DISARMED"
          echo "False PASS forbidden: connect+auth+poll+AI evidenced above"

      - name: Upload IMAP/AI pipeline summary + checkpoint (no secrets / no bodies)
        if: always() && env.LIVE_IMAP_BLOCKED == '0'
        uses: actions/upload-artifact@v4
        with:
          name: iu-forpsi-live-imap-poll
          path: |
            /tmp/iu-phase3r-pipeline-summary.json
            /tmp/iu-forpsi-live-poll-summary.json
            /tmp/iu-workers-ai-probe.json
            .iu-forpsi-imap-checkpoint/
          if-no-files-found: warn
          retention-days: 30

      - name: Live ingest gate summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Live catalog mutation from email/AI alone: FORBIDDEN"
          echo "Mailbox target: affiliate@infouzel.cz via imap.forpsi.com:993 TLS"
          echo "AI model: @cf/meta/llama-3.1-8b-instruct (Workers AI free Neurons)"
          echo "Required: IU_FORPSI_IMAP_CONNECT_APPROVED=1 + secrets IU_FORPSI_IMAP_USER/SECRET"
          echo "CJ API remains the only authority for partner lifecycle changes."
          echo "CJ_MANAGED_PUBLIC_LIVE_ENABLED=false liveEnabled=false publishArmed=false"
