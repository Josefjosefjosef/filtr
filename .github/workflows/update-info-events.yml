name: Update info events

# Production connector for Přehled dne V2 (public/official sources only).
# Backend-only fetch → atomic publish of split datasets. Does not touch commercial aggregation.
# CHMI CAP v2 items (ie-chmi-v2-*) and monitoring.chmiCapV2 are owned by update-chmi-cap-v2.

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Optional lane/group only (doprava|pocasi|bezpecnost|…); empty = full refresh"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"

# Share writer lock with update-chmi-cap-v2 to prevent lost updates on feed/monitoring.
concurrency:
  group: info-events-data-writers
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Minimal checkout: refresh scripts do not need full history/tags/all branches.
      # Previously fetch-depth: 0 caused ~12–20 min hung git fetch (job timeout).
      # Pin actions/checkout v7.0.1 by commit SHA (Node 24 ready).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh info events + atomic publish
        env:
          IU_INFO_EVENTS_GROUP: ${{ github.event.inputs.group || '' }}
        run: node scripts/iu-info-events-refresh.mjs

      - name: Guard
        run: |
          node scripts/iu-info-system-v1-guard.mjs
          node scripts/iu-info-events-atom-time-source-guard.mjs

      - name: Legal whitelist guard
        run: node scripts/iu-info-events-legal-whitelist-guard.mjs

      - name: Preserve CHMI namespaces guard
        run: node scripts/iu-info-events-preserve-chmi-namespaces-guard.mjs

      - name: Checkout scope guard
        run: node scripts/iu-info-events-checkout-scope-guard.mjs

      - name: Commit data if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/data/info_events
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          BRANCH="automation/update-info-events"
          git checkout -B "$BRANCH"
          git commit -m "chore(data): refresh info events feed and monitoring"
          git push -u origin "$BRANCH" --force
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create --title "chore(data): refresh info events feed and monitoring" --body "Automated refresh of projects/data/info_events (Přehled dne V2). Preserves CHMI CAP v2 feed items and monitoring.chmiCapV2." --base main --head "$BRANCH"
          fi
          NUM=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          gh pr merge "$NUM" --squash --auto || true
