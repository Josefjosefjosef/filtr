name: Repo guard

on:
  push:
    branches:
      - main
      - automation/update-articles-data
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR head for pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check (data generators)
        run: |
          python -m py_compile scripts/build_articles.py
          python -m py_compile scripts/build_videos.py

      - name: Run repo guard
        run: python scripts/repo_guard.py
