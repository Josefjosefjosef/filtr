name: Repo guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check (data generators)
        run: |
          python -m py_compile scripts/build_articles.py
          python -m py_compile scripts/build_videos.py

      - name: Run repo guard
        run: python scripts/repo_guard.py
