name: Build republish (verified images)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # every 60 minutes

permissions:
  contents: write

concurrency:
  group: build-republish
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate republish feed + proofs
        shell: pwsh
        env:
          EDGE_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: |
          Write-Host "Running generator WITHOUT --source-id (ALL sources)."
          python .\scripts\build_republish_with_images.py --items-per-feed 200 --edge-path "$env:EDGE_PATH"

      - name: Gate - republish json exists and valid
        shell: pwsh
        run: |
          python -c "import json,pathlib; p=pathlib.Path('projects/data/republish_with_images.json'); (p.exists() and p.stat().st_size>0) or (_ for _ in ()).throw(SystemExit('missing republish_with_images.json')); data=json.loads(p.read_text(encoding='utf-8')); items=data.get('items'); isinstance(items,list) or (_ for _ in ()).throw(SystemExit('items is not a list')); print(f'items={len(items)} ok')"

      - name: Gate - banned providers grep (OK/FAIL)
        shell: pwsh
        run: |
          $m = Select-String -Path .\projects\data\republish_with_images.json -Pattern "GETTY|REUTERS|SHUTTERSTOCK|ALAMY|ASSOCIATED PRESS|\bAP\b|AFP|BLOOMBERG" -CaseSensitive:$false
          if ($m) { Write-Error "FAIL banned_provider_strings_found>0"; exit 1 } else { Write-Host "OK banned_provider_strings_found=0" }

      - name: Gate - junk tokens grep (OK/FAIL)
        shell: pwsh
        run: |
          $pat = "(?i)(wikiloves|wiki_loves|wiki-loves|commons-logo|commons_logo|pictogram|\bicon\b|icons|sports_icon|_icon\.|banner|logo|portal|portlet|navbox|badge|button|placeholder|sprite)"
          $m = Select-String -Path .\projects\data\republish_with_images.json -Pattern $pat
          if ($m) { Write-Error "FAIL junk_tokens_found>0"; exit 1 } else { Write-Host "OK junk_tokens_found=0" }

      - name: Gate - license_url empty grep (OK/FAIL)
        shell: pwsh
        run: |
          $m = Select-String -Path .\projects\data\republish_with_images.json -Pattern '"license_url"\s*:\s*""'
          if ($m) { Write-Error "FAIL license_url_empty>0"; exit 1 } else { Write-Host "OK license_url_empty=0" }

      - name: Gate - strict item validation (title/license/allowlist/proofs/source_id)
        shell: pwsh
        run: |
          $lines = @(
            'import json, pathlib, re',
            'from urllib.parse import urlparse',
            'root = pathlib.Path(".")',
            'data = json.loads((root / "projects/data/republish_with_images.json").read_text(encoding="utf-8"))',
            'items = data.get("items") or []',
            'allow = json.loads((root / "projects/data/image_allowlist.json").read_text(encoding="utf-8")).get("allowed_domains") or []',
            'allow = [str(x).lower() for x in allow]',
            '',
            'def is_allowed(host: str) -> bool:',
            '    h = (host or "").lower()',
            '    for d in allow:',
            '        d = (d or "").lower()',
            '        if not d:',
            '            continue',
            '        if h == d or h.endswith("." + d):',
            '            return True',
            '    return False',
            '',
            'banned = re.compile(r"(?i)(getty|reuters|shutterstock|alamy|associated\\s+press|\\bap\\b|afp|bloomberg)")',
            'junk = [ "wikiloves","wiki_loves","wiki-loves","commons-logo","commons_logo","pictogram","icon","icons","sports_icon","_icon.","banner","logo","portal","portlet","navbox","badge","button","placeholder","sprite" ]',
            'req = ("source_id","title","proof_path_html","proof_path_png","image_url","source_url","attribution_html","image_license_type","license_url")',
            '',
            'for idx, it in enumerate(items):',
            '    for k in req:',
            '        if not it.get(k):',
            '            raise SystemExit(f"missing_field {idx} {k}")',
            '    if not str(it.get("title","")).strip():',
            '        raise SystemExit(f"empty_title {idx}")',
            '    lu = str(it.get("license_url","")).strip()',
            '    if not lu:',
            '        raise SystemExit(f"empty_license_url {idx}")',
            '    if lu.lower().startswith("http://"):',
            '        raise SystemExit(f"license_url_http_forbidden {idx}")',
            '    if "/deed" in lu.lower():',
            '        raise SystemExit(f"license_url_deed_forbidden {idx}")',
            '    host = (urlparse(str(it.get("image_url",""))).hostname or "").lower()',
            '    if not is_allowed(host):',
            '        raise SystemExit(f"image_host_not_allowlisted {idx} {host}")',
            '    txt = str(it.get("image_url","")) + " " + str(it.get("attribution_html",""))',
            '    if banned.search(txt):',
            '        raise SystemExit(f"banned_provider_string_found {idx}")',
            '    img_l = str(it.get("image_url","")).lower()',
            '    for tok in junk:',
            '        if tok in img_l:',
            '            raise SystemExit(f"junk_token_found {idx} {tok}")',
            '    htmlp = root / str(it.get("proof_path_html"))',
            '    pngp  = root / str(it.get("proof_path_png"))',
            '    if not htmlp.exists():',
            '        raise SystemExit(f"missing_proof_html {htmlp}")',
            '    if not pngp.exists():',
            '        raise SystemExit(f"missing_proof_png {pngp}")',
            '',
            'print(f"ALL_OK items={len(items)}")'
          )
          $lines | Set-Content -Encoding utf8 .\_gate_republish_valid.py
          python .\_gate_republish_valid.py

      - name: Log - count_by_source_id (hard numbers)
        shell: pwsh
        run: |
          python -c "import json,collections; data=json.loads(open('projects/data/republish_with_images.json',encoding='utf-8').read()); c=collections.Counter([str(it.get('source_id') or '') for it in (data.get('items') or [])]); pairs=sorted(c.items(), key=lambda kv: (-kv[1], kv[0])); s=', '.join([f'{k}={v}' for k,v in pairs]); print('count_by_source_id: ' + s)"

      - name: Gate - PROD sanity (iuHomeRepublishGrid present)
        shell: pwsh
        run: |
          python -c "p='projects/index.html'; s=open(p,encoding='utf-8').read(); ok=('iuHomeRepublishGrid' in s); print(f'iuHomeRepublishGrid present = {ok}'); import sys; sys.exit(0 if ok else 1)"

      - name: Log - 2 sample items (TITLE + SOURCE_URL + IMAGE_URL + LICENSE_URL)
        shell: pwsh
        run: |
          python -c "import json; data=json.loads(open('projects/data/republish_with_images.json',encoding='utf-8').read()); items=data.get('items') or []; sample=items[:2]; out=[{'title':it.get('title'),'source_url':it.get('source_url'),'image_url':it.get('image_url'),'license_url':it.get('license_url'),'source_id':it.get('source_id')} for it in sample]; print('sample_items='+json.dumps(out,ensure_ascii=False,indent=2))"

      - name: Log - ALL_OK
        shell: pwsh
        run: |
          Write-Host "ALL_OK"

      - name: Commit and push (if changed)
        shell: pwsh
        run: |
          $s = git status --porcelain
          if (-not $s) {
            Write-Host "No changes to commit."
            exit 0
          }
          git add -f projects/data/republish_with_images.json
          git add -f projects/data/provenance/
          git add -f projects/data/license_proofs/
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data: refresh republish_with_images (verified)"
          git push origin HEAD:main

