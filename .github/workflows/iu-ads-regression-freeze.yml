# Deterministic InfoUzel Ads regression bundle for PRs touching ads code.
# Add "iu-ads-regression-freeze" as required check in branch protection when ready.
name: IU Ads regression freeze

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    paths:
      - "cloudflare/iu-ads/**"
      - ".github/workflows/iu-ads-regression-freeze.yml"
      - "scripts/iu-premium-*.mjs"
      - "scripts/iu-ads-*.mjs"
      - "assets/iu-premium-*.js"
      - "assets/iu-premium-*.css"
  push:
    branches: [main]
    paths:
      - "cloudflare/iu-ads/**"
      - ".github/workflows/iu-ads-regression-freeze.yml"

concurrency:
  group: iu-ads-regression-freeze-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  regression-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-ads/package-lock.json

      - name: Install (iu-ads)
        working-directory: cloudflare/iu-ads
        run: npm ci

      - name: Manifest contract
        working-directory: cloudflare/iu-ads
        run: npm test -- test/regression-freeze-manifest.test.ts

      - name: Vitest regression bundle
        working-directory: cloudflare/iu-ads
        run: |
          set -euo pipefail
          eval "$(node --experimental-strip-types scripts/print-regression-freeze-lists.ts | grep '^VITEST_FILES=')"
          test -n "${VITEST_FILES:-}"
          npm test -- $VITEST_FILES

      - name: Repo freeze guard scripts
        run: |
          set -euo pipefail
          node --experimental-strip-types cloudflare/iu-ads/scripts/print-regression-freeze-lists.ts | grep '^GUARD_SCRIPT=' | sed 's/^GUARD_SCRIPT=//' | while IFS= read -r script; do
            test -n "$script"
            node "$script"
          done

      - name: Post status (iu-ads-regression-freeze)
        if: always()
        uses: actions/github-script@60a0d83039c774a2a286fca6b3589c8800423b3a # v7.0.1
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'iu-ads-regression-freeze',
              description: state === 'success' ? 'Ads regression bundle passed' : 'Ads regression bundle failed',
            });
