      - name: Legal documents form state guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.data_mgmt_restore_overlay_mobile_only != 'true' && steps.scope.outputs.pc_left_rail_same_window_tabs_only != 'true' && steps.scope.outputs.pc_tool_window_left_rail_layout_only != 'true' && steps.scope.outputs.notes_unified_field_only != 'true' && steps.scope.outputs.pwa_offline_resilience_only != 'true' && steps.scope.outputs.quicktools_mobile_visibility_only != 'true' && steps.scope.outputs.quicktools_fixed_width_only != 'true' && steps.scope.outputs.user_data_backup_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-legal-documents-form-state-guard

      - name: Legal documents preview PC guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-legal-documents-preview-pc-guard

      - name: Legal tool-guard layering guard (mobile/tablet above bottom nav)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-legal-tool-guard-layering-guard

      - name: Invoice preview PC guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-invoice-preview-pc-guard

      - name: Invoice preview open proof
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-invoice-preview-open-proof

      - name: Invoice preview open proof (MyInfoUzel stacking)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-invoice-preview-open-proof
        env:
          IU_INVOICE_PREVIEW_MYINFOUZEL: "1"

      - name: Weather chevron UTF-8 guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-weather-chevron-utf8-guard

      - name: Travel article feed regression guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run travel-article-feed-regression-guard

      - name: Set required status context (smoke)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          SHA="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context="smoke" \
            -f description="Required status context (smoke)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
