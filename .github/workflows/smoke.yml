name: Smoke

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      # Force-pushes z update-articles.yml často nespustí pull_request synchronize → povinné checky na data PR zůstaly viset (mergeStateStatus BLOCKED).
      - automation/update-articles-data
      - automation/update-articles-fast-pool
      - automation/update-info-panel-snapshot
      - automation/update-chmi-cap-v2
      - automation/update-ndic-datex-v1
      # Silver/release PR heads: pull_request webhooks občas nedorazí; push na fix/* spustí required status na head SHA.
      - "fix/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history clones hang/timeout on this large repo; scope script fetches main --depth=64.
          fetch-depth: 64

      - name: Detect data-only scope (fast pool / data PR fast path)
        id: scope
        env:
          SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SMOKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/smoke-data-only-scope.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Data-only smoke fast path (skip unrelated UI guards)
        if: steps.scope.outputs.data_only == 'true'
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_articles_index_from_pool.py
          python -m py_compile scripts/emit_frontend_article_chunks.py
          node scripts/smoke_data_only_scope_proof.mjs
          echo "SMOKE_DATA_ONLY_FAST_PATH=YES"
          echo "UI_GUARDS_SKIPPED=YES"

      - name: Silver calendar.create regression
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run silver-regression

      - name: Install Playwright browsers
        if: steps.scope.outputs.data_only != 'true'
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Ensure playwright bin executable (fallback)
        if: steps.scope.outputs.data_only != 'true'
        run: |
          if [ -f node_modules/.bin/playwright ]; then chmod +x node_modules/.bin/playwright || true; fi

      - name: Full UI smoke suite
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run smoke

      - name: Silver Notes V2 UX guard (checkout localhost)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run silver-notes-v2-ux-guard-checkout

      - name: Notes unified field guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-notes-unified-field-guard

      - name: PWA offline resilience guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-pwa-offline-resilience-guard

      - name: PWA offline nav fallback guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-pwa-offline-nav-fallback-guard

      - name: Silver mobile layout guard (checkout localhost)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.jr_section_header_line_color_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: node scripts/run_silver_layout_guard_against_checkout.cjs

      - name: Silver speech bubble stable privacy + 4px down-shift guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.jr_section_header_line_color_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run silver-bubble-stable-privacy-guard-checkout

      - name: Weather outside-temp emphasis guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run weather-emphasis-guard

      - name: Počasíčko / pocasicko data guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run weather-pocasicko-guard

      - name: CZ vertical sections guard (hry/kultura/veda/vzdelavani)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run section-cz-guard

      - name: Nameday overlay dative guard (Laura → Lauře)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-nameday-dative-guard

      - name: State holiday welcome label guard (státní svátek vs svátek má)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-state-holiday-label-guard

      - name: Perf regression guards (flicker phases + 16 nav latency + calendar/Silver surface)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.pc_left_rail_same_window_tabs_only != 'true' && steps.scope.outputs.pc_tool_window_left_rail_layout_only != 'true' && steps.scope.outputs.notes_unified_field_only != 'true' && steps.scope.outputs.pwa_offline_resilience_only != 'true' && steps.scope.outputs.jr_section_header_line_color_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-perf-regression-guards

      - name: Reload / section switch / scroll stability guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.data_mgmt_restore_overlay_mobile_only != 'true' && steps.scope.outputs.pc_left_rail_same_window_tabs_only != 'true' && steps.scope.outputs.pc_tool_window_left_rail_layout_only != 'true' && steps.scope.outputs.notes_unified_field_only != 'true' && steps.scope.outputs.pwa_offline_resilience_only != 'true' && steps.scope.outputs.quicktools_mobile_visibility_only != 'true' && steps.scope.outputs.quicktools_fixed_width_only != 'true' && steps.scope.outputs.user_data_backup_only != 'true' && steps.scope.outputs.jr_section_header_line_color_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
