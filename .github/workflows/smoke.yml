name: Smoke

permissions:
  statuses: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      # Force-pushes z update-articles.yml často nespustí pull_request synchronize → povinné checky na data PR zůstaly viset (mergeStateStatus BLOCKED).
      - automation/update-articles-data
      - automation/update-articles-fast-pool
      # Silver/release PR heads: pull_request webhooks občas nedorazí; push na fix/* spustí required status na head SHA.
      - "fix/**"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect data-only scope (fast pool / data PR fast path)
        id: scope
        env:
          SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SMOKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/smoke-data-only-scope.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Data-only smoke fast path (skip unrelated UI guards)
        if: steps.scope.outputs.data_only == 'true'
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_articles_index_from_pool.py
          python -m py_compile scripts/emit_frontend_article_chunks.py
          node scripts/smoke_data_only_scope_proof.mjs
          echo "SMOKE_DATA_ONLY_FAST_PATH=YES"
          echo "UI_GUARDS_SKIPPED=YES"

      - name: Silver calendar.create regression
        if: steps.scope.outputs.data_only != 'true'
        run: npm run silver-regression

      - name: Install Playwright browsers
        if: steps.scope.outputs.data_only != 'true'
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Ensure playwright bin executable (fallback)
        if: steps.scope.outputs.data_only != 'true'
        run: |
          if [ -f node_modules/.bin/playwright ]; then chmod +x node_modules/.bin/playwright || true; fi

      - name: Full UI smoke suite
        if: steps.scope.outputs.data_only != 'true'
        run: npm run smoke

      - name: Silver Notes V2 UX guard (checkout localhost)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run silver-notes-v2-ux-guard-checkout

      - name: Silver mobile layout guard (checkout localhost)
        if: steps.scope.outputs.data_only != 'true'
        run: node scripts/run_silver_layout_guard_against_checkout.cjs

      - name: Weather outside-temp emphasis guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run weather-emphasis-guard

      - name: Počasíčko / pocasicko data guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run weather-pocasicko-guard

      - name: CZ vertical sections guard (hry/kultura/veda/vzdelavani)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run section-cz-guard

      - name: Nameday overlay dative guard (Laura → Lauře)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-nameday-dative-guard

      - name: State holiday welcome label guard (státní svátek vs svátek má)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-state-holiday-label-guard

      - name: Perf regression guards (flicker phases + 16 nav latency + calendar/Silver surface)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-perf-regression-guards

      - name: Reload / section switch / scroll stability guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-reload-section-scroll-stability-guard

      - name: Section switch instant response guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-section-switch-instant-response-guard

      - name: Section switch scroll position guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-section-switch-scroll-position-guard

      - name: Desktop left-rail section close guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-desktop-section-close-guard

      - name: Desktop left-rail new window guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-desktop-left-rail-new-window-guard

      - name: Desktop calendar all-day toggle guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-desktop-calendar-allday-toggle-guard

      - name: Desktop HomeCards feed width alignment guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run desktop-homecards-feed-width-alignment-guard

      - name: Desktop info panel layout guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-desktop-info-panel-layout-guard

      - name: Desktop info panel validation guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-desktop-info-panel-validation-guard

      - name: Info panel mobile polish guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-info-panel-mobile-polish-guard

      - name: Article entrypoint parity guard (chunked loading V1)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_only != 'true' && steps.scope.outputs.fin_calc_header_only != 'true' && steps.scope.outputs.datovka_overlay_only != 'true' && steps.scope.outputs.custom_buttons_scroll_only != 'true' && steps.scope.outputs.user_data_backup_only != 'true'
        run: npm run article-entrypoint-parity-guard

      - name: Article long-session memory guard (Task 66)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_only != 'true' && steps.scope.outputs.fin_calc_header_only != 'true' && steps.scope.outputs.datovka_overlay_only != 'true' && steps.scope.outputs.custom_buttons_scroll_only != 'true' && steps.scope.outputs.user_data_backup_only != 'true'
        run: npm run iu-article-long-session-memory-guard

      - name: Article load-more stress guard (Task 66)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_only != 'true' && steps.scope.outputs.fin_calc_header_only != 'true' && steps.scope.outputs.datovka_overlay_only != 'true' && steps.scope.outputs.custom_buttons_scroll_only != 'true' && steps.scope.outputs.user_data_backup_only != 'true'
        run: npm run iu-article-load-more-stress-guard

      - name: Local data protection guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-local-data-protection-guard

      - name: MindMenu bottom nav restore guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-mindmenu-bottom-nav-restore-guard

      - name: MindMenu overlay bottom gap unified guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-mindmenu-overlay-bottom-gap-unified-guard

      - name: Desktop MindMenu calendar polish guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-desktop-mindmenu-calendar-polish-guard

      - name: Desktop partner banners removed guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-desktop-partner-banners-removed-guard

      - name: Financial calc mobile header guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-financial-calc-mobile-header-guard

      - name: Legal documents mobile header guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-legal-documents-mobile-header-guard

      - name: Datovka mobile overlay visible guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-ds-mobile-overlay-visible-guard

      - name: Datovka mobile scroll bottom clearance guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-ds-mobile-scroll-bottom-clearance-guard

      - name: Datovka mobile delete confirm anchor guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-ds-mobile-delete-confirm-anchor-guard

      - name: Moje sluzby mobile keyboard add btn guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-moje-sluzby-mobile-keyboard-add-btn-guard

      - name: Bakalari card count persist guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-bakalari-card-count-persist-guard

      - name: Custom buttons mobile scroll guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-custom-buttons-mobile-scroll-guard

      - name: Custom buttons overlay polish guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-custom-buttons-overlay-polish-guard

      - name: Silver PC top input action menu guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-silver-pc-top-input-action-menu-guard

      - name: Quicktools custom buttons reset sync guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run silver-quicktools-custom-buttons-guard

      - name: Svatek pill responsive wrap guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-svatek-pill-responsive-wrap-guard

      - name: Tasks mobile form filter guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-tasks-mobile-form-filter-guard

      - name: PC browser compat guard (MindMenu + Tasks filters)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-pc-browser-compat-guard

      - name: User data backup guard (iCentrum export/import)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-user-data-backup-guard

      - name: Financial calc PC hub info close gap guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-financial-calc-pc-hub-info-close-gap-guard

      - name: Silver welcome legacy input removed guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-silver-welcome-legacy-input-removed-guard

      - name: AI assistants overlay bottom gap guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-ai-assistants-overlay-bottom-gap-guard

      - name: Mobile form card + datovka safe-area guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run silver-mobile-form-card-ds-safe-area-guard

      - name: Mobile/tablet stability guards (CLS + nav + media)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-mobile-stability-guards

      - name: Legal documents unified template guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-legal-documents-unified-template-guard

      - name: Legal documents audit guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-legal-documents-audit-guard

      - name: Legal documents preview PC guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-legal-documents-preview-pc-guard

      - name: Legal tool-guard layering guard (mobile/tablet above bottom nav)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-legal-tool-guard-layering-guard

      - name: Invoice preview PC guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-invoice-preview-pc-guard

      - name: Invoice preview open proof
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-invoice-preview-open-proof

      - name: Invoice preview open proof (MyInfoUzel stacking)
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-invoice-preview-open-proof
        env:
          IU_INVOICE_PREVIEW_MYINFOUZEL: "1"

      - name: Weather chevron UTF-8 guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run iu-weather-chevron-utf8-guard

      - name: Travel article feed regression guard
        if: steps.scope.outputs.data_only != 'true'
        run: npm run travel-article-feed-regression-guard

      - name: Set required status context (smoke)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          SHA="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context="smoke" \
            -f description="Required status context (smoke)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
