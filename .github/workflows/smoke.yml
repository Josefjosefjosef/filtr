        run: npm run iu-state-holiday-label-guard

      - name: Perf regression guards (flicker phases + 16 nav latency + calendar/Silver surface)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.pc_left_rail_same_window_tabs_only != 'true' && steps.scope.outputs.pc_tool_window_left_rail_layout_only != 'true' && steps.scope.outputs.notes_unified_field_only != 'true' && steps.scope.outputs.pwa_offline_resilience_only != 'true' && steps.scope.outputs.jr_section_header_line_color_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-perf-regression-guards

      - name: Stage 7 calendar hero prefetch guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-perf-stage7-calendar-hero-prefetch-guard
      - name: Perf-loop iter-001 parallel boot guard
        run: npm run iu-perf-loop-iter001-parallel-boot-guard
      - name: Perf-loop iter-003 core dedupe guard
        run: npm run iu-perf-loop-iter003-core-dedupe-guard
      - name: Perf-loop iter-004 lazy traffic presenter guard
        run: npm run iu-perf-loop-iter004-lazy-presenter-guard
      - name: Perf-loop iter-005 defer traffic presenter guard
        run: npm run iu-perf-loop-iter005-defer-presenter-guard
      - name: Perf-loop iter-006 defer feed pipeline guard
        run: npm run iu-perf-loop-iter006-defer-pipeline-guard
      - name: Perf-loop iter-007 demote silver img guard
        run: npm run iu-perf-loop-iter007-demote-silver-img-guard
      - name: Perf-loop iter-008 defer secondary css guard
        run: npm run iu-perf-loop-iter008-defer-secondary-css-guard
      - name: Perf-loop iter-010 overlay css after FCP guard
        run: npm run iu-perf-loop-iter010-overlay-css-after-fcp-guard
      - name: Perf-loop iter-011 desktop css after FCP guard
