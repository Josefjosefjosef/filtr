        run: npm run iu-financial-calc-pc-hub-info-close-gap-guard

      - name: Silver welcome legacy input removed guard
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run iu-silver-welcome-legacy-input-removed-guard

