      - name: Desktop article read mark guard
        if: >
          steps.scope.outputs.data_only != 'true' &&
          (steps.scope.outputs.desktop_article_read_mark_only == 'true' ||
          (steps.scope.outputs.legal_docs_form_state_only != 'true' &&
