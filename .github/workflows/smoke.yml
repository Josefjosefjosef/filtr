name: Smoke

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      # Force-pushes z update-articles.yml často nespustí pull_request synchronize → povinné checky na data PR zůstaly viset (mergeStateStatus BLOCKED).
      - automation/update-articles-data
      - automation/update-articles-fast-pool
      - automation/update-info-panel-snapshot
      - automation/update-chmi-cap-v2
      - automation/update-ndic-datex-v1
      # Silver/release PR heads: pull_request webhooks občas nedorazí; push na fix/* spustí required status na head SHA.
      - "fix/**"
  workflow_dispatch:
  # Merge Queue: required CI must run on the merge-group SHA (PR head + current main).
  merge_group:

concurrency:
  # Event-scoped: push / pull_request / merge_group must NOT cancel each other.
  # merge_group keyed by head_sha so CHMI/feature pushes cannot cancel queue CI.
  group: smoke-${{ github.event.merge_group.head_sha || github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Real early-exit for duplicate push when an open PR owns required smoke.
  # Must NOT run npm ci / Playwright — only gate. Does NOT post required status.
  smoke-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.prgate.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Skip redundant push when open PR covers branch
        id: prgate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/skip-push-if-pr-open.sh
          scripts/ci/skip-push-if-pr-open.sh

      - name: Duplicate push early-exit ack (PR owns required smoke)
        if: steps.prgate.outputs.skip == 'true'
        run: |
          set -euo pipefail
          echo "SMOKE_PUSH_PR_OWNS_CHECK=YES"
          echo "SMOKE_PUSH_SKIPPED_PR_OWNS_CHECK=YES"
          echo "SMOKE_EARLY_EXIT=YES"
          # Do NOT post required status — false-greens SHA before pull_request smoke finishes.

  smoke:
    needs: smoke-gate
    if: needs.smoke-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history clones hang/timeout on this large repo; scope script fetches main --depth=64.
          fetch-depth: 64

      - name: Merge-group SHA contract
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          test "${GITHUB_SHA}" = "${CHECKED_OUT_SHA}"
          test -n "${{ github.event.merge_group.head_sha }}"
          test "${GITHUB_SHA}" = "${{ github.event.merge_group.head_sha }}"
          echo "MERGE_GROUP_SHA_CONTRACT=PASS"

      - name: Detect data-only scope (fast pool / data PR fast path)
        id: scope
        env:
          SMOKE_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || '' }}
          SMOKE_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node scripts/smoke-data-only-scope.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/iu-ads/package-lock.json

      - run: npm ci

      - name: Prefetch cloudflare/iu-ads npm (premium visual guards)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.iu_ads_deploy_unblock_only != 'true' && steps.scope.outputs.cj_affiliate_phase2_offline_only != 'true'
        run: npm ci
        working-directory: cloudflare/iu-ads

      - name: Merge-group / duplicate-push CI contract proof
        run: node scripts/ci/merge-group-ci-contract-proof.mjs
      - name: GHA immutable pin guard (SC-GHA-02)
        run: npm run iu-gha-immutable-pin-guard
      - name: Permissions-Policy guard (EXT-HDR-PERM-01)
        run: npm run iu-permissions-policy-guard
      - name: Secondary HTML CSP guard (EXT-CSP-SECONDARY-01)
        run: npm run iu-secondary-csp-guard
      - name: security.txt guard (EXT-SEC-TXT-01 / RFC 9116)
        run: npm run iu-security-txt-guard
      - name: CJ Affiliate Phase 2 offline selftest smoke
        if: steps.scope.outputs.cj_affiliate_phase2_offline_only == 'true'
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-coupon-eligibility-fixture-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-offline-pipeline-e2e-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-approved-product-feed-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-connector-readiness-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-cj-api-security-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-staging-isolation-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-staging-cj-api-probe-v1-selftest.mjs
          echo "CJ_AFFILIATE_PHASE2_OFFLINE_SMOKE=PASS"
      - name: Data-only smoke fast path (skip unrelated UI guards)
        if: steps.scope.outputs.data_only == 'true'
        run: |
          set -euo pipefail
          python -m py_compile scripts/sync_articles_index_from_pool.py
          python -m py_compile scripts/emit_frontend_article_chunks.py
          node scripts/smoke_data_only_scope_proof.mjs
          echo "SMOKE_DATA_ONLY_FAST_PATH=YES"
          echo "UI_GUARDS_SKIPPED=YES"
          echo "SMOKE_SKIP_BROWSER=YES"

      - name: IU Ads deploy unblock guards (vitest + freeze contract)
        if: steps.scope.outputs.iu_ads_deploy_unblock_only == 'true'
        run: |
          set -euo pipefail
          cd cloudflare/iu-ads
          npm ci
          npm test
          cd ../..
          node scripts/iu-ads-admin-menu-guard-v1.mjs
          node scripts/iu-ads-admin-zip-search-guard-v1.mjs
          node scripts/iu-premium-selected-services-freeze-guard-v1.mjs
          npm run iu-premium-order-form-guard
          node scripts/iu-premium-order-documents-freeze-guard-v1.mjs
          node scripts/iu-premium-invoice-pdf-freeze-guard-v1.mjs
          node scripts/iu-premium-order-confirmation-pdf-freeze-guard-v1.mjs
          node scripts/iu-premium-dev-operational-reset-guard-v1.mjs
          export IU_INVOICE_VISUAL_OUT="${RUNNER_TEMP}/iu-invoice-visual"
          mkdir -p "$IU_INVOICE_VISUAL_OUT"
          cd cloudflare/iu-ads
          IU_INVOICE_VISUAL_OUT="$IU_INVOICE_VISUAL_OUT" npm test -- test/premium-invoice-visual-proof.test.ts
          export IU_ORDER_CONFIRMATION_VISUAL_OUT="${RUNNER_TEMP}/iu-order-confirmation-visual"
          mkdir -p "$IU_ORDER_CONFIRMATION_VISUAL_OUT"
          IU_ORDER_CONFIRMATION_VISUAL_OUT="$IU_ORDER_CONFIRMATION_VISUAL_OUT" npm test -- test/premium-order-confirmation-visual-freeze.test.ts
          cd ../..
          test -s "$IU_INVOICE_VISUAL_OUT/invoice-reference-like.pdf"
          test -s "$IU_ORDER_CONFIRMATION_VISUAL_OUT/order-confirmation-freeze.pdf"
          test -s "$IU_ORDER_CONFIRMATION_VISUAL_OUT/order-confirmation-freeze-page-1.png"
          test -s "$IU_ORDER_CONFIRMATION_VISUAL_OUT/order-confirmation-freeze-page-2.png"
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftoppm -png -singlefile -r 150 "$IU_INVOICE_VISUAL_OUT/invoice-reference-like.pdf" "$IU_INVOICE_VISUAL_OUT/invoice-reference-like"
          test -s "$IU_INVOICE_VISUAL_OUT/invoice-reference-like.png"
          echo "IU_PREMIUM_INVOICE_PNG_RENDER=PASS"
          echo "IU_PREMIUM_ORDER_CONFIRMATION_PNG_RENDER=PASS"
          echo "IU_ADS_DEPLOY_UNBLOCK_SMOKE=PASS"

      - name: Upload premium invoice visual artifacts (IU Ads unblock)
        if: steps.scope.outputs.iu_ads_deploy_unblock_only == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: premium-invoice-visual-${{ github.run_id }}
          path: ${{ runner.temp }}/iu-invoice-visual/
          if-no-files-found: error

      - name: Upload premium order confirmation visual artifacts (IU Ads unblock)
        if: steps.scope.outputs.iu_ads_deploy_unblock_only == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: premium-order-confirmation-visual-${{ github.run_id }}
          path: ${{ runner.temp }}/iu-order-confirmation-visual/
          if-no-files-found: error


      - name: CHMI CAP watchdog deploy guards (worker unit tests)
        if: steps.scope.outputs.chmi_cap_watchdog_deploy_only == 'true'
        run: |
          set -euo pipefail
          cd cloudflare/chmi-cap-watchdog
          npm ci
          npm test
          cd ../..
          echo "CHMI_CAP_WATCHDOG_DEPLOY_UNBLOCK_SMOKE=PASS"

      - name: CHMI CAP v2 prod verify scope guards
        if: steps.scope.outputs.chmi_cap_v2_prod_verify_only == 'true'
        run: |
          set -euo pipefail
          npm run iu-chmi-cap-v2-guard
          npm run iu-chmi-cap-v2-architecture-validation
          npm run iu-chmi-cap-no-segment-dedupe-guard
          npm run iu-chmi-cap-monitoring-refuse-wipe-guard
          npm run iu-info-events-preserve-chmi-namespaces-guard
          npm run iu-chmi-cap-v2-prod-verify
          echo "CHMI_CAP_V2_PROD_VERIFY_SCOPE_SMOKE=PASS"
      # Non-browser CHMI/info_events contract: RUN even when Playwright/FOUC are skipped.
      - name: Info events / CHMI data-contract suite (non-browser)
        if: steps.scope.outputs.data_only == 'true' && steps.scope.outputs.run_info_events_contract == 'true'
        run: |
          set -euo pipefail
          npm run iu-chmi-cap-v2-guard
          npm run iu-chmi-cap-v2-architecture-validation
          npm run iu-chmi-cap-no-segment-dedupe-guard
          npm run iu-chmi-cap-monitoring-refuse-wipe-guard
          npm run iu-info-events-preserve-chmi-namespaces-guard
          npm run iu-info-events-legal-whitelist-guard
          echo "IU_INFO_EVENTS_DATA_CONTRACT=PASS"
          echo "IU_BROWSER_SKIPPED_FOR_PURE_DATA=YES"

      - name: Silver calendar.create regression
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run silver-regression

      - name: Cache Playwright browser
        if: steps.scope.outputs.data_only != 'true'
        id: pwcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Avoid --with-deps on GitHub-hosted runners (apt hang). Browser binary via cache/install.
      - name: Install Playwright browsers
        if: steps.scope.outputs.data_only != 'true'
        run: node node_modules/playwright/cli.js install chromium

      - name: Ensure playwright bin executable (fallback)
        if: steps.scope.outputs.data_only != 'true'
        run: |
          if [ -f node_modules/.bin/playwright ]; then chmod +x node_modules/.bin/playwright || true; fi

      - name: Full UI smoke suite
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        run: npm run smoke

      - name: Smoke guard manifest selftest (391 guards, no duplicates)
        if: steps.scope.outputs.data_only != 'true'
        run: node scripts/ci/smoke-guard-manifest-v1-selftest.mjs

      - name: Playwright guard suite (parallel pool, manifest v1)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.cj_affiliate_phase2_offline_only != 'true'
        timeout-minutes: 90
        env:
          IU_SMOKE_GUARD_PARALLEL: "4"
          SCOPE_data_only: ${{ steps.scope.outputs.data_only }}
          SCOPE_cj_affiliate_phase2_offline_only: ${{ steps.scope.outputs.cj_affiliate_phase2_offline_only }}
          SCOPE_skip_browser: ${{ steps.scope.outputs.skip_browser }}
          SCOPE_run_info_events_contract: ${{ steps.scope.outputs.run_info_events_contract }}
          SCOPE_vault_runtime_scope: ${{ steps.scope.outputs.vault_runtime_scope }}
          SCOPE_info_panel_only: ${{ steps.scope.outputs.info_panel_only }}
          SCOPE_fin_calc_header_only: ${{ steps.scope.outputs.fin_calc_header_only }}
          SCOPE_datovka_overlay_only: ${{ steps.scope.outputs.datovka_overlay_only }}
          SCOPE_custom_buttons_scroll_only: ${{ steps.scope.outputs.custom_buttons_scroll_only }}
          SCOPE_quicktools_mobile_visibility_only: ${{ steps.scope.outputs.quicktools_mobile_visibility_only }}
          SCOPE_quicktools_fixed_width_only: ${{ steps.scope.outputs.quicktools_fixed_width_only }}
          SCOPE_user_data_backup_only: ${{ steps.scope.outputs.user_data_backup_only }}
          SCOPE_data_mgmt_restore_overlay_mobile_only: ${{ steps.scope.outputs.data_mgmt_restore_overlay_mobile_only }}
          SCOPE_pc_left_rail_same_window_tabs_only: ${{ steps.scope.outputs.pc_left_rail_same_window_tabs_only }}
          SCOPE_pc_tool_window_left_rail_layout_only: ${{ steps.scope.outputs.pc_tool_window_left_rail_layout_only }}
          SCOPE_notes_unified_field_only: ${{ steps.scope.outputs.notes_unified_field_only }}
          SCOPE_pwa_offline_resilience_only: ${{ steps.scope.outputs.pwa_offline_resilience_only }}
          SCOPE_info_panel_cnb_rates_only: ${{ steps.scope.outputs.info_panel_cnb_rates_only }}
          SCOPE_jr_section_header_line_color_only: ${{ steps.scope.outputs.jr_section_header_line_color_only }}
          SCOPE_legal_doc_section_bar_only: ${{ steps.scope.outputs.legal_doc_section_bar_only }}
          SCOPE_legal_docs_form_state_only: ${{ steps.scope.outputs.legal_docs_form_state_only }}
          SCOPE_pc_svatek_label_pill_gap_only: ${{ steps.scope.outputs.pc_svatek_label_pill_gap_only }}
          SCOPE_calendar_allday_pinned_limit_only: ${{ steps.scope.outputs.calendar_allday_pinned_limit_only }}
          SCOPE_desktop_article_read_mark_only: ${{ steps.scope.outputs.desktop_article_read_mark_only }}
          SCOPE_iu_ads_deploy_unblock_only: ${{ steps.scope.outputs.iu_ads_deploy_unblock_only }}
        run: node scripts/ci/run-smoke-guards-parallel-v1.mjs
      - name: Premium invoice PDF visual proof (Linux PNG)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true' && steps.scope.outputs.iu_ads_deploy_unblock_only != 'true'
        run: |
          set -euo pipefail
          cd cloudflare/iu-ads
          export IU_INVOICE_VISUAL_OUT="${RUNNER_TEMP}/iu-invoice-visual"
          mkdir -p "$IU_INVOICE_VISUAL_OUT"
          IU_INVOICE_VISUAL_OUT="$IU_INVOICE_VISUAL_OUT" npm test -- test/premium-invoice-visual-proof.test.ts
          test -s "$IU_INVOICE_VISUAL_OUT/invoice-reference-like.pdf"
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftoppm -png -singlefile -r 150 "$IU_INVOICE_VISUAL_OUT/invoice-reference-like.pdf" "$IU_INVOICE_VISUAL_OUT/invoice-reference-like"
          test -s "$IU_INVOICE_VISUAL_OUT/invoice-reference-like.png"
          echo "IU_PREMIUM_INVOICE_PNG_RENDER=PASS"

      - name: Upload premium invoice visual artifacts
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true' && steps.scope.outputs.iu_ads_deploy_unblock_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: premium-invoice-visual-${{ github.run_id }}
          path: ${{ runner.temp }}/iu-invoice-visual/
          if-no-files-found: error

      - name: Upload CHMI CZ map visual proof
        if: always() && steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iu-chmi-cz-map-visual-proof
          path: iu-chmi-cz-map-visual-proof/
          if-no-files-found: warn
          retention-days: 14

      - name: Pages artifact allowlist stage + guard (SC-EXP-01)
        if: steps.scope.outputs.data_only != 'true' && steps.scope.outputs.info_panel_cnb_rates_only != 'true' && steps.scope.outputs.desktop_article_read_mark_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Contract: Pages must upload allowlisted staging dir, never full checkout.
          grep -n 'path: dist-pages' .github/workflows/pages.yml
          if grep -n 'upload-pages-artifact' -A2 .github/workflows/pages.yml | grep -E 'path:[[:space:]]*\.'; then
            echo "FAIL: upload-pages-artifact still uses path: ."
            exit 1
          fi
          npm run iu-pages-stage-artifact
          npm run iu-pages-artifact-guard
          # Ensure smoke checkout is not polluted for later UI guards.
          rm -rf dist-pages

      # Required status owner: pull_request or merge_group (this job). Duplicate push is gated out.
      - name: Set required status context (smoke)
        if: always() && needs.smoke-gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/post-required-status.sh
          scripts/ci/post-required-status.sh smoke
