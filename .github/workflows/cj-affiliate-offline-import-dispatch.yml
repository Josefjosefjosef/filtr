name: CJ Affiliate unattended import (offline dispatch only)

on:
  workflow_dispatch:
    inputs:
      mock_product_feed:
        description: "Run mock product feed probe (offline)"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: cj-affiliate-unattended-import-offline
  cancel-in-progress: false

jobs:
  unattended-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: CJ offline full stack selftest (FORPSI mock + unattended + gates)
        shell: bash
        env:
          IU_CJ_EMAIL_INGEST_OFFLINE: "1"
          IU_CJ_GITHUB_INGEST_DRY_RUN: "1"
          IU_CJ_D1_BACKEND: "mock"
          PRODUCTION_SIGNING_ENABLED: "false"
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-offline-full-stack-v1-selftest.mjs

      - name: Archive publication negative (vitest deps)
        shell: bash
        working-directory: cloudflare/iu-ads
        run: |
          set -euo pipefail
          npm ci

      - name: Archive publication negative (vitest)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-affiliate-archive-publication-negative-selftest.mjs

      - name: Run unattended import runner (offline — no live CJ/FORPSI)
        shell: bash
        env:
          IU_CJ_UNATTENDED_IMPORT_OFFLINE: "1"
          IU_CJ_UNATTENDED_SKIP_EMAIL_INGEST: "1"
          PRODUCTION_SIGNING_ENABLED: "false"
          IU_CJ_UNATTENDED_MOCK_PRODUCT_FEED: ${{ github.event.inputs.mock_product_feed || '1' }}
        run: |
          set -euo pipefail
          node scripts/iu-cj-affiliate-phase2-unattended-import-runner-v1.mjs

      - name: Live unattended gate (NOT ENABLED)
        shell: bash
        run: |
          set -euo pipefail
          echo "Live unattended import requires ALL of:"
          echo "  IU_CJ_LIVE_UNATTENDED_IMPORT=1"
          echo "  IU_CJ_LIVE_INGEST_APPROVED=1"
          echo "  IU_FORPSI_IMAP_CONNECT_APPROVED=1 + IMAP secrets"
          echo "  IU_CJ_D1_BACKEND=worker + worker URL + ingest token"
          echo "  IU_CJ_CJ_API_HTTP_EXECUTE=1 + infra PAT"
          echo "  IU_CJ_UNATTENDED_IMPORT_OFFLINE=0"
          echo "No cron schedule on this workflow until explicit production GO."
