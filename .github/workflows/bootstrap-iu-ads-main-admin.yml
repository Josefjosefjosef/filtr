# Bootstrap first InfoUzel Ads main_admin (public ads stay OFF)
#
# Manual-only. Creates Worker auth secrets (from GitHub secrets), seeds exactly one
# main_admin with a one-time activation URL written ONLY to a short-lived private artifact.
# Never prints passwords, tokens, peppers, or hashes to logs.
#
# Root cause fix: committed wrangler.toml uses placeholder database_id; this workflow
# resolves the real iu-ads D1 id (same account as Deploy) before any remote execute.
name: Bootstrap IU Ads Main Admin

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "bootstrap = seed; precheck_only = read-only D1; cleanup_bootstrap_token = delete leftover ADS_BOOTSTRAP_TOKEN only (no seed)."
        type: choice
        required: true
        default: bootstrap
        options:
          - bootstrap
          - precheck_only
          - cleanup_bootstrap_token
      admin_email:
        description: "E-mail prvního hlavního administrátora (povinné pro bootstrap; neheslo)."
        type: string
        required: false
        default: ""
      admin_display_name:
        description: "Zobrazované jméno (volitelné)."
        type: string
        required: false
        default: "Hlavní administrátor"
      activation_ttl_seconds:
        description: "Platnost aktivačního odkazu v sekundách (300–86400)."
        type: string
        required: false
        default: "3600"
      enable_apis_after:
        description: "Po bootstrapu nastavit Admin+Client API ON (public delivery zůstane OFF)."
        type: boolean
        required: false
        default: true

concurrency:
  group: bootstrap-iu-ads-main-admin
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: cloudflare/iu-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      ADS_SESSION_SECRET: ${{ secrets.ADS_SESSION_SECRET }}
      ADS_PASSWORD_PEPPER: ${{ secrets.ADS_PASSWORD_PEPPER }}
      ADS_CLIENT_SESSION_SECRET: ${{ secrets.ADS_CLIENT_SESSION_SECRET }}
      ADS_CODE_PEPPER: ${{ secrets.ADS_CODE_PEPPER }}
      ADS_BACKUP_ENCRYPTION_KEY: ${{ secrets.ADS_BACKUP_ENCRYPTION_KEY }}
      RUN_MODE: ${{ inputs.run_mode }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-ads/package-lock.json

      - name: Install
        run: npm ci

      - name: Token source (names only)
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "TOKEN_SOURCE=MISSING"
            echo "BLOCKER: need CLOUDFLARE_ADS_API_TOKEN (preferred) or CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -n "${{ secrets.CLOUDFLARE_ADS_API_TOKEN }}" ]; then
            echo "TOKEN_SOURCE=CLOUDFLARE_ADS_API_TOKEN"
          else
            echo "TOKEN_SOURCE=CLOUDFLARE_API_TOKEN_FALLBACK"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID_SET=577868e9aac9c289e9323100f68fad16"

      - name: Require auth secrets present (names only)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          missing=0
          for name in ADS_SESSION_SECRET ADS_PASSWORD_PEPPER ADS_CLIENT_SESSION_SECRET ADS_CODE_PEPPER; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "MISSING_SECRET=$name"
              missing=1
            else
              echo "SECRET_PRESENT=$name"
            fi
          done
          if [ -n "${ADS_BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "SECRET_PRESENT=ADS_BACKUP_ENCRYPTION_KEY"
          else
            echo "SECRET_OPTIONAL_MISSING=ADS_BACKUP_ENCRYPTION_KEY"
          fi
          if [ "$missing" != "0" ]; then
            echo "BLOCKER: create the missing GitHub Actions repository secrets, then re-run this workflow."
            echo "MANUAL_STEP=Repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Put Worker secrets (values never echoed)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local val="$2"
            printf '%s' "$val" | npx wrangler secret put "$name"
            echo "SECRET_PUT=${name}=OK"
          }
          put_secret ADS_SESSION_SECRET "$ADS_SESSION_SECRET"
          put_secret ADS_PASSWORD_PEPPER "$ADS_PASSWORD_PEPPER"
          put_secret ADS_CLIENT_SESSION_SECRET "$ADS_CLIENT_SESSION_SECRET"
          put_secret ADS_CODE_PEPPER "$ADS_CODE_PEPPER"
          if [ -n "${ADS_BACKUP_ENCRYPTION_KEY:-}" ]; then
            put_secret ADS_BACKUP_ENCRYPTION_KEY "$ADS_BACKUP_ENCRYPTION_KEY"
          fi

      - name: Resolve real D1 database_id for iu-ads
        if: ${{ inputs.run_mode == 'bootstrap' || inputs.run_mode == 'precheck_only' }}
        run: |
          set -euo pipefail
          # Committed wrangler.toml uses placeholder 00000000-… — remote execute fails without patch.
          # Same account/list approach as Deploy IU Ads; NEVER create DB here (fail-closed).
          set +e
          LIST_JSON="$(npx wrangler d1 list --json 2>/tmp/d1-list.err)"
          LIST_EC=$?
          set -e
          if [ "$LIST_EC" != "0" ]; then
            echo "STATUS=D1_QUERY_FAILED"
            echo "BLOCKER: cannot list D1 databases"
            if [ -f /tmp/d1-list.err ]; then sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/d1-list.err | head -n 40 || true; fi
            exit 1
          fi
          ID="$(printf '%s' "$LIST_JSON" | node -e "
            let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{
              try {
                const arr=JSON.parse(s);
                const hit=(arr||[]).find(x=>x&&x.name==='iu-ads');
                const id=hit&&(hit.uuid||hit.id||'');
                process.stdout.write(id?String(id):'');
              } catch { process.stdout.write(''); }
            });
          ")"
          if [ -z "$ID" ]; then
            echo "STATUS=D1_QUERY_FAILED"
            echo "BLOCKER: D1 database named iu-ads not found in account 577868e9aac9c289e9323100f68fad16"
            exit 1
          fi
          echo "D1_NAME=iu-ads"
          echo "D1_ID_RESOLVED=yes"
          export ID
          ID="$ID" node -e "
            const fs=require('fs');
            let t=fs.readFileSync('wrangler.toml','utf8');
            if (!/database_id = \"[^\"]+\"/.test(t)) { console.error('BLOCKER: wrangler.toml missing database_id'); process.exit(2); }
            t=t.replace(/database_id = \"[^\"]+\"/, 'database_id = \"'+process.env.ID+'\"');
            fs.writeFileSync('wrangler.toml',t);
            console.log('D1_ID_PATCHED=yes');
          "

      - name: Refuse if main_admin already exists (fail-closed)
        if: ${{ inputs.run_mode == 'bootstrap' || inputs.run_mode == 'precheck_only' }}
        run: |
          set -euo pipefail
          run_eval() {
            local kind="$1"
            local sql="$2"
            local stdout_file="$3"
            local stderr_file="$4"
            set +e
            npx wrangler d1 execute iu-ads --remote --json --command "$sql" >"$stdout_file" 2>"$stderr_file"
            local ec=$?
            set -e
            node ./scripts/iu-ads-bootstrap-precheck.mjs evaluate \
              --kind "$kind" \
              --exit-code "$ec" \
              --stdout-file "$stdout_file" \
              --stderr-file "$stderr_file"
          }

          echo "PRECHECK_SCHEMA_START"
          SCHEMA_OUT="$(run_eval schema_probe "SELECT COUNT(*) AS cnt FROM sqlite_master WHERE type='table' AND name='admin_user_roles';" /tmp/d1-schema.out /tmp/d1-schema.err)"
          printf '%s\n' "$SCHEMA_OUT"
          SCHEMA_STATUS="$(printf '%s\n' "$SCHEMA_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          if [ "$SCHEMA_STATUS" != "OK" ]; then
            echo "BLOCKER: admin_user_roles schema probe failed ($SCHEMA_STATUS)"
            exit 1
          fi

          echo "PRECHECK_USERS_START"
          USERS_OUT="$(run_eval users_count "SELECT COUNT(*) AS cnt FROM admin_users;" /tmp/d1-users.out /tmp/d1-users.err)"
          printf '%s\n' "$USERS_OUT"
          USERS_STATUS="$(printf '%s\n' "$USERS_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          USERS_COUNT="$(printf '%s\n' "$USERS_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          echo "ADMIN_USERS_COUNT=${USERS_COUNT:-unknown}"
          if [ "$USERS_STATUS" != "OK" ]; then
            echo "BLOCKER: admin_users count query failed ($USERS_STATUS)"
            exit 1
          fi

          echo "PRECHECK_MAIN_ADMIN_START"
          MAIN_OUT="$(run_eval main_admin_count "SELECT COUNT(*) AS cnt FROM admin_user_roles WHERE role_code = 'main_admin';" /tmp/d1-main.out /tmp/d1-main.err)"
          printf '%s\n' "$MAIN_OUT"
          MAIN_STATUS="$(printf '%s\n' "$MAIN_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          MAIN_COUNT="$(printf '%s\n' "$MAIN_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          echo "MAIN_ADMIN_COUNT=${MAIN_COUNT:-unknown}"

          echo "PRECHECK_LOCK_START"
          LOCK_OUT="$(run_eval bootstrap_lock "SELECT value FROM system_settings WHERE key = 'BOOTSTRAP_COMPLETED';" /tmp/d1-lock.out /tmp/d1-lock.err)"
          printf '%s\n' "$LOCK_OUT"
          LOCK_STATUS="$(printf '%s\n' "$LOCK_OUT" | sed -n 's/^STATUS=//p' | head -n1)"

          # Consistency probes (counts only — no tokens/hashes).
          echo "PRECHECK_CONSISTENCY_START"
          set +e
          npx wrangler d1 execute iu-ads --remote --json --command "SELECT COUNT(*) AS cnt FROM admin_password_resets WHERE used_at IS NULL;" >/tmp/d1-unused.out 2>/tmp/d1-unused.err
          EC_U=$?
          npx wrangler d1 execute iu-ads --remote --json --command "SELECT COUNT(*) AS cnt FROM admin_user_roles r LEFT JOIN admin_users u ON u.user_id = r.user_id WHERE u.user_id IS NULL;" >/tmp/d1-orphan.out 2>/tmp/d1-orphan.err
          EC_O=$?
          npx wrangler d1 execute iu-ads --remote --json --command "SELECT COUNT(*) AS cnt FROM admin_users u LEFT JOIN admin_user_roles r ON r.user_id = u.user_id WHERE r.user_id IS NULL;" >/tmp/d1-norole.out 2>/tmp/d1-norole.err
          EC_N=$?
          set -e
          UNUSED_OUT="$(node ./scripts/iu-ads-bootstrap-precheck.mjs evaluate --kind users_count --exit-code "$EC_U" --stdout-file /tmp/d1-unused.out --stderr-file /tmp/d1-unused.err)"
          ORPHAN_OUT="$(node ./scripts/iu-ads-bootstrap-precheck.mjs evaluate --kind users_count --exit-code "$EC_O" --stdout-file /tmp/d1-orphan.out --stderr-file /tmp/d1-orphan.err)"
          NOROLE_OUT="$(node ./scripts/iu-ads-bootstrap-precheck.mjs evaluate --kind users_count --exit-code "$EC_N" --stdout-file /tmp/d1-norole.out --stderr-file /tmp/d1-norole.err)"
          UNUSED_STATUS="$(printf '%s\n' "$UNUSED_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          ORPHAN_STATUS="$(printf '%s\n' "$ORPHAN_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          NOROLE_STATUS="$(printf '%s\n' "$NOROLE_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          UNUSED_COUNT="$(printf '%s\n' "$UNUSED_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          ORPHAN_COUNT="$(printf '%s\n' "$ORPHAN_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          NOROLE_COUNT="$(printf '%s\n' "$NOROLE_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          echo "UNUSED_RESETS_COUNT=${UNUSED_COUNT:-unknown}"
          echo "ORPHAN_ROLES_COUNT=${ORPHAN_COUNT:-unknown}"
          echo "USERS_WITHOUT_ROLES_COUNT=${NOROLE_COUNT:-unknown}"
          if [ "$UNUSED_STATUS" != "OK" ] || [ "$ORPHAN_STATUS" != "OK" ] || [ "$NOROLE_STATUS" != "OK" ]; then
            echo "BLOCKER: consistency probe query failed — fail-closed."
            exit 1
          fi
          if [ "${ORPHAN_COUNT:-}" != "0" ] || [ "${NOROLE_COUNT:-}" != "0" ]; then
            echo "BLOCKER: inconsistent D1 state (orphan roles or users without roles) — fail-closed."
            exit 1
          fi
          if [ "${USERS_COUNT:-}" = "0" ] && [ "${UNUSED_COUNT:-}" != "0" ]; then
            echo "BLOCKER: unused activation resets without users — fail-closed."
            exit 1
          fi

          # Hard infrastructure failures always fail-closed (both modes).
          for pair in "SCHEMA:$SCHEMA_STATUS" "USERS:$USERS_STATUS" "MAIN:$MAIN_STATUS" "LOCK:$LOCK_STATUS"; do
            name="${pair%%:*}"
            st="${pair#*:}"
            case "$st" in
              D1_QUERY_FAILED|TABLE_MISSING|JSON_INVALID|AMBIGUOUS)
                echo "BLOCKER: $name precheck failed ($st) — fail-closed."
                exit 1
                ;;
            esac
          done

          if [ "$RUN_MODE" = "precheck_only" ]; then
            if [ "$MAIN_STATUS" = "MAIN_ADMIN_EXISTS" ] || [ "${MAIN_COUNT:-}" != "0" ]; then
              echo "VERDICT=MAIN_ADMIN_EXISTS"
            elif [ "$LOCK_STATUS" = "BOOTSTRAP_COMPLETED" ]; then
              echo "VERDICT=BOOTSTRAP_COMPLETED"
            else
              echo "VERDICT=READY_FOR_BOOTSTRAP"
            fi
            echo "BOOTSTRAP_PRECHECK=REPORTED"
            exit 0
          fi

          # bootstrap mode: refuse existing main_admin / lock; never continue without COUNT=0.
          if [ "$MAIN_STATUS" = "MAIN_ADMIN_EXISTS" ]; then
            echo "BLOCKER: main_admin already exists — bootstrap refused (idempotent lock)."
            exit 1
          fi
          if [ "$MAIN_STATUS" != "OK" ] || [ "$MAIN_COUNT" != "0" ]; then
            echo "BLOCKER: main_admin precheck not clear (STATUS=$MAIN_STATUS COUNT=${MAIN_COUNT:-}) — fail-closed."
            exit 1
          fi
          if [ "$LOCK_STATUS" = "BOOTSTRAP_COMPLETED" ]; then
            echo "BLOCKER: BOOTSTRAP_COMPLETED=1 — bootstrap refused."
            exit 1
          fi
          if [ "$LOCK_STATUS" != "OK" ]; then
            echo "BLOCKER: bootstrap lock precheck failed ($LOCK_STATUS) — fail-closed."
            exit 1
          fi
          if [ "${USERS_COUNT:-}" != "0" ]; then
            echo "BLOCKER: admin_users not empty — fail-closed."
            exit 1
          fi

          echo "BOOTSTRAP_PRECHECK=OK"
          echo "PREVIOUS_FAILED_RUN_SEEDED=no (D1 empty; prior SQL txn apply aborted by D1)"

      - name: Stop after precheck_only
        if: ${{ inputs.run_mode == 'precheck_only' }}
        run: |
          set -euo pipefail
          echo "RUN_MODE=precheck_only"
          echo "PRECHECK_ONLY=SUCCESS"
          echo "NO_MUTATION=seed_skipped"
          echo "PUBLIC_ADS=still_OFF"

      - name: Delete leftover ADS_BOOTSTRAP_TOKEN (cleanup_bootstrap_token only)
        if: ${{ inputs.run_mode == 'cleanup_bootstrap_token' }}
        id: stale_cleanup
        run: |
          set -euo pipefail
          set +e
          npx wrangler secret list --name infouzel-ads --format json >"$RUNNER_TEMP/iu-ads-secret-list.json"
          LIST_EC=$?
          set -e
          if [ "$LIST_EC" != "0" ]; then
            echo "BLOCKER: wrangler secret list failed"
            exit 1
          fi
          set +e
          node ./scripts/iu-ads-bootstrap-token-flow.mjs secret-list-has \
            "$RUNNER_TEMP/iu-ads-secret-list.json" ADS_BOOTSTRAP_TOKEN
          HAS_EC=$?
          set -e
          rm -f "$RUNNER_TEMP/iu-ads-secret-list.json"
          if [ "$HAS_EC" != "0" ]; then
            echo "BOOTSTRAP_SECRET_DELETE=ALREADY_ABSENT"
          else
            set +e
            echo y | npx wrangler secret delete ADS_BOOTSTRAP_TOKEN --name infouzel-ads
            DEL_EC=$?
            set -e
            if [ "$DEL_EC" != "0" ]; then
              echo "BOOTSTRAP_SECRET_DELETE=FAIL"
              echo "BLOCKER: could not delete ADS_BOOTSTRAP_TOKEN"
              exit 1
            fi
            echo "BOOTSTRAP_SECRET_DELETE=SUCCESS"
          fi

      - name: Verify bootstrap endpoint unusable after cleanup_bootstrap_token
        if: ${{ inputs.run_mode == 'cleanup_bootstrap_token' }}
        run: |
          set -euo pipefail
          RESP_FILE="$RUNNER_TEMP/iu-ads-cleanup-probe.json"
          attempt=1
          while [ "$attempt" -le 24 ]; do
            set +e
            HTTP="$(curl -sS -o "$RESP_FILE" -w "%{http_code}" \
              -X POST "https://ads.infouzel.cz/v1/internal/bootstrap/main-admin" \
              -H "Authorization: Bearer cleanup-probe" \
              -H "Content-Type: application/json" \
              --data '{"email":"cleanup@invalid.example"}')"
            CURL_EC=$?
            set -e
            if [ "$CURL_EC" = "0" ]; then
              set +e
              node ./scripts/iu-ads-bootstrap-token-flow.mjs classify-post-delete "$HTTP" "$RESP_FILE"
              CLS_EC=$?
              set -e
              rm -f "$RESP_FILE"
              if [ "$CLS_EC" = "0" ]; then
                echo "BOOTSTRAP_TOKEN_GONE=CONFIRMED"
                echo "CLEANUP_BOOTSTRAP_TOKEN=SUCCESS"
                echo "NO_MUTATION=d1_untouched"
                echo "PUBLIC_ADS=still_OFF"
                exit 0
              fi
              echo "BOOTSTRAP_TOKEN_STILL_PRESENT attempt=$attempt http=$HTTP"
            else
              echo "CLEANUP_PROBE_CURL_FAIL attempt=$attempt"
              rm -f "$RESP_FILE"
            fi
            attempt=$((attempt+1))
            sleep 5
          done
          echo "BLOCKER: ADS_BOOTSTRAP_TOKEN still observable after delete"
          exit 1

      - name: Validate bootstrap email
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          EMAIL='${{ inputs.admin_email }}'
          if [ -z "$EMAIL" ]; then
            echo "BLOCKER: admin_email is required for run_mode=bootstrap"
            exit 1
          fi
          echo "BOOTSTRAP_EMAIL_PRESENT=1"

      # ROOT CAUSE (run 30141405605): secret put ADS_BOOTSTRAP_TOKEN then wrangler deploy
      # created a new Worker version that did not bind the ephemeral secret → 503
      # bootstrap_token_not_configured. Safe order: deploy FIRST, then secret put
      # (secret put deploys a version with the binding), readiness, then call. Never
      # deploy again until after token delete.
      - name: Deploy Worker (APIs ON, public OFF) before bootstrap token
        if: ${{ inputs.run_mode == 'bootstrap' }}
        id: boot_deploy
        run: |
          set -euo pipefail
          echo "DEPLOY_TARGET_WORKER=infouzel-ads"
          echo "DEPLOY_TARGET_ACCOUNT=577868e9aac9c289e9323100f68fad16"
          echo "DEPLOY_TARGET_URL=https://ads.infouzel.cz"
          npx wrangler deploy \
            --name infouzel-ads \
            --var ADS_SAFE_MODE:true \
            --var ADS_PUBLIC_DELIVERY_ENABLED:false \
            --var ADS_ADMIN_API_ENABLED:true \
            --var ADS_CLIENT_API_ENABLED:true
          echo "WORKER_DEPLOY=SUCCESS"
          echo "DEPLOY_VAR_ADMIN_API=true"
          echo "DEPLOY_VAR_CLIENT_API=true"
          echo "DEPLOY_VAR_PUBLIC_DELIVERY=false"

      - name: Put ephemeral ADS_BOOTSTRAP_TOKEN after deploy (never logged)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        id: boot_token
        run: |
          set -euo pipefail
          umask 077
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/iu-ads-bootstrap-token.txt"
          chmod 600 "$RUNNER_TEMP/iu-ads-bootstrap-token.txt"
          set +e
          printf '%s' "$TOKEN" | npx wrangler secret put ADS_BOOTSTRAP_TOKEN --name infouzel-ads
          PUT_EC=$?
          set -e
          unset TOKEN
          if [ "$PUT_EC" != "0" ]; then
            echo "BOOTSTRAP_SECRET_PUT=FAIL"
            echo "BLOCKER: wrangler secret put ADS_BOOTSTRAP_TOKEN failed (exit=$PUT_EC)"
            exit 1
          fi
          echo "BOOTSTRAP_SECRET_PUT=SUCCESS"
          set +e
          npx wrangler secret list --name infouzel-ads --format json >"$RUNNER_TEMP/iu-ads-secret-list.json"
          LIST_EC=$?
          set -e
          if [ "$LIST_EC" != "0" ]; then
            echo "BLOCKER: wrangler secret list failed after put"
            exit 1
          fi
          node ./scripts/iu-ads-bootstrap-token-flow.mjs secret-list-has \
            "$RUNNER_TEMP/iu-ads-secret-list.json" ADS_BOOTSTRAP_TOKEN
          rm -f "$RUNNER_TEMP/iu-ads-secret-list.json"
          # Do NOT wrangler deploy after this put — that was the production failure mode.

      - name: Bootstrap readiness (binding present; value never logged)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        id: boot_ready
        run: |
          set -euo pipefail
          PROBE_URL="https://ads.infouzel.cz/v1/internal/bootstrap/main-admin"
          PROBE_BODY='{"email":"readiness-probe@invalid.example"}'
          # Fixed non-secret probe string (not the ephemeral token). Expect 401 when configured.
          PROBE_BEARER="iu-ads-bootstrap-readiness-probe"
          echo "::add-mask::$PROBE_BEARER"
          attempt=1
          while [ "$attempt" -le 24 ]; do
            RESP_FILE="$RUNNER_TEMP/iu-ads-bootstrap-ready-$attempt.json"
            set +e
            HTTP="$(curl -sS -o "$RESP_FILE" -w "%{http_code}" \
              -X POST "$PROBE_URL" \
              -H "Authorization: Bearer ${PROBE_BEARER}" \
              -H "Content-Type: application/json" \
              --data "$PROBE_BODY")"
            CURL_EC=$?
            set -e
            if [ "$CURL_EC" = "0" ]; then
              set +e
              node ./scripts/iu-ads-bootstrap-token-flow.mjs classify-readiness "$HTTP" "$RESP_FILE"
              CLS_EC=$?
              set -e
              rm -f "$RESP_FILE"
              if [ "$CLS_EC" = "0" ]; then
                echo "BOOTSTRAP_READINESS=READY"
                exit 0
              fi
              if [ "$CLS_EC" = "2" ]; then
                echo "BOOTSTRAP_READINESS=NOT_READY attempt=$attempt"
              else
                echo "BOOTSTRAP_READINESS=UNKNOWN attempt=$attempt http=$HTTP"
              fi
            else
              echo "BOOTSTRAP_READINESS=CURL_FAIL attempt=$attempt curl_ec=$CURL_EC"
              rm -f "$RESP_FILE"
            fi
            attempt=$((attempt+1))
            sleep 5
          done
          echo "BOOTSTRAP_READINESS=TIMEOUT"
          echo "BLOCKER: ADS_BOOTSTRAP_TOKEN binding not observable before endpoint call"
          exit 1

      - name: Atomic Worker bootstrap via D1 batch (no SQL BEGIN)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        id: boot_call
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ inputs.admin_email }}
          BOOTSTRAP_ADMIN_DISPLAY_NAME: ${{ inputs.admin_display_name }}
          BOOTSTRAP_ACTIVATION_TTL_SECONDS: ${{ inputs.activation_ttl_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iu-ads-bootstrap"
          umask 077
          TOKEN="$(cat "$RUNNER_TEMP/iu-ads-bootstrap-token.txt")"
          echo "::add-mask::$TOKEN"
          BODY_FILE="$RUNNER_TEMP/iu-ads-bootstrap/request.json"
          RESP_FILE="$RUNNER_TEMP/iu-ads-bootstrap/response.json"
          BODY_FILE="$BODY_FILE" node -e "
            const fs=require('fs');
            const email=process.env.BOOTSTRAP_ADMIN_EMAIL||'';
            const displayName=process.env.BOOTSTRAP_ADMIN_DISPLAY_NAME||'Hlavni administrator';
            const ttl=Number(process.env.BOOTSTRAP_ACTIVATION_TTL_SECONDS||'3600');
            fs.writeFileSync(process.env.BODY_FILE, JSON.stringify({email, displayName, ttlSeconds:ttl}));
          "
          # Call Worker; never print response body (contains activationUrl).
          set +e
          HTTP="$(curl -sS -o "$RESP_FILE" -w "%{http_code}" \
            -X POST "https://ads.infouzel.cz/v1/internal/bootstrap/main-admin" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @"$BODY_FILE")"
          CURL_EC=$?
          set -e
          unset TOKEN
          echo "BOOTSTRAP_HTTP=$HTTP"
          if [ "$CURL_EC" != "0" ] || { [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; }; then
            echo "BLOCKER: worker bootstrap failed (http=$HTTP curl_ec=$CURL_EC)"
            node -e "
              const fs=require('fs');
              try {
                const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));
                console.log('BOOTSTRAP_ERROR='+String(j.error||'unknown'));
              } catch { console.log('BOOTSTRAP_ERROR=unparseable_or_empty'); }
            " "$RESP_FILE"
            rm -f "$RUNNER_TEMP/iu-ads-bootstrap-token.txt"
            exit 1
          fi
          node -e "
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));
            if(j.ok!==true) process.exit(2);
            if(typeof j.activationUrl!=='string' || j.activationUrl.indexOf('activate=')<0) process.exit(3);
            if(typeof j.email!=='string' || !j.email) process.exit(4);
            const lines=[
              '# InfoUzel Ads — jednorázový aktivační odkaz (NECOMMITOVAT, NESDÍLET)',
              '# Platnost do: '+(j.expiresAt||''),
              '# Po nastavení hesla odkaz přestane platit.',
              '',
              j.activationUrl,
              ''
            ];
            fs.writeFileSync(process.argv[2], lines.join('\\n'), {mode:0o600});
            delete j.activationUrl;
            fs.writeFileSync(process.argv[1], JSON.stringify({ok:true,email:j.email,userIdPrefix:j.userIdPrefix,expiresAt:j.expiresAt}));
            console.log('BOOTSTRAP_WORKER=OK');
            console.log('BOOTSTRAP_EMAIL_SET=1');
            console.log('BOOTSTRAP_USER_ID_PREFIX='+String(j.userIdPrefix||''));
            console.log('BOOTSTRAP_ACTIVATION_ARTIFACT=WRITTEN');
          " "$RESP_FILE" "$RUNNER_TEMP/iu-ads-bootstrap/activation-url.txt"
          rm -f "$RUNNER_TEMP/iu-ads-bootstrap-token.txt"

      - name: Read-back D1 after Worker bootstrap
        if: ${{ inputs.run_mode == 'bootstrap' }}
        id: boot_readback
        run: |
          set -euo pipefail
          run_eval() {
            local kind="$1"
            local sql="$2"
            local stdout_file="$3"
            local stderr_file="$4"
            set +e
            npx wrangler d1 execute iu-ads --remote --json --command "$sql" >"$stdout_file" 2>"$stderr_file"
            local ec=$?
            set -e
            node ./scripts/iu-ads-bootstrap-precheck.mjs evaluate \
              --kind "$kind" \
              --exit-code "$ec" \
              --stdout-file "$stdout_file" \
              --stderr-file "$stderr_file"
          }
          MAIN_OUT="$(run_eval main_admin_count "SELECT COUNT(*) AS cnt FROM admin_user_roles WHERE role_code = 'main_admin';" /tmp/rb-main.out /tmp/rb-main.err)"
          USERS_OUT="$(run_eval users_count "SELECT COUNT(*) AS cnt FROM admin_users;" /tmp/rb-users.out /tmp/rb-users.err)"
          LOCK_OUT="$(run_eval bootstrap_lock "SELECT value FROM system_settings WHERE key = 'BOOTSTRAP_COMPLETED';" /tmp/rb-lock.out /tmp/rb-lock.err)"
          printf '%s\n' "$MAIN_OUT"
          printf '%s\n' "$USERS_OUT"
          printf '%s\n' "$LOCK_OUT"
          MAIN_STATUS="$(printf '%s\n' "$MAIN_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          MAIN_COUNT="$(printf '%s\n' "$MAIN_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          USERS_COUNT="$(printf '%s\n' "$USERS_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          LOCK_STATUS="$(printf '%s\n' "$LOCK_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          echo "READBACK_MAIN_ADMIN_COUNT=${MAIN_COUNT:-}"
          echo "READBACK_ADMIN_USERS_COUNT=${USERS_COUNT:-}"
          if [ "$MAIN_STATUS" != "MAIN_ADMIN_EXISTS" ] || [ "$MAIN_COUNT" != "1" ] || [ "$USERS_COUNT" != "1" ] || [ "$LOCK_STATUS" != "BOOTSTRAP_COMPLETED" ]; then
            echo "BOOTSTRAP_READBACK=INCONSISTENT"
            echo "BLOCKER: read-back inconsistent — fail-closed (no SUCCESS)."
            rm -f "$RUNNER_TEMP/iu-ads-bootstrap/activation-url.txt"
            exit 1
          fi
          echo "BOOTSTRAP_READBACK=CONSISTENT"
          echo "READBACK=OK"

      - name: Upload private activation artifact (not logged)
        if: ${{ inputs.run_mode == 'bootstrap' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: iu-ads-main-admin-activation
          path: ${{ runner.temp }}/iu-ads-bootstrap/activation-url.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Delete ephemeral ADS_BOOTSTRAP_TOKEN (always after put; does not hide prior failure)
        if: ${{ always() && inputs.run_mode == 'bootstrap' && steps.boot_token.outcome == 'success' }}
        id: boot_cleanup
        run: |
          set -euo pipefail
          set +e
          echo y | npx wrangler secret delete ADS_BOOTSTRAP_TOKEN --name infouzel-ads
          DEL_EC=$?
          set -e
          if [ "$DEL_EC" != "0" ]; then
            echo "BOOTSTRAP_SECRET_DELETE=FAIL"
            echo "BLOCKER: could not delete ADS_BOOTSTRAP_TOKEN — rotate/delete manually"
            # Still exit non-zero; prior bootstrap failure remains visible in job log.
            exit 1
          fi
          echo "BOOTSTRAP_SECRET_DELETE=SUCCESS"
          rm -f "$RUNNER_TEMP/iu-ads-bootstrap-token.txt"

      - name: Verify bootstrap endpoint unusable after token delete
        if: ${{ always() && inputs.run_mode == 'bootstrap' && steps.boot_cleanup.outcome == 'success' }}
        run: |
          set -euo pipefail
          RESP_FILE="$RUNNER_TEMP/iu-ads-bootstrap-post-delete.json"
          set +e
          HTTP="$(curl -sS -o "$RESP_FILE" -w "%{http_code}" \
            -X POST "https://ads.infouzel.cz/v1/internal/bootstrap/main-admin" \
            -H "Authorization: Bearer post-delete-probe" \
            -H "Content-Type: application/json" \
            --data '{"email":"post-delete@invalid.example"}')"
          CURL_EC=$?
          set -e
          if [ "$CURL_EC" != "0" ]; then
            echo "BLOCKER: post-delete probe curl failed"
            exit 1
          fi
          node ./scripts/iu-ads-bootstrap-token-flow.mjs classify-post-delete "$HTTP" "$RESP_FILE"
          rm -f "$RESP_FILE"

      - name: Health gate (public ads must stay OFF)
        if: ${{ inputs.run_mode == 'bootstrap' && success() }}
        run: |
          set -euo pipefail
          URL="https://ads.infouzel.cz/health"
          attempt=1
          while [ "$attempt" -le 18 ]; do
            CODE="$(curl -sS -o /tmp/iu-ads-health.json -w "%{http_code}" "$URL" || true)"
            if [ "$CODE" = "200" ]; then
              node -e "
                const fs=require('fs');
                const j=JSON.parse(fs.readFileSync('/tmp/iu-ads-health.json','utf8'));
                if(j.ok!==true) process.exit(2);
                if(j.safeMode!==true) process.exit(3);
                if(j.publicDeliveryEnabled!==false) process.exit(4);
                if(j.adminApiEnabled!==true) process.exit(5);
                if(j.clientApiEnabled!==true) process.exit(7);
                if(j.r2 && j.r2.privateDocumentsPublicUrl!==false) process.exit(6);
                console.log('HEALTH_GATE=PASS');
              "
              exit 0
            fi
            attempt=$((attempt+1))
            sleep 5
          done
          echo "HEALTH_GATE=FAIL"
          cat /tmp/iu-ads-health.json || true
          exit 1

      - name: Success instructions (no secrets)
        if: ${{ inputs.run_mode == 'bootstrap' && success() }}
        run: |
          set -euo pipefail
          cat <<'EOF'
          BOOTSTRAP_STATUS=SUCCESS
          ATOMICITY=d1_worker_batch
          NEXT_1=GitHub → Actions run → Artifacts → download iu-ads-main-admin-activation
          NEXT_2=Open activation-url.txt in a private browser window
          NEXT_3=Set your own strong password (min 12 chars)
          NEXT_4=Sign in at /admin with your email + new password
          NEXT_5=Delete the downloaded activation file
          NEXT_6=Artifact auto-expires in 1 day
          PUBLIC_ADS=still_OFF
          EOF
