# Bootstrap first InfoUzel Ads main_admin (public ads stay OFF)
#
# Manual-only. Creates Worker auth secrets (from GitHub secrets), seeds exactly one
# main_admin with a one-time activation URL written ONLY to a short-lived private artifact.
# Never prints passwords, tokens, peppers, or hashes to logs.
#
# Root cause fix: committed wrangler.toml uses placeholder database_id; this workflow
# resolves the real iu-ads D1 id (same account as Deploy) before any remote execute.
name: Bootstrap IU Ads Main Admin

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "bootstrap = seed first main_admin; precheck_only = read-only D1 state (no seed)."
        type: choice
        required: true
        default: bootstrap
        options:
          - bootstrap
          - precheck_only
      admin_email:
        description: "E-mail prvního hlavního administrátora (povinné pro bootstrap; neheslo)."
        type: string
        required: false
        default: ""
      admin_display_name:
        description: "Zobrazované jméno (volitelné)."
        type: string
        required: false
        default: "Hlavní administrátor"
      activation_ttl_seconds:
        description: "Platnost aktivačního odkazu v sekundách (300–86400)."
        type: string
        required: false
        default: "3600"
      enable_apis_after:
        description: "Po bootstrapu nastavit Admin+Client API ON (public delivery zůstane OFF)."
        type: boolean
        required: false
        default: true

concurrency:
  group: bootstrap-iu-ads-main-admin
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: cloudflare/iu-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      ADS_SESSION_SECRET: ${{ secrets.ADS_SESSION_SECRET }}
      ADS_PASSWORD_PEPPER: ${{ secrets.ADS_PASSWORD_PEPPER }}
      ADS_CLIENT_SESSION_SECRET: ${{ secrets.ADS_CLIENT_SESSION_SECRET }}
      ADS_CODE_PEPPER: ${{ secrets.ADS_CODE_PEPPER }}
      ADS_BACKUP_ENCRYPTION_KEY: ${{ secrets.ADS_BACKUP_ENCRYPTION_KEY }}
      RUN_MODE: ${{ inputs.run_mode }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-ads/package-lock.json

      - name: Install
        run: npm ci

      - name: Token source (names only)
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "TOKEN_SOURCE=MISSING"
            echo "BLOCKER: need CLOUDFLARE_ADS_API_TOKEN (preferred) or CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -n "${{ secrets.CLOUDFLARE_ADS_API_TOKEN }}" ]; then
            echo "TOKEN_SOURCE=CLOUDFLARE_ADS_API_TOKEN"
          else
            echo "TOKEN_SOURCE=CLOUDFLARE_API_TOKEN_FALLBACK"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID_SET=577868e9aac9c289e9323100f68fad16"

      - name: Require auth secrets present (names only)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          missing=0
          for name in ADS_SESSION_SECRET ADS_PASSWORD_PEPPER ADS_CLIENT_SESSION_SECRET ADS_CODE_PEPPER; do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "MISSING_SECRET=$name"
              missing=1
            else
              echo "SECRET_PRESENT=$name"
            fi
          done
          if [ -n "${ADS_BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "SECRET_PRESENT=ADS_BACKUP_ENCRYPTION_KEY"
          else
            echo "SECRET_OPTIONAL_MISSING=ADS_BACKUP_ENCRYPTION_KEY"
          fi
          if [ "$missing" != "0" ]; then
            echo "BLOCKER: create the missing GitHub Actions repository secrets, then re-run this workflow."
            echo "MANUAL_STEP=Repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Put Worker secrets (values never echoed)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local val="$2"
            printf '%s' "$val" | npx wrangler secret put "$name"
            echo "SECRET_PUT=${name}=OK"
          }
          put_secret ADS_SESSION_SECRET "$ADS_SESSION_SECRET"
          put_secret ADS_PASSWORD_PEPPER "$ADS_PASSWORD_PEPPER"
          put_secret ADS_CLIENT_SESSION_SECRET "$ADS_CLIENT_SESSION_SECRET"
          put_secret ADS_CODE_PEPPER "$ADS_CODE_PEPPER"
          if [ -n "${ADS_BACKUP_ENCRYPTION_KEY:-}" ]; then
            put_secret ADS_BACKUP_ENCRYPTION_KEY "$ADS_BACKUP_ENCRYPTION_KEY"
          fi

      - name: Resolve real D1 database_id for iu-ads
        run: |
          set -euo pipefail
          # Committed wrangler.toml uses placeholder 00000000-… — remote execute fails without patch.
          # Same account/list approach as Deploy IU Ads; NEVER create DB here (fail-closed).
          set +e
          LIST_JSON="$(npx wrangler d1 list --json 2>/tmp/d1-list.err)"
          LIST_EC=$?
          set -e
          if [ "$LIST_EC" != "0" ]; then
            echo "STATUS=D1_QUERY_FAILED"
            echo "BLOCKER: cannot list D1 databases"
            if [ -f /tmp/d1-list.err ]; then sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/d1-list.err | head -n 40 || true; fi
            exit 1
          fi
          ID="$(printf '%s' "$LIST_JSON" | node -e "
            let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{
              try {
                const arr=JSON.parse(s);
                const hit=(arr||[]).find(x=>x&&x.name==='iu-ads');
                const id=hit&&(hit.uuid||hit.id||'');
                process.stdout.write(id?String(id):'');
              } catch { process.stdout.write(''); }
            });
          ")"
          if [ -z "$ID" ]; then
            echo "STATUS=D1_QUERY_FAILED"
            echo "BLOCKER: D1 database named iu-ads not found in account 577868e9aac9c289e9323100f68fad16"
            exit 1
          fi
          echo "D1_NAME=iu-ads"
          echo "D1_ID_RESOLVED=yes"
          export ID
          ID="$ID" node -e "
            const fs=require('fs');
            let t=fs.readFileSync('wrangler.toml','utf8');
            if (!/database_id = \"[^\"]+\"/.test(t)) { console.error('BLOCKER: wrangler.toml missing database_id'); process.exit(2); }
            t=t.replace(/database_id = \"[^\"]+\"/, 'database_id = \"'+process.env.ID+'\"');
            fs.writeFileSync('wrangler.toml',t);
            console.log('D1_ID_PATCHED=yes');
          "

      - name: Refuse if main_admin already exists (fail-closed)
        run: |
          set -euo pipefail
          run_eval() {
            local kind="$1"
            local sql="$2"
            local stdout_file="$3"
            local stderr_file="$4"
            set +e
            npx wrangler d1 execute iu-ads --remote --json --command "$sql" >"$stdout_file" 2>"$stderr_file"
            local ec=$?
            set -e
            node ./scripts/iu-ads-bootstrap-precheck.mjs evaluate \
              --kind "$kind" \
              --exit-code "$ec" \
              --stdout-file "$stdout_file" \
              --stderr-file "$stderr_file"
          }

          echo "PRECHECK_SCHEMA_START"
          SCHEMA_OUT="$(run_eval schema_probe "SELECT COUNT(*) AS cnt FROM sqlite_master WHERE type='table' AND name='admin_user_roles';" /tmp/d1-schema.out /tmp/d1-schema.err)"
          printf '%s\n' "$SCHEMA_OUT"
          SCHEMA_STATUS="$(printf '%s\n' "$SCHEMA_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          if [ "$SCHEMA_STATUS" != "OK" ]; then
            echo "BLOCKER: admin_user_roles schema probe failed ($SCHEMA_STATUS)"
            exit 1
          fi

          echo "PRECHECK_USERS_START"
          USERS_OUT="$(run_eval users_count "SELECT COUNT(*) AS cnt FROM admin_users;" /tmp/d1-users.out /tmp/d1-users.err)"
          printf '%s\n' "$USERS_OUT"
          USERS_STATUS="$(printf '%s\n' "$USERS_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          USERS_COUNT="$(printf '%s\n' "$USERS_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          echo "ADMIN_USERS_COUNT=${USERS_COUNT:-unknown}"
          if [ "$USERS_STATUS" != "OK" ]; then
            echo "BLOCKER: admin_users count query failed ($USERS_STATUS)"
            exit 1
          fi

          echo "PRECHECK_MAIN_ADMIN_START"
          MAIN_OUT="$(run_eval main_admin_count "SELECT COUNT(*) AS cnt FROM admin_user_roles WHERE role_code = 'main_admin';" /tmp/d1-main.out /tmp/d1-main.err)"
          printf '%s\n' "$MAIN_OUT"
          MAIN_STATUS="$(printf '%s\n' "$MAIN_OUT" | sed -n 's/^STATUS=//p' | head -n1)"
          MAIN_COUNT="$(printf '%s\n' "$MAIN_OUT" | sed -n 's/^COUNT=//p' | head -n1)"
          echo "MAIN_ADMIN_COUNT=${MAIN_COUNT:-unknown}"

          echo "PRECHECK_LOCK_START"
          LOCK_OUT="$(run_eval bootstrap_lock "SELECT value FROM system_settings WHERE key = 'BOOTSTRAP_COMPLETED';" /tmp/d1-lock.out /tmp/d1-lock.err)"
          printf '%s\n' "$LOCK_OUT"
          LOCK_STATUS="$(printf '%s\n' "$LOCK_OUT" | sed -n 's/^STATUS=//p' | head -n1)"

          # Hard infrastructure failures always fail-closed (both modes).
          for pair in "SCHEMA:$SCHEMA_STATUS" "USERS:$USERS_STATUS" "MAIN:$MAIN_STATUS" "LOCK:$LOCK_STATUS"; do
            name="${pair%%:*}"
            st="${pair#*:}"
            case "$st" in
              D1_QUERY_FAILED|TABLE_MISSING|JSON_INVALID|AMBIGUOUS)
                echo "BLOCKER: $name precheck failed ($st) — fail-closed."
                exit 1
                ;;
            esac
          done

          if [ "$RUN_MODE" = "precheck_only" ]; then
            if [ "$MAIN_STATUS" = "MAIN_ADMIN_EXISTS" ] || [ "${MAIN_COUNT:-}" != "0" ]; then
              echo "VERDICT=MAIN_ADMIN_EXISTS"
            elif [ "$LOCK_STATUS" = "BOOTSTRAP_COMPLETED" ]; then
              echo "VERDICT=BOOTSTRAP_COMPLETED"
            else
              echo "VERDICT=READY_FOR_BOOTSTRAP"
            fi
            echo "BOOTSTRAP_PRECHECK=REPORTED"
            exit 0
          fi

          # bootstrap mode: refuse existing main_admin / lock; never continue without COUNT=0.
          if [ "$MAIN_STATUS" = "MAIN_ADMIN_EXISTS" ]; then
            echo "BLOCKER: main_admin already exists — bootstrap refused (idempotent lock)."
            exit 1
          fi
          if [ "$MAIN_STATUS" != "OK" ] || [ "$MAIN_COUNT" != "0" ]; then
            echo "BLOCKER: main_admin precheck not clear (STATUS=$MAIN_STATUS COUNT=${MAIN_COUNT:-}) — fail-closed."
            exit 1
          fi
          if [ "$LOCK_STATUS" = "BOOTSTRAP_COMPLETED" ]; then
            echo "BLOCKER: BOOTSTRAP_COMPLETED=1 — bootstrap refused."
            exit 1
          fi
          if [ "$LOCK_STATUS" != "OK" ]; then
            echo "BLOCKER: bootstrap lock precheck failed ($LOCK_STATUS) — fail-closed."
            exit 1
          fi

          echo "BOOTSTRAP_PRECHECK=OK"
          echo "PREVIOUS_FAILED_RUN_SEEDED=no_evidence (prior run stopped before SQL generate/apply)"

      - name: Stop after precheck_only
        if: ${{ inputs.run_mode == 'precheck_only' }}
        run: |
          set -euo pipefail
          echo "RUN_MODE=precheck_only"
          echo "PRECHECK_ONLY=SUCCESS"
          echo "NO_MUTATION=seed_skipped"
          echo "PUBLIC_ADS=still_OFF"

      - name: Validate bootstrap email
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          EMAIL='${{ inputs.admin_email }}'
          if [ -z "$EMAIL" ]; then
            echo "BLOCKER: admin_email is required for run_mode=bootstrap"
            exit 1
          fi
          echo "BOOTSTRAP_EMAIL_PRESENT=1"

      - name: Generate bootstrap SQL + activation artifact file
        if: ${{ inputs.run_mode == 'bootstrap' }}
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ inputs.admin_email }}
          BOOTSTRAP_ADMIN_DISPLAY_NAME: ${{ inputs.admin_display_name }}
          BOOTSTRAP_ACTIVATION_TTL_SECONDS: ${{ inputs.activation_ttl_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iu-ads-bootstrap"
          umask 077
          node ./scripts/iu-ads-bootstrap-main-admin.mjs \
            --sql-out "$RUNNER_TEMP/iu-ads-bootstrap/bootstrap.sql" \
            --activation-out "$RUNNER_TEMP/iu-ads-bootstrap/activation-url.txt"
          if grep -Eq 'activate=' "$RUNNER_TEMP/iu-ads-bootstrap/bootstrap.sql"; then
            echo "BLOCKER: activation token leaked into SQL file"
            exit 1
          fi
          echo "BOOTSTRAP_FILES=READY"

      - name: Apply bootstrap SQL to remote D1
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute iu-ads --remote --file="$RUNNER_TEMP/iu-ads-bootstrap/bootstrap.sql"
          echo "BOOTSTRAP_D1_APPLY=OK"

      - name: Upload private activation artifact (not logged)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        uses: actions/upload-artifact@v4
        with:
          name: iu-ads-main-admin-activation
          path: ${{ runner.temp }}/iu-ads-bootstrap/activation-url.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Deploy Worker with Admin/Client ON, public delivery OFF
        if: ${{ inputs.run_mode == 'bootstrap' && inputs.enable_apis_after }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var ADS_SAFE_MODE:true \
            --var ADS_PUBLIC_DELIVERY_ENABLED:false \
            --var ADS_ADMIN_API_ENABLED:true \
            --var ADS_CLIENT_API_ENABLED:true
          echo "DEPLOY_VAR_ADMIN_API=true"
          echo "DEPLOY_VAR_CLIENT_API=true"
          echo "DEPLOY_VAR_PUBLIC_DELIVERY=false"

      - name: Health gate (public ads must stay OFF)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          URL="https://infouzel-ads.josef-zmrhal.workers.dev/health"
          attempt=1
          while [ "$attempt" -le 18 ]; do
            CODE="$(curl -sS -o /tmp/iu-ads-health.json -w "%{http_code}" "$URL" || true)"
            if [ "$CODE" = "200" ]; then
              node -e "
                const fs=require('fs');
                const j=JSON.parse(fs.readFileSync('/tmp/iu-ads-health.json','utf8'));
                if(j.ok!==true) process.exit(2);
                if(j.safeMode!==true) process.exit(3);
                if(j.publicDeliveryEnabled!==false) process.exit(4);
                if(j.adminApiEnabled!==true) process.exit(5);
                if(j.clientApiEnabled!==true) process.exit(7);
                if(j.r2 && j.r2.privateDocumentsPublicUrl!==false) process.exit(6);
                console.log('HEALTH_GATE=PASS');
              "
              exit 0
            fi
            attempt=$((attempt+1))
            sleep 5
          done
          echo "HEALTH_GATE=FAIL"
          cat /tmp/iu-ads-health.json || true
          exit 1

      - name: Success instructions (no secrets)
        if: ${{ inputs.run_mode == 'bootstrap' }}
        run: |
          set -euo pipefail
          cat <<'EOF'
          BOOTSTRAP_STATUS=SUCCESS
          NEXT_1=GitHub → Actions run → Artifacts → download iu-ads-main-admin-activation
          NEXT_2=Open activation-url.txt in a private browser window
          NEXT_3=Set your own strong password (min 12 chars)
          NEXT_4=Sign in at /admin with your email + new password
          NEXT_5=Delete the downloaded activation file
          NEXT_6=Artifact auto-expires in 1 day
          PUBLIC_ADS=still_OFF
          EOF
