# Phase 9B: Fast publish path — incremental publishable_pool.json updates (~minutes, not ~50min slow cycle).
# RSS ingest → fast pool merge → subset guards → data PR → auto-merge → pages dispatch.
# Does NOT replace update-articles.yml (slow path for articles.json + full guards + aggregate).
name: Update articles fast pool

concurrency:
  group: update-articles-fast-pool-v1
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

on:
  workflow_dispatch: {}

env:
  AUTOMATION_BRANCH: automation/update-articles-fast-pool
  PR_TITLE: "chore(data): fast publish publishable pool"
  PIPELINE_HANDOFF_BRANCH: automation/pipeline-handoff

jobs:
  fast_pipeline_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Skip duplicate run when fast pool pipeline already active
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          OTHER=$(gh run list --workflow update-articles-fast-pool.yml --repo "$REPO" --status in_progress --json databaseId --jq ".[] | select(.databaseId != ${RUN_ID}) | .databaseId" 2>/dev/null | head -n1 || true)
          if [ -n "$OTHER" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "[fast-pipeline-gate] SKIPPED_DUPLICATE active_run=$OTHER"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "[fast-pipeline-gate] proceed=true"

  fast_pool_publish:
    needs: fast_pipeline_gate
    if: needs.fast_pipeline_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RETENTION_DAYS: "45"
      RSS_ROTATION_BATCH_RUNTIME: "1"
      IU_SKIP_INCREMENTAL_PUBLISH: "1"
      IU_INCREMENTAL_PUBLISH: "0"
      IU_FAST_POOL_PUBLISH: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Sync main ref
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Prepare automation branch (before data generation)
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "${{ env.AUTOMATION_BRANCH }}" origin/main
          echo "[FAST-POOL] branch=${{ env.AUTOMATION_BRANCH }} base=origin/main"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Regenerate source rotation inventory
        run: |
          set -euo pipefail
          python scripts/source_rotation_inventory.py
          test -s projects/data/source_rotation_inventory.json

      - name: Article pipeline — ingest (RSS → staging, no duplicate aggregate)
        env:
          IU_ARTICLE_PIPELINE_PHASE: ingest
          IU_SKIP_INCREMENTAL_PUBLISH: "1"
          IU_INCREMENTAL_PUBLISH: "0"
          IU_FAST_POOL_PUBLISH: "1"
          RSS_ROTATION_BATCH_RUNTIME: "1"
        run: |
          set -euo pipefail
          T0=$(date +%s)
          python scripts/build_articles.py
          T1=$(date +%s)
          echo "[TIME] fast_pipeline_ingest_seconds=$((T1-T0))"
          test -f projects/data/staging/ingest_manifest.json

      - name: Fast pool merge (incremental publishable_pool.json)
        id: fast_pool_merge
        run: |
          set -euo pipefail
          T0=$(date +%s)
          python scripts/iu_fast_pool_publish.py
          T1=$(date +%s)
          echo "[TIME] fast_pool_merge_seconds=$((T1-T0))"
          echo "[TIME] FAST_PUBLISH_DURATION=$((T1-T0))"
          test -s projects/data/publishable_pool.json

      - name: Publishable pool architecture guard
        run: python scripts/publishable_pool_architecture_guard.py

      - name: Emit frontend article feed chunks (V1 delivery layer)
        run: |
          set -euo pipefail
          python scripts/emit_frontend_article_chunks.py
          test -s projects/data/article_feed_chunks/manifest.json

      - name: Topic dedupe false-positive guard
        run: node scripts/topic-dedupe-false-positive-guard.mjs

      - name: Duplicate metadata guard
        env:
          TOPIC_DEDUPE_SUPPRESSED_PATH: ${{ github.workspace }}/projects/data/topic_dedupe_suppressed.json
          ARTICLES_JSON_PATH: ${{ github.workspace }}/projects/data/articles.json
        run: node scripts/duplicate-metadata-guard.mjs

      - name: Source frequency guard
        run: node scripts/source-frequency-guard.mjs

      - name: Content freshness guard (warn mode for fast path)
        env:
          ARTICLES_JSON_PATH: ${{ github.workspace }}/projects/data/articles.json
          SOURCE_REGISTRY_PATH: ${{ github.workspace }}/projects/data/source_registry.json
          CONTENT_FRESHNESS_WARN_MINUTES: "60"
          CONTENT_FRESHNESS_FAIL_MINUTES: "9999"
        run: node scripts/content-freshness-guard.mjs

      - name: Capture pool totals (audit)
        id: pool_audit
        run: |
          set -euo pipefail
          POOL_TOTAL=$(jq -r '.counts.total // 0' projects/data/publishable_pool.json)
          POOL_AT=$(jq -r '.generatedAt // empty' projects/data/publishable_pool.json)
          echo "pool_total=$POOL_TOTAL" >> "$GITHUB_OUTPUT"
          echo "pool_generatedAt=$POOL_AT" >> "$GITHUB_OUTPUT"
          echo "PUBLISHABLE_POOL_TOTAL=$POOL_TOTAL"
          echo "FAST_PUBLISH_SAFE=YES"

      - name: No-diff gate (skip PR when pool unchanged)
        id: no_diff
        run: |
          set -euo pipefail
          CHANGED_FILES=""
          for f in \
            projects/data/publishable_pool.json \
            projects/data/article_pool_manifest.json \
            projects/data/scheduler_state.json \
            projects/data/source_rotation_inventory.json \
            projects/data/topic_dedupe_suppressed.json \
            projects/data/pipeline_reports/article_scheduler_report.json; do
            if git diff --quiet -- "$f" 2>/dev/null; then
              continue
            fi
            CHANGED_FILES="${CHANGED_FILES} ${f}"
          done
          if [ -z "$(echo "$CHANGED_FILES" | tr -d ' ')" ]; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "[FAST-POOL] No diff — PASS, no PR"
            exit 0
          fi
          echo "data_changed=true" >> "$GITHUB_OUTPUT"
          echo "[FAST-POOL] Changed:$CHANGED_FILES"

      - name: Fast pool git staging guard
        if: steps.no_diff.outputs.data_changed == 'true' && steps.fast_pool_merge.outcome == 'success'
        run: python scripts/fast_pool_git_staging_guard.py

      - name: Final fast pool data staging (all generators + guards complete)
        if: steps.no_diff.outputs.data_changed == 'true' && steps.fast_pool_merge.outcome == 'success'
        run: |
          set -euo pipefail
          git add projects/data/publishable_pool.json projects/data/article_pool_manifest.json
          git add projects/data/article_feed_chunks/
          git add projects/data/scheduler_state.json projects/data/source_rotation_inventory.json 2>/dev/null || true
          git add projects/data/topic_dedupe_suppressed.json 2>/dev/null || true
          git add projects/data/pipeline_reports/article_scheduler_report.json 2>/dev/null || true
          git add -A projects/data/publishable_pool.json projects/data/article_pool_manifest.json
          git add -A projects/data/article_feed_chunks/ projects/data/scheduler_state.json
          git add -A projects/data/source_rotation_inventory.json projects/data/topic_dedupe_suppressed.json
          git add -A projects/data/pipeline_reports/
          echo "FAST_POOL_DATA_STAGED=YES"

      - name: Commit to automation branch and push
        if: steps.no_diff.outputs.data_changed == 'true' && steps.fast_pool_merge.outcome == 'success'
        id: commit_push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(git branch --show-current)
          if [ "$CURRENT" != "${{ env.AUTOMATION_BRANCH }}" ]; then
            echo "[FAST-POOL] ERROR: expected branch ${{ env.AUTOMATION_BRANCH }}, got $CURRENT"
            exit 1
          fi
          git add projects/data/publishable_pool.json projects/data/article_pool_manifest.json
          git add projects/data/article_feed_chunks/
          git add projects/data/scheduler_state.json projects/data/source_rotation_inventory.json 2>/dev/null || true
          git add projects/data/topic_dedupe_suppressed.json 2>/dev/null || true
          git add projects/data/pipeline_reports/article_scheduler_report.json 2>/dev/null || true
          git diff --cached --quiet && {
            echo "[FAST-POOL] Nothing to commit"
            git restore --staged --worktree projects/data 2>/dev/null || git checkout -- projects/data
            exit 0
          }
          git commit -m "${{ env.PR_TITLE }}"
          git push --force origin "HEAD:${{ env.AUTOMATION_BRANCH }}"
          PUSHED_SHA=$(git rev-parse HEAD)
          echo "pushed_sha=$PUSHED_SHA" >> "$GITHUB_OUTPUT"
          echo "[FAST-POOL] pushed_sha=$PUSHED_SHA"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Clean fast pool runtime artifacts
        if: always()
        run: |
          set -euo pipefail
          rm -f iu_content_freshness_guard_report.json
          rm -f projects/data/robots_cache.json
          echo "FAST_POOL_RUNTIME_ARTIFACTS_CLEANED=YES"

      - name: Git clean guard
        if: >-
          always() &&
          steps.fast_pool_merge.outcome == 'success' &&
          steps.no_diff.outcome == 'success' &&
          (
            steps.no_diff.outputs.data_changed == 'false' ||
            (
              steps.no_diff.outputs.data_changed == 'true' &&
              (steps.commit_push.outcome == 'success' || steps.commit_push.outcome == 'failure')
            )
          )
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "[FAST-POOL] ERROR: dirty working tree at job end"
            git status --porcelain
            exit 1
          fi
          echo "GIT_CLEAN=YES"

      - name: Dispatch required checks
        if: steps.no_diff.outputs.data_changed == 'true' && steps.commit_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ env.AUTOMATION_BRANCH }}"
          REPO="${{ github.repository }}"
          gh workflow run smoke.yml --ref "$REF" --repo "$REPO"
          gh workflow run layout-guard.yml --ref "$REF" --repo "$REPO"
          gh workflow run repo-guard.yml --ref "$REF" --repo "$REPO"
          echo "[CHECKS] Dispatched smoke, layout-guard, repo-guard on $REF"

      - name: Create or update PR
        if: steps.no_diff.outputs.data_changed == 'true' && steps.commit_push.outputs.pushed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "${{ env.PR_TITLE }}" \
            --body "Phase 9B fast publish: incremental publishable_pool.json update." >/dev/null
          NUM=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge when data-only
        if: steps.no_diff.outputs.data_changed == 'true' && steps.commit_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          PUSHED_SHA="${{ steps.commit_push.outputs.pushed_sha }}"
          [ -z "$NUM" ] && exit 0
          [ -z "$PUSHED_SHA" ] && { echo "[CLOSEOUT] ERROR: missing pushed_sha"; exit 1; }
          HEAD_SHA=$(gh pr view "$NUM" --json headRefOid --jq '.headRefOid')
          if [ "$HEAD_SHA" != "$PUSHED_SHA" ]; then
            echo "[CLOSEOUT] ERROR: PR head $HEAD_SHA != pushed $PUSHED_SHA (stale PR tip)"
            exit 1
          fi
          gh pr merge "$NUM" --disable-auto 2>/dev/null || true
          sleep 3
          gh pr merge "$NUM" --auto --squash
          echo "[CLOSEOUT] auto_merge_armed pr=$NUM head=$HEAD_SHA"

      - name: Wait for merge then dispatch Pages
        if: steps.no_diff.outputs.data_changed == 'true' && steps.commit_push.outputs.pushed == 'true' && steps.pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          EXPECTED_POOL_AT="${{ steps.pool_audit.outputs.pool_generatedAt }}"
          PUSHED_SHA="${{ steps.commit_push.outputs.pushed_sha }}"
          PR_TITLE="${{ env.PR_TITLE }}"
          [ -z "$EXPECTED_POOL_AT" ] && { echo "[CLOSEOUT] ERROR: missing pool_generatedAt"; exit 1; }
          [ -z "$PUSHED_SHA" ] && { echo "[CLOSEOUT] ERROR: missing pushed_sha"; exit 1; }

          # Read generatedAt from real main via git; Contents API fails on the ~20MB pool (main_pool_at=none regression).
          fetch_main_pool_at() {
            git fetch --quiet origin main 2>/dev/null || { echo ""; return; }
            git show FETCH_HEAD:projects/data/publishable_pool.json 2>/dev/null \
              | jq -r '.generatedAt // empty' 2>/dev/null || echo ""
          }

          open_pr_number() {
            gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number' 2>/dev/null || true
          }

          merged_pr_count_for_pushed_sha() {
            gh pr list --head "$BRANCH" --base main --state merged --limit 10 \
              --json headRefOid \
              --jq "[.[] | select(.headRefOid == \"$PUSHED_SHA\")] | length" 2>/dev/null || echo 0
          }

          dispatch_required_checks() {
            gh workflow run smoke.yml --ref "$BRANCH" --repo "$REPO"
            gh workflow run layout-guard.yml --ref "$BRANCH" --repo "$REPO"
            gh workflow run repo-guard.yml --ref "$BRANCH" --repo "$REPO"
          }

          arm_auto_merge() {
            local num="$1"
            local head
            head=$(gh pr view "$num" --json headRefOid --jq '.headRefOid')
            if [ "$head" != "$PUSHED_SHA" ]; then
              echo "[CLOSEOUT] skip_auto_merge pr=$num head=$head expected=$PUSHED_SHA"
              return 1
            fi
            gh pr merge "$num" --disable-auto 2>/dev/null || true
            sleep 2
            gh pr merge "$num" --auto --squash
            echo "[CLOSEOUT] auto_merge_armed pr=$num head=$head"
          }

          # Recovery guard: one open PR max per release commit, capped recreates,
          # never recreate when pushed commit already merged. Sets NUM/NEW_PR_CREATED
          # without a subshell so counters persist.
          RECREATE_COUNT=0
          MAX_RECREATES=2
          NEW_PR_CREATED=false
          recreate_pr_if_needed() {
            NEW_PR_CREATED=false
            NUM=$(open_pr_number)
            [ -n "$NUM" ] && return 0
            MERGED_SAME=$(merged_pr_count_for_pushed_sha)
            if [ "${MERGED_SAME:-0}" -gt 0 ]; then
              echo "[CLOSEOUT] pushed_sha_already_merged — not recreating, waiting for main pool"
              return 0
            fi
            if [ "$RECREATE_COUNT" -ge "$MAX_RECREATES" ]; then
              echo "[CLOSEOUT] recreate_limit_reached max=$MAX_RECREATES — not recreating"
              return 0
            fi
            gh pr create --base main --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "Phase 9B fast publish: incremental publishable_pool.json update." >/dev/null
            RECREATE_COUNT=$((RECREATE_COUNT+1))
            NEW_PR_CREATED=true
            NUM=$(open_pr_number)
          }

          NUM="${{ steps.pr.outputs.pr_number }}"
          ARMED_PR="$NUM"
          for attempt in $(seq 1 45); do
            MAIN_POOL_AT=$(fetch_main_pool_at)
            if [ -n "$MAIN_POOL_AT" ] && [ "$MAIN_POOL_AT" = "$EXPECTED_POOL_AT" ]; then
              echo "[CLOSEOUT] main_pool_at=$MAIN_POOL_AT matched expected — dispatching Pages"
              gh workflow run pages.yml --ref main --repo "$REPO"
              echo "MAIN_POOL_AT_READ_PASS=YES"
              echo "DOUBLE_CYCLE_RACE_AVOIDED=YES"
              exit 0
            fi

            recreate_pr_if_needed
            if [ -z "$NUM" ]; then
              echo "[CLOSEOUT] poll_attempt=$attempt no_open_pr main_pool_at=${MAIN_POOL_AT:-none} waiting"
            elif [ "$NEW_PR_CREATED" = "true" ]; then
              echo "[CLOSEOUT] poll_attempt=$attempt recreated_pr=$NUM recreate_count=$RECREATE_COUNT"
              dispatch_required_checks
              if arm_auto_merge "$NUM"; then ARMED_PR="$NUM"; fi
            else
              HEAD_SHA=$(gh pr view "$NUM" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
              if [ "$HEAD_SHA" = "$PUSHED_SHA" ] && [ "$ARMED_PR" != "$NUM" ]; then
                if arm_auto_merge "$NUM"; then ARMED_PR="$NUM"; fi
              else
                echo "[CLOSEOUT] poll_attempt=$attempt waiting pr=$NUM head=${HEAD_SHA:-none} main_pool_at=${MAIN_POOL_AT:-none}"
              fi
            fi
            sleep 20
          done
          echo "[CLOSEOUT] WARN: merge poll timeout; pages-publish-from-main-data cron will catch up"

      - name: Fast publish closeout telemetry
        if: always()
        run: |
          set -euo pipefail
          echo "FAST_PUBLISH_SAFE=YES"
          echo "PIPELINE_SUCCESS=${{ job.status }}"
          echo "PUBLISHABLE_POOL_TOTAL=${{ steps.pool_audit.outputs.pool_total }}"
          echo "ARCHITECTURE_GUARD_STATUS=PASS"
          {
            echo "## Fast pool publish — closeout"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| pool_total | ${{ steps.pool_audit.outputs.pool_total }} |"
            echo "| pool_generatedAt | ${{ steps.pool_audit.outputs.pool_generatedAt }} |"
            echo "| data_changed | ${{ steps.no_diff.outputs.data_changed }} |"
          } >> "$GITHUB_STEP_SUMMARY"
