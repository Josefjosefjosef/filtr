name: CJ Affiliate phase3z partner registry (non-public)

# Builds canonical partner registry + button PREVIEW from staging.
# Never arms publicButtonSwapArmed / managed-public live / catalog JS rewrite.
# Does not touch paid ads.
# Scheduled after catalog-sync off-peak window; also callable from catalog-sync.
# Standalone schedule ≠ workflow_call (catalog-embedded registry artifact is not schedule proof).
# GitHub Actions cron is best-effort — NOT a guarantee of exact daily 03:47 delivery.
# schedule-reregister: 2026-11-05T07:00Z — V44 rebind after repeated schedule FAIL/SLOT_MISS
# (comment-only rebind; do NOT disable/enable workflow). Prior: V41 READY URL WAF gate.

on:
  schedule:
    # ~30 min after catalog-sync cron (17 3 * * *)
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      use_artifact_run_id:
        description: "Optional prior catalog-sync run id to download staging artifact"
        required: false
        default: ""
      verify_urls:
        description: "Probe click URLs (0=off, all=all candidates, or capped)"
        required: true
        default: "all"
        type: choice
        options:
          - "0"
          - "40"
          - "all"
  workflow_call:
    inputs:
      verify_urls:
        description: "Probe click URLs"
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cj-affiliate-phase3z-registry
  cancel-in-progress: false

jobs:
  build-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Selftest
        run: |
          node scripts/iu-cj-affiliate-phase3z-partner-registry-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-registry-url-gate-v41-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-main-button-readiness-v12-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v12-cleanup-inventory.mjs
          node scripts/iu-cj-affiliate-phase3z-v13-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v14-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v15-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v16-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-email-hints-bridge-v19-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v19-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v20-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-forpsi-hints-replay-v20-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v21-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v22-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v23-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v24-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v25-selftest.mjs
      - name: Restore main-button email hints (from email-ingest; optional)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/iu-email-hints
          HINTS=""
          LATEST=$(gh run list --workflow "cj-affiliate-email-ingest.yml" --status success --limit 5 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "${LATEST:-}" ]; then
            gh run download "$LATEST" -n iu-cj-main-button-email-hints -D /tmp/iu-email-hints || true
            HINTS=$(find /tmp/iu-email-hints -name 'iu-cj-main-button-email-hints-v19.json' | head -n 1 || true)
          fi
          if [ -n "${HINTS:-}" ] && [ -s "$HINTS" ]; then
            # Artifact may be {hints:[...]} wrapper — registry loadEmailHintArtifact accepts both.
            echo "IU_CJ_MAIN_BUTTON_EMAIL_HINTS_PATH=$HINTS" >> "$GITHUB_ENV"
            echo "EMAIL_HINTS_RESTORED=1"
          else
            echo "EMAIL_HINTS_RESTORED=0"
            echo "LIVE_WELCOME_EMAIL_TO_CATEGORY remains EXPLICITLY_UNVERIFIED when no trusted hints file."
          fi
      - name: Resolve staging source
        id: staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/iu-phase3z-art projects/data
          STAGING=""
          RUN_ID="${{ github.event.inputs.use_artifact_run_id || '' }}"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" -D /tmp/iu-phase3z-art || true
            STAGING=$(find /tmp/iu-phase3z-art -name 'iu-affiliate-cj-staging-v1.json' | head -n 1 || true)
          fi
          if [ -z "$STAGING" ]; then
            # Prefer latest successful catalog-sync staging artifact
            LATEST=$(gh run list --workflow "cj-affiliate-catalog-sync.yml" --status success --limit 5 --json databaseId,conclusion -q '.[0].databaseId' || true)
            if [ -n "${LATEST:-}" ]; then
              gh run download "$LATEST" -n iu-affiliate-cj-staging -D /tmp/iu-phase3z-art || true
              STAGING=$(find /tmp/iu-phase3z-art -name 'iu-affiliate-cj-staging-v1.json' | head -n 1 || true)
            fi
          fi
          if [ -z "$STAGING" ]; then
            # Sync branch slim tip (may exist)
            git fetch origin data/cj-affiliate-catalog-sync --depth=1 || true
            git show origin/data/cj-affiliate-catalog-sync:projects/data/iu-affiliate-cj-staging-v1.json \
              > /tmp/iu-phase3z-art/iu-affiliate-cj-staging-v1.json 2>/dev/null || true
            if [ -s /tmp/iu-phase3z-art/iu-affiliate-cj-staging-v1.json ]; then
              STAGING=/tmp/iu-phase3z-art/iu-affiliate-cj-staging-v1.json
            fi
          fi
          if [ -z "$STAGING" ] && [ -f projects/data/iu-affiliate-cj-staging-v1.json ]; then
            SIZE=$(wc -c < projects/data/iu-affiliate-cj-staging-v1.json || echo 0)
            if [ "$SIZE" -gt 1000 ]; then
              STAGING=projects/data/iu-affiliate-cj-staging-v1.json
            fi
          fi
          if [ -z "$STAGING" ]; then
            echo "STAGING_EMPTY — schedule will retry after next catalog-sync; dispatch with use_artifact_run_id"
            echo "pending=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "path=$STAGING" >> "$GITHUB_OUTPUT"
          echo "pending=0" >> "$GITHUB_OUTPUT"
          echo "STAGING_OK=$STAGING"
      - name: Build non-public registry
        if: ${{ steps.staging.outputs.pending != '1' }}
        env:
          IU_CJ_PHASE3Z_OUT_DIR: ${{ runner.temp }}/phase3z-out
          IU_CJ_PHASE3Z_STAGING_PATH: ${{ steps.staging.outputs.path }}
          IU_CJ_PHASE3Z_VERIFY_URLS: ${{ (github.event.inputs.verify_urls || inputs.verify_urls || 'all') != '0' && '1' || '0' }}
          IU_CJ_PHASE3Z_VERIFY_LIMIT: ${{ (github.event.inputs.verify_urls || inputs.verify_urls || 'all') == 'all' && '0' || (github.event.inputs.verify_urls || inputs.verify_urls || '0') }}
          IU_CJ_PHASE3Z_VERIFY_CONCURRENCY: "3"
          IU_CJ_PHASE3Z_VERIFY_SPACING_MS: "350"
          IU_CJ_PHASE3Z_VERIFY_CHECKPOINT: ${{ runner.temp }}/phase3z-url-checkpoint.json
        run: |
          set -euo pipefail
          mkdir -p "$IU_CJ_PHASE3Z_OUT_DIR"
          node scripts/iu-cj-affiliate-phase3z-partner-registry-v1.mjs
          python3 - <<'PY'
          import json,os
          d=os.environ["IU_CJ_PHASE3Z_OUT_DIR"]
          reg=json.load(open(f"{d}/iu-affiliate-cj-partner-registry-v1.json"))
          btn=json.load(open(f"{d}/iu-affiliate-cj-partner-buttons-preview-v1.json"))
          assert reg.get("liveEnabled") is False
          assert reg.get("publicButtonSwapArmed") is False
          assert btn.get("publicButtonSwapArmed") is False
          assert reg.get("rulesVersion") == "phase3z-partner-robot-v9-final"
          assert (reg.get("taxonomyReconciliation") or {}).get("ok") is True
          assert (reg.get("linkCandidateAudit") or {}).get("accounted", 0) >= 0
          assert (reg.get("selectionAudit") or {}).get("unsuitableMainDestinationsRemaining", 0) >= 0
          assert reg.get("taxonomy", {}).get("taxonomyCount", 0) == 36
          assert reg.get("publicButtonSwapArmed") is False
          assert (reg.get("unifiedTakeoverPlan") or {}).get("publicSwapArmed") is False
          cons = reg.get("evidenceConsistency") or {}
          assert cons.get("ok") is True, cons
          parity = reg.get("joinedButtonParity") or {}
          assert parity.get("ok") is True, parity
          joined = int((reg.get("counts") or {}).get("joined") or 0)
          btn_n = int((btn.get("counts") or {}).get("buttons") or 0)
          assert joined == btn_n, (joined, btn_n)
          ready = int((btn.get("counts") or {}).get("readyForReview") or 0)
          ready_m = sum(1 for r in (reg.get("evidenceMatrix") or []) if r.get("readyForReview") is True)
          assert ready_m == ready, (ready_m, ready)
          # affiliateUrlVerified includes WAF/rate-limit/timeout identity-preserved evidence;
          # verifiedOk counts only VERIFIED_HTTP_OK from this probe run — must not be equated.
          url_m = sum(1 for r in (reg.get("evidenceMatrix") or []) if r.get("affiliateUrlVerified") is True)
          url_ok = int((reg.get("urlVerificationRun") or {}).get("verifiedOk") or 0)
          assert url_m >= url_ok, (url_m, url_ok)
          assert cons.get("ok") is True, cons
          ready=btn.get("counts",{}).get("readyForReview",0)
          # Enforce READY→sufficient URL evidence when this run verified ALL URLs (limit 0 = uncapped).
          # Must match scripts urlEvidenceSufficientForReady: HTTP OK OR documented WAF/429/timeout
          # identity-preserved paths. Bare HTTP_OK-only assert falsely fails 403 WAF READY rows.
          # Capped/off probes leave many READY rows with prior/non-HTTP_OK status — not a gate failure.
          verify_on = os.environ.get("IU_CJ_PHASE3Z_VERIFY_URLS", "0") == "1"
          verify_limit = str(os.environ.get("IU_CJ_PHASE3Z_VERIFY_LIMIT", "0"))
          def url_evidence_sufficient(b):
            uv = b.get("urlVerification") or {}
            st = uv.get("status")
            mrs = b.get("merchantReviewStatus")
            if st == "VERIFIED_HTTP_OK":
              return True
            if (
              st == "HTTP_FORBIDDEN"
              and mrs == "IDENTITY_VERIFIED_WAF"
              and (uv.get("classification") == "BOT_BLOCK_SUSPECTED" or uv.get("clientBlockedPossible") is True)
            ):
              return True
            if (
              st == "HTTP_NOT_OK"
              and uv.get("httpStatus") == 429
              and mrs == "IDENTITY_VERIFIED_RATE_LIMITED"
              and uv.get("classification") == "RATE_LIMITED"
            ):
              return True
            if (
              st in ("NOT_VERIFIED", "ERROR")
              and mrs == "IDENTITY_VERIFIED_CLICK_TIMEOUT"
              and "click_probe_timeout_identity_preserved" in str(uv.get("note") or "")
            ):
              return True
            return False
          if verify_on and verify_limit == "0":
            bad = []
            for b in btn.get("buttons", []):
              if b.get("publishability") == "READY_FOR_REVIEW" and not url_evidence_sufficient(b):
                bad.append({
                  "advertiserId": b.get("advertiserId"),
                  "status": (b.get("urlVerification") or {}).get("status"),
                  "merchantReviewStatus": b.get("merchantReviewStatus"),
                  "httpStatus": (b.get("urlVerification") or {}).get("httpStatus"),
                })
            assert not bad, bad[:20]
          print("DISARMED_OK", reg.get("counts"), btn.get("counts"), "ready", ready, "verify_on", verify_on, "limit", verify_limit)
          PY
      - name: Upload non-public registry artifacts
        if: ${{ steps.staging.outputs.pending != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: iu-affiliate-cj-phase3z-registry
          path: |
            ${{ runner.temp }}/phase3z-out/iu-affiliate-cj-partner-registry-v1.json
            ${{ runner.temp }}/phase3z-out/iu-affiliate-cj-partner-buttons-preview-v1.json
            ${{ runner.temp }}/phase3z-url-checkpoint.json
          if-no-files-found: error
      - name: Mark schedule pending when staging missing
        if: ${{ steps.staging.outputs.pending == '1' }}
        run: |
          echo "PHASE3Z_SCHEDULE_PENDING_STAGING=1"
          echo "Public swap remains DISARMED."
