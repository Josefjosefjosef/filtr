# Merges performed via GITHUB_TOKEN (e.g. update-articles auto-merge) do not trigger push workflows.
# Path filters on pull_request closed can skip long-lived automation PRs; verify files via API instead.
name: Pages deploy after data PR merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: pages-dispatch-after-data-merge
  cancel-in-progress: false

jobs:
  dispatch-pages:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy to GitHub Pages when PR touched projects/data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[CLOSEOUT] merged_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[CLOSEOUT] pr_number=${{ github.event.pull_request.number }}"
          echo "[CLOSEOUT] merge_commit_sha=${{ github.event.pull_request.merge_commit_sha }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          if ! gh api "repos/${REPO}/pulls/${PR_NUM}/files" --paginate --jq '.[].filename' | grep -q '^projects/data/'; then
            echo "SKIP: no projects/data files in PR #${PR_NUM}"
            exit 0
          fi
          echo "[CLOSEOUT] publish_dispatch_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pages.yml --ref main --repo "${REPO}"
          echo "OK: Dispatched pages.yml for merged data PR #${PR_NUM}"

      - name: Job summary (telemetry)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Pages deploy after data PR merge — closeout telemetry"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| pr_number | ${{ github.event.pull_request.number }} |"
            echo "| merge_commit_sha | ${{ github.event.pull_request.merge_commit_sha }} |"
            echo "| this_run_id | ${{ github.run_id }} |"
            echo "| this_run_url | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "Triggers Pages publish immediately after merge (pull_request closed); scheduled **Pages publish from main data** remains fallback."
          } >> "$GITHUB_STEP_SUMMARY"
