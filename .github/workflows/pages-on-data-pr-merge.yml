# ROOT_CAUSE (P0): pull_request alone can be unreliable for long-lived automation branches where the
# merge ref / workflow resolution does not consistently trigger after squash auto-merge; merges
# performed via the default GITHUB_TOKEN also do not trigger push → pages.yml downstream.
# FIX: use pull_request_target so this workflow always runs from default branch (main) context on
# PR closed, then dispatch pages.yml after verifying projects/data (no checkout of PR head code).
# Security: only merged PRs; steps use gh API + workflow dispatch — do not checkout untrusted PR code.
name: Pages deploy after data PR merge

on:
  pull_request_target:
    types: [closed]
    branches:
      - main

permissions:
  actions: write
  pull-requests: read
  contents: read

concurrency:
  group: pages-dispatch-after-data-merge
  cancel-in-progress: false

jobs:
  dispatch-pages:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy to GitHub Pages when PR touched projects/data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[CLOSEOUT] trigger_event=${{ github.event_name }}"
          echo "[CLOSEOUT] merged_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[CLOSEOUT] pr_number=${{ github.event.pull_request.number }}"
          echo "[CLOSEOUT] merge_commit_sha=${{ github.event.pull_request.merge_commit_sha }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          if ! gh api "repos/${REPO}/pulls/${PR_NUM}/files" --paginate --jq '.[].filename' | grep -q '^projects/data/'; then
            echo "SKIP: no projects/data files in PR #${PR_NUM}"
            exit 0
          fi
          echo "[CLOSEOUT] publish_dispatch_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pages.yml --ref main --repo "${REPO}"
          echo "OK: Dispatched pages.yml for merged data PR #${PR_NUM}"
          # Best-effort: newest Pages deploy run on main (may still be queued)
          sleep 3
          PAGES_RUN=$(gh run list --workflow "Deploy to GitHub Pages" --branch main --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          echo "[CLOSEOUT] pages_workflow_run_id=${PAGES_RUN:-pending}"
          if [ -n "${PAGES_RUN:-}" ]; then
            echo "[CLOSEOUT] pages_workflow_url=${GITHUB_SERVER_URL}/${REPO}/actions/runs/${PAGES_RUN}"
          fi

      - name: Job summary (telemetry)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Pages deploy after data PR merge — closeout telemetry"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| trigger | ${{ github.event_name }} (pull_request_target = workflow from main) |"
            echo "| pr_number | ${{ github.event.pull_request.number }} |"
            echo "| merge_commit_sha | ${{ github.event.pull_request.merge_commit_sha }} |"
            echo "| this_run_id | ${{ github.run_id }} |"
            echo "| this_run_url | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "Primary automatic publish path after data PR merge. **Pages publish from main data** (cron */5) remains fallback if this ever skips."
          } >> "$GITHUB_STEP_SUMMARY"
