name: NDIC DATEX v1 shadow probe

# Dedicated Czech egress shadow probe (label: ndic-cz-egress).
# Prepared ONLY — do not enable the runner service or dispatch until ops approval.
#
# FIRST SHADOW DISPATCH (mandatory):
# 1) Actions → "NDIC DATEX v1 shadow probe"
# 2) "Use workflow from" MUST be: feat/ndic-datex-v1-integration
#    (main still has an older ubuntu-latest dispatcher; do NOT use main for self-hosted)
# 3) Inputs: mode=shadow, code_ref=feat/ndic-datex-v1-integration
#
# Security contract (public repo):
# - Trigger: workflow_dispatch ONLY (no pull_request / pull_request_target / workflow_run / schedule)
# - runs-on MUST include all four labels: self-hosted, Linux, X64, ndic-cz-egress
# - permissions: contents: read
# - checkout: persist-credentials: false; allowlisted code_ref only
# - mode: shadow only (active rejected)
# - Never commit / push / deploy / upload raw DATEX|TMC payloads
# - Refuse github-hosted runners even if labels are mis-edited later

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Must be shadow (active is rejected)"
        required: true
        type: choice
        options:
          - shadow
        default: shadow
      code_ref:
        description: "Allowlisted git ref containing NDIC probe implementation"
        required: true
        type: choice
        options:
          - feat/ndic-datex-v1-integration
        default: feat/ndic-datex-v1-integration

concurrency:
  group: ndic-datex-v1-shadow-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shadow-probe:
    # Defense-in-depth: refuse forks / non-dispatch even if triggers are edited later.
    if: >
      github.event_name == 'workflow_dispatch'
      && github.repository == 'Josefjosefjosef/filtr'
      && github.event.pull_request == null
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ndic-cz-egress
    timeout-minutes: 15
    steps:
      - name: Preflight runner identity (fail-closed)
        run: |
          set -euo pipefail
          # Never enable shell xtrace in secret-bearing jobs.
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            echo "REFUSING_GITHUB_HOSTED"
            exit 1
          fi
          if [ "$(id -u)" -eq 0 ]; then
            echo "REFUSING_ROOT_RUNNER"
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1; then
            if sudo -n true >/dev/null 2>&1; then
              echo "REFUSING_PASSWORDLESS_SUDO"
              exit 1
            fi
          fi
          umask 077
          # ~54MB DATEX + ~21MB TMC + headroom; require >= 512MB free.
          avail_kb="$(df -Pk . | awk 'NR==2 {print $4}')"
          if [ -z "${avail_kb}" ] || [ "${avail_kb}" -lt 524288 ]; then
            echo "REFUSING_LOW_DISK"
            exit 1
          fi
          echo "RUNNER_PREFLIGHT_OK"
          echo "RUNNER_USER=$(id -un)"
          echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unknown}"
          echo "DISK_AVAIL_KB=${avail_kb}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: false
          ref: ${{ github.event.inputs.code_ref }}

      - name: Enforce allowlisted code_ref
        env:
          INPUT_REF: ${{ github.event.inputs.code_ref }}
        run: |
          set -euo pipefail
          case "${INPUT_REF}" in
            feat/ndic-datex-v1-integration) ;;
            *)
              echo "REFUSING_NON_ALLOWLISTED_CODE_REF"
              exit 1
              ;;
          esac
          echo "CODE_REF_OK=${INPUT_REF}"
          echo "CODE_SHA=$(git rev-parse HEAD)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Reject non-shadow modes
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          mode="$(printf '%s' "${INPUT_MODE:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$mode" != "shadow" ]; then
            echo "REFUSING_NON_SHADOW_MODE"
            exit 1
          fi
          echo "MODE_OK=shadow"

      - name: Fixture guards (no network)
        run: |
          set -euo pipefail
          umask 077
          npm run iu-ndic-datex-v1-guard
          npm run iu-ndic-datex-v1-exposure-guard
          npm run iu-ndic-self-hosted-runner-contract-guard

      - name: Real shadow probe (isolated temp only)
        id: probe
        env:
          IU_NDIC_DATEX_V1_MODE: shadow
          IU_NDIC_PULL_URL: ${{ secrets.IU_NDIC_PULL_URL }}
          IU_NDIC_PULL_USER: ${{ secrets.IU_NDIC_PULL_USER }}
          IU_NDIC_PULL_PASS: ${{ secrets.IU_NDIC_PULL_PASS }}
          IU_NDIC_TMC_PULL_URL: ${{ secrets.IU_NDIC_TMC_PULL_URL }}
          IU_NDIC_TMC_PULL_USER: ${{ secrets.IU_NDIC_TMC_PULL_USER }}
          IU_NDIC_TMC_PULL_PASS: ${{ secrets.IU_NDIC_TMC_PULL_PASS }}
          IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID: ${{ secrets.IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID }}
          IU_NDIC_SHADOW_WORK_DIR: ${{ runner.temp }}/ndic-shadow-work
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$IU_NDIC_SHADOW_WORK_DIR"
          mkdir -p "$RUNNER_TEMP/ndic-shadow-report"
          # Aggregate JSON only — wrapper catches OOM/SIGKILL and writes minimal fallback.
          node scripts/ndic-datex-v1-shadow-run.mjs "$RUNNER_TEMP/ndic-shadow-report/shadow-report.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/ndic-shadow-report/shadow-report.json'); if(!r.ok) process.exit(2);"

      - name: Job summary (aggregate only)
        if: always()
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/ndic-shadow-report/shadow-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "NO_REPORT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## NDIC shadow probe (aggregate)"
            echo ""
            echo "- code_ref: \`${{ github.event.inputs.code_ref }}\`"
            echo "- code_sha: \`$(git rev-parse HEAD)\`"
            echo "- runner_labels: self-hosted+Linux+X64+ndic-cz-egress"
            echo ""
            echo '```json'
            cat "$REPORT"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ndic-shadow-probe-report
          path: ${{ runner.temp }}/ndic-shadow-report/shadow-report.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Wipe temp workdir
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${{ runner.temp }}/ndic-shadow-work" || true
          rm -rf "${{ runner.temp }}/ndic-shadow-report" || true
