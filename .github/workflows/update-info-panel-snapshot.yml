name: Update info panel snapshot

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build info panel snapshot
        run: node scripts/build_info_panel_snapshot.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- projects/data/info_panel_snapshot.json projects/data/info_panel_scheduler_state.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/data/info_panel_snapshot.json projects/data/info_panel_scheduler_state.json
          git commit -m "chore: refresh info panel market snapshot"
          git push
