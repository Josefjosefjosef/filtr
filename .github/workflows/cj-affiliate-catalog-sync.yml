      - name: Persist product-feed + refresh checkpoints to sync branch (also durable catalog)
        if: hashFiles('projects/data/iu-affiliate-cj-product-feed-checkpoints-v31.json') != '' || hashFiles('projects/data/iu-affiliate-cj-refresh-coverage-v35.json') != '' || hashFiles('projects/data/iu-affiliate-cj-miss-products-v38.json') != '' || hashFiles('projects/data/iu-affiliate-cj-feed-inventory-v40.json') != '' || hashFiles('projects/data/iu-affiliate-cj-durable-catalog-v51.json') != '' || hashFiles('projects/data/iu-affiliate-cj-public-growth-budget-v51.json') != ''
        continue-on-error: true
