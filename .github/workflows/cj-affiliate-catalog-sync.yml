name: CJ Affiliate catalog sync (fetch ? publish)

# Phase 2C PR B: daily fetch ? staging artifacts; publish only CJ_MANAGED via gate.
# Never force-pushes main. Never rewrites catalog JS / freeze guards / slot policy.
# Prod deploy remains Pages/PR merge after human approval.
# Single publication owner: concurrency group cj-affiliate-catalog-sync (cancel-in-progress: false).
# GitHub Actions cron is best-effort ? NOT a guarantee of exact 3h delivery.
# schedule-reregister: 2026-11-05T07:00Z ? V44 cadence rebind after post-#13768 SLOT_MISS window
# (comment-only rebind; do NOT disable/enable workflow).
# schedule-catchup-marker: 2026-11-09T10:00Z ? catchup_dispatch input so diagnostic dispatch
# does not consume MAX_CATCHUPS_PER_UTC_DAY (V51.8-maint).
# schedule-reregister: 2026-11-12T08:45Z — rebind after GHA undelivered 03:17+06:17 (V51.8-closure).
# Independent recovery: cloudflare/cj-catalog-sync-watchdog (CF cron → catch-up dispatch)
# complements GHA schedule-watch when both catalog and watch crons vanish.

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.catchup_dispatch == '1'
      && format('CATCHUP_DISPATCH_NOT_SCHEDULE {0}', github.run_id)
      || format('CJ catalog sync ({0})', github.event_name) }}

on:
  schedule:
    # Daily full inventory + deeper discovery (UTC ~03:17).
    - cron: "17 3 * * *"
    # V34: refresh-priority cadence (~every 3h). Target published price/availability refresh
    # within 1?3h when CJ quotas allow; discovery continues lightly without inventory.
    - cron: "17 0,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      execute_live_fetch:
        description: "GO live CJ HTTP fetch (requires IU_CJ_PAT + CID + PID secrets)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      offers_mode:
        description: "Offers sync mode (full=inventory+deep discovery; refresh_priority=refresh published first)"
        required: true
        default: "full"
        type: choice
        options:
          - "full"
          - "refresh_priority"
      arm_publish:
        description: "Arm publish gate write to managed registry (infra-approved only)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      promote_managed_public:
        description: "Open data-only PR to main with managed-public JSON (legacy Pages path; infra GO)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      publish_managed_public_r2:
        description: "Unattended R2 publish via site-redirects worker (no git merge; requires infra GO + secrets)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      arm_offers_live:
        description: "Arm offers liveEnabled=true (coupons/actions/products) after validation"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      promote_offers_public:
        description: "Open data-only PR to main with offers-public JSON (Pages path)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      catchup_dispatch:
        description: "Mark as schedule watch catch-up (NOT a schedule event; consumes daily catch-up budget)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cj-affiliate-catalog-sync
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish-gate selftest
        run: node scripts/iu-cj-affiliate-catalog-sync-v1-selftest.mjs
      - name: E2E overlay selftest (fixtures)
