            projects/data/iu-affiliate-cj-feed-inventory-v40.json
            projects/data/iu-affiliate-cj-cumulative-coverage-v40.json
            projects/data/iu-affiliate-cj-identity-repair-v40.json
            projects/data/iu-affiliate-cj-product-funnel-v46.json
            projects/data/iu-affiliate-cj-feed-continuation-v47.json
            projects/data/iu-affiliate-cj-declared-product-decomposition-v47.json
            projects/data/iu-affiliate-cj-missing-feed-partners-v47.json
            projects/data/iu-affiliate-cj-product-progress-v48.json
            projects/data/iu-affiliate-cj-fetched-published-funnel-v48.json
            projects/data/iu-affiliate-cj-price-availability-history-v48.json
            projects/data/iu-affiliate-cj-durable-price-history-v50.json
            projects/data/iu-affiliate-cj-durable-price-history-archive-v51.json
            projects/data/iu-affiliate-cj-product-reverify-v50.json
            projects/data/iu-affiliate-cj-product-identity-v50.json
            projects/data/iu-affiliate-cj-durable-catalog-v51.json
            projects/data/iu-affiliate-cj-public-growth-budget-v51.json
