          node scripts/iu-cj-affiliate-phase3z-v15-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v24-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-v25-selftest.mjs

  fetch-staging:
    needs: selftest
    runs-on: ubuntu-latest
    # Full CJ Link Search + advertiser pages with ~2.4s spacing routinely exceeds 20m.
    timeout-minutes: 45
    env:
      IU_CJ_PAT: ${{ secrets.IU_CJ_PAT }}
      IU_CJ_PUBLISHER_CID: ${{ secrets.IU_CJ_PUBLISHER_CID }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
      # Schedule must live-fetch (read-only). Publish/promote/R2 stay disarmed unless dispatch arms them.
      IU_CJ_SYNC_HTTP_EXECUTE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.execute_live_fetch == '1')) && '1' || '0' }}
      IU_CJ_SYNC_REQ_SPACING_MS: "2400"
      # Targeted all-types Link Search for known missing-URL joined partners (read-only).
      IU_CJ_SYNC_PROBE_ADVERTISER_IDS: "6466592,5578976,7804601,5725783"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight secrets (no values)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${IU_CJ_PAT:-}" ]; then echo "IU_CJ_PAT=CONFIGURED"; else echo "IU_CJ_PAT=MISSING"; fi
          if [ -n "${IU_CJ_PUBLISHER_CID:-}" ]; then echo "IU_CJ_PUBLISHER_CID=CONFIGURED"; else echo "IU_CJ_PUBLISHER_CID=MISSING"; fi
          if [ -n "${IU_CJ_WEBSITE_PID:-}" ]; then echo "IU_CJ_WEBSITE_PID=CONFIGURED"; else echo "IU_CJ_WEBSITE_PID=MISSING"; fi
          echo "HTTP_EXECUTE=${IU_CJ_SYNC_HTTP_EXECUTE}"
          if [ "${IU_CJ_SYNC_HTTP_EXECUTE}" != "1" ]; then
            echo "STAGING_CLASS=DRY_RUN_NO_HTTP"
            echo "NOTE=workflow_dispatch without execute_live_fetch=1 produces empty staging (not a CJ outage). offers-live-sync may still VERIFY_ONLY against LIVE LKG."
          fi
          if [ "${IU_CJ_SYNC_HTTP_EXECUTE}" = "1" ]; then
            if [ -z "${IU_CJ_PAT:-}" ] || [ -z "${IU_CJ_PUBLISHER_CID:-}" ] || [ -z "${IU_CJ_WEBSITE_PID:-}" ]; then
              echo "BLOCKER=SECRETS_MISSING_FOR_LIVE_FETCH"
              exit 1
            fi
          fi
      - name: Offers public dry-build from fixture (never arms liveEnabled)
        run: node scripts/iu-cj-affiliate-offers-public-build-v1.mjs
      - name: Fetch ? staging JSON
        run: node scripts/iu-cj-affiliate-catalog-sync-fetch-v1.mjs
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: |
            projects/data/iu-affiliate-cj-staging-v1.json
            projects/data/iu-affiliate-cj-sync-audit-v1.json
          if-no-files-found: error
      - name: Commit staging to data/cj-affiliate-catalog-sync (never main)
        shell: bash
        run: |
          set -euo pipefail
          # Sync branch historically bloated (~400k files). Always rewrite as a slim
          # orphan tip with only CJ JSON artifacts ? never checkout the fat history.
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          STASH="${RUNNER_TEMP}/iu-cj-staging"
          mkdir -p "${STASH}/prev" projects/data
          cp projects/data/iu-affiliate-cj-staging-v1.json "${STASH}/"
          cp projects/data/iu-affiliate-cj-sync-audit-v1.json "${STASH}/"
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${SYNC_BRANCH}" --depth=1 || true
          # V32: staging slim rewrite must NOT wipe durable offers/checkpoints/email bridge.
          # V51.1: also preserve price/reverify/identity + refresh/miss (fetch-staging orphan was wiping them -> DURABLE_LEDGER_MISSING).
          DURABLE_FILES="
            iu-affiliate-cj-managed-public-v1.json
            iu-affiliate-cj-managed-registry-v1.json
            iu-affiliate-cj-staging-v1.json
            iu-affiliate-cj-sync-audit-v1.json
            iu-affiliate-cj-offers-public-v1.json
            iu-affiliate-cj-offers-public-lkg-v1.json
            iu-affiliate-cj-offers-sync-audit-v1.json
            iu-affiliate-cj-product-feed-checkpoints-v31.json
            iu-affiliate-cj-email-only-offers-bridge-v31.json
            iu-affiliate-cj-refresh-coverage-v35.json
            iu-affiliate-cj-miss-products-v38.json
            iu-affiliate-cj-feed-inventory-v40.json
            iu-affiliate-cj-cumulative-coverage-v40.json
            iu-affiliate-cj-durable-price-history-v50.json
            iu-affiliate-cj-durable-price-history-archive-v51.json
            iu-affiliate-cj-product-reverify-v50.json
            iu-affiliate-cj-product-identity-v50.json
          "
          for f in $DURABLE_FILES; do
            tmp="${STASH}/prev/${f}.tmp"
            if git show "origin/${SYNC_BRANCH}:projects/data/${f}" > "${tmp}" 2>/dev/null; then
              if [ -s "${tmp}" ]; then mv "${tmp}" "${STASH}/prev/${f}"; else rm -f "${tmp}"; fi
            else
              rm -f "${tmp}"
            fi
          done
          git checkout --orphan "iu-cj-sync-slim-$$"
          git reset --hard
          git clean -fdx
          mkdir -p projects/data
          # Preserve prior managed overlays + durable catalog state when this job only refreshes staging.
          for name in managed-public managed-registry; do
            if [ -f "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            fi
          done
          for f in \
            iu-affiliate-cj-offers-public-v1.json \
            iu-affiliate-cj-offers-public-lkg-v1.json \
            iu-affiliate-cj-offers-sync-audit-v1.json \
            iu-affiliate-cj-product-feed-checkpoints-v31.json \
            iu-affiliate-cj-email-only-offers-bridge-v31.json \
            iu-affiliate-cj-refresh-coverage-v35.json \
            iu-affiliate-cj-miss-products-v38.json \
            iu-affiliate-cj-feed-inventory-v40.json \
            iu-affiliate-cj-cumulative-coverage-v40.json \
            iu-affiliate-cj-durable-price-history-v50.json \
            iu-affiliate-cj-durable-price-history-archive-v51.json \
            iu-affiliate-cj-product-reverify-v50.json \
            iu-affiliate-cj-product-identity-v50.json
          do
            if [ -s "${STASH}/prev/${f}" ]; then
              cp "${STASH}/prev/${f}" "projects/data/${f}"
              echo "STAGING_SLIM_PRESERVED=${f}"
            fi
          done
          cp "${STASH}/iu-affiliate-cj-staging-v1.json" projects/data/
          cp "${STASH}/iu-affiliate-cj-sync-audit-v1.json" projects/data/
          git add projects/data/iu-affiliate-cj-*.json
          if git diff --cached --quiet; then
            echo "NO_STAGING_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-.*\.json$'; then
            echo "BLOCKER=UNEXPECTED_STAGED_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore(data): CJ affiliate staging fetch (sync branch only, slim tip)"
          git push --force origin "HEAD:${SYNC_BRANCH}"
          echo "SYNC_BRANCH_SLIM_REWRITE=true"

  publish-gate:
    needs: fetch-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IU_CJ_SYNC_PUBLISH_ARMED: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_publish || '0' }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: projects/data
      - name: Ensure policy + section-map + public LKG present (artifact must not wipe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data
          for f in \
            iu-affiliate-slot-policy-v1.json \
            iu-affiliate-cj-section-map-v1.json \
            iu-affiliate-cj-managed-public-v1.json \
            iu-affiliate-cj-managed-registry-v1.json
          do
            if [ ! -f "projects/data/${f}" ]; then
              git show "HEAD:projects/data/${f}" > "projects/data/${f}"
              echo "RESTORED_FROM_HEAD=${f}"
            else
              echo "PRESENT=${f}"
            fi
          done
          python3 - <<'PY'
          import json
          mp=json.load(open("projects/data/iu-affiliate-cj-managed-public-v1.json"))
          print("LKG_PUBLIC_PARTNERS", len(mp.get("partners") or []))
          PY
      - name: Publish gate (CJ_MANAGED only; LKG on outage)
        run: node scripts/iu-cj-affiliate-catalog-sync-publish-v1.mjs
      - name: Commit managed registry + public overlay if armed (sync branch only)
        if: env.IU_CJ_SYNC_PUBLISH_ARMED == '1'
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          STASH="${RUNNER_TEMP}/iu-cj-publish"
          mkdir -p "${STASH}/prev" projects/data
          for name in managed-public managed-registry staging sync-audit; do
            if [ -f "projects/data/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "projects/data/iu-affiliate-cj-${name}-v1.json" "${STASH}/iu-affiliate-cj-${name}-v1.json"
            fi
          done
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${SYNC_BRANCH}" --depth=1 || true
          # V51.1: publish-gate slim tip must also keep durable ledgers / refresh / miss.
          DURABLE_FILES="
            iu-affiliate-cj-managed-public-v1.json
            iu-affiliate-cj-managed-registry-v1.json
            iu-affiliate-cj-staging-v1.json
            iu-affiliate-cj-sync-audit-v1.json
            iu-affiliate-cj-offers-public-v1.json
            iu-affiliate-cj-offers-public-lkg-v1.json
            iu-affiliate-cj-offers-sync-audit-v1.json
            iu-affiliate-cj-product-feed-checkpoints-v31.json
            iu-affiliate-cj-email-only-offers-bridge-v31.json
            iu-affiliate-cj-refresh-coverage-v35.json
            iu-affiliate-cj-miss-products-v38.json
            iu-affiliate-cj-feed-inventory-v40.json
            iu-affiliate-cj-cumulative-coverage-v40.json
            iu-affiliate-cj-durable-price-history-v50.json
            iu-affiliate-cj-durable-price-history-archive-v51.json
            iu-affiliate-cj-product-reverify-v50.json
            iu-affiliate-cj-product-identity-v50.json
          "
          for f in $DURABLE_FILES; do
            tmp="${STASH}/prev/${f}.tmp"
            if git show "origin/${SYNC_BRANCH}:projects/data/${f}" > "${tmp}" 2>/dev/null; then
              if [ -s "${tmp}" ]; then mv "${tmp}" "${STASH}/prev/${f}"; else rm -f "${tmp}"; fi
            else
              rm -f "${tmp}"
            fi
          done
          git checkout --orphan "iu-cj-sync-slim-$$"
          git reset --hard
          git clean -fdx
          mkdir -p projects/data
          for name in managed-public managed-registry staging sync-audit; do
            if [ -f "${STASH}/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            elif [ -f "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            fi
          done
          for f in \
            iu-affiliate-cj-offers-public-v1.json \
            iu-affiliate-cj-offers-public-lkg-v1.json \
            iu-affiliate-cj-offers-sync-audit-v1.json \
            iu-affiliate-cj-product-feed-checkpoints-v31.json \
            iu-affiliate-cj-email-only-offers-bridge-v31.json \
            iu-affiliate-cj-refresh-coverage-v35.json \
            iu-affiliate-cj-miss-products-v38.json \
            iu-affiliate-cj-feed-inventory-v40.json \
            iu-affiliate-cj-cumulative-coverage-v40.json \
            iu-affiliate-cj-durable-price-history-v50.json \
            iu-affiliate-cj-durable-price-history-archive-v51.json \
            iu-affiliate-cj-product-reverify-v50.json \
            iu-affiliate-cj-product-identity-v50.json
          do
            if [ -s "${STASH}/prev/${f}" ]; then
              cp "${STASH}/prev/${f}" "projects/data/${f}"
              echo "PUBLISH_SLIM_PRESERVED=${f}"
            fi
          done
          git add projects/data/iu-affiliate-cj-*.json
          if git diff --cached --quiet; then
            echo "NO_REGISTRY_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-.*\.json$'; then
            echo "BLOCKER=UNEXPECTED_PUBLISH_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore(data): CJ_MANAGED registry+public overlay (gate pass, slim sync tip)"
          git push --force origin "HEAD:${SYNC_BRANCH}"
          echo "SYNC_BRANCH_SLIM_REWRITE=true"
      - name: Summary (no merge / no prod)
        shell: bash
        run: |
          set -euo pipefail
          echo "NO_MERGE=true"
          echo "NO_PROD_DEPLOY=true"
          echo "FETCH_NE_PUBLISH=true"
          echo "MANAGED_PUBLIC_OVERLAY=projects/data/iu-affiliate-cj-managed-public-v1.json"
          echo "PROMOTE_TO_MAIN=DISARMED_REQUIRES_INFRA_GO"
          if [ -f projects/data/iu-affiliate-cj-sync-audit-v1.json ]; then
            python3 -c "import json; a=json.load(open('projects/data/iu-affiliate-cj-sync-audit-v1.json')); print(json.dumps(a.get('plan',a) if isinstance(a,dict) else {}, indent=2)[:2000])"
          fi

  promote-data-pr:
    needs: publish-gate
    if: github.event_name == 'workflow_dispatch' && inputs.promote_managed_public == '1' && inputs.arm_publish == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch managed-public from sync branch
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          git fetch origin "${SYNC_BRANCH}" --depth=1
          git show "origin/${SYNC_BRANCH}:projects/data/iu-affiliate-cj-managed-public-v1.json" > /tmp/iu-managed-public-incoming.json
      - name: Validate incoming managed-public (promote write stays disarmed)
        shell: bash
        env:
          IU_CJ_MANAGED_PUBLIC_PROMOTE_ARMED: "0"
        run: |
          set -euo pipefail
          mkdir -p projects/data
          cp /tmp/iu-managed-public-incoming.json projects/data/iu-affiliate-cj-managed-public-v1.json
          node scripts/iu-cj-affiliate-catalog-sync-promote-managed-public-v1.mjs
      - name: Open data-only PR to main (required checks still apply; no auto-merge)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="data/cj-managed-public-promote-${GITHUB_RUN_ID}"
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BR}"
          mkdir -p projects/data
          cp /tmp/iu-managed-public-incoming.json projects/data/iu-affiliate-cj-managed-public-v1.json
          git add projects/data/iu-affiliate-cj-managed-public-v1.json
          if git diff --cached --quiet; then
            echo "NO_PUBLIC_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-managed-public-v1\.json$'; then
            echo "BLOCKER=UNEXPECTED_PROMOTE_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore(data): promote CJ managed-public overlay (data-only)"
          git push origin "HEAD:${BR}"
          gh pr create \
            --base main \
            --head "${BR}" \
            --title "chore(data): promote CJ managed-public overlay" \
            --body "## Summary
          - Data-only promote of \`projects/data/iu-affiliate-cj-managed-public-v1.json\`
          - No code/guard/workflow changes
          - Required checks must pass; no auto-merge

          ## What does NOT change
          - Catalog JS, slot policy, MANUAL_PROTECTED partners, secrets

          ## Verification checklist
          - [ ] Only one file changed
          - [ ] Overlay schema validates
          - [ ] No live CJ fetch in this PR
          "
          echo "PROMOTE_PR_OPENED=true"
          echo "NO_AUTO_MERGE=true"
          echo "NO_PROD_DEPLOY_FROM_THIS_JOB=true"

  # Phase 2H: unattended public overlay via Worker/R2 (no PR merge, no commit to main).
  # DISARMED unless workflow_dispatch publish_managed_public_r2=1 AND arm_publish=1 AND secrets set.
  # Live CF binding creation is INFRA_PENDING ? job fails closed if endpoint/token missing when armed.
  publish-managed-public-r2:
    needs: publish-gate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_managed_public_r2 == '1' && inputs.arm_publish == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IU_CJ_MANAGED_PUBLIC_R2_PUBLISH_ARMED: "1"
      IU_CJ_MANAGED_PUBLIC_PUBLISH_URL: ${{ secrets.IU_CJ_MANAGED_PUBLIC_R2_PUBLISH_URL || secrets.IU_CJ_MANAGED_PUBLIC_PUBLISH_URL }}
      IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN: ${{ secrets.IU_CJ_MANAGED_PUBLIC_R2_PUBLISH_TOKEN || secrets.IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch managed-public from sync branch
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          git fetch origin "${SYNC_BRANCH}" --depth=1
          mkdir -p projects/data
          git show "origin/${SYNC_BRANCH}:projects/data/iu-affiliate-cj-managed-public-v1.json" > projects/data/iu-affiliate-cj-managed-public-v1.json
      - name: Preflight R2 publish secrets (no values)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${IU_CJ_MANAGED_PUBLIC_PUBLISH_URL:-}" ]; then echo "PUBLISH_URL=CONFIGURED"; else echo "PUBLISH_URL=MISSING"; fi
          if [ -n "${IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN:-}" ]; then echo "PUBLISH_TOKEN=CONFIGURED"; else echo "PUBLISH_TOKEN=MISSING"; fi
          if [ -z "${IU_CJ_MANAGED_PUBLIC_PUBLISH_URL:-}" ] || [ -z "${IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN:-}" ]; then
            echo "BLOCKER=INFRA_PENDING_R2_PUBLISH_SECRETS"
            echo "NO_PROD_DEPLOY=true"
            exit 1
          fi
      - name: Publish validated overlay to Worker/R2 (no git merge)
        run: node scripts/iu-cj-affiliate-catalog-sync-r2-publish-v1.mjs
      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          echo "NO_GIT_MERGE=true"
          echo "NO_MAIN_COMMIT=true"
          echo "NO_AUTO_MERGE_PR=true"
          echo "CHANNEL=cloudflare_r2_via_site_redirects"
          echo "LIVE_ARM_REQUIRES_INFRA_GO=true"

  # Phase 3Z: non-public partner registry + button preview (never arms public swap).
  phase3z-partner-registry:
    needs: fetch-staging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Phase 3Z selftest
        run: node scripts/iu-cj-affiliate-phase3z-partner-registry-v1-selftest.mjs
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: projects/data
      - name: Restore section-map + slot policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data
          for f in iu-affiliate-slot-policy-v1.json iu-affiliate-cj-section-map-v1.json; do
            if [ ! -f "projects/data/${f}" ]; then
              git show "HEAD:projects/data/${f}" > "projects/data/${f}" || true
            fi
          done
      # V51.3: dry_run empty staging must preserve prior registry LKG (not fail whole workflow).
      - name: Restore prior phase3z registry LKG (dry-run preserve)
        env:
          GH_TOKEN: ${{ github.token }}
          IU_CJ_PHASE3Z_REGISTRY_LKG_DIR: ${{ runner.temp }}/phase3z-registry-lkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${IU_CJ_PHASE3Z_REGISTRY_LKG_DIR}"
          # Find a recent successful run that uploaded the registry artifact.
          mapfile -t RUNS < <(gh run list --workflow=cj-affiliate-catalog-sync.yml --limit 30 --json databaseId,conclusion -q '.[]|select(.conclusion=="success")|.databaseId' 2>/dev/null || true)
          RESTORED=0
          for RUN in "${RUNS[@]:-}"; do
            [ -n "${RUN}" ] || continue
            if gh run download "${RUN}" -n iu-affiliate-cj-phase3z-registry -D "${IU_CJ_PHASE3Z_REGISTRY_LKG_DIR}" 2>/dev/null; then
              if [ -s "${IU_CJ_PHASE3Z_REGISTRY_LKG_DIR}/iu-affiliate-cj-partner-registry-v1.json" ]; then
                echo "REGISTRY_LKG_PRIOR_RUN=${RUN}"
                RESTORED=1
                break
              fi
            fi
          done
          if [ "${RESTORED}" != "1" ]; then
            echo "REGISTRY_LKG_PRIOR_RUN=NONE"
          fi
      - name: Build non-public registry (URL verify all; DISARMED)
        env:
          IU_CJ_PHASE3Z_OUT_DIR: ${{ runner.temp }}/phase3z-out
          IU_CJ_PHASE3Z_STAGING_PATH: projects/data/iu-affiliate-cj-staging-v1.json
          IU_CJ_PHASE3Z_REGISTRY_LKG_DIR: ${{ runner.temp }}/phase3z-registry-lkg
          IU_CJ_PHASE3Z_VERIFY_URLS: "1"
          IU_CJ_PHASE3Z_VERIFY_LIMIT: "0"
          IU_CJ_PHASE3Z_VERIFY_CONCURRENCY: "3"
          IU_CJ_PHASE3Z_VERIFY_SPACING_MS: "350"
          IU_CJ_PHASE3Z_VERIFY_CHECKPOINT: ${{ runner.temp }}/phase3z-url-checkpoint.json
        run: |
          set -euo pipefail
          mkdir -p "$IU_CJ_PHASE3Z_OUT_DIR"
          node scripts/iu-cj-affiliate-phase3z-partner-registry-v1.mjs
          python3 - <<'PY'
          import json,os
          d=os.environ["IU_CJ_PHASE3Z_OUT_DIR"]
          reg=json.load(open(f"{d}/iu-affiliate-cj-partner-registry-v1.json"))
          btn=json.load(open(f"{d}/iu-affiliate-cj-partner-buttons-preview-v1.json"))
          assert reg.get("liveEnabled") is False
          assert reg.get("publicButtonSwapArmed") is False
          assert btn.get("publicButtonSwapArmed") is False
          print("PHASE3Z_DISARMED_OK", reg.get("counts"), btn.get("counts"), "lkgPreserved=", reg.get("lkgPreserved"))
          PY
      - name: Upload phase3z non-public artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iu-affiliate-cj-phase3z-registry
          path: |
            ${{ runner.temp }}/phase3z-out/iu-affiliate-cj-partner-registry-v1.json
            ${{ runner.temp }}/phase3z-out/iu-affiliate-cj-partner-buttons-preview-v1.json
            ${{ runner.temp }}/phase3z-url-checkpoint.json
          if-no-files-found: error

  # Phase 3V: offers/coupons/products from staging (+ optional shoppingProducts sample).
  # Schedule: rebuild + promote when previous public was live (KEEP_LIVE). First LIVE requires dispatch arm_offers_live=1.
  offers-live-sync:
    needs: fetch-staging
    runs-on: ubuntu-latest
    # V30.2: full feed inventory + deep pagination exceeded 45m (run cancelled). Continueable paging stays; raise budget.
    # V51.8: post-miss gap-deepen schedule 42839779394 hit 90m job timeout during Build/promote; raise to 150m (no gate weaken).
    timeout-minutes: 150
    env:
      IU_CJ_PAT: ${{ secrets.IU_CJ_PAT }}
      IU_CJ_PUBLISHER_CID: ${{ secrets.IU_CJ_PUBLISHER_CID }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
      # Promote writes on schedule (KEEP_LIVE) or when dispatch arms offers.
      IU_CJ_OFFERS_PROMOTE_ARMED: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.arm_offers_live == '1' || inputs.promote_offers_public == '1'))) && '1' || '0' }}
      IU_CJ_OFFERS_LIVE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_offers_live == '1' && '1' || '0' }}
      IU_CJ_OFFERS_SAMPLE_PRODUCTS: "1"
      # V30: 0 = all active managed partners (no artificial 80 / 10 caps).
      # Page size uses documented CJ Product Details Search pagination (default 1000, max 10000).
      # Artificial Math.min(10) source cap removed. Presentation budget optional/separate.
      IU_CJ_OFFERS_PRODUCT_PARTNER_LIMIT: "0"
      IU_CJ_OFFERS_PRODUCT_PAGE_SIZE: "100"
      # Continueable paging window (not API 10-cap). Early-stop once presentation budget filled.
      # V34: refresh_priority schedules use light discovery (1 page); daily 03:17 + full dispatch keep 5.
      # Base pages: light refresh=2, full/daily=8. Incomplete partners deepen via IU_CJ_OFFERS_DEEPEN_INCOMPLETE_MAX_PAGES.
      IU_CJ_OFFERS_PRODUCT_MAX_PAGES: ${{ (github.event_name == 'schedule' && github.event.schedule != '17 3 * * *') && '2' || (github.event_name == 'workflow_dispatch' && inputs.offers_mode == 'refresh_priority' && '2' || '8') }}
      IU_CJ_OFFERS_DEEPEN_INCOMPLETE_MAX_PAGES: ${{ (github.event_name == 'schedule' && github.event.schedule != '17 3 * * *') && '6' || (github.event_name == 'workflow_dispatch' && inputs.offers_mode == 'refresh_priority' && '6' || '20') }}
      IU_CJ_OFFERS_MAX_UNIQUE_DROP_ABS: "50"
      IU_CJ_OFFERS_MAX_UNIQUE_DROP_RATIO: "0.03"
      # Public growth: absolute 500 + ratio 0.2 remain armed. Uncapped stays DISARMED (never commit "1").
      IU_CJ_OFFERS_MAX_LKG_GROWTH_ABS: "500"
      IU_CJ_OFFERS_MAX_LKG_GROWTH_RATIO: "0.2"
      IU_CJ_PUBLIC_GROWTH_UNCAPPED: "0"
      # Chronic incomplete LKG: gradual HOLD after 720h (30d), max 25/run — no mass delete.
      IU_CJ_OFFERS_LKG_STALE_HOURS: "72"
      IU_CJ_OFFERS_LKG_INCOMPLETE_HOLD_HOURS: "720"
      IU_CJ_OFFERS_LKG_MAX_AGE_HOLD_PER_RUN: "25"
      # Presentation/runtime budget (prevents RangeError on mega-feeds). Not a CJ API source cap.
      IU_CJ_OFFERS_PRODUCT_PUBLISH_PER_PARTNER: "25"
      IU_CJ_OFFERS_KEEP_SOURCE_ROWS: "0"
      # V45: full inventory on daily 03:17 + workflow_dispatch offers_mode=full.
      # Progressive inventory on other schedules merges into durable feed-inventory-v40.
      IU_CJ_OFFERS_INVENTORY_FEEDS: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') && '1' || (github.event_name == 'workflow_dispatch' && inputs.offers_mode == 'full' && '1' || '0') }}
      IU_CJ_OFFERS_INVENTORY_FEEDS_PROGRESSIVE: ${{ (github.event_name == 'schedule' && github.event.schedule != '17 3 * * *') && '1' || (github.event_name == 'workflow_dispatch' && inputs.offers_mode == 'refresh_priority' && '1' || '0') }}
      IU_CJ_OFFERS_INVENTORY_PROGRESSIVE_LIMIT: "30"
      IU_CJ_OFFERS_REFRESH_PUBLISHED: "1"
      # V37: documented shoppingProducts(productIds) targeted refresh (fallback scan window if query fails).
      IU_CJ_OFFERS_REFRESH_PRODUCT_IDS: "1"
      # Deeper published-key scan on refresh-priority runs (still not an API source invent).
      IU_CJ_OFFERS_REFRESH_PAGE_SIZE: "100"
      IU_CJ_OFFERS_REFRESH_MAX_PAGES: ${{ (github.event_name == 'schedule' && github.event.schedule != '17 3 * * *') && '5' || (github.event_name == 'workflow_dispatch' && inputs.offers_mode == 'refresh_priority' && '5' || '5') }}
      IU_CJ_OFFERS_MODE: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *') && 'full' || (github.event_name == 'schedule' && 'refresh_priority' || (github.event_name == 'workflow_dispatch' && inputs.offers_mode || 'full')) }}
      IU_CJ_REFRESH_CHECKPOINT_PATH: projects/data/iu-affiliate-cj-refresh-coverage-v35.json
      # Legacy alias: treated as page size when PAGE_SIZE unset (no longer capped at 10).
      IU_CJ_OFFERS_PRODUCT_LIMIT: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: projects/data
      - name: Restore product-feed checkpoints (V31 continuation)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-product-feed-checkpoints
          path: projects/data
      - name: Restore email-only offers bridge (V31; optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-email-only-offers-bridge
          path: projects/data
      - name: Restore policy/section-map/offers LKG + prefer LIVE managed-public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p projects/data
          # Never leave empty files from failed git show (blocks later restores).
          restore_git_file() {
            local src="$1" dest="$2"
            local tmp="${dest}.tmp.$$"
            if git show "${src}" > "${tmp}" 2>/dev/null; then
              if [ -s "${tmp}" ]; then
                mv "${tmp}" "${dest}"
                return 0
              fi
            fi
            rm -f "${tmp}"
            return 1
          }
          for f in \
            iu-affiliate-slot-policy-v1.json \
            iu-affiliate-cj-section-map-v1.json \
            iu-affiliate-cj-offers-public-v1.json \
            iu-affiliate-cj-main-buttons-static-v13.json
          do
            if [ ! -f "projects/data/${f}" ] || [ ! -s "projects/data/${f}" ]; then
              restore_git_file "HEAD:projects/data/${f}" "projects/data/${f}" || true
            fi
          done
          # Durable checkpoints live on sync branch (not main). Drop empty/missing then restore.
          # Root cause V32: fetch-staging slim tip historically wiped checkpoints before this job ran.
          # Root cause V37: refresh-coverage checkpoint was uploaded but not restored ? every pass restarted at offset 1.
          git fetch origin refs/heads/data/cj-affiliate-catalog-sync:refs/remotes/origin/data/cj-affiliate-catalog-sync --depth=1 \
            || git fetch origin data/cj-affiliate-catalog-sync --depth=1 \
            || true
          CP="projects/data/iu-affiliate-cj-product-feed-checkpoints-v31.json"
          INV="projects/data/iu-affiliate-cj-feed-inventory-v40.json"
          CUM="projects/data/iu-affiliate-cj-cumulative-coverage-v40.json"
          if [ -f "$CP" ] && [ ! -s "$CP" ]; then rm -f "$CP"; fi
          if [ -f "$INV" ] && [ ! -s "$INV" ]; then rm -f "$INV"; fi
          if [ -f "$CUM" ] && [ ! -s "$CUM" ]; then rm -f "$CUM"; fi
          if [ ! -f "$INV" ]; then
            restore_git_file \
              "origin/data/cj-affiliate-catalog-sync:projects/data/iu-affiliate-cj-feed-inventory-v40.json" \
              "$INV" \
              || true
          fi
          if [ ! -f "$CUM" ]; then
            restore_git_file \
              "origin/data/cj-affiliate-catalog-sync:projects/data/iu-affiliate-cj-cumulative-coverage-v40.json" \
              "$CUM" \
              || true
          fi
          if [ ! -f "$CP" ]; then
            restore_git_file \
              "origin/data/cj-affiliate-catalog-sync:projects/data/iu-affiliate-cj-product-feed-checkpoints-v31.json" \
              "$CP" \
              || restore_git_file "FETCH_HEAD:projects/data/iu-affiliate-cj-product-feed-checkpoints-v31.json" "$CP" \
              || true
          fi
          RCP="projects/data/iu-affiliate-cj-refresh-coverage-v35.json"
          if [ -f "$RCP" ] && [ ! -s "$RCP" ]; then rm -f "$RCP"; fi
          if [ ! -f "$RCP" ]; then
            restore_git_file \
              "origin/data/cj-affiliate-catalog-sync:projects/data/iu-affiliate-cj-refresh-coverage-v35.json" \
              "$RCP" \
              || restore_git_file "FETCH_HEAD:projects/data/iu-affiliate-cj-refresh-coverage-v35.json" "$RCP" \
              || true
          fi
          if [ -f "$RCP" ] && [ -s "$RCP" ]; then
            echo "REFRESH_COVERAGE_CHECKPOINT_RESTORED=1"
          else
            echo "REFRESH_COVERAGE_CHECKPOINT_RESTORED=0"
          fi
          MISS="projects/data/iu-affiliate-cj-miss-products-v38.json"
          if [ -f "$MISS" ] && [ ! -s "$MISS" ]; then rm -f "$MISS"; fi
          if [ ! -f "$MISS" ]; then
            restore_git_file \
              "origin/data/cj-affiliate-catalog-sync:projects/data/iu-affiliate-cj-miss-products-v38.json" \
              "$MISS" \
              || restore_git_file "FETCH_HEAD:projects/data/iu-affiliate-cj-miss-products-v38.json" "$MISS" \
              || true
          fi
          if [ -f "$MISS" ] && [ -s "$MISS" ]; then
            echo "MISS_AUDIT_CHECKPOINT_RESTORED=1"
          else
            echo "MISS_AUDIT_CHECKPOINT_RESTORED=0"
          fi
          # V51: restore durable price/reverify/identity ledgers so append-only survives orphan slim tips.
          # V51.8-maint: also restore durable catalog + cumulative growth ledger (missing file reset growth!).
          for DUR in \
            iu-affiliate-cj-durable-price-history-v50.json \
            iu-affiliate-cj-durable-price-history-archive-v51.json \
            iu-affiliate-cj-product-reverify-v50.json \
            iu-affiliate-cj-product-identity-v50.json \
            iu-affiliate-cj-durable-catalog-v51.json \
            iu-affiliate-cj-public-growth-budget-v51.json
          do
            DP="projects/data/${DUR}"
            if [ -f "$DP" ] && [ ! -s "$DP" ]; then rm -f "$DP"; fi
            if [ ! -f "$DP" ]; then
              restore_git_file \
                "origin/data/cj-affiliate-catalog-sync:projects/data/${DUR}" \
                "$DP" \
                || restore_git_file "FETCH_HEAD:projects/data/${DUR}" "$DP" \
                || true
            fi
          done
          if [ -f "projects/data/iu-affiliate-cj-public-growth-budget-v51.json" ] && [ -s "projects/data/iu-affiliate-cj-public-growth-budget-v51.json" ]; then
            echo "GROWTH_BUDGET_LEDGER_RESTORED=1"
          else
            echo "GROWTH_BUDGET_LEDGER_RESTORED=0"
          fi
          # V51.1: prior-run artifact restore (survives fetch-staging slim wipe; reverify >1MB so skip gh contents).
          NEED_DUR=0
          for DUR in \
            iu-affiliate-cj-durable-price-history-v50.json \
            iu-affiliate-cj-product-reverify-v50.json \
            iu-affiliate-cj-product-identity-v50.json \
            iu-affiliate-cj-durable-catalog-v51.json \
            iu-affiliate-cj-public-growth-budget-v51.json
          do
            if [ ! -f "projects/data/${DUR}" ] || [ ! -s "projects/data/${DUR}" ]; then NEED_DUR=1; fi
          done
          # Archive is optional for NEED_DUR (bootstrap later if absent). Still attempt restore when missing.
          if [ ! -s "projects/data/iu-affiliate-cj-durable-price-history-archive-v51.json" ]; then NEED_DUR=1; fi
          if [ "$NEED_DUR" = "1" ]; then
            set +e
            PRIOR_DUR_RUN=$(gh run list \
              --workflow cj-affiliate-catalog-sync.yml \
              --branch main \
              --status completed \
              --limit 20 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion=="success")][0].databaseId')
            if [ -n "${PRIOR_DUR_RUN}" ] && [ "${PRIOR_DUR_RUN}" != "null" ]; then
              mkdir -p "${RUNNER_TEMP}/iu-cj-dur-prior"
              gh run download "${PRIOR_DUR_RUN}" \
                -n iu-affiliate-cj-product-feed-checkpoints \
                -D "${RUNNER_TEMP}/iu-cj-dur-prior" \
                2>/tmp/iu-dur-prior.err
              dur_rc=$?
              if [ "$dur_rc" -eq 0 ]; then
                for DUR in \
                  iu-affiliate-cj-durable-price-history-v50.json \
                  iu-affiliate-cj-durable-price-history-archive-v51.json \
                  iu-affiliate-cj-product-reverify-v50.json \
                  iu-affiliate-cj-product-identity-v50.json \
                  iu-affiliate-cj-durable-catalog-v51.json \
                  iu-affiliate-cj-public-growth-budget-v51.json
                do
                  SRC="${RUNNER_TEMP}/iu-cj-dur-prior/${DUR}"
                  DP="projects/data/${DUR}"
                  if [ ! -s "$DP" ] && [ -s "$SRC" ]; then
                    cp "$SRC" "$DP"
                    echo "DURABLE_PRIOR_RUN_RESTORE=${DUR} run=${PRIOR_DUR_RUN} bytes=$(wc -c < "$DP" | tr -d ' ')"
                  fi
                done
              else
                echo "DURABLE_PRIOR_RUN_RESTORE_FAIL run=${PRIOR_DUR_RUN} rc=${dur_rc}"
                cat /tmp/iu-dur-prior.err 2>/dev/null || true
              fi
            else
              echo "DURABLE_PRIOR_RUN_NONE"
            fi
            set -e
          fi
          # V51.3: archive companion is NEW — prior successful runs may lack it.
          # Required fail-closed set remains price/reverify/identity only.
          # Missing archive → bootstrap empty file (do NOT DURABLE_RESTORE_BLOCKED).
          DURABLE_MISSING_COUNT=0
          for DUR in \
            iu-affiliate-cj-durable-price-history-v50.json \
            iu-affiliate-cj-product-reverify-v50.json \
            iu-affiliate-cj-product-identity-v50.json
          do
            DP="projects/data/${DUR}"
            if [ -f "$DP" ] && [ -s "$DP" ]; then
              echo "DURABLE_LEDGER_RESTORED=${DUR}"
            else
              echo "DURABLE_LEDGER_MISSING=${DUR}"
              DURABLE_MISSING_COUNT=$((DURABLE_MISSING_COUNT + 1))
            fi
          done
          ARCH="projects/data/iu-affiliate-cj-durable-price-history-archive-v51.json"
          if [ -f "$ARCH" ] && [ -s "$ARCH" ]; then
            echo "DURABLE_LEDGER_RESTORED=iu-affiliate-cj-durable-price-history-archive-v51.json"
          else
            mkdir -p projects/data
            printf '%s\n' '{"schema":"iu-cj-affiliate-phase3z-durable-history-archive-v51.3","at":"'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'","runId":null,"events":[],"availabilityEvents":[],"eventKeys":[],"counts":{"economicEvents":0,"availabilityEvents":0,"appendedThisRun":0,"skippedDuplicateKeys":0},"note":"BOOTSTRAP empty archive — prior runs predate V51.3 archive companion"}' > "$ARCH"
            echo "DURABLE_ARCHIVE_BOOTSTRAP=1"
            echo "DURABLE_LEDGER_MISSING=iu-affiliate-cj-durable-price-history-archive-v51.json"
          fi
          # V51.1 fail-closed: if prior successful sync produced durable artifacts but restore
          # failed, do NOT silently continue with empty history (would wipe append-only ledger).
          if [ "$DURABLE_MISSING_COUNT" -gt 0 ]; then
            set +e
            PRIOR_DUR_PROBE=$(gh run list \
              --workflow cj-affiliate-catalog-sync.yml \
              --branch main \
              --status completed \
              --limit 20 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion=="success")][0].databaseId')
            PRIOR_HAS_DURABLE=0
            if [ -n "${PRIOR_DUR_PROBE}" ] && [ "${PRIOR_DUR_PROBE}" != "null" ]; then
              mkdir -p "${RUNNER_TEMP}/iu-cj-dur-probe"
              gh run download "${PRIOR_DUR_PROBE}" \
                -n iu-affiliate-cj-product-feed-checkpoints \
                -D "${RUNNER_TEMP}/iu-cj-dur-probe" \
                2>/tmp/iu-dur-probe.err
              if [ -s "${RUNNER_TEMP}/iu-cj-dur-probe/iu-affiliate-cj-durable-price-history-v50.json" ]; then
                PRIOR_HAS_DURABLE=1
              fi
            fi
            set -e
            if [ "$PRIOR_HAS_DURABLE" = "1" ]; then
              echo "DURABLE_RESTORE_BLOCKED=1"
              echo "BLOCKER=DURABLE_RESTORE_BLOCKED priorRun=${PRIOR_DUR_PROBE} missingCount=${DURABLE_MISSING_COUNT}"
              echo "::error::DURABLE_RESTORE_BLOCKED - prior durable history exists but restore failed; refusing empty-ledger continue"
              exit 1
            fi
            echo "DURABLE_RESTORE_BLOCKED=0"
            echo "DURABLE_RESTORE_NOTE=no_prior_durable_artifact_detected"
          else
            echo "DURABLE_RESTORE_BLOCKED=0"
          fi
          # V51.8-maint: growth ledger missing while LIVE must hard-fail (belt+suspenders for #13843).
          # JS resolvePublicGrowthBudgetLedger is also fail-closed; workflow refuses empty-ledger continue.
          LIVE_FLAG=0
          if [ -f "projects/data/iu-affiliate-cj-offers-public-v1.json" ] && [ -s "projects/data/iu-affiliate-cj-offers-public-v1.json" ]; then
            LIVE_FLAG=$(node -e "try{const d=require('./projects/data/iu-affiliate-cj-offers-public-v1.json');process.stdout.write(d&&d.liveEnabled===true?'1':'0')}catch(e){process.stdout.write('0')}")
          fi
          if [ -f "projects/data/iu-affiliate-cj-public-growth-budget-v51.json" ] && [ -s "projects/data/iu-affiliate-cj-public-growth-budget-v51.json" ]; then
            echo "GROWTH_BUDGET_LEDGER_RESTORED=1"
          else
            echo "GROWTH_BUDGET_LEDGER_RESTORED=0"
            if [ "$LIVE_FLAG" = "1" ]; then
              echo "GROWTH_LEDGER_RESTORE_BLOCKED=1"
              echo "BLOCKER=GROWTH_LEDGER_RESTORE_BLOCKED"
              echo "::error::GROWTH_LEDGER_RESTORE_BLOCKED - LIVE catalog requires cumulative growth ledger; refusing empty-ledger continue (#13843)"
              exit 1
            fi
          fi
          # API fallback via gh (same path that successfully restores offers-public).
          if [ ! -f "$CP" ] || [ ! -s "$CP" ]; then
            set +e
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/projects/data/iu-affiliate-cj-product-feed-checkpoints-v31.json?ref=data%2Fcj-affiliate-catalog-sync" \
              -H "Accept: application/vnd.github.raw" \
              > "${CP}.gh.tmp"
            gh_rc=$?
            set -e
            if [ "$gh_rc" -eq 0 ] && [ -s "${CP}.gh.tmp" ]; then
              mv "${CP}.gh.tmp" "$CP"
              echo "CHECKPOINT_GH_API_RESTORE=$(wc -c < "$CP" | tr -d ' ')"
            else
              rm -f "${CP}.gh.tmp"
              echo "CHECKPOINT_GH_API_RESTORE_FAIL rc=${gh_rc}"
            fi
          fi
          # Prior successful run artifact (survives sync-branch slim wipe).
          if [ ! -f "$CP" ] || [ ! -s "$CP" ]; then
            set +e
            PRIOR_RUN=$(gh run list \
              --workflow cj-affiliate-catalog-sync.yml \
              --branch main \
              --status completed \
              --limit 20 \
              --json databaseId,conclusion,headBranch \
              --jq '[.[] | select(.conclusion=="success")][0].databaseId')
            if [ -n "${PRIOR_RUN}" ] && [ "${PRIOR_RUN}" != "null" ]; then
              mkdir -p "${RUNNER_TEMP}/iu-cj-cp-prior"
              gh run download "${PRIOR_RUN}" \
                -n iu-affiliate-cj-product-feed-checkpoints \
                -D "${RUNNER_TEMP}/iu-cj-cp-prior" \
                2>/tmp/iu-cp-prior.err
              prior_rc=$?
              PRIOR_CP="${RUNNER_TEMP}/iu-cj-cp-prior/iu-affiliate-cj-product-feed-checkpoints-v31.json"
              if [ "$prior_rc" -eq 0 ] && [ -s "${PRIOR_CP}" ]; then
                cp "${PRIOR_CP}" "$CP"
                echo "CHECKPOINT_PRIOR_RUN_RESTORE=${PRIOR_RUN} bytes=$(wc -c < "$CP" | tr -d ' ')"
              else
                echo "CHECKPOINT_PRIOR_RUN_RESTORE_FAIL run=${PRIOR_RUN} rc=${prior_rc}"
                cat /tmp/iu-cp-prior.err 2>/dev/null || true
              fi
            else
              echo "CHECKPOINT_PRIOR_RUN_NONE"
            fi
            set -e
          fi
          if [ -f "$CP" ] && [ -s "$CP" ]; then
            echo "PRODUCT_FEED_CHECKPOINT_RESTORED=1"
            python3 - <<'PY'
          import json
          p="projects/data/iu-affiliate-cj-product-feed-checkpoints-v31.json"
          j=json.load(open(p))
          partners=j.get("partners") or {}
          resumed=sum(1 for v in partners.values() if (v or {}).get("resumeOffset") not in (None,1,"1") or (v or {}).get("resumePage"))
          print("CHECKPOINT_PARTNERS", len(partners), "RESUMABLE", resumed)
          PY
          else
            echo "PRODUCT_FEED_CHECKPOINT_RESTORED=0"
          fi
          EB="projects/data/iu-affiliate-cj-email-only-offers-bridge-v31.json"
          if [ -f "$EB" ] && [ ! -s "$EB" ]; then rm -f "$EB"; fi
          if [ -f "$EB" ] && [ -s "$EB" ]; then
            echo "EMAIL_ONLY_BRIDGE_RESTORED=1"
          else
            echo "EMAIL_ONLY_BRIDGE_RESTORED=0"
          fi
          # Prefer R2/public LIVE partner overlay for section mapping (not stale Pages tip).
          if curl -fsSL "https://infouzel.cz/projects/data/iu-affiliate-cj-managed-public-v1.json" \
            -o projects/data/iu-affiliate-cj-managed-public-v1.json; then
            echo "MANAGED_PUBLIC_SOURCE=production_live"
          else
            echo "MANAGED_PUBLIC_SOURCE=checkout_fallback"
          fi
          # Prefer LIVE main buttons so offers section fill matches published partners (V28).
          if curl -fsSL "https://infouzel.cz/projects/data/iu-affiliate-cj-main-buttons-static-v13.json" \
            -o projects/data/iu-affiliate-cj-main-buttons-static-v13.json; then
            echo "MAIN_BUTTONS_SOURCE=production_live"
          else
            echo "MAIN_BUTTONS_SOURCE=checkout_fallback"
          fi
          python3 - <<'PY'
          import json
          mp=json.load(open("projects/data/iu-affiliate-cj-managed-public-v1.json"))
          print("MANAGED_PUBLIC_PARTNERS", len(mp.get("partners") or []))
          off=json.load(open("projects/data/iu-affiliate-cj-offers-public-v1.json"))
          print("PREV_OFFERS_LIVE", off.get("liveEnabled") is True)
          PY
      - name: V44 gap-deepen when schedule/catch-up fires after long miss window
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.catchup_dispatch == '1') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_SCHEDULE: ${{ github.event.schedule }}
          THIS_EVENT: ${{ github.event_name }}
          CATCHUP_DISPATCH: ${{ inputs.catchup_dispatch || '0' }}
        run: |
          set -euo pipefail
          WF_ID="$(gh api "repos/${REPO}/actions/workflows" --jq \
            '.workflows[] | select(.path==".github/workflows/cj-affiliate-catalog-sync.yml") | .id')"
          RAW="$(gh api "repos/${REPO}/actions/workflows/${WF_ID}/runs?event=schedule&per_page=10")"
          echo "${RAW}" > /tmp/iu-cj-gap-schedules.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { decideGapDeepen } from "./scripts/iu-cj-affiliate-phase3z-schedule-catchup-v44.mjs";
          const raw = JSON.parse(fs.readFileSync("/tmp/iu-cj-gap-schedules.json", "utf8"));
          const runs = (raw.workflow_runs || []).filter((r) => String(r.id) !== String(process.env.GITHUB_RUN_ID || ""));
          const prior = runs[0];
          let ageH = null;
          if (prior?.created_at) {
            ageH = (Date.now() - new Date(prior.created_at).getTime()) / 3600000;
          }
          const d = decideGapDeepen({
            eventName: process.env.THIS_EVENT || "schedule",
            scheduleExpr: process.env.THIS_SCHEDULE || "",
            catchupDispatch: process.env.CATCHUP_DISPATCH || "0",
            latestScheduleAgeHours: ageH,
          });
          fs.writeFileSync("/tmp/iu-cj-gap-deepen.json", JSON.stringify({ ...d, priorRunId: prior?.id || null }, null, 2));
          console.log(JSON.stringify({ ...d, priorRunId: prior?.id || null, priorAgeHours: ageH }));
          if (d.deepen && d.productMaxPages) {
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              "IU_CJ_OFFERS_PRODUCT_MAX_PAGES=" + d.productMaxPages + "\n"
            );
            console.log("GAP_DEEPEN_APPLIED=" + d.productMaxPages);
          } else {
            console.log("GAP_DEEPEN_APPLIED=0 reason=" + d.reason);
          }
          NODE
      - name: Build/promote offers-public (fail-closed)
