name: CJ Affiliate catalog sync (fetch â‰  publish)

# Phase 2C PR B: daily fetch â†’ staging artifacts; publish only CJ_MANAGED via gate.
# Never force-pushes main. Never rewrites catalog JS / freeze guards / slot policy.
# Prod deploy remains Pages/PR merge after human approval.

on:
  schedule:
    # Off-peak UTC (~03:17) â€” ~25 req/min spacing enforced in fetch script
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      execute_live_fetch:
        description: "GO live CJ HTTP fetch (requires IU_CJ_PAT + CID + PID secrets)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      arm_publish:
        description: "Arm publish gate write to managed registry (infra-approved only)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      promote_managed_public:
        description: "Open data-only PR to main with managed-public JSON (legacy Pages path; infra GO)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      publish_managed_public_r2:
        description: "Unattended R2 publish via site-redirects worker (no git merge; requires infra GO + secrets)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      arm_offers_live:
        description: "Arm offers liveEnabled=true (coupons/actions/products) after validation"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      promote_offers_public:
        description: "Open data-only PR to main with offers-public JSON (Pages path)"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cj-affiliate-catalog-sync
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish-gate selftest
        run: node scripts/iu-cj-affiliate-catalog-sync-v1-selftest.mjs
      - name: E2E overlay selftest (fixtures)
        run: node scripts/iu-cj-affiliate-catalog-sync-e2e-overlay-selftest.mjs
      - name: Promote selftest (fixtures, disarmed default)
        run: node scripts/iu-cj-affiliate-catalog-sync-promote-selftest.mjs
      - name: R2 auto-publish selftest (fixtures; no prod; proves no git merge)
        run: node scripts/iu-cj-affiliate-catalog-sync-r2-publish-selftest.mjs
      - name: R2 â†’ overlay E2E selftest (fixtures; no git merge)
        run: node scripts/iu-cj-affiliate-catalog-sync-r2-e2e-overlay-selftest.mjs
      - name: Site-redirects CJ managed-public unit tests
        working-directory: cloudflare/iu-site-redirects
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test -- --run src/cj-managed-public.test.ts
      - name: Offers public build selftest (fixture; liveEnabled disarmed)
        run: node scripts/iu-cj-affiliate-offers-public-build-v1-selftest.mjs
      - name: Offers live-sync selftest (offline fixtures)
        run: node scripts/iu-cj-affiliate-offers-live-sync-v1-selftest.mjs
      - name: Offers UI + production feature-flag gate selftest
        run: |
          node scripts/iu-cj-affiliate-phase2-offers-preview-ui-selftest.mjs
          node scripts/iu-cj-affiliate-phase2-offers-prod-gate-selftest.mjs
      - name: Phase 3C live-audit harness selftest (offline; no live HTTP)
        run: node scripts/iu-cj-affiliate-phase3c-live-readonly-audit-v1-selftest.mjs
      - name: Phase 3D complete validation + R2 readiness selftest (offline)
        run: |
          node scripts/iu-cj-affiliate-phase3d-complete-validation-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3d-r2-infra-readiness-v1.mjs
      - name: Phase 3E partner recon + capacity + R2 GO plan selftest (offline)
        run: |
          node scripts/iu-cj-affiliate-phase3e-partner-recon-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3e-capacity-audit-v1.mjs
          node scripts/iu-cj-affiliate-phase3e-r2-production-go-plan-v1.mjs
      - name: Phase 3F unlimited dynamic catalog selftest (offline)
        run: |
          node scripts/iu-cj-affiliate-phase3f-dynamic-catalog-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3f-dynamic-catalog-v1.mjs
      - name: Phase 3G E2E renderer wire selftest (catalog.js overlay; DISARMED)
        run: |
          node scripts/iu-cj-affiliate-phase3g-e2e-renderer-wire-v1-selftest.mjs
      - name: Phase 3H coverage reconcile + auth 14/14 matrix (DISARMED)
        run: |
          node scripts/iu-cj-affiliate-phase3h-coverage-reconcile-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3d-complete-validation-v1-selftest.mjs
      - name: Phase 3I R2 binding + four-partner coverage (DISARMED)
        run: |
          node scripts/iu-cj-affiliate-phase3i-r2-four-partners-v1-selftest.mjs
      - name: Phase 3J staging burn-in readiness + public GO checklist (DISARMED)
        run: |
          node scripts/iu-cj-affiliate-phase3j-staging-burnin-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3j-public-go-checklist-v1.mjs
      - name: Phase 3M unified lifecycle + email hint (DISARMED; mock IMAP)
        run: |
          node scripts/iu-cj-affiliate-phase3m-unified-lifecycle-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3m-email-hint-v1.mjs
          node scripts/iu-cj-affiliate-phase3m-unified-lifecycle-v1.mjs
      - name: Phase 3N live-verify harness + Forpsi auth checklist (DISARMED)
        run: |
          node scripts/iu-cj-affiliate-phase3n-live-verify-v1.mjs
          node scripts/iu-cj-affiliate-phase3n-forpsi-auth-checklist-v1.mjs
      - name: Phase 3O baked CID resolve + Forpsi ready + live-verify (DISARMED)
        run: |
          node scripts/iu-cj-affiliate-phase3o-baked-cid-resolve-v1-selftest.mjs
          node scripts/iu-cj-affiliate-phase3o-forpsi-ready-v1.mjs
          node scripts/iu-cj-affiliate-phase3o-live-verify-v1.mjs
      - name: Phase 3P migration plan + Forpsi runbook + live-verify (DISARMED)
        run: |
          node scripts/iu-cj-affiliate-phase3p-forpsi-operator-runbook-v1.mjs
          node scripts/iu-cj-affiliate-phase3p-live-verify-v1.mjs
      - name: Phase 3Z V9-final ops guards (circuit / schedule watchdog helpers)
        run: |
          node scripts/iu-cj-affiliate-phase3z-ops-guards-v9-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-inventory-equality-v9.mjs
          node scripts/iu-cj-affiliate-phase3z-assortment-evidence-v9-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-category-consistency-v9-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-publication-readiness-v9-selftest.mjs

  fetch-staging:
    needs: selftest
    runs-on: ubuntu-latest
    # Full CJ Link Search + advertiser pages with ~2.4s spacing routinely exceeds 20m.
    timeout-minutes: 45
    env:
      IU_CJ_PAT: ${{ secrets.IU_CJ_PAT }}
      IU_CJ_PUBLISHER_CID: ${{ secrets.IU_CJ_PUBLISHER_CID }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
      # Schedule must live-fetch (read-only). Publish/promote/R2 stay disarmed unless dispatch arms them.
      IU_CJ_SYNC_HTTP_EXECUTE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.execute_live_fetch == '1')) && '1' || '0' }}
      IU_CJ_SYNC_REQ_SPACING_MS: "2400"
      # Targeted all-types Link Search for known missing-URL joined partners (read-only).
      IU_CJ_SYNC_PROBE_ADVERTISER_IDS: "6466592,5578976,7804601,5725783"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight secrets (no values)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${IU_CJ_PAT:-}" ]; then echo "IU_CJ_PAT=CONFIGURED"; else echo "IU_CJ_PAT=MISSING"; fi
          if [ -n "${IU_CJ_PUBLISHER_CID:-}" ]; then echo "IU_CJ_PUBLISHER_CID=CONFIGURED"; else echo "IU_CJ_PUBLISHER_CID=MISSING"; fi
          if [ -n "${IU_CJ_WEBSITE_PID:-}" ]; then echo "IU_CJ_WEBSITE_PID=CONFIGURED"; else echo "IU_CJ_WEBSITE_PID=MISSING"; fi
          echo "HTTP_EXECUTE=${IU_CJ_SYNC_HTTP_EXECUTE}"
          if [ "${IU_CJ_SYNC_HTTP_EXECUTE}" = "1" ]; then
            if [ -z "${IU_CJ_PAT:-}" ] || [ -z "${IU_CJ_PUBLISHER_CID:-}" ] || [ -z "${IU_CJ_WEBSITE_PID:-}" ]; then
              echo "BLOCKER=SECRETS_MISSING_FOR_LIVE_FETCH"
              exit 1
            fi
          fi
      - name: Offers public dry-build from fixture (never arms liveEnabled)
        run: node scripts/iu-cj-affiliate-offers-public-build-v1.mjs
      - name: Fetch â†’ staging JSON
        run: node scripts/iu-cj-affiliate-catalog-sync-fetch-v1.mjs
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: |
            projects/data/iu-affiliate-cj-staging-v1.json
            projects/data/iu-affiliate-cj-sync-audit-v1.json
          if-no-files-found: error
      - name: Commit staging to data/cj-affiliate-catalog-sync (never main)
        shell: bash
        run: |
          set -euo pipefail
          # Sync branch historically bloated (~400k files). Always rewrite as a slim
          # orphan tip with only CJ JSON artifacts â€” never checkout the fat history.
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          STASH="${RUNNER_TEMP}/iu-cj-staging"
          mkdir -p "${STASH}/prev" projects/data
          cp projects/data/iu-affiliate-cj-staging-v1.json "${STASH}/"
          cp projects/data/iu-affiliate-cj-sync-audit-v1.json "${STASH}/"
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${SYNC_BRANCH}" --depth=1 || true
          for name in managed-public managed-registry staging sync-audit; do
            git show "origin/${SYNC_BRANCH}:projects/data/iu-affiliate-cj-${name}-v1.json" \
              > "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" 2>/dev/null || true
          done
          git checkout --orphan "iu-cj-sync-slim-$$"
          git reset --hard
          git clean -fdx
          mkdir -p projects/data
          # Preserve prior managed overlays when this job only refreshes staging.
          for name in managed-public managed-registry; do
            if [ -f "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            fi
          done
          cp "${STASH}/iu-affiliate-cj-staging-v1.json" projects/data/
          cp "${STASH}/iu-affiliate-cj-sync-audit-v1.json" projects/data/
          git add projects/data/iu-affiliate-cj-*.json
          if git diff --cached --quiet; then
            echo "NO_STAGING_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-(staging|sync-audit|managed-public|managed-registry)-v1\.json$'; then
            echo "BLOCKER=UNEXPECTED_STAGED_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore(data): CJ affiliate staging fetch (sync branch only, slim tip)"
          git push --force origin "HEAD:${SYNC_BRANCH}"
          echo "SYNC_BRANCH_SLIM_REWRITE=true"

  publish-gate:
    needs: fetch-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IU_CJ_SYNC_PUBLISH_ARMED: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_publish || '0' }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: projects/data
      - name: Ensure policy + section-map + public LKG present (artifact must not wipe)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data
          for f in \
            iu-affiliate-slot-policy-v1.json \
            iu-affiliate-cj-section-map-v1.json \
            iu-affiliate-cj-managed-public-v1.json \
            iu-affiliate-cj-managed-registry-v1.json
          do
            if [ ! -f "projects/data/${f}" ]; then
              git show "HEAD:projects/data/${f}" > "projects/data/${f}"
              echo "RESTORED_FROM_HEAD=${f}"
            else
              echo "PRESENT=${f}"
            fi
          done
          python3 - <<'PY'
          import json
          mp=json.load(open("projects/data/iu-affiliate-cj-managed-public-v1.json"))
          print("LKG_PUBLIC_PARTNERS", len(mp.get("partners") or []))
          PY
      - name: Publish gate (CJ_MANAGED only; LKG on outage)
        run: node scripts/iu-cj-affiliate-catalog-sync-publish-v1.mjs
      - name: Commit managed registry + public overlay if armed (sync branch only)
        if: env.IU_CJ_SYNC_PUBLISH_ARMED == '1'
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          STASH="${RUNNER_TEMP}/iu-cj-publish"
          mkdir -p "${STASH}/prev" projects/data
          for name in managed-public managed-registry staging sync-audit; do
            if [ -f "projects/data/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "projects/data/iu-affiliate-cj-${name}-v1.json" "${STASH}/iu-affiliate-cj-${name}-v1.json"
            fi
          done
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${SYNC_BRANCH}" --depth=1 || true
          for name in managed-public managed-registry staging sync-audit; do
            git show "origin/${SYNC_BRANCH}:projects/data/iu-affiliate-cj-${name}-v1.json" \
              > "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" 2>/dev/null || true
          done
          git checkout --orphan "iu-cj-sync-slim-$$"
          git reset --hard
          git clean -fdx
          mkdir -p projects/data
          for name in managed-public managed-registry staging sync-audit; do
            if [ -f "${STASH}/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            elif [ -f "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            fi
          done
          git add projects/data/iu-affiliate-cj-*.json
          if git diff --cached --quiet; then
            echo "NO_REGISTRY_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-(managed-registry|managed-public|staging|sync-audit)-v1\.json$'; then
            echo "BLOCKER=UNEXPECTED_PUBLISH_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore(data): CJ_MANAGED registry+public overlay (gate pass, slim sync tip)"
          git push --force origin "HEAD:${SYNC_BRANCH}"
          echo "SYNC_BRANCH_SLIM_REWRITE=true"
      - name: Summary (no merge / no prod)
        shell: bash
        run: |
          set -euo pipefail
          echo "NO_MERGE=true"
          echo "NO_PROD_DEPLOY=true"
          echo "FETCH_NE_PUBLISH=true"
          echo "MANAGED_PUBLIC_OVERLAY=projects/data/iu-affiliate-cj-managed-public-v1.json"
          echo "PROMOTE_TO_MAIN=DISARMED_REQUIRES_INFRA_GO"
          if [ -f projects/data/iu-affiliate-cj-sync-audit-v1.json ]; then
            python3 -c "import json; a=json.load(open('projects/data/iu-affiliate-cj-sync-audit-v1.json')); print(json.dumps(a.get('plan',a) if isinstance(a,dict) else {}, indent=2)[:2000])"
          fi

  promote-data-pr:
    needs: publish-gate
    if: github.event_name == 'workflow_dispatch' && inputs.promote_managed_public == '1' && inputs.arm_publish == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch managed-public from sync branch
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          git fetch origin "${SYNC_BRANCH}" --depth=1
          git show "origin/${SYNC_BRANCH}:projects/data/iu-affiliate-cj-managed-public-v1.json" > /tmp/iu-managed-public-incoming.json
      - name: Validate incoming managed-public (promote write stays disarmed)
        shell: bash
        env:
          IU_CJ_MANAGED_PUBLIC_PROMOTE_ARMED: "0"
        run: |
          set -euo pipefail
          mkdir -p projects/data
          cp /tmp/iu-managed-public-incoming.json projects/data/iu-affiliate-cj-managed-public-v1.json
          node scripts/iu-cj-affiliate-catalog-sync-promote-managed-public-v1.mjs
      - name: Open data-only PR to main (required checks still apply; no auto-merge)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="data/cj-managed-public-promote-${GITHUB_RUN_ID}"
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BR}"
          mkdir -p projects/data
          cp /tmp/iu-managed-public-incoming.json projects/data/iu-affiliate-cj-managed-public-v1.json
          git add projects/data/iu-affiliate-cj-managed-public-v1.json
          if git diff --cached --quiet; then
            echo "NO_PUBLIC_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-managed-public-v1\.json$'; then
            echo "BLOCKER=UNEXPECTED_PROMOTE_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "chore(data): promote CJ managed-public overlay (data-only)"
          git push origin "HEAD:${BR}"
          gh pr create \
            --base main \
            --head "${BR}" \
            --title "chore(data): promote CJ managed-public overlay" \
            --body "## Summary
          - Data-only promote of \`projects/data/iu-affiliate-cj-managed-public-v1.json\`
          - No code/guard/workflow changes
          - Required checks must pass; no auto-merge

          ## What does NOT change
          - Catalog JS, slot policy, MANUAL_PROTECTED partners, secrets

          ## Verification checklist
          - [ ] Only one file changed
          - [ ] Overlay schema validates
          - [ ] No live CJ fetch in this PR
          "
          echo "PROMOTE_PR_OPENED=true"
          echo "NO_AUTO_MERGE=true"
          echo "NO_PROD_DEPLOY_FROM_THIS_JOB=true"

  # Phase 2H: unattended public overlay via Worker/R2 (no PR merge, no commit to main).
  # DISARMED unless workflow_dispatch publish_managed_public_r2=1 AND arm_publish=1 AND secrets set.
  # Live CF binding creation is INFRA_PENDING â€” job fails closed if endpoint/token missing when armed.
  publish-managed-public-r2:
    needs: publish-gate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_managed_public_r2 == '1' && inputs.arm_publish == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IU_CJ_MANAGED_PUBLIC_R2_PUBLISH_ARMED: "1"
      IU_CJ_MANAGED_PUBLIC_PUBLISH_URL: ${{ secrets.IU_CJ_MANAGED_PUBLIC_R2_PUBLISH_URL || secrets.IU_CJ_MANAGED_PUBLIC_PUBLISH_URL }}
      IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN: ${{ secrets.IU_CJ_MANAGED_PUBLIC_R2_PUBLISH_TOKEN || secrets.IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch managed-public from sync branch
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          git fetch origin "${SYNC_BRANCH}" --depth=1
          mkdir -p projects/data
          git show "origin/${SYNC_BRANCH}:projects/data/iu-affiliate-cj-managed-public-v1.json" > projects/data/iu-affiliate-cj-managed-public-v1.json
      - name: Preflight R2 publish secrets (no values)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${IU_CJ_MANAGED_PUBLIC_PUBLISH_URL:-}" ]; then echo "PUBLISH_URL=CONFIGURED"; else echo "PUBLISH_URL=MISSING"; fi
          if [ -n "${IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN:-}" ]; then echo "PUBLISH_TOKEN=CONFIGURED"; else echo "PUBLISH_TOKEN=MISSING"; fi
          if [ -z "${IU_CJ_MANAGED_PUBLIC_PUBLISH_URL:-}" ] || [ -z "${IU_CJ_MANAGED_PUBLIC_PUBLISH_TOKEN:-}" ]; then
            echo "BLOCKER=INFRA_PENDING_R2_PUBLISH_SECRETS"
            echo "NO_PROD_DEPLOY=true"
            exit 1
          fi
      - name: Publish validated overlay to Worker/R2 (no git merge)
        run: node scripts/iu-cj-affiliate-catalog-sync-r2-publish-v1.mjs
      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          echo "NO_GIT_MERGE=true"
          echo "NO_MAIN_COMMIT=true"
          echo "NO_AUTO_MERGE_PR=true"
          echo "CHANNEL=cloudflare_r2_via_site_redirects"
          echo "LIVE_ARM_REQUIRES_INFRA_GO=true"

  # Phase 3Z: non-public partner registry + button preview (never arms public swap).
  phase3z-partner-registry:
    needs: fetch-staging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Phase 3Z selftest
        run: node scripts/iu-cj-affiliate-phase3z-partner-registry-v1-selftest.mjs
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: projects/data
      - name: Restore section-map + slot policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data
          for f in iu-affiliate-slot-policy-v1.json iu-affiliate-cj-section-map-v1.json; do
            if [ ! -f "projects/data/${f}" ]; then
              git show "HEAD:projects/data/${f}" > "projects/data/${f}" || true
            fi
          done
      - name: Build non-public registry (URL verify all; DISARMED)
        env:
          IU_CJ_PHASE3Z_OUT_DIR: ${{ runner.temp }}/phase3z-out
          IU_CJ_PHASE3Z_STAGING_PATH: projects/data/iu-affiliate-cj-staging-v1.json
          IU_CJ_PHASE3Z_VERIFY_URLS: "1"
          IU_CJ_PHASE3Z_VERIFY_LIMIT: "0"
          IU_CJ_PHASE3Z_VERIFY_CONCURRENCY: "3"
          IU_CJ_PHASE3Z_VERIFY_SPACING_MS: "350"
          IU_CJ_PHASE3Z_VERIFY_CHECKPOINT: ${{ runner.temp }}/phase3z-url-checkpoint.json
        run: |
          set -euo pipefail
          mkdir -p "$IU_CJ_PHASE3Z_OUT_DIR"
          node scripts/iu-cj-affiliate-phase3z-partner-registry-v1.mjs
          python3 - <<'PY'
          import json,os
          d=os.environ["IU_CJ_PHASE3Z_OUT_DIR"]
          reg=json.load(open(f"{d}/iu-affiliate-cj-partner-registry-v1.json"))
          btn=json.load(open(f"{d}/iu-affiliate-cj-partner-buttons-preview-v1.json"))
          assert reg.get("liveEnabled") is False
          assert reg.get("publicButtonSwapArmed") is False
          assert btn.get("publicButtonSwapArmed") is False
          print("PHASE3Z_DISARMED_OK", reg.get("counts"), btn.get("counts"))
          PY
      - name: Upload phase3z non-public artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iu-affiliate-cj-phase3z-registry
          path: |
            ${{ runner.temp }}/phase3z-out/iu-affiliate-cj-partner-registry-v1.json
            ${{ runner.temp }}/phase3z-out/iu-affiliate-cj-partner-buttons-preview-v1.json
            ${{ runner.temp }}/phase3z-url-checkpoint.json
          if-no-files-found: error

  # Phase 3V: offers/coupons/products from staging (+ optional shoppingProducts sample).
  # Schedule: rebuild + promote when previous public was live (KEEP_LIVE). First LIVE requires dispatch arm_offers_live=1.
  offers-live-sync:
    needs: fetch-staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IU_CJ_PAT: ${{ secrets.IU_CJ_PAT }}
      IU_CJ_PUBLISHER_CID: ${{ secrets.IU_CJ_PUBLISHER_CID }}
      IU_CJ_WEBSITE_PID: ${{ secrets.IU_CJ_WEBSITE_PID }}
      # Promote writes on schedule (KEEP_LIVE) or when dispatch arms offers.
      IU_CJ_OFFERS_PROMOTE_ARMED: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.arm_offers_live == '1' || inputs.promote_offers_public == '1'))) && '1' || '0' }}
      IU_CJ_OFFERS_LIVE_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.arm_offers_live == '1' && '1' || '0' }}
      IU_CJ_OFFERS_SAMPLE_PRODUCTS: "1"
      IU_CJ_OFFERS_PRODUCT_PARTNER_LIMIT: "80"
      IU_CJ_OFFERS_PRODUCT_LIMIT: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-staging
          path: projects/data
      - name: Restore policy/section-map/offers LKG + prefer LIVE managed-public
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data
          for f in \
            iu-affiliate-slot-policy-v1.json \
            iu-affiliate-cj-section-map-v1.json \
            iu-affiliate-cj-offers-public-v1.json
          do
            if [ ! -f "projects/data/${f}" ]; then
              git show "HEAD:projects/data/${f}" > "projects/data/${f}" || true
            fi
          done
          # Prefer R2/public LIVE partner overlay for section mapping (not stale Pages tip).
          if curl -fsSL "https://infouzel.cz/projects/data/iu-affiliate-cj-managed-public-v1.json" \
            -o projects/data/iu-affiliate-cj-managed-public-v1.json; then
            echo "MANAGED_PUBLIC_SOURCE=production_live"
          else
            echo "MANAGED_PUBLIC_SOURCE=checkout_fallback"
          fi
          python3 - <<'PY'
          import json
          mp=json.load(open("projects/data/iu-affiliate-cj-managed-public-v1.json"))
          print("MANAGED_PUBLIC_PARTNERS", len(mp.get("partners") or []))
          off=json.load(open("projects/data/iu-affiliate-cj-offers-public-v1.json"))
          print("PREV_OFFERS_LIVE", off.get("liveEnabled") is True)
          PY
      - name: Build/promote offers-public (fail-closed)
        run: node scripts/iu-cj-affiliate-offers-live-sync-v1.mjs
      - name: Upload offers artifact
        uses: actions/upload-artifact@v4
        with:
          name: iu-affiliate-cj-offers-public
          path: |
            projects/data/iu-affiliate-cj-offers-public-v1.json
            projects/data/iu-affiliate-cj-offers-public-lkg-v1.json
            projects/data/iu-affiliate-cj-offers-sync-audit-v1.json
          if-no-files-found: warn
      - name: Commit offers to sync branch (slim tip preserve)
        if: env.IU_CJ_OFFERS_PROMOTE_ARMED == '1'
        shell: bash
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          STASH="${RUNNER_TEMP}/iu-cj-offers"
          mkdir -p "${STASH}/prev" projects/data
          for name in managed-public managed-registry staging sync-audit offers-public offers-public-lkg offers-sync-audit; do
            f="projects/data/iu-affiliate-cj-${name}-v1.json"
            if [ -f "$f" ]; then cp "$f" "${STASH}/iu-affiliate-cj-${name}-v1.json"; fi
          done
          # offers file names differ slightly
          for f in iu-affiliate-cj-offers-public-v1.json iu-affiliate-cj-offers-public-lkg-v1.json iu-affiliate-cj-offers-sync-audit-v1.json; do
            if [ -f "projects/data/${f}" ]; then cp "projects/data/${f}" "${STASH}/${f}"; fi
          done
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${SYNC_BRANCH}" --depth=1 || true
          for name in managed-public managed-registry staging sync-audit; do
            git show "origin/${SYNC_BRANCH}:projects/data/iu-affiliate-cj-${name}-v1.json" \
              > "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" 2>/dev/null || true
          done
          for f in iu-affiliate-cj-offers-public-v1.json iu-affiliate-cj-offers-public-lkg-v1.json iu-affiliate-cj-offers-sync-audit-v1.json; do
            git show "origin/${SYNC_BRANCH}:projects/data/${f}" > "${STASH}/prev/${f}" 2>/dev/null || true
          done
          git checkout --orphan "iu-cj-offers-slim-$$"
          git reset --hard
          git clean -fdx
          mkdir -p projects/data
          for name in managed-public managed-registry staging sync-audit; do
            if [ -f "${STASH}/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            elif [ -f "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" ]; then
              cp "${STASH}/prev/iu-affiliate-cj-${name}-v1.json" "projects/data/iu-affiliate-cj-${name}-v1.json"
            fi
          done
          for f in iu-affiliate-cj-offers-public-v1.json iu-affiliate-cj-offers-public-lkg-v1.json iu-affiliate-cj-offers-sync-audit-v1.json; do
            if [ -f "${STASH}/${f}" ]; then cp "${STASH}/${f}" "projects/data/${f}"
            elif [ -f "${STASH}/prev/${f}" ]; then cp "${STASH}/prev/${f}" "projects/data/${f}"; fi
          done
          git add projects/data/iu-affiliate-cj-*.json
          if git diff --cached --quiet; then
            echo "NO_OFFERS_CHANGES"
            exit 0
          fi
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore(data): CJ offers-public sync (slim tip)"
          git push --force origin "HEAD:${SYNC_BRANCH}"
          echo "OFFERS_SYNC_BRANCH_UPDATED=true"

  promote-offers-public-pr:
    needs: offers-live-sync
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.arm_offers_live == '1' || inputs.promote_offers_public == '1'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch offers-public from sync branch (API, no full git history)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SYNC_BRANCH="data/cj-affiliate-catalog-sync"
          # Avoid git fetch of all refs (previous cancel during deep checkout).
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/projects/data/iu-affiliate-cj-offers-public-v1.json?ref=${SYNC_BRANCH}" \
            -H "Accept: application/vnd.github.raw" \
            > /tmp/iu-offers-public-incoming.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/iu-offers-public-incoming.json"))
          print("INCOMING_LIVE", d.get("liveEnabled") is True)
          print("INCOMING_STATS", json.dumps(d.get("stats") or {}))
          if d.get("ok") is False:
            raise SystemExit("BLOCKER=OFFERS_DOC_NOT_OK")
          if d.get("liveEnabled") is not True:
            print("NOTE=INCOMING_NOT_LIVE_YET")
          PY
      - name: Open data-only offers PR to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="data/cj-offers-public-promote-${GITHUB_RUN_ID}"
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BR}"
          mkdir -p projects/data
          cp /tmp/iu-offers-public-incoming.json projects/data/iu-affiliate-cj-offers-public-v1.json
          git add projects/data/iu-affiliate-cj-offers-public-v1.json
          if git diff --cached --quiet; then
            echo "NO_OFFERS_PUBLIC_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-offers-public-v1\.json$'; then
            echo "BLOCKER=UNEXPECTED_OFFERS_PROMOTE_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore(data): promote CJ offers-public (coupons/actions/products)"
          git push origin "HEAD:${BR}"
          BODY=$(printf '%s\n' "## Summary" "- Data-only promote of projects/data/iu-affiliate-cj-offers-public-v1.json" "- Coupons/actions/products publicationReady only" "- Required checks must pass; no admin merge" "" "## What does NOT change" "- Catalog JS, slot policy, MANUAL_PROTECTED, managed-public, secrets")
          gh pr create --base main --head "${BR}" --title "chore(data): promote CJ offers-public (coupons/actions/products)" --body "${BODY}"
          echo "OFFERS_PROMOTE_PR_OPENED=true"
