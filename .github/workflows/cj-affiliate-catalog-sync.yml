  promote-offers-public-pr:
    needs: offers-live-sync
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.arm_offers_live == '1' || inputs.promote_offers_public == '1'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # V34: prefer same-run offers artifact (avoids stale sync-branch/production fallback).
      - name: Download offers artifact from this run
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: iu-affiliate-cj-offers-public
          path: /tmp/iu-offers-artifact
      - name: Resolve offers-public incoming (artifact ? sync branch ? production LKG)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ART="/tmp/iu-offers-artifact/iu-affiliate-cj-offers-public-v1.json"
          if [ -s "$ART" ]; then
            cp "$ART" /tmp/iu-offers-public-incoming.json
            echo "INCOMING_SOURCE=run_artifact"
          else
            set +e
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/projects/data/iu-affiliate-cj-offers-public-v1.json?ref=data%2Fcj-affiliate-catalog-sync" \
              -H "Accept: application/vnd.github.raw" \
              > /tmp/iu-offers-public-incoming.json
            api_rc=$?
            set -e
            if [ "$api_rc" -eq 0 ] && [ -s /tmp/iu-offers-public-incoming.json ]; then
              echo "INCOMING_SOURCE=sync_branch_api"
            else
              echo "NOTE=SYNC_BRANCH_OFFERS_MISSING_OR_EMPTY_FALLBACK_PRODUCTION"
              curl -fsSL "https://infouzel.cz/projects/data/iu-affiliate-cj-offers-public-v1.json" \
                -o /tmp/iu-offers-public-incoming.json
              echo "INCOMING_SOURCE=production_lkg_fallback"
            fi
          fi
          python3 - <<'PY'
          import json, os
          path="/tmp/iu-offers-public-incoming.json"
          if not os.path.getsize(path):
            raise SystemExit("BLOCKER=OFFERS_INCOMING_EMPTY")
          d=json.load(open(path))
          print("INCOMING_LIVE", d.get("liveEnabled") is True)
          print("INCOMING_STATS", json.dumps(d.get("stats") or {}))
          print("INCOMING_UPDATED_AT", d.get("updatedAt"))
          fr=(d.get("stats") or {}).get("freshness") or {}
          print("INCOMING_FRESHNESS", json.dumps(fr))
          if d.get("ok") is False:
            raise SystemExit("BLOCKER=OFFERS_DOC_NOT_OK")
          if d.get("liveEnabled") is not True:
            print("NOTE=INCOMING_NOT_LIVE_YET")
          PY
      - name: Open data-only offers PR to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="data/cj-offers-public-promote-${GITHUB_RUN_ID}"
          git config user.name "iu-cj-catalog-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BR}"
          mkdir -p projects/data
          cp /tmp/iu-offers-public-incoming.json projects/data/iu-affiliate-cj-offers-public-v1.json
          git add projects/data/iu-affiliate-cj-offers-public-v1.json
          if git diff --cached --quiet; then
            echo "NO_OFFERS_PUBLIC_CHANGES"
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^projects/data/iu-affiliate-cj-offers-public-v1\.json$'; then
            echo "BLOCKER=UNEXPECTED_OFFERS_PROMOTE_PATHS"
            git diff --cached --name-only
            exit 1
          fi
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore(data): promote CJ offers-public (coupons/actions/products)"
          git push origin "HEAD:${BR}"
          BODY=$(printf '%s\n' "## Summary" "- Data-only promote of projects/data/iu-affiliate-cj-offers-public-v1.json" "- Coupons/actions/products publicationReady only" "- Required checks must pass; no admin merge" "" "## What does NOT change" "- Catalog JS, slot policy, MANUAL_PROTECTED, managed-public, secrets")
          gh pr create --base main --head "${BR}" --title "chore(data): promote CJ offers-public (coupons/actions/products)" --body "${BODY}"
          echo "OFFERS_PROMOTE_PR_OPENED=true"
