# GitHub-side fallback when Cloudflare cron is intermittent.
# Observe-only /probe first; dispatch update-chmi-cap-v2 only when prod feed is stale (not after every CHMI run).
name: CHMI CAP watchdog cron fallback

on:
  workflow_dispatch:
    inputs:
      force_probe_dispatch:
        description: "Ops only — authorized worker /probe?dispatch=1 (ignores freshness)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "3,18,33,48 * * * *"

concurrency:
  group: chmi-cap-watchdog-cron-fallback
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  WATCHDOG_PROBE_URL: "https://infouzel-chmi-cap-watchdog.josef-zmrhal.workers.dev/probe"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force probe dispatch (manual ops)
        if: github.event_name == 'workflow_dispatch' && inputs.force_probe_dispatch == true
        env:
          MANUAL_TRIGGER_SECRET: ${{ secrets.CHMI_CAP_WATCHDOG_MANUAL_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MANUAL_TRIGGER_SECRET:-}" ]; then
            echo "ERROR: CHMI_CAP_WATCHDOG_MANUAL_TRIGGER_SECRET repo secret missing"
            exit 1
          fi
          OUT="${RUNNER_TEMP}/chmi_cap_watchdog_probe.json"
          code=$(curl -sS -m 40 -o "$OUT" -w "%{http_code}" \
            -H "Authorization: Bearer ${MANUAL_TRIGGER_SECRET}" \
            "${WATCHDOG_PROBE_URL}?dispatch=1" || true)
          echo "probe_http=$code"
          head -c 4000 "$OUT" || true
          echo ""
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "WATCHDOG_PROBE_AUTH_FAILED=$code"
            exit 1
          fi
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "WATCHDOG_PROBE_UNEXPECTED_HTTP=$code"
            exit 1
          fi
          if grep -q '"ok":false' "$OUT" && grep -q 'dispatch_failed\|GitHub dispatch failed\|workflow_disabled' "$OUT"; then
            if grep -q 'workflow_disabled' "$OUT"; then
              echo "WATCHDOG_WORKFLOW_DISABLED"
              echo "CHMI_CAP_FIX=gh workflow enable update-chmi-cap-v2.yml"
            else
              echo "WATCHDOG_DISPATCH_FAILED"
            fi
            exit 1
          fi
          echo "WATCHDOG_PROBE_OK"

      - name: Stale-gated CHMI recovery (schedule + default manual)
        if: github.event_name != 'workflow_dispatch' || inputs.force_probe_dispatch != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/chmi_cap_watchdog_observe.json"
          code=$(curl -sS -m 40 -o "$OUT" -w "%{http_code}" \
            "${WATCHDOG_PROBE_URL}" || true)
          echo "observe_http=$code"
          head -c 4000 "$OUT" || true
          echo ""
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "WATCHDOG_OBSERVE_UNEXPECTED_HTTP=$code"
            exit 1
          fi
          action=$(jq -r '.decision.action // empty' "$OUT")
          reason=$(jq -r '.decision.reason // empty' "$OUT")
          echo "watchdog_decision action=${action} reason=${reason}"
          if [ "$action" = "dispatch" ] && [ "$reason" = "stale" ]; then
            gh workflow run update-chmi-cap-v2.yml --ref main -f mode=active
            echo "WATCHDOG_STALE_RECOVERY_DISPATCH=gh"
            exit 0
          fi
          if grep -q '"ok":false' "$OUT" && grep -q 'workflow_disabled' "$OUT"; then
            echo "WATCHDOG_WORKFLOW_DISABLED"
            echo "CHMI_CAP_FIX=gh workflow enable update-chmi-cap-v2.yml"
            exit 1
          fi
          echo "WATCHDOG_OBSERVE_OK"
