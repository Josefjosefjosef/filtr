# Deploy Cloudflare articles watchdog + sync GITHUB_TOKEN secret.
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN — API token with Workers Scripts Edit (+ Account read)
#   ARTICLES_WATCHDOG_GITHUB_TOKEN — PAT with Actions Read+Write on Josefjosefjosef/filtr
name: Deploy articles watchdog

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "cloudflare/articles-watchdog/**"
      - ".github/workflows/deploy-articles-watchdog.yml"

concurrency:
  group: deploy-articles-watchdog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/articles-watchdog
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/articles-watchdog/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Put GITHUB_TOKEN secret on worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARTICLES_WATCHDOG_GITHUB_TOKEN: ${{ secrets.ARTICLES_WATCHDOG_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN repo secret missing"
            exit 1
          fi
          if [ -z "${ARTICLES_WATCHDOG_GITHUB_TOKEN:-}" ]; then
            echo "ERROR: ARTICLES_WATCHDOG_GITHUB_TOKEN repo secret missing"
            exit 1
          fi
          printf '%s' "$ARTICLES_WATCHDOG_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Probe worker health
        run: |
          set -euo pipefail
          curl -fsS "https://infouzel-articles-watchdog.josef-zmrhal.workers.dev/health"
          echo ""
          curl -fsS "https://infouzel-articles-watchdog.josef-zmrhal.workers.dev/probe" | head -c 4000
          echo ""

      - name: Notify completion (beep)
        if: always()
        run: printf '\a'
