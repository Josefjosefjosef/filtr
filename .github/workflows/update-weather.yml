name: Update Weather

concurrency:
  group: data-writers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"  # každých 15 minut

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Debug script version
        run: |
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Current branch: $(git branch --show-current)"
          node -e "const fs=require('fs'); const s=fs.readFileSync('scripts/update-weather-namedays.js','utf8'); console.log(s.includes('place:') && s.includes('current:') ? 'SCRIPT=NEW' : 'SCRIPT=OLD');"

      - name: Ensure output folders
        run: |
          mkdir -p projects/data

      - name: Run updater (weather)
        env:
          OUTPUT_DIR: projects/data
        run: node scripts/update-weather-namedays.js weather

      - name: Sanity check
        run: |
          ls -la projects/data
          head -c 200 projects/data/weather.json || true
          if [ -f projects/data/weather.json ]; then
            echo "OK: projects/data/weather.json exists"
            # Verify schema
            if grep -q '"place"' projects/data/weather.json && grep -q '"current"' projects/data/weather.json; then
              echo "OK: weather.json has NEW schema (place/current)"
            elif grep -q '"tempC"' projects/data/weather.json; then
              echo "WARNING: weather.json has OLD schema (tempC/location)"
            else
              echo "WARNING: weather.json schema unclear"
            fi
          else
            echo "ERROR: weather.json missing"
            exit 1
          fi

      - name: Validate generated JSON (publish root)
        run: |
          if python3 -c "import json; json.load(open('projects/data/weather.json','r',encoding='utf-8'))"; then
            echo "OK weather"
          else
            echo "ERROR: projects/data/weather.json is not valid JSON"
            exit 1
          fi

      - name: Commit & push (safe, rebase + retry)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "[DATA] No changes to commit."
            exit 0
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "[DATA] Nothing staged after add."
            exit 0
          fi

          git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true

          BRANCH="main"
          for i in 1 2 3; do
            echo "[PUSH] Attempt $i/3"
            git fetch origin "${BRANCH}"

            git rebase "origin/${BRANCH}" || (git rebase --abort && exit 1)

            if git push origin "HEAD:${BRANCH}"; then
              echo "[PUSH] Success."
              exit 0
            fi

            echo "[PUSH] Failed, retrying..."
            sleep 2
          done

          echo "[PUSH] Failed after retries."
          exit 1
