name: Update Weather

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"  # každých 15 minut

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure output folders
        run: |
          mkdir -p projects/data

      - name: Run updater (weather)
        env:
          OUTPUT_DIR: projects/data
        run: node scripts/update-weather-namedays.js weather

      - name: Sanity check
        run: |
          ls -la projects/data
          head -c 200 projects/data/weather.json || true
          if [ -f projects/data/weather.json ]; then
            echo "OK: projects/data/weather.json exists"
          else
            echo "ERROR: weather.json missing"
            exit 1
          fi

      - name: Validate generated JSON (publish root)
        run: |
          if python3 -c "import json; json.load(open('projects/data/weather.json','r',encoding='utf-8'))"; then
            echo "OK weather"
          else
            echo "ERROR: projects/data/weather.json is not valid JSON"
            exit 1
          fi

      - name: Commit and push projects/data/weather.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add projects/data/weather.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update weather"
          git push
