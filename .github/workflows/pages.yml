name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure filtr/data exists + mirror data
        run: |
          mkdir -p filtr/data
          if [ -d "data" ]; then
            rm -rf filtr/data/*
            cp -R data/* filtr/data/ || true
          fi
          ls -la filtr/data || true

      - name: Sanity check – required files in filtr/
        run: |
          test -f filtr/index.html || (echo "❌ filtr/index.html missing" && exit 1)
          test -d filtr/assets || (echo "❌ filtr/assets missing" && exit 1)
          test -d filtr/data || (echo "❌ filtr/data missing" && exit 1)

          if [ ! -f filtr/data/articles.json ]; then
            echo "⚠️ filtr/data/articles.json not present (allowed – ignored by git)"
          else
            echo "✅ filtr/data/articles.json found"
          fi

          test -f filtr/assets/app-crash-shield.js || (echo "❌ app-crash-shield.js missing" && exit 1)
          test -f filtr/assets/app-render-optimizer.js || (echo "❌ app-render-optimizer.js missing" && exit 1)
          test -f filtr/assets/app.js || (echo "❌ app.js missing" && exit 1)
          test -f filtr/sw.js || (echo "❌ sw.js missing" && exit 1)
          test -f filtr/.nojekyll || (echo "❌ .nojekyll missing" && exit 1)

          echo "✅ Sanity check OK"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: filtr

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
