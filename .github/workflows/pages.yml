---
name: Deploy static SPA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check – required files in filtr/ (publish root)
        run: |
          echo "=== Repo root ==="
          ls -la
          echo ""

          echo "=== filtr/ ==="
          ls -la filtr || true
          echo ""

          echo "=== filtr/assets/ ==="
          ls -la filtr/assets || true
          echo ""

          echo "=== filtr/data/ ==="
          ls -la filtr/data || true
          echo ""

          test -f filtr/index.html || (echo "❌ filtr/index.html missing" && exit 1)
          test -d filtr/assets || (echo "❌ filtr/assets/ missing" && exit 1)
          test -d filtr/data || (echo "❌ filtr/data/ missing" && exit 1)
          test -f filtr/data/articles.json || (echo "❌ filtr/data/articles.json missing" && exit 1)
          test -f filtr/assets/app-crash-shield.js || (echo "❌ filtr/assets/app-crash-shield.js missing" && exit 1)
          test -f filtr/assets/app-render-optimizer.js || (echo "❌ filtr/assets/app-render-optimizer.js missing" && exit 1)
          test -f filtr/assets/app.js || (echo "❌ filtr/assets/app.js missing" && exit 1)
          test -f filtr/sw.js || (echo "❌ filtr/sw.js missing" && exit 1)
          test -f filtr/.nojekyll || (echo "❌ filtr/.nojekyll missing" && exit 1)

          echo "✅ Sanity check OK"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (filtr/ as publish root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: filtr

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
---
