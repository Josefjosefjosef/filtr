name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pages deploy telemetry (start)
        shell: bash
        run: |
          set -euo pipefail
          echo "[PAGES] deploy_job_started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[PAGES] head_sha=${{ github.sha }}"
          echo "[PAGES] triggering_event=${{ github.event_name }}"

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0
        with:
          enablement: true

      - name: Set asset version (short SHA)
        run: echo "ASSET_VER=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Path-based cache bust (copy assets to versioned filenames)
        shell: bash
        run: |
          set -euo pipefail
          echo "ASSET_VER=${ASSET_VER}"
          cp assets/app.css "assets/app.${ASSET_VER}.css"
          cp assets/app.js "assets/app.${ASSET_VER}.js"
          cp assets/iu-desktop-home-premium.css "assets/iu-desktop-home-premium.${ASSET_VER}.css"
          cp assets/iu-silver-premium-draft.css "assets/iu-silver-premium-draft.${ASSET_VER}.css"
          cp assets/iu-prehled-dne-v1.css "assets/iu-prehled-dne-v1.${ASSET_VER}.css"
          cp assets/iu-prehled-dne-ui-v1.js "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js"
          cp assets/iu-info-system-core-v1.js "assets/iu-info-system-core-v1.${ASSET_VER}.js"
          ls -la "assets/app.${ASSET_VER}.css" "assets/app.${ASSET_VER}.js" "assets/iu-desktop-home-premium.${ASSET_VER}.css" \
            "assets/iu-silver-premium-draft.${ASSET_VER}.css" \
            "assets/iu-prehled-dne-v1.${ASSET_VER}.css" "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js" "assets/iu-info-system-core-v1.${ASSET_VER}.js"

      - name: Rewrite HTML to versioned asset paths (deploy artifact only)
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="."
          # Path-based cache bust: CDN cannot serve old file when URL path changes.
          # Replace /assets/app.css?v=... and /assets/app.js?v=... with /assets/app.ASSET_VER.*
          find "$SITE_DIR" -name "*.html" -print0 | xargs -0 sed -i \
            -e "s#/assets/app\\.css?v=[A-Za-z0-9_-]*#/assets/app.${ASSET_VER}.css#g" \
            -e "s#/assets/app\\.js?v=[A-Za-z0-9_-]*#/assets/app.${ASSET_VER}.js#g" \
            -e "s#/assets/iu-desktop-home-premium\\.css?v=[A-Za-z0-9_-]*#/assets/iu-desktop-home-premium.${ASSET_VER}.css#g" \
            -e "s#/assets/iu-silver-premium-draft\\.css?v=[A-Za-z0-9._-]*#/assets/iu-silver-premium-draft.${ASSET_VER}.css#g" \
            -e "s#/assets/iu-prehled-dne-v1\\.css?v=[A-Za-z0-9._-]*#/assets/iu-prehled-dne-v1.${ASSET_VER}.css#g" \
            -e "s#/assets/iu-prehled-dne-ui-v1\\.js?v=[A-Za-z0-9._-]*#/assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js#g" \
            -e "s#<meta name=\"iu-data-ver\" content=\"iu-data-ver-placeholder\"#<meta name=\"iu-data-ver\" content=\"${ASSET_VER}\"#g"

          # ES module relative imports must resolve to the same deploy SHA core copy.
          # Prehled UI is hashed; traffic-overview (and any other importer) is still loaded unhashed
          # with ?v= — without rewriting those, the browser downloads core twice (hashed + unhashed).
          if [ -f "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js" ]; then
            sed -i \
              -e "s#\\./iu-info-system-core-v1\\.js?v=[A-Za-z0-9._-]*#./iu-info-system-core-v1.${ASSET_VER}.js#g" \
              "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js"
          fi
          while IFS= read -r -d '' f; do
            if grep -q 'iu-info-system-core-v1\.js?v=' "$f"; then
              sed -i \
                -e "s#\\./iu-info-system-core-v1\\.js?v=[A-Za-z0-9._-]*#./iu-info-system-core-v1.${ASSET_VER}.js#g" \
                "$f"
            fi
          done < <(find assets -type f -name '*.js' ! -name "iu-prehled-dne-ui-v1.${ASSET_VER}.js" -print0)
          echo "--- core import rewrite sample (traffic + hashed UI) ---"
          grep -n 'iu-info-system-core-v1' "assets/iu-traffic-overview-v1.js" "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js" | head -n 20 || true

          echo "--- app.*.css refs after rewrite (first 20) ---"
          grep -R --line-number "/assets/app\.${ASSET_VER}\.css" "$SITE_DIR" | head -n 20 || true
          echo "--- app.*.js refs after rewrite (first 20) ---"
          grep -R --line-number "/assets/app\.${ASSET_VER}\.js" "$SITE_DIR" | head -n 20 || true
          echo "--- iu-desktop-home-premium.*.css refs after rewrite (first 20) ---"
          grep -R --line-number "/assets/iu-desktop-home-premium\.${ASSET_VER}\.css" "$SITE_DIR" | head -n 20 || true

      - name: Publish app at site root + legacy /projects/ HTML redirects
        shell: bash
        run: |
          set -euo pipefail
          # Source of truth remains projects/index.html in git. Artifact serves the app at /.
          # Data/icons/version/manifest stay under /projects/* (folder names unchanged).
          node scripts/iu-pages-root-publish.mjs

      - name: Recompute CSP script hashes for deploy artifact
        shell: bash
        run: |
          set -euo pipefail
          IU_CSP_APPLY_INDEX=index.html node scripts/iu-csp-apply-script-hashes-v1.mjs

      - name: Verify CSP inline script hashes on deploy artifact
        shell: bash
        run: |
          set -euo pipefail
          IU_CSP_GUARD_INDEX=index.html node scripts/iu-csp-inline-script-guard-v1.mjs

      # SC-EXP-01: never upload the full repository checkout to Pages.
      # Canonical contract = allowlisted runtime staging directory only.
      - name: Stage allowlisted Pages production artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/iu-pages-stage-artifact-v1.mjs

      - name: Pages artifact allowlist guard (SC-EXP-01)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/iu-pages-artifact-guard-v1.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Post-deploy proof (root hub + legacy /projects/ redirect)
        # Fail the job if root leaves / or /projects/ still serves the SPA hub.
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://infouzel.cz"
          echo "Base URL: ${BASE_URL}"
          code=$(curl -sS -o /tmp/iu_root_body.html -w "%{http_code}" --max-redirs 0 "${BASE_URL}/")
          echo "root_status=$code"
          test "$code" = "200"
          curl -sSI --max-redirs 0 "${BASE_URL}/" | tee /tmp/iu_root_headers.txt | head -n 20
          if grep -Eiq 'location:.*\/projects\/' /tmp/iu_root_headers.txt; then
            echo "FAIL root Location points to /projects/"
            exit 1
          fi
          if grep -E 'location\.(replace|assign)\([^)]*/projects/' /tmp/iu_root_body.html; then
            echo "FAIL root HTML client-redirects to /projects/"
            exit 1
          fi
          grep -E 'href="/projects/(manifest|icons)' /tmp/iu_root_body.html && echo "FAIL public projects PWA href" && exit 1 || echo "OK_NO_PROJECTS_PWA_HREF"
          pcode=$(curl -sS -o /dev/null -w "%{http_code}" --max-redirs 0 "${BASE_URL}/projects/")
          ploc=$(curl -sSI --max-redirs 0 "${BASE_URL}/projects/" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2; exit}')
          echo "projects_status=$pcode location=$ploc"
          test "$pcode" = "301" -o "$pcode" = "308"
          echo "$ploc" | grep -Eq '^https://infouzel\.cz/?(\?|$)'
          curl -sS "${BASE_URL}/manifest.json" | tee /tmp/iu_manifest.json >/dev/null
          grep -E '"start_url"[[:space:]]*:[[:space:]]*"/"' /tmp/iu_manifest.json
          grep -E '"scope"[[:space:]]*:[[:space:]]*"/"' /tmp/iu_manifest.json
          echo "POST_DEPLOY_ROOT_GATE=PASS"

          # SC-EXP-01 live deny proof (Cache-Control bypass for CDN freshness).
          echo "=== SC-EXP-01 production deny proof ==="
          DENY_PATHS=(
            "/.gitignore"
            "/package.json"
            "/package-lock.json"
            "/node_modules/puppeteer/package.json"
            "/cloudflare/iu-ads/wrangler.toml"
            "/cloudflare/iu-site-redirects/wrangler.toml"
            "/cloudflare/iu-site-redirects/src/index.ts"
            "/scripts/smoke.mjs"
            "/.vscode/settings.json"
          )
          for p in "${DENY_PATHS[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -H 'Cache-Control: no-cache' --max-redirs 0 "${BASE_URL}${p}" || true)
            echo "deny_path=${p} status=${code}"
            if [ "$code" = "200" ]; then
              echo "FAIL SC-EXP-01 still public: ${p}"
              exit 1
            fi
          done
          echo "SC_EXP_01_DENY_PROOF=PASS"

          # Positive runtime smoke (minimal).
          for p in "/sw.js" "/offline.html" "/assets/iu-trusted-types-v1.js" "/projects/version.json" "/manifest.json" "/favicon.svg"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -H 'Cache-Control: no-cache' "${BASE_URL}${p}" || true)
            echo "runtime_path=${p} status=${code}"
            test "$code" = "200"
          done
          echo "SC_EXP_01_RUNTIME_PROOF=PASS"

      - name: Pages deploy telemetry (summary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          FIN_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "[PAGES] deploy_finished_utc=$FIN_UTC"
          {
            echo "## Deploy to GitHub Pages — closeout telemetry"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| run_id | ${{ github.run_id }} |"
            echo "| run_url | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| head_sha | ${{ github.sha }} |"
            echo "| page_url | ${{ steps.deployment.outputs.page_url || 'n/a' }} |"
            echo "| deploy_finished_utc | $FIN_UTC |"
            echo ""
            echo "Pair with **After-merge articles freshness** or prod curl for prod visible timestamp."
          } >> "$GITHUB_STEP_SUMMARY"
