name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pages deploy telemetry (start)
        shell: bash
        run: |
          set -euo pipefail
          echo "[PAGES] deploy_job_started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "[PAGES] head_sha=${{ github.sha }}"
          echo "[PAGES] triggering_event=${{ github.event_name }}"

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Set asset version (short SHA)
        run: echo "ASSET_VER=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Path-based cache bust (copy assets to versioned filenames)
        shell: bash
        run: |
          set -euo pipefail
          echo "ASSET_VER=${ASSET_VER}"
          cp assets/app.css "assets/app.${ASSET_VER}.css"
          cp assets/app.js "assets/app.${ASSET_VER}.js"
          cp assets/iu-desktop-home-premium.css "assets/iu-desktop-home-premium.${ASSET_VER}.css"
          cp assets/iu-silver-premium-draft.css "assets/iu-silver-premium-draft.${ASSET_VER}.css"
          cp assets/iu-prehled-dne-v1.css "assets/iu-prehled-dne-v1.${ASSET_VER}.css"
          cp assets/iu-prehled-dne-ui-v1.js "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js"
          cp assets/iu-info-system-core-v1.js "assets/iu-info-system-core-v1.${ASSET_VER}.js"
          ls -la "assets/app.${ASSET_VER}.css" "assets/app.${ASSET_VER}.js" "assets/iu-desktop-home-premium.${ASSET_VER}.css" \
            "assets/iu-silver-premium-draft.${ASSET_VER}.css" \
            "assets/iu-prehled-dne-v1.${ASSET_VER}.css" "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js" "assets/iu-info-system-core-v1.${ASSET_VER}.js"

      - name: Rewrite HTML to versioned asset paths (deploy artifact only)
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="."
          # Path-based cache bust: CDN cannot serve old file when URL path changes.
          # Replace /assets/app.css?v=... and /assets/app.js?v=... with /assets/app.ASSET_VER.*
          find "$SITE_DIR" -name "*.html" -print0 | xargs -0 sed -i \
            -e "s#/assets/app\\.css?v=[A-Za-z0-9_-]*#/assets/app.${ASSET_VER}.css#g" \
            -e "s#/assets/app\\.js?v=[A-Za-z0-9_-]*#/assets/app.${ASSET_VER}.js#g" \
            -e "s#/assets/iu-desktop-home-premium\\.css?v=[A-Za-z0-9_-]*#/assets/iu-desktop-home-premium.${ASSET_VER}.css#g" \
            -e "s#/assets/iu-silver-premium-draft\\.css?v=[A-Za-z0-9._-]*#/assets/iu-silver-premium-draft.${ASSET_VER}.css#g" \
            -e "s#/assets/iu-prehled-dne-v1\\.css?v=[A-Za-z0-9._-]*#/assets/iu-prehled-dne-v1.${ASSET_VER}.css#g" \
            -e "s#/assets/iu-prehled-dne-ui-v1\\.js?v=[A-Za-z0-9._-]*#/assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js#g" \
            -e "s#iu-data-ver-placeholder#${ASSET_VER}#g"

          # ES module relative import inside Prehled UI must resolve to the same deploy SHA copy.
          if [ -f "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js" ]; then
            sed -i \
              -e "s#\\./iu-info-system-core-v1\\.js?v=[A-Za-z0-9._-]*#./iu-info-system-core-v1.${ASSET_VER}.js#g" \
              "assets/iu-prehled-dne-ui-v1.${ASSET_VER}.js"
          fi

          echo "--- app.*.css refs after rewrite (first 20) ---"
          grep -R --line-number "/assets/app\.${ASSET_VER}\.css" "$SITE_DIR" | head -n 20 || true
          echo "--- app.*.js refs after rewrite (first 20) ---"
          grep -R --line-number "/assets/app\.${ASSET_VER}\.js" "$SITE_DIR" | head -n 20 || true
          echo "--- iu-desktop-home-premium.*.css refs after rewrite (first 20) ---"
          grep -R --line-number "/assets/iu-desktop-home-premium\.${ASSET_VER}\.css" "$SITE_DIR" | head -n 20 || true

      - name: Publish app at site root + legacy /projects/ HTML redirects
        shell: bash
        run: |
          set -euo pipefail
          # Source of truth remains projects/index.html in git. Artifact serves the app at /.
          # Data/icons/version/manifest stay under /projects/* (folder names unchanged).
          node scripts/iu-pages-root-publish.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy proof (best-effort)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Base URL: ${BASE_URL}"
          curl -sL "${BASE_URL}" | grep -oE "/assets/app\\.[a-f0-9]+\\.(css|js)" | head -n 5 || true
          # Root PWA assets (manifest/icons) must exist without /projects/.
          curl -sI "${BASE_URL}manifest.json" | head -n 5 || true
          curl -sI "${BASE_URL}icons/favicon-32.png" | head -n 5 || true
          # Legacy hub: client shim until CF Worker 301 is live (GH Pages has no native 301).
          curl -sL "${BASE_URL}projects/" | grep -oE "/assets/app\\.[a-f0-9]+\\.(css|js)" | head -n 5 || true
          curl -sL "${BASE_URL}" | grep -E 'href="/projects/(manifest|icons)' && echo "FAIL public projects PWA href" && exit 1 || echo "OK_NO_PROJECTS_PWA_HREF"

      - name: Pages deploy telemetry (summary)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          FIN_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "[PAGES] deploy_finished_utc=$FIN_UTC"
          {
            echo "## Deploy to GitHub Pages — closeout telemetry"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| run_id | ${{ github.run_id }} |"
            echo "| run_url | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo "| head_sha | ${{ github.sha }} |"
            echo "| page_url | ${{ steps.deployment.outputs.page_url || 'n/a' }} |"
            echo "| deploy_finished_utc | $FIN_UTC |"
            echo ""
            echo "Pair with **After-merge articles freshness** or prod curl for prod visible timestamp."
          } >> "$GITHUB_STEP_SUMMARY"
