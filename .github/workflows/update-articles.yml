name: Update articles data

concurrency:
  group: data-writers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync with branch
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Build articles JSON
        env:
          RETENTION_DAYS: "45"
        run: python scripts/build_articles.py

      - name: Build videos JSON (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "scripts/build_videos.py" ]; then
            python scripts/build_videos.py
            echo "OK: build_videos.py ran"
          else
            echo "SKIP: scripts/build_videos.py not found"
          fi

      - name: Normalize output paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data

          if [ ! -f projects/data/articles.json ]; then
            echo "ERROR: projects/data/articles.json missing"
            exit 1
          fi

          echo "probe-ok $(date --utc +%Y-%m-%dT%H:%M:%SZ)" > projects/data/_probe.txt

          test -s projects/data/articles.json
          if [ "$(stat -c %s projects/data/articles.json)" -eq 0 ]; then
            echo "ERROR: projects/data/articles.json is empty"
            exit 1
          fi

          if [ -f projects/data/videos.json ] && [ "$(stat -c %s projects/data/videos.json)" -eq 0 ]; then
            echo "ERROR: projects/data/videos.json is empty"
            exit 1
          fi

      - name: Detect data changes
        id: detect_changes
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain projects/data/ | grep -q .; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "[DEPLOY] data_changed=true"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "[DEPLOY] data_changed=false"
          fi

      - name: Commit & push (safe, rebase + retry)
        id: commit_push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "[DATA] No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "[DATA] Nothing staged after add."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true

          for i in 1 2 3; do
            echo "[PUSH] Attempt $i/3"
            git fetch origin "${GITHUB_REF_NAME}"

            git rebase "origin/${GITHUB_REF_NAME}" || (git rebase --abort && exit 1)

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "[PUSH] Success."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "[PUSH] Failed, retrying..."
            sleep 2
          done

          echo "[PUSH] Failed after retries."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Trigger Pages deploy (workflow_dispatch)
        if: ${{ success() && steps.detect_changes.outputs.data_changed == 'true' && steps.commit_push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[DEPLOY] dispatch_pages=RUN"
          curl -f -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
        continue-on-error: true

      - name: Deploy summary
        if: always()
        run: |
          echo "[DEPLOY] data_changed=${{ steps.detect_changes.outputs.data_changed }}"
          if [ "${{ steps.detect_changes.outputs.data_changed }}" == "true" ] && [ "${{ steps.commit_push.outputs.pushed }}" == "true" ]; then
            echo "[DEPLOY] dispatch_pages=RUN"
          else
            echo "[DEPLOY] dispatch_pages=SKIP"
          fi
