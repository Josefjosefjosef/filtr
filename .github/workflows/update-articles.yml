name: Update articles data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync with main
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Build articles JSON
        run: python scripts/build_articles.py

      - name: Normalize output paths (ensure publish root)
        shell: bash
        run: |
          set -e
          echo "PWD=$(pwd)"
          echo "List possible outputs:"
          ls -la
          echo "Find generated articles.json/videos.json:"
          find . -maxdepth 6 -type f \( -name "articles.json" -o -name "videos.json" \) -print

          # Preferovaný publish root:
          mkdir -p filtr/data

          # Pokud generátor vytvořil filtr/filtr/data/*, přenes to do filtr/data/*
          if [ -f "filtr/filtr/data/articles.json" ]; then
            cp -f "filtr/filtr/data/articles.json" "filtr/data/articles.json"
          fi
          if [ -f "filtr/filtr/data/videos.json" ]; then
            cp -f "filtr/filtr/data/videos.json" "filtr/data/videos.json"
          fi

          # Pokud generátor vytvořil filtr/data/*, nech to být, ale ujisti se že existuje
          if [ -f "filtr/data/articles.json" ]; then
            echo "OK: filtr/data/articles.json exists"
          else
            echo "ERROR: filtr/data/articles.json missing after normalize"
            exit 1
          fi
          if [ -f "filtr/data/videos.json" ]; then
            echo "OK: filtr/data/videos.json exists"
          else
            echo "WARN: filtr/data/videos.json missing (not fatal if videos optional)"
          fi

      - name: Debug generated output (generatedAt + basic stats)
        run: |
          echo "=== ls -la filtr/data ==="
          ls -la filtr/data || true

          echo "=== generatedAt from filtr/data/articles.json ==="
          if [ -f filtr/data/articles.json ]; then
            python -c "import json; d=json.load(open('filtr/data/articles.json','r',encoding='utf-8')); print(d.get('generatedAt',''))"
          else
            echo "MISSING: filtr/data/articles.json"
          fi

          echo "=== head of filtr/data/articles.json ==="
          if [ -f filtr/data/articles.json ]; then
            head -n 20 filtr/data/articles.json || true
          else
            echo "MISSING: filtr/data/articles.json"
          fi

          echo "=== generatedAt from filtr/data/videos.json ==="
          if [ -f filtr/data/videos.json ]; then
            python -c "import json; d=json.load(open('filtr/data/videos.json','r',encoding='utf-8')); print(d.get('generatedAt',''))"
          else
            echo "MISSING: filtr/data/videos.json"
          fi

          echo "=== head of filtr/data/videos.json ==="
          if [ -f filtr/data/videos.json ]; then
            head -n 50 filtr/data/videos.json || true
          else
            echo "MISSING: filtr/data/videos.json"
          fi

      - name: Commit and push if changed
        run: |
          set -e

          echo "=== Debug: ignored files (for visibility) ==="
          git status --ignored || true

          echo "=== Configure git identity ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Stage ONLY versioned files, EXCLUDING generated/ignored data ==="
          # Přidá vše sledované i nové, ale VYLOUČÍ generovaná data v data/ a filtr/data/
          git add -A -- ':!data/**' ':!filtr/data/**' ':!**/articles.json' || true

          echo "=== Show staged diff (if any) ==="
          git diff --cached --name-status || true

          echo "=== Guard: no staged changes => exit OK ==="
          git diff --cached --quiet && echo "Nothing to commit (OK)" && exit 0

          echo "=== Commit & push ==="
          git commit -m "Update pipeline (no generated data committed)"
          git push origin HEAD:main
