name: Update articles data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync with main
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Build articles JSON
        run: python scripts/build_articles.py

      - name: Build videos JSON (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "scripts/build_videos.py" ]; then
            python scripts/build_videos.py
            echo "OK: build_videos.py ran"
          else
            echo "SKIP: scripts/build_videos.py not found"
          fi

      - name: Normalize output paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data

          if [ ! -f projects/data/articles.json ]; then
            echo "ERROR: projects/data/articles.json missing"
            exit 1
          fi

          echo "probe-ok $(date --utc +%Y-%m-%dT%H:%M:%SZ)" > projects/data/_probe.txt

          test -s projects/data/articles.json
          if [ "$(stat -c %s projects/data/articles.json)" -eq 0 ]; then
            echo "ERROR: projects/data/articles.json is empty"
            exit 1
          fi

          if [ -f projects/data/videos.json ] && [ "$(stat -c %s projects/data/videos.json)" -eq 0 ]; then
            echo "ERROR: projects/data/videos.json is empty"
            exit 1
          fi

      - name: Commit & push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add projects/data

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "data: update articles"
          git push origin main
