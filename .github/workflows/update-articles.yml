name: Update articles data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync with main
        run: |
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Build articles JSON
        run: python scripts/build_articles.py

      - name: Normalize output paths (ensure publish root)
        shell: bash
        run: |
          set -euo pipefail
          echo "PWD=$(pwd)"
          pwd
          ls -la
          mkdir -p projects/data

          echo "=== find generated json candidates ==="
          find . -maxdepth 6 -type f \( -name "articles.json" -o -name "videos.json" \) -print || true

          copy_if_needed () {
            local src="$1"
            local dst="$2"

            if [ ! -s "$src" ]; then
              echo "[skip] missing/empty: $src"
              return 0
            fi

            local rsrc rdst
            rsrc="$(python -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$src")"

            rdst="$(python -c 'import os, sys; print(os.path.realpath(sys.argv[1]))' "$dst")"

            if [ "$rsrc" = "$rdst" ]; then
              echo "[skip] same file: $src -> $dst"
              return 0
            fi

            echo "[copy] $src -> $dst"
            cp -f "$src" "$dst"
          }

          copy_if_needed "filtr/data/articles.json"       "projects/data/articles.json"
          copy_if_needed "filtr/filtr/data/articles.json" "projects/data/articles.json"
          copy_if_needed "filtr/filtr/filtr/data/articles.json" "projects/data/articles.json"
          copy_if_needed "data/articles.json"             "projects/data/articles.json"

          copy_if_needed "filtr/data/videos.json"         "projects/data/videos.json"
          copy_if_needed "filtr/filtr/data/videos.json"   "projects/data/videos.json"
          copy_if_needed "filtr/filtr/filtr/data/videos.json"   "projects/data/videos.json"
          copy_if_needed "data/videos.json"               "projects/data/videos.json"

          if [ -f "projects/data/articles.json" ]; then
            echo "OK: projects/data/articles.json exists"
          else
            echo "ERROR: projects/data/articles.json missing"
            exit 1
          fi

          if [ -f "projects/data/videos.json" ]; then
            echo "OK: projects/data/videos.json exists"
          else
            echo "WARN: projects/data/videos.json missing (may be empty video feed)"
          fi

          echo "=== Writing publish probe ==="
          echo "probe-ok $(date --utc +%Y-%m-%dT%H:%M:%SZ)" > projects/data/_probe.txt

          echo "[proof] projects/data:"
          ls -la projects/data || true
          wc -c projects/data/articles.json 2>/dev/null || true
          wc -c projects/data/videos.json 2>/dev/null || true
          head -c 120 projects/data/articles.json || true
          echo
          if [ -f projects/data/videos.json ]; then
            head -c 120 projects/data/videos.json || true
            echo
          fi

          test -s projects/data/articles.json
          if [ -f projects/data/videos.json ]; then
            test -s projects/data/videos.json || echo "WARN: projects/data/videos.json exists but is empty"
          fi

      - name: Debug generated output (generatedAt + basic stats)
        run: |
          echo "=== ls -la projects/data ==="
          ls -la projects/data || true

          echo "=== generatedAt from projects/data/articles.json ==="
          if [ -f projects/data/articles.json ]; then
            python -c "import json; d=json.load(open('projects/data/articles.json','r',encoding='utf-8')); print(d.get('generatedAt',''))"
          else
            echo "MISSING: projects/data/articles.json"
          fi

          echo "=== head of projects/data/articles.json ==="
          if [ -f projects/data/articles.json ]; then
            head -n 20 projects/data/articles.json || true
          else
            echo "MISSING: projects/data/articles.json"
          fi

          echo "=== generatedAt from projects/data/videos.json ==="
          if [ -f projects/data/videos.json ]; then
            python -c "import json; d=json.load(open('projects/data/videos.json','r',encoding='utf-8')); print(d.get('generatedAt',''))"
          else
            echo "MISSING: projects/data/videos.json"
          fi

          echo "=== head of projects/data/videos.json ==="
          if [ -f projects/data/videos.json ]; then
            head -n 50 projects/data/videos.json || true
          else
            echo "MISSING: projects/data/videos.json"
          fi

      - name: PROOF: articles.json exists + generatedAt + count
        shell: bash
        run: |
          set -euo pipefail
          echo "=== LIST projects/data ==="
          ls -la projects/data || true

          echo "=== STAT articles.json ==="
          test -f projects/data/articles.json || { echo "ERROR: projects/data/articles.json missing"; exit 1; }
          wc -c projects/data/articles.json
          sha256sum projects/data/articles.json | head -n 1

          echo "=== generatedAt ==="
          python - <<'PY'
import json, datetime

p = "projects/data/articles.json"
with open(p, "r", encoding="utf-8") as f:
    data = json.load(f)

gen = data.get("generatedAt")
arts = data.get("articles", [])
print("generatedAt:", gen)
print("articles_count:", len(arts))
if arts:
    print("first_publishedAt:", arts[0].get("publishedAt"))
    print("first_title:", arts[0].get("title"))
PY

      - name: PROOF: git status
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1
          git diff --name-only

      - name: PROOF: git status
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1
          git status

      - name: Commit & push (projects data)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A projects/data/articles.json projects/data/videos.json projects/data/_probe.txt

          if git diff --cached --quiet; then
            echo "Nothing to commit (projects/data unchanged)."
            exit 0
          fi

          git status --short
          git commit -m "data: update articles"
          git push origin HEAD:main
