# Minimal schedule-only wrapper: dispatches the full "Update articles data" pipeline via
# workflow_dispatch every 5 minutes. Cadence lives here so GitHub's cron reliably fires on a
# tiny workflow (forensics: native `schedule` on update-articles.yml stopped enqueueing runs
# while other scheduled workflows in this repo continued; dispatch remains the supported path).
#
# The heavy workflow (.github/workflows/update-articles.yml) keeps only `workflow_dispatch`
# so we never double-run if GitHub ever resumes the old schedule path.

name: Update articles data schedule dispatch

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: update-articles-schedule-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Update articles data (workflow_dispatch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run update-articles.yml --repo "${{ github.repository }}" --ref main
