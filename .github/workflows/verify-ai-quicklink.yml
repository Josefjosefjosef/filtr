# Production proof: AI quicklink no URL change, CLS=0. Tooling only.
name: Verify AI quicklink (no URL)

permissions:
  contents: read


on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install chromium

      - name: Run verify (production)
        run: node tools/verify_ai_quicklink_no_url.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ai-quicklink-verify-screenshots
          path: artifacts/ai-quicklink-verify/
          if-no-files-found: ignore
