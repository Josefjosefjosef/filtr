# Ads post-migration production verification (CORS/CSP/iCentrum/DOM/legacy).
name: IU Ads Post-Migration Prod Verify

permissions:
  contents: read


on:
  workflow_dispatch:

concurrency:
  group: iu-ads-post-migration-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install root deps (playwright for DOM)
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Post-migration verify
        run: node scripts/iu-ads-post-migration-prod-verify.mjs
        env:
          ADS_BASE_URL: "https://ads.infouzel.cz"
          SITE_BASE_URL: "https://infouzel.cz"
