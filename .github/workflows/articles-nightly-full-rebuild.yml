# Nightly full registry rebuild (recovery / maintenance — not default autorun path).
name: Articles nightly full rebuild

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: articles-nightly-full-rebuild
  cancel-in-progress: false

jobs:
  full_rebuild_ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RETENTION_DAYS: "45"
      IU_FULL_REBUILD: "1"
      IU_ARTICLE_PIPELINE_PHASE: ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            projects/data/info_events/cutover_state.json
          sparse-checkout-cone-mode: false

      - name: Skip when commercial aggregation cut over
        id: cutover
        run: |
          set -euo pipefail
          if [ -f projects/data/info_events/cutover_state.json ]; then
            COMMERCIAL=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('projects/data/info_events/cutover_state.json','utf8'));process.stdout.write(j.commercialAggregationActive===false?'0':'1')")
            if [ "$COMMERCIAL" = "0" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "[nightly] SKIPPED_INFO_SYSTEM_CUTOVER"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cutover.outputs.skip != 'true'
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.cutover.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.cutover.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Full rebuild ingest (all registry feeds)
        if: steps.cutover.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python scripts/source_rotation_inventory.py
          python scripts/build_articles.py
          test -f projects/data/staging/ingest_manifest.json

      - name: Proof
        if: steps.cutover.outputs.skip != 'true'
        run: |
          echo "FULL_REBUILD_MODE=IU_FULL_REBUILD"
          echo "EXPECTED_RUNTIME_MINUTES=30-90"
          echo "FREQUENCY=daily_02_00_UTC"
