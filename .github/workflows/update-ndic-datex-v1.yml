name: Update NDIC DATEX v1

# Kill switch: IU_NDIC_DATEX_V1_MODE=off|shadow|active (default off).
# Secrets (never echo): IU_NDIC_PULL_URL, IU_NDIC_PULL_USER, IU_NDIC_PULL_PASS,
#   IU_NDIC_TMC_PULL_URL (+ optional TMC user/pass falling back to DATEX),
#   optional IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID (ops only).
# Phase-2 note: periodic schedule is intentionally disabled until explicit ops approval.
# Controlled real shadow diagnostics use workflow "NDIC DATEX v1 shadow probe"
# on the dedicated Czech runner labels (self-hosted+Linux+X64+ndic-cz-egress).
#
# This publish-capable workflow MUST stay on ubuntu-latest in this phase
# (must NOT use self-hosted / ndic-cz-egress) until a separate hardened
# active-publish contract is approved. Default mode remains off.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | shadow | active (active publishes; use with extreme care)"
        required: true
        type: choice
        options:
          - off
          - shadow
          - active
        default: off

concurrency:
  group: info-events-data-writers
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

env:
  AUTOMATION_BRANCH: automation/update-ndic-datex-v1
  PR_TITLE: "chore(data): refresh NDIC DATEX v1 snapshot"

jobs:
  sync:
    # Intentionally GitHub-hosted — do not retarget to ndic-cz-egress here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: NDIC DATEX v1 guard (fixtures)
        run: npm run iu-ndic-datex-v1-guard

      - name: NDIC exposure guard
        run: npm run iu-ndic-datex-v1-exposure-guard

      - name: Resolve mode (fail-closed)
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          mode="$(printf '%s' "${INPUT_MODE:-off}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$mode" in
            off|shadow|active) ;;
            *) echo "INVALID_MODE"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "RESOLVED_MODE=$mode"

      - name: Sync NDIC DATEX v1
        id: sync
        env:
          IU_NDIC_DATEX_V1_MODE: ${{ steps.mode.outputs.mode }}
          IU_NDIC_PULL_URL: ${{ secrets.IU_NDIC_PULL_URL }}
          IU_NDIC_PULL_USER: ${{ secrets.IU_NDIC_PULL_USER }}
          IU_NDIC_PULL_PASS: ${{ secrets.IU_NDIC_PULL_PASS }}
          IU_NDIC_TMC_PULL_URL: ${{ secrets.IU_NDIC_TMC_PULL_URL }}
          IU_NDIC_TMC_PULL_USER: ${{ secrets.IU_NDIC_TMC_PULL_USER }}
          IU_NDIC_TMC_PULL_PASS: ${{ secrets.IU_NDIC_TMC_PULL_PASS }}
          IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID: ${{ secrets.IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID }}
          IU_NDIC_TMC_STORE_PATH: ${{ runner.temp }}/ndic-tmc-store.json
          IU_NDIC_SHADOW_ISOLATED: ${{ steps.mode.outputs.mode == 'shadow' && '1' || '0' }}
        run: |
          set -euo pipefail
          node scripts/ndic-datex-v1-prod-sync.mjs | tee "$RUNNER_TEMP/ndic-sync-out.json"
          # Never print secrets; only structured result keys already redacted by script.

      - name: Commit data if changed (active publish only)
        id: commit_push
        if: steps.mode.outputs.mode == 'active'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never add full TMC store / raw caches / shadow dumps
          git add projects/data/info_events/feed.json \
                  projects/data/info_events/lanes/doprava.json \
                  projects/data/info_events/monitoring.json \
                  projects/data/info_events/ndic_datex_v1/sync_state.json \
                  projects/data/info_events/ndic_datex_v1/diagnostics.json \
                  projects/data/info_events/ndic_datex_v1/tmc_meta.json \
                  2>/dev/null || true
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          git checkout -B "$BRANCH"
          git commit -m "${{ env.PR_TITLE }}"
          git push -u origin "$BRANCH" --force
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh data PR
        if: steps.mode.outputs.mode == 'active' && steps.commit_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR exists"
          else
            gh pr create --base main --head "$BRANCH" --title "${{ env.PR_TITLE }}" --body "Automated NDIC DATEX v1 data refresh."
          fi
