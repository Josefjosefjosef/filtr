name: Update NDIC DATEX v1

# Kill switch: IU_NDIC_DATEX_V1_MODE=off|shadow|active (default off).
# Real NDIC network access is FORBIDDEN on GitHub-hosted runners.
#
# TARGET_OPERATION_MODE=AUTOMATIC_SCHEDULED_NDIC_SYNC_WITH_CONTINUOUS_SELF_HOSTED_RUNNER
#
# SCHEDULED PATH (fail-closed, DISARMED by default):
#   1) schedule-gate (ubuntu-latest, no secrets, no NDIC network)
#      -> requires repository variable NDIC_AUTOMATION_ENABLED == 'true'
#      -> skips with success when disarmed or another run of this workflow is in progress
#   2) scheduled-preflight (ubuntu-latest, no secrets, no NDIC network)
#      -> runs the same offline suite as the standalone "NDIC staging preflight"
#      -> publishes the HEAD-bound short-lived attestation for github.sha in this run
#   3) ndic-prep on self-hosted+Linux+X64+ndic-cz-egress
#      -> verifies the attestation for the exact github.sha BEFORE NDIC secrets
#
# MANUAL BREAK-GLASS (unchanged): workflow_dispatch with mode off|shadow|active and an
# optional attestation id published by the standalone "NDIC staging preflight" workflow.
#
# NARROW SHARED WRITER LOCK (active only):
# - Network/parse/build candidate on VPS WITHOUT info-events-data-writers.
# - Critical RMW/commit on the same Czech self-hosted runner UNDER info-events-data-writers
#   with live re-read (NO ubuntu-latest / GitHub-hosted shared write).
# - Data PR is immediate after commit (no Pages/required-check waits inside the lock).

on:
  schedule:
    # Conservative staggered 15-minute cadence. No authoritative NDIC minimum
    # poll interval is documented, so stay well above any plausible rate limit.
    # schedule-reregister: 2026-08-10T09:25Z — tip-equality reconcile (#9541) on main;
    # GitHub stopped emitting NDIC event=schedule after consecutive failures while
    # other repo schedules still fire. Comment-only rebind (do NOT disable/enable).
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "off | shadow | active (active publishes; use with extreme care)"
        required: true
        type: choice
        options:
          - off
          - shadow
          - active
        default: off
      preflight_attestation_id:
        description: "Optional exact preflight attestation id (aid=...); empty accepts newest valid for HEAD"
        required: false
        type: string
        default: ""

# Intentionally NO workflow-level info-events-data-writers.
# Intentionally NO workflow-level concurrency at all: a whole-run lock would queue the
# schedule gate and defeat its early duplicate skip. Duplicate suppression is the
# schedule-gate inflight probe plus ndic-datex-v1-internal-staging on the single NDIC
# network job. Prep uses the staging group; active shared-write uses the writer group.

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

env:
  AUTOMATION_BRANCH: automation/update-ndic-datex-v1
  PR_TITLE: "chore(data): refresh NDIC DATEX v1 snapshot"

jobs:
  schedule-gate:
    if: >
      github.event_name == 'schedule'
      && github.repository == 'Josefjosefjosef/filtr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      armed: ${{ steps.gate.outputs.armed }}
      proceed: ${{ steps.gate.outputs.proceed }}
      skip_reason: ${{ steps.gate.outputs.skip_reason }}
      resolved_mode: ${{ steps.gate.outputs.resolved_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Arming variable is absent by default => scheduled automation stays disabled.
      # Any evaluation error skips with success (fail-closed: no NDIC network).
      - name: Evaluate arming variable and duplicate inflight guard
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IU_NDIC_AUTOMATION_ENABLED: ${{ vars.NDIC_AUTOMATION_ENABLED }}
          IU_NDIC_SCHEDULE_EVENT_NAME: ${{ github.event_name }}
          IU_NDIC_SCHEDULE_WORKFLOW_FILE: update-ndic-datex-v1.yml
          IU_NDIC_SCHEDULE_SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/ndic-schedule-arming.mjs

  scheduled-preflight:
    needs: schedule-gate
    if: >
      github.event_name == 'schedule'
      && needs.schedule-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      attestation_id: ${{ steps.publish.outputs.PREFLIGHT_ATTESTATION_ID }}
      head_sha: ${{ steps.publish.outputs.PREFLIGHT_HEAD_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Architecture fixtures (two-phase)
        run: npm run iu-ndic-staging-preflight-architecture-fixtures

      - name: Attestation fixtures
        run: npm run iu-ndic-staging-preflight-attestation-fixtures

      - name: Architecture meta fixtures
        run: npm run iu-ndic-staging-preflight-architecture-meta-fixtures

      - name: Automatic schedule fixtures
        run: npm run iu-ndic-automatic-schedule-fixtures

      - name: Automatic schedule meta fixtures
        run: npm run iu-ndic-automatic-schedule-meta-fixtures

      - name: Runner disk cleanup fixtures
        run: npm run iu-ndic-runner-disk-cleanup-fixtures

      - name: Concurrency fixtures
        run: |
          set -euo pipefail
          npm run iu-ndic-datex-v1-concurrency-fixtures
          npm run iu-ndic-datex-v1-concurrency-meta-fixtures

      - name: Product offline guards (required when scripts exist on ref)
        run: |
          set -euo pipefail
          node scripts/ndic-staging-preflight-suite.mjs

      - name: Publish HEAD-bound preflight attestation
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IU_NDIC_PREFLIGHT_EXPECTED_HEAD: ${{ github.sha }}
          # 7200s covers self-hosted queue wait when runner briefly offline
          # (incident schedule 31344963532: TTL 1800 expired after ~42m queue).
          IU_NDIC_PREFLIGHT_TTL_SECONDS: "7200"
        run: |
          set -euo pipefail
          node scripts/ndic-publish-preflight-attestation.mjs

  ndic-prep:
    needs:
      - schedule-gate
      - scheduled-preflight
    # !cancelled() (never always()) so the manual dispatch path still runs while the
    # scheduled gate/preflight jobs are skipped, without bypassing their failures.
    if: >
      !cancelled()
      && github.repository == 'Josefjosefjosef/filtr'
      && (
      (github.event_name == 'workflow_dispatch'
      && (github.event.inputs.mode == 'shadow' || github.event.inputs.mode == 'active'))
      || (github.event_name == 'schedule'
      && needs.schedule-gate.result == 'success'
      && needs.schedule-gate.outputs.proceed == 'true'
      && needs.scheduled-preflight.result == 'success')
      )
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ndic-cz-egress
    timeout-minutes: 20
    concurrency:
      group: ndic-datex-v1-internal-staging
      cancel-in-progress: false
    env:
      # Scheduled runs are ACTIVE after an armed inline preflight PASS.
      NDIC_RESOLVED_MODE: ${{ github.event_name == 'schedule' && 'active' || github.event.inputs.mode }}
    outputs:
      candidate_ready: ${{ steps.pack.outputs.candidate_ready }}
      sync_ok: ${{ steps.sync.outputs.sync_ok }}
      resolved_mode: ${{ steps.mode.outputs.resolved_mode }}
    steps:
      # MUST stay first: no checkout, no secrets, no network before identity PASS.
      - name: Preflight runner identity (fail-closed)
        run: |
          set -euo pipefail
          EXPECTED_NAME="infouzel-ndic-cz-vps4204"
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "REFUSING_GITHUB_HOSTED"
            exit 1
          fi
          if [ "${RUNNER_NAME:-}" != "${EXPECTED_NAME}" ]; then
            echo "REFUSING_UNEXPECTED_RUNNER_NAME"
            exit 1
          fi
          if [ "${RUNNER_OS:-}" != "Linux" ]; then
            echo "REFUSING_UNEXPECTED_OS"
            exit 1
          fi
          if [ "${RUNNER_ARCH:-}" != "X64" ]; then
            echo "REFUSING_UNEXPECTED_ARCH"
            exit 1
          fi
          ws="${GITHUB_WORKSPACE:-}"
          cwd="$(pwd)"
          case "${ws}" in
            /home/runner|/home/runner/*)
              echo "REFUSING_GITHUB_HOSTED_PATH"
              exit 1
              ;;
          esac
          case "${cwd}" in
            /home/runner|/home/runner/*)
              echo "REFUSING_GITHUB_HOSTED_PATH"
              exit 1
              ;;
          esac
          if [ "$(id -u)" -eq 0 ]; then
            echo "REFUSING_ROOT_RUNNER"
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1; then
            if sudo -n true >/dev/null 2>&1; then
              echo "REFUSING_PASSWORDLESS_SUDO"
              exit 1
            fi
          fi
          umask 077
          avail_kb="$(df -Pk . | awk 'NR==2 {print $4}')"
          if [ -z "${avail_kb}" ] || [ "${avail_kb}" -lt 2097152 ]; then
            echo "REFUSING_LOW_DISK"
            exit 1
          fi
          echo "RUNNER_PREFLIGHT_OK"
          echo "RUNNER_NAME_OK=1"
          echo "RUNNER_ENVIRONMENT=self-hosted"
          echo "DISK_AVAIL_KB=${avail_kb}"

      - name: Resolve NDIC mode (dispatch input or scheduled active)
        id: mode
        run: |
          set -euo pipefail
          case "${NDIC_RESOLVED_MODE:-}" in
            shadow|active) ;;
            *)
              echo "REFUSING_UNKNOWN_MODE"
              exit 1
              ;;
          esac
          echo "resolved_mode=${NDIC_RESOLVED_MODE}" >> "$GITHUB_OUTPUT"
          echo "NDIC_RESOLVED_MODE=${NDIC_RESOLVED_MODE}"
          echo "NDIC_TRIGGER_EVENT=${{ github.event_name }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify staging preflight attestation (fail-closed, before NDIC secrets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IU_NDIC_PREFLIGHT_EXPECTED_HEAD: ${{ github.sha }}
          IU_NDIC_PREFLIGHT_ATTESTATION_ID: ${{ github.event_name == 'schedule' && needs.scheduled-preflight.outputs.attestation_id || github.event.inputs.preflight_attestation_id }}
        run: |
          set -euo pipefail
          node scripts/ndic-verify-preflight-attestation.mjs

      - name: Sync NDIC DATEX v1 (prep sandbox; no shared writer lock)
        id: sync
        env:
          IU_NDIC_DATEX_V1_MODE: ${{ env.NDIC_RESOLVED_MODE }}
          IU_NDIC_PULL_URL: ${{ secrets.IU_NDIC_PULL_URL }}
          IU_NDIC_PULL_USER: ${{ secrets.IU_NDIC_PULL_USER }}
          IU_NDIC_PULL_PASS: ${{ secrets.IU_NDIC_PULL_PASS }}
          IU_NDIC_TMC_PULL_URL: ${{ secrets.IU_NDIC_TMC_PULL_URL }}
          IU_NDIC_TMC_PULL_USER: ${{ secrets.IU_NDIC_TMC_PULL_USER }}
          IU_NDIC_TMC_PULL_PASS: ${{ secrets.IU_NDIC_TMC_PULL_PASS }}
          IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID: ${{ secrets.IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID }}
          IU_NDIC_TMC_STORE_PATH: ${{ runner.temp }}/ndic-tmc-store.json
          IU_NDIC_SHADOW_ISOLATED: ${{ env.NDIC_RESOLVED_MODE == 'shadow' && '1' || '0' }}
          IU_NDIC_FORENSIC_DIR: ${{ runner.temp }}/ndic-shadow-forensic
          IU_NDIC_FORENSIC_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${NDIC_RESOLVED_MODE}" = "active" ]; then
            CAND="${RUNNER_TEMP}/ndic-ie-candidate"
            rm -rf "$CAND"
            mkdir -p "$CAND"
            cp -a projects/data/info_events/. "$CAND/"
            export IU_INFO_EVENTS_DATA_DIR="$CAND"
          fi
          set +e
          node scripts/ndic-datex-v1-prod-sync.mjs | tee "$RUNNER_TEMP/ndic-sync-out.json"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "sync_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync_ok=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      - name: Upload redacted shadow forensic artifacts
        if: ${{ always() && github.event.inputs.mode == 'shadow' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ndic-shadow-forensic-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ndic-shadow-forensic/ndic-shadow-forensic-summary.json
            ${{ runner.temp }}/ndic-shadow-forensic/ndic-shadow-card-preview.json
            ${{ runner.temp }}/ndic-shadow-forensic/ndic-shadow-validation-report.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Pack active candidate
        id: pack
        if: env.NDIC_RESOLVED_MODE == 'active' && steps.sync.outputs.sync_ok == 'true'
        run: |
          set -euo pipefail
          test -d "${RUNNER_TEMP}/ndic-ie-candidate"
          # REQUIRED snapshot must be inside candidate before upload (ACTIVE 31257122613).
          node scripts/ndic-assert-candidate-required-outputs.mjs "${RUNNER_TEMP}/ndic-ie-candidate"
          node scripts/ndic-write-candidate-producer-binding.mjs "${RUNNER_TEMP}/ndic-ie-candidate"
          echo "candidate_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload NDIC candidate
        if: env.NDIC_RESOLVED_MODE == 'active' && steps.pack.outputs.candidate_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ndic-ie-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/ndic-ie-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Bounded NDIC disk cleanup (prep post)
        if: always()
        env:
          IU_NDIC_CLEANUP_RUN_ID: ${{ github.run_id }}
          IU_NDIC_CLEANUP_ORPHAN_AGE_SECONDS: "7200"
          IU_NDIC_CLEANUP_WIPE_RUNNER_TEMP_NDIC: "1"
        run: |
          set -euo pipefail
          df -B1 --output=avail / | tail -n1 | awk '{print "DISK_AVAILABLE_BYTES="$1}'
          node scripts/ndic-runner-disk-cleanup.mjs
          df -B1 --output=avail / | tail -n1 | awk '{print "DISK_AVAILABLE_AFTER_CLEANUP_BYTES="$1}'

  ndic-shared-write:
    needs: ndic-prep
    # Variant A (after ACTIVE canaries 31311789781 / 31313465533):
    # Job eligibility uses only GitHub-native result/event gates.
    # Do NOT gate on needs.ndic-prep.outputs.* — those outputs were not a reliable
    # eligibility signal after skipped schedule jobs in the needs graph.
    # Candidate existence/validity is fail-closed AFTER artifact download (step-level).
    if: >
      !cancelled()
      && needs.ndic-prep.result == 'success'
      && (
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'active')
      || (github.event_name == 'schedule')
      )
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ndic-cz-egress
    timeout-minutes: 15
    concurrency:
      group: info-events-data-writers
      cancel-in-progress: false
      # FIFO queue (up to 100). Default single-pending slot cancels a waiting writer when
      # another request arrives (incident ACTIVE run 31250620970 / NDIC shared-write).
      queue: max
    outputs:
      pushed: ${{ steps.commit_push.outputs.pushed }}
      refresh_count: ${{ steps.reconcile.outputs.refresh_count }}
    steps:
      # MUST stay first: no checkout before identity PASS (fail-closed on GitHub-hosted).
      - name: Preflight runner identity (fail-closed)
        run: |
          set -euo pipefail
          EXPECTED_NAME="infouzel-ndic-cz-vps4204"
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "REFUSING_GITHUB_HOSTED"
            exit 1
          fi
          if [ "${RUNNER_NAME:-}" != "${EXPECTED_NAME}" ]; then
            echo "REFUSING_UNEXPECTED_RUNNER_NAME"
            exit 1
          fi
          if [ "${RUNNER_OS:-}" != "Linux" ]; then
            echo "REFUSING_UNEXPECTED_OS"
            exit 1
          fi
          if [ "${RUNNER_ARCH:-}" != "X64" ]; then
            echo "REFUSING_UNEXPECTED_ARCH"
            exit 1
          fi
          ws="${GITHUB_WORKSPACE:-}"
          cwd="$(pwd)"
          case "${ws}" in
            /home/runner|/home/runner/*)
              echo "REFUSING_GITHUB_HOSTED_PATH"
              exit 1
              ;;
          esac
          case "${cwd}" in
            /home/runner|/home/runner/*)
              echo "REFUSING_GITHUB_HOSTED_PATH"
              exit 1
              ;;
          esac
          if [ "$(id -u)" -eq 0 ]; then
            echo "REFUSING_ROOT_RUNNER"
            exit 1
          fi
          umask 077
          echo "RUNNER_PREFLIGHT_OK"
          echo "NDIC_SHARED_WRITE_JOB_ON_GITHUB_HOSTED=NO"

      # Recover from ENOSPC (incident schedule run 31338815059: full-history reconcile clone).
      # Only wipe this job's prior checkout dirs + runner temp — never whole-disk /home.
      - name: Reclaim workspace disk before checkout
        run: |
          set -euo pipefail
          echo "DISK_BEFORE_BYTES=$(df -B1 --output=avail / | tail -n1)"
          df -h / || true
          # Explicit existence checks — never `cmd 2>/dev/null || true` (ACTIVE staging guard).
          if [ -e ndic-orch ]; then rm -rf ndic-orch; fi
          if [ -e ndic-main-data ]; then rm -rf ndic-main-data; fi
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "${RUNNER_TEMP}" ]; then
            find "${RUNNER_TEMP}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi
          # Age-gated orphan Git temporary packs left by interrupted clones (ENOSPC root cause).
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
            find "${GITHUB_WORKSPACE}" -path '*/.git/objects/pack/tmp_pack_*' -type f -mmin +120 -print -delete
          fi
          df -h / || true
          echo "DISK_AFTER_RECLAIM_BYTES=$(df -B1 --output=avail / | tail -n1)"

      # TWO-SOURCE MODEL (incident ACTIVE run 31254863015):
      # A) ORCHESTRATION_CODE_SOURCE=FEATURE_HEAD â€” helper scripts from workflow SHA
      # B) SHARED_STATE_SOURCE=LATEST_MAIN â€” live info_events RMW/commit worktree
      # Never overwrite feature helpers by checking out main into the same workspace.
      - name: Checkout feature HEAD orchestration code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ndic-orch
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: false

      - name: Checkout latest main shared-state worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: ndic-main-data
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Refresh main tip before shared write (reread after acquire)
        run: |
          set -euo pipefail
          test -f ndic-orch/scripts/info-events-shared-writer-critical.mjs
          test -f ndic-orch/scripts/ndic-open-or-refresh-data-pr.mjs
          test -f ndic-orch/scripts/ndic-data-pr-reconcile-against-main.mjs
          git -C ndic-main-data fetch origin main --depth=1
          git -C ndic-main-data checkout -B "${{ env.AUTOMATION_BRANCH }}" origin/main
          echo "ORCHESTRATION_CODE_SOURCE=FEATURE_HEAD"
          echo "SHARED_STATE_SOURCE=LATEST_MAIN"
          echo "FEATURE_HELPER_AVAILABLE_DURING_MAIN_REREAD=YES"

      - name: Download NDIC candidate
        uses: actions/download-artifact@v4
        with:
          name: ndic-ie-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/ndic-ie-candidate

      - name: Fail-closed validate downloaded candidate
        env:
          IU_NDIC_EXPECTED_PRODUCER_RUN_ID: ${{ github.run_id }}
          IU_NDIC_EXPECTED_PRODUCER_HEAD_SHA: ${{ github.sha }}
          IU_NDIC_EXPECTED_CANDIDATE_MODE: active
        run: |
          set -euo pipefail
          node ndic-orch/scripts/ndic-validate-shared-write-candidate.mjs "${RUNNER_TEMP}/ndic-ie-candidate"

      - name: Apply NDIC candidate (re-read live shared state)
        run: |
          set -euo pipefail
          node ndic-orch/scripts/info-events-shared-writer-critical.mjs ndic \
            "${RUNNER_TEMP}/ndic-ie-candidate" \
            "ndic-main-data/projects/data/info_events"

      # DATA_PR_FINALIZATION_PROTOCOL: bind DATA_PR_HEAD × BASE_MAIN_HEAD × SHARED_STATE_DIGEST
      # (semantic namespace digests; merge-ready ≠ HEAD checks alone). Short critical section only.
      - name: Record data PR finalization binding
        run: |
          set -euo pipefail
          BASE_MAIN_SHA="$(git -C ndic-main-data rev-parse HEAD)"
          export BASE_MAIN_SHA
          export WRITER_RUN_ID="${GITHUB_RUN_ID}"
          export GENERATED_BY_WRITER=ndic
          node ndic-orch/scripts/iu-data-pr-finalization-protocol.mjs record-binding ndic-main-data
          echo "DATA_PR_FINALIZATION_BINDING_RECORDED=YES"
          echo "WHOLE_WORKFLOW_SHARED_LOCK=NO"
          echo "NETWORK_PREP_INSIDE_SHARED_LOCK=NO"
          echo "LONG_RUNNING_TESTS_INSIDE_SHARED_LOCK=NO"

      - name: Commit data if changed
        id: commit_push
        working-directory: ndic-main-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Per-path staging + REQUIRED fail-closed (no all-or-nothing git add || true).
          set +e
          stage_out="$(node ../ndic-orch/scripts/ndic-stage-shared-write-outputs.mjs --repo .)"
          stage_code=$?
          set -e
          echo "$stage_out"
          if [ "$stage_code" -eq 2 ]; then
            echo "REQUIRED_OUTPUT_MISSING_FAIL_CLOSED"
            exit 2
          fi
          if [ "$stage_code" -ne 0 ]; then
            echo "STAGE_FAILED"
            exit "$stage_code"
          fi
          if echo "$stage_out" | grep -q '"result":"NO_CHANGES"'; then
            echo "NO_CHANGES"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$stage_out" | grep -q '"result":"STAGED"'; then
            echo "UNEXPECTED_STAGE_RESULT"
            exit 1
          fi
          git commit -m "${{ env.PR_TITLE }}"
          git push -u origin "HEAD:refs/heads/${{ env.AUTOMATION_BRANCH }}" --force
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh data PR
        if: steps.commit_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMATION_BRANCH: ${{ env.AUTOMATION_BRANCH }}
          PR_TITLE: ${{ env.PR_TITLE }}
          PR_BODY: "Automated NDIC DATEX v1 data refresh. Shared writer lock held only during critical RMW/commit after live re-read on Czech self-hosted runner. Canonical Data PR is reconciled against latest main (CHMI/IE namespaces preserved) then checks are dispatched via workflow_dispatch (no manual action_required gate)."
          PR_BASE: main
        run: |
          set -euo pipefail
          node ndic-orch/scripts/ndic-open-or-refresh-data-pr.mjs

      - name: Bounded reconcile against current main (same lock, shallow)
        if: steps.commit_push.outputs.pushed == 'true'
        id: reconcile
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUTOMATION_BRANCH: ${{ env.AUTOMATION_BRANCH }}
          PR_TITLE: ${{ env.PR_TITLE }}
        run: |
          set -euo pipefail
          # Keep critical section short: reread main tip + namespace-merge NDIC candidate.
          # No second self-hosted job / no full-history clone (ENOSPC run 31338815059).
          node ndic-orch/scripts/ndic-data-pr-reconcile-against-main.mjs \
            --repo ndic-main-data \
            --ndic-candidate "${RUNNER_TEMP}/ndic-ie-candidate" \
            --branch "${{ env.AUTOMATION_BRANCH }}" \
            --max 12 \
            --commit-message "${{ env.PR_TITLE }}" \
            | tee "$RUNNER_TEMP/ndic-reconcile.json"
          REFRESH_COUNT="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(j.refreshCount||0));' "$RUNNER_TEMP/ndic-reconcile.json")"
          echo "refresh_count=${REFRESH_COUNT}" >> "$GITHUB_OUTPUT"
          echo "REREAD_CURRENT_SHARED_STATE_BEFORE_FINAL_COMMIT=YES"
          echo "DATA_PR_REFRESH_BOUNDED=YES"
          echo "DATA_PR_REFRESH_MAX=12"
          echo "UNBOUNDED_RETRY_POSSIBLE=NO"
          echo "GIT_OURS_THEIRS_USED=NO"

      - name: Push reconciled automation branch
        if: steps.commit_push.outputs.pushed == 'true'
        working-directory: ndic-main-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push -u origin "HEAD:refs/heads/${{ env.AUTOMATION_BRANCH }}" --force
          echo "CANONICAL_DATA_PR_PRESERVED=YES"
          echo "DUPLICATE_DATA_PR_CREATED=NO"

      - name: Bounded NDIC disk cleanup (shared-write post)
        if: always()
        env:
          IU_NDIC_CLEANUP_RUN_ID: ${{ github.run_id }}
          IU_NDIC_CLEANUP_ORPHAN_AGE_SECONDS: "7200"
          IU_NDIC_CLEANUP_WIPE_WORKTREES: "1"
          IU_NDIC_CLEANUP_WIPE_RUNNER_TEMP_NDIC: "1"
        run: |
          set -euo pipefail
          df -B1 --output=avail / | tail -n1 | awk '{print "DISK_AVAILABLE_BYTES="$1}'
          SCRIPT="ndic-orch/scripts/ndic-runner-disk-cleanup.mjs"
          if [ ! -f "$SCRIPT" ]; then SCRIPT="scripts/ndic-runner-disk-cleanup.mjs"; fi
          if [ -f "$SCRIPT" ]; then
            node "$SCRIPT"
          else
            echo "CLEANUP_SCRIPT_MISSING — falling back to allowlisted worktree wipe"
            if [ -e ndic-orch ]; then rm -rf ndic-orch; fi
            if [ -e ndic-main-data ]; then rm -rf ndic-main-data; fi
          fi
          df -B1 --output=avail / | tail -n1 | awk '{print "DISK_AVAILABLE_AFTER_CLEANUP_BYTES="$1}'


  # Outside shared writer lock (mirrors CHMI post-write):
  # workflow_dispatch required checks — avoids pull_request action_required gate for github-actions[bot].
  ndic-post-write:
    needs: ndic-shared-write
    if: needs.ndic-shared-write.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NO info-events-data-writers — checks/Pages must not hold the shared writer lock.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUTOMATION_BRANCH }}
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - name: Dispatch required checks (workflow_dispatch; not pull_request approval gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ env.AUTOMATION_BRANCH }}"
          REPO="${{ github.repository }}"
          # GITHUB_TOKEN pushes do not start push-triggered workflows; pull_request runs
          # from github-actions[bot] can sit in action_required. Mirror CHMI: explicit dispatch.
          gh workflow run smoke.yml --ref "$REF" --repo "$REPO"
          gh workflow run layout-guard.yml --ref "$REF" --repo "$REPO"
          gh workflow run repo-guard.yml --ref "$REF" --repo "$REPO"
          echo "[CHECKS] Dispatched smoke, layout-guard, repo-guard on $REF"
          echo "MANUAL_WORKFLOW_APPROVAL_USED=NO"

      - name: Resolve canonical Data PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number' || echo "")
          if [ -z "$EXISTING" ]; then
            echo "CANONICAL_DATA_PR_MISSING"
            exit 1
          fi
          echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
          echo "[PR] Canonical Data PR #$EXISTING"
          echo "AUTONOMOUS_DATA_PR_DUPLICATE_CREATED=NO"

      - name: Diff scope check (data-only → allow auto-merge)
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          # Avoid `git fetch origin main` on shallow automation checkout — can hang until
          # job timeout negotiating a huge pack (schedule 31380918663: 20m cancel).
          # PR file list via API is authoritative for data-only scope.
          CHANGED=$(gh pr diff "$NUM" --name-only)
          echo "[SCOPE] Changed files:"
          echo "$CHANGED"
          DATA_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              projects/data/info_events/*) ;;
              *) DATA_ONLY=false; break ;;
            esac
          done <<< "$CHANGED"
          if [ "$DATA_ONLY" = true ]; then
            echo "data_only=true" >> "$GITHUB_OUTPUT"
            echo "[SCOPE] data-only — auto-merge allowed"
            echo "POSTWRITE_SCOPE_VIA_GH_PR_DIFF=YES"
          else
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "[SCOPE] non-data / unsafe drift — auto-merge disabled (fail-closed)"
            exit 1
          fi

      - name: Enable auto-merge (squash) when data-only
        if: steps.scope.outputs.data_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && exit 0
          gh pr merge "$NUM" --auto --squash
          echo "[AUTO-MERGE] Enabled for PR #$NUM"

      - name: Wait for required checks (fail if missing/failing)
        if: steps.scope.outputs.data_only == 'true'
        id: wait_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && exit 0
          SHA=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
          echo "[WAIT] PR #$NUM sha=$SHA"
          REQUIRED='repo-guard smoke layout-guard'
          for i in $(seq 1 48); do
            MERGED=$(gh pr view "$NUM" --json state -q .state)
            if [ "$MERGED" = "MERGED" ]; then
              echo "[WAIT] PR already merged"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              echo "mergedAt_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            MS=$(gh pr view "$NUM" --json mergeStateStatus -q .mergeStateStatus)
            if [ "$MS" = "DIRTY" ] || [ "$MS" = "dirty" ]; then
              echo "[WAIT] PR became DIRTY during checks — fail-closed for this run (next schedule reconcile)"
              echo "FAILED_PHASE=DATA_PR_CONFLICT_DURING_CHECKS"
              exit 1
            fi
            ROLLUP=$(gh pr view "$NUM" --json mergeStateStatus,statusCheckRollup -q '{m:.mergeStateStatus,c:[.statusCheckRollup[]? | {name:(.name // .context), conclusion:(.conclusion // .state)}]}')
            echo "[WAIT] attempt=$i $ROLLUP"
            FAIL=$(echo "$ROLLUP" | jq -r '[.c[] | select(((.conclusion // "")|ascii_downcase) == "failure" or ((.conclusion // "")|ascii_downcase) == "cancelled" or ((.conclusion // "")|ascii_downcase) == "error")] | length')
            if [ "$FAIL" != "0" ]; then
              echo "[WAIT] required check failed"
              gh pr checks "$NUM" || true
              exit 1
            fi
            HAVE=0
            for ctx in $REQUIRED; do
              HIT=$(echo "$ROLLUP" | jq -r --arg n "$ctx" '[.c[] | select((.name|ascii_downcase) == ($n|ascii_downcase))] | length')
              if [ "$HIT" != "0" ]; then HAVE=$((HAVE + 1)); fi
            done
            if [ "$HAVE" -lt 3 ]; then
              echo "[WAIT] required contexts starting ($HAVE/3) — sleeping"
              sleep 15
              continue
            fi
            PENDING=$(echo "$ROLLUP" | jq -r '[.c[] | select(((.conclusion // "")|ascii_downcase) == "pending" or .conclusion == "" or .conclusion == null or ((.conclusion // "")|ascii_downcase) == "in_progress" or ((.conclusion // "")|ascii_downcase) == "queued" or ((.conclusion // "")|ascii_downcase) == "waiting" or ((.conclusion // "")|ascii_downcase) == "action_required")] | length')
            if [ "$PENDING" != "0" ]; then
              # action_required on pull_request-triggered runs must not block us if
              # workflow_dispatch checks (same names) are green — prefer dispatch conclusions.
              AR=$(echo "$ROLLUP" | jq -r '[.c[] | select(((.conclusion // "")|ascii_downcase) == "action_required")] | length')
              NON_AR_PENDING=$(echo "$ROLLUP" | jq -r '[.c[] | select(((.conclusion // "")|ascii_downcase) != "action_required") | select(((.conclusion // "")|ascii_downcase) == "pending" or .conclusion == "" or .conclusion == null or ((.conclusion // "")|ascii_downcase) == "in_progress" or ((.conclusion // "")|ascii_downcase) == "queued" or ((.conclusion // "")|ascii_downcase) == "waiting")] | length')
              if [ "$AR" != "0" ] && [ "$NON_AR_PENDING" = "0" ]; then
                echo "[WAIT] ignoring stale pull_request action_required; dispatch checks ready"
              else
                sleep 15
                continue
              fi
            fi
            if [ "$MS" = "CLEAN" ] || [ "$MS" = "HAS_HOOKS" ] || [ "$MS" = "UNSTABLE" ]; then
              echo "[WAIT] checks ready (mergeState=$MS)"
              for _try in $(seq 1 12); do
                ST=$(gh pr view "$NUM" --json state -q .state)
                if [ "$ST" = "MERGED" ]; then
                  echo "[WAIT] auto-merge completed (try=$_try)"
                  echo "merged=true" >> "$GITHUB_OUTPUT"
                  echo "mergedAt_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                sleep 10
              done
              echo "[WAIT] checks green but PR not merged yet — leaving auto-merge enabled"
              echo "merged=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "[WAIT] timeout waiting for checks"
          gh pr checks "$NUM" || true
          exit 1

      - name: Dispatch Pages after successful data merge
        if: steps.scope.outputs.data_only == 'true' && steps.wait_merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[PAGES] publish_dispatch_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pages.yml --ref main --repo "${{ github.repository }}"
          echo "[PAGES] Dispatched pages.yml on main after NDIC data merge"
          gh workflow run pages-publish-from-main-data.yml --ref main --repo "${{ github.repository }}" || true
