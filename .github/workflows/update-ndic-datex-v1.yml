name: Update NDIC DATEX v1

# Kill switch: IU_NDIC_DATEX_V1_MODE=off|shadow|active (default off).
# Real NDIC network access is FORBIDDEN on GitHub-hosted runners.
#
# TWO-PHASE STAGING (fail-closed):
#   1) NDIC staging preflight (ubuntu-latest, no secrets, no NDIC network)
#      -> publishes HEAD-bound short-lived attestation
#   2) This workflow (network-only on self-hosted+Linux+X64+ndic-cz-egress)
#      -> requires valid preflight attestation for exact github.sha
#      -> operator starts VPS runner ONLY after preflight PASS
#
# This workflow intentionally has NO ubuntu-latest job so authorized staging
# no longer depends on GitHub-hosted runner queue / timeout-minutes while the
# VPS egress runner is online.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | shadow | active (active publishes; use with extreme care)"
        required: true
        type: choice
        options:
          - off
          - shadow
          - active
        default: off
      preflight_attestation_id:
        description: "Optional exact preflight attestation id (aid=...); empty accepts newest valid for HEAD"
        required: false
        type: string
        default: ""

# Staging (off|shadow) MUST NOT share the CHMI/info-events pending slot.
# GitHub still cancels prior pending runs in a group even when cancel-in-progress is false.
# Active mode alone joins the shared production writer lock (same feed/monitoring targets).
concurrency:
  group: ${{ inputs.mode == 'active' && 'info-events-data-writers' || 'ndic-datex-v1-internal-staging' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

env:
  AUTOMATION_BRANCH: automation/update-ndic-datex-v1
  PR_TITLE: "chore(data): refresh NDIC DATEX v1 snapshot"

jobs:
  ndic-network-sync:
    if: >
      github.event_name == 'workflow_dispatch'
      && github.repository == 'Josefjosefjosef/filtr'
      && (github.event.inputs.mode == 'shadow' || github.event.inputs.mode == 'active')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ndic-cz-egress
    timeout-minutes: 20
    steps:
      # MUST stay first: no checkout, no secrets, no network before identity PASS.
      - name: Preflight runner identity (fail-closed)
        run: |
          set -euo pipefail
          EXPECTED_NAME="infouzel-ndic-cz-vps4204"
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then
            echo "REFUSING_GITHUB_HOSTED"
            exit 1
          fi
          if [ "${RUNNER_NAME:-}" != "${EXPECTED_NAME}" ]; then
            echo "REFUSING_UNEXPECTED_RUNNER_NAME"
            exit 1
          fi
          if [ "${RUNNER_OS:-}" != "Linux" ]; then
            echo "REFUSING_UNEXPECTED_OS"
            exit 1
          fi
          if [ "${RUNNER_ARCH:-}" != "X64" ]; then
            echo "REFUSING_UNEXPECTED_ARCH"
            exit 1
          fi
          ws="${GITHUB_WORKSPACE:-}"
          cwd="$(pwd)"
          case "${ws}" in
            /home/runner|/home/runner/*)
              echo "REFUSING_GITHUB_HOSTED_PATH"
              exit 1
              ;;
          esac
          case "${cwd}" in
            /home/runner|/home/runner/*)
              echo "REFUSING_GITHUB_HOSTED_PATH"
              exit 1
              ;;
          esac
          if [ "$(id -u)" -eq 0 ]; then
            echo "REFUSING_ROOT_RUNNER"
            exit 1
          fi
          if command -v sudo >/dev/null 2>&1; then
            if sudo -n true >/dev/null 2>&1; then
              echo "REFUSING_PASSWORDLESS_SUDO"
              exit 1
            fi
          fi
          umask 077
          avail_kb="$(df -Pk . | awk 'NR==2 {print $4}')"
          if [ -z "${avail_kb}" ] || [ "${avail_kb}" -lt 2097152 ]; then
            echo "REFUSING_LOW_DISK"
            exit 1
          fi
          echo "RUNNER_PREFLIGHT_OK"
          echo "RUNNER_NAME_OK=1"
          echo "RUNNER_ENVIRONMENT=self-hosted"
          echo "DISK_AVAIL_KB=${avail_kb}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify staging preflight attestation (fail-closed, before NDIC secrets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IU_NDIC_PREFLIGHT_EXPECTED_HEAD: ${{ github.sha }}
          IU_NDIC_PREFLIGHT_ATTESTATION_ID: ${{ github.event.inputs.preflight_attestation_id }}
        run: |
          set -euo pipefail
          node scripts/ndic-verify-preflight-attestation.mjs

      - name: Sync NDIC DATEX v1
        id: sync
        env:
          IU_NDIC_DATEX_V1_MODE: ${{ github.event.inputs.mode }}
          IU_NDIC_PULL_URL: ${{ secrets.IU_NDIC_PULL_URL }}
          IU_NDIC_PULL_USER: ${{ secrets.IU_NDIC_PULL_USER }}
          IU_NDIC_PULL_PASS: ${{ secrets.IU_NDIC_PULL_PASS }}
          IU_NDIC_TMC_PULL_URL: ${{ secrets.IU_NDIC_TMC_PULL_URL }}
          IU_NDIC_TMC_PULL_USER: ${{ secrets.IU_NDIC_TMC_PULL_USER }}
          IU_NDIC_TMC_PULL_PASS: ${{ secrets.IU_NDIC_TMC_PULL_PASS }}
          IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID: ${{ secrets.IU_NDIC_MOBILITYDATA_SUBSCRIBER_ID }}
          IU_NDIC_TMC_STORE_PATH: ${{ runner.temp }}/ndic-tmc-store.json
          IU_NDIC_SHADOW_ISOLATED: ${{ github.event.inputs.mode == 'shadow' && '1' || '0' }}
          IU_NDIC_FORENSIC_DIR: ${{ runner.temp }}/ndic-shadow-forensic
          IU_NDIC_FORENSIC_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/ndic-datex-v1-prod-sync.mjs | tee "$RUNNER_TEMP/ndic-sync-out.json"

      - name: Upload redacted shadow forensic artifacts
        if: github.event.inputs.mode == 'shadow'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ndic-shadow-forensic-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ndic-shadow-forensic/ndic-shadow-forensic-summary.json
            ${{ runner.temp }}/ndic-shadow-forensic/ndic-shadow-card-preview.json
            ${{ runner.temp }}/ndic-shadow-forensic/ndic-shadow-validation-report.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Commit data if changed (active publish only)
        id: commit_push
        if: github.event.inputs.mode == 'active'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/data/info_events/feed.json \
                  projects/data/info_events/lanes/doprava.json \
                  projects/data/info_events/monitoring.json \
                  projects/data/info_events/ndic_datex_v1/sync_state.json \
                  projects/data/info_events/ndic_datex_v1/diagnostics.json \
                  projects/data/info_events/ndic_datex_v1/tmc_meta.json \
                  2>/dev/null || true
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          git checkout -B "$BRANCH"
          git commit -m "${{ env.PR_TITLE }}"
          git push -u origin "$BRANCH" --force
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or refresh data PR
        if: github.event.inputs.mode == 'active' && steps.commit_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR exists"
          else
            gh pr create --base main --head "$BRANCH" --title "${{ env.PR_TITLE }}" --body "Automated NDIC DATEX v1 data refresh."
          fi
