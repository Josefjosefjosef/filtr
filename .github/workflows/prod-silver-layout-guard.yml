name: Production Silver layout guard

permissions:
  contents: read
  actions: read
  statuses: write

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]

jobs:
  prod-silver-layout-guard:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Silver mobile layout guard (production)
        run: node scripts/proof_silver_layout_guard.cjs

      - name: Set production CLS gate status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          SHA="${{ github.event.workflow_run.head_sha }}"
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="$STATE" \
            -f context="prod-silver-layout-guard" \
            -f description="Post-deploy Silver CLS guard (production)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
