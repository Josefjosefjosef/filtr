name: IU Premium order documents prod proof

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: iu-premium-order-documents-prod-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      ADS_PASSWORD_PEPPER: ${{ secrets.ADS_PASSWORD_PEPPER }}
      ADS_BASE_URL: "https://ads.infouzel.cz"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/iu-ads/package-lock.json
      - name: Install deps
        run: |
          npm ci --ignore-scripts
          cd cloudflare/iu-ads
          npm ci
      - name: Bounded documents prod proof
        run: node scripts/iu-premium-order-documents-prod-proof.mjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Mobile admin order documents E2E (prod)
        run: node scripts/iu-premium-admin-order-documents-mobile-e2e-prod.mjs
