# Phase 3K / V42: watch real catalog-sync *schedule* runs (never treat workflow_dispatch as schedule).
# Does NOT arm CJ LIVE / publicButtonSwapArmed. Does NOT open a second publisher.
# V42: run after each expected 3h slot (+30m buffer) so SLOT_MISS is visible the same day.
# V44/V51.8: bounded catch-up dispatch (max 4/UTC day, 2h cooldown) via same catalog-sync concurrency group.
# GitHub Actions cron is best-effort — NOT a guarantee of exact 3h delivery.
# schedule-reregister: 2026-11-10T10:00Z — secondary :57 watch after proven :47 watch SLOT_MISS
# (plus daycap 2). Comment+cron rebind; do NOT disable/enable workflow. Prior: V44 :47-only.
name: CJ Affiliate catalog-sync schedule watch

on:
  schedule:
    # After each catalog-sync cron :17 (+30m GitHub delay buffer) at hours 0/3/6/9/12/15/18/21 UTC
    - cron: "47 0,3,6,9,12,15,18,21 * * *"
    # Late observer: if GitHub drops the :47 watch slot, still detect SLOT_MISS same hour (+10m)
    - cron: "57 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

concurrency:
  group: cj-affiliate-catalog-sync-schedule-watch
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Slot-watch + catch-up selftests (offline)
        run: |
          node scripts/iu-cj-affiliate-phase3z-schedule-slot-watch-v42-selftest.mjs
          node scripts/iu-cj-affiliate-phase3z-schedule-catchup-v44-selftest.mjs
      - name: Inspect last schedule runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_PATH: cj-affiliate-catalog-sync.yml
        run: |
          set -euo pipefail
          WF_ID="$(gh api "repos/${REPO}/actions/workflows" --jq \
            ".workflows[] | select(.path==\".github/workflows/${WORKFLOW_PATH}\") | .id")"
          if [ -z "${WF_ID}" ]; then
            echo "WATCH_RESULT=FAIL reason=workflow_not_found"
            exit 1
          fi
          echo "WORKFLOW_ID=${WF_ID}"
          RAW="$(gh api "repos/${REPO}/actions/workflows/${WF_ID}/runs?event=schedule&per_page=30")"
          echo "${RAW}" | jq -r '.workflow_runs[] | "\(.id)\t\(.conclusion // "null")\t\(.status)\t\(.created_at)\t\(.actor.login // "")"' \
            | tee /tmp/iu-cj-schedule-runs.tsv || true
          TOTAL="$(echo "${RAW}" | jq '.total_count')"
          echo "SCHEDULE_TOTAL_COUNT=${TOTAL}"
          CUTOFF="$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-48H +%Y-%m-%dT%H:%M:%SZ)"
          echo "CUTOFF_UTC=${CUTOFF}"
          SUCCESS_48="$(echo "${RAW}" | jq --arg c "$CUTOFF" \
            '[.workflow_runs[] | select(.conclusion=="success" and .created_at >= $c)] | length')"
          FAIL_48="$(echo "${RAW}" | jq --arg c "$CUTOFF" \
            '[.workflow_runs[] | select(.conclusion=="failure" and .created_at >= $c)] | length')"
          CANCEL_48="$(echo "${RAW}" | jq --arg c "$CUTOFF" \
            '[.workflow_runs[] | select(.conclusion=="cancelled" and .created_at >= $c)] | length')"
          INPROG="$(echo "${RAW}" | jq \
            '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')"
          # Any event in-flight (schedule OR dispatch) blocks catch-up.
          INPROG_ANY="$(gh api "repos/${REPO}/actions/workflows/${WF_ID}/runs?per_page=20" --jq \
            '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')"
          ALL_RECENT="$(gh api "repos/${REPO}/actions/workflows/${WF_ID}/runs?per_page=30")"
          echo "${ALL_RECENT}" > /tmp/iu-cj-catalog-all-recent.json
          echo "SUCCESS_48H=${SUCCESS_48}"
          echo "FAIL_48H=${FAIL_48}"
          echo "CANCEL_48H=${CANCEL_48}"
          echo "IN_PROGRESS=${INPROG}"
          echo "IN_PROGRESS_ANY=${INPROG_ANY}"
          LATEST="$(echo "${RAW}" | jq -r '.workflow_runs[0] // empty | "\(.id) \(.conclusion) \(.created_at)"')"
          echo "LATEST_SCHEDULE=${LATEST:-none}"
          echo "${RAW}" > /tmp/iu-cj-schedule-raw.json
          # V42: authoritative slot classification (FAIL on multiple SLOT_MISS — do not mask with one 48h success).
          set +e
          node scripts/iu-cj-affiliate-phase3z-schedule-slot-watch-v42.mjs /tmp/iu-cj-schedule-raw.json | tee /tmp/iu-cj-slot-watch.txt
          SLOT_RC=$?
          set -e
          export INPROG_ANY
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { classifyScheduleSlots } from "./scripts/iu-cj-affiliate-phase3z-schedule-slot-watch-v42.mjs";
          import { decideScheduleCatchup } from "./scripts/iu-cj-affiliate-phase3z-schedule-catchup-v44.mjs";
          const raw = JSON.parse(fs.readFileSync("/tmp/iu-cj-schedule-raw.json", "utf8"));
          const all = JSON.parse(fs.readFileSync("/tmp/iu-cj-catalog-all-recent.json", "utf8"));
          const report = classifyScheduleSlots(raw.workflow_runs || [], new Date());
          fs.writeFileSync("/tmp/iu-cj-slot-report.json", JSON.stringify(report, null, 2));
          const decision = decideScheduleCatchup({
            slotReport: report,
            catalogInProgressCount: Number(process.env.INPROG_ANY || 0),
            recentCatalogRuns: all.workflow_runs || [],
          });
          fs.writeFileSync("/tmp/iu-cj-catchup-decision.json", JSON.stringify(decision, null, 2));
          console.log("CATCHUP_ALLOW=" + decision.allow);
          console.log("CATCHUP_REASON=" + decision.reason);
          console.log(JSON.stringify(decision));
          NODE
          ALLOW="$(jq -r '.allow' /tmp/iu-cj-catchup-decision.json)"
          if [ "${ALLOW}" = "true" ]; then
            echo "CATCHUP_DISPATCH=1 (NOT schedule; refresh_priority; same concurrency group)"
            set +e
            gh workflow run "${WORKFLOW_PATH}" \
              -f execute_live_fetch=1 \
              -f offers_mode=refresh_priority \
              -f arm_publish=0 \
              -f promote_managed_public=0 \
              -f publish_managed_public_r2=0 \
              -f arm_offers_live=0 \
              -f promote_offers_public=1 \
              -f catchup_dispatch=1
            DISP_RC=$?
            if [ "${DISP_RC}" -ne 0 ]; then
              echo "CATCHUP_DISPATCH_RETRY=1"
              sleep 5
              gh workflow run "${WORKFLOW_PATH}" \
                -f execute_live_fetch=1 \
                -f offers_mode=refresh_priority \
                -f arm_publish=0 \
                -f promote_managed_public=0 \
                -f publish_managed_public_r2=0 \
                -f arm_offers_live=0 \
                -f promote_offers_public=1 \
                -f catchup_dispatch=1
              DISP_RC=$?
            fi
            set -e
            if [ "${DISP_RC}" -ne 0 ]; then
              echo "CATCHUP_DISPATCH_FAILED"
              echo "WATCH_RESULT=FAIL"
              echo "BURNIN_STATUS=CATCHUP_DISPATCH_FAILED"
              exit 1
            fi
            echo "CATCHUP_DISPATCH_OK=1"
          else
            echo "CATCHUP_DISPATCH=0 reason=$(jq -r '.reason' /tmp/iu-cj-catchup-decision.json)"
          fi
          if [ "${INPROG}" -ge 1 ] || [ "${INPROG_ANY}" -ge 1 ]; then
            echo "WATCH_RESULT=PENDING"
            echo "BURNIN_STATUS=SCHEDULE_IN_PROGRESS"
            exit 0
          fi
          if [ "${TOTAL}" -eq 0 ]; then
            echo "WATCH_RESULT=PENDING"
            echo "BURNIN_STATUS=NO_SCHEDULE_RUNS_YET"
            exit 0
          fi
          if [ "${SLOT_RC}" -ne 0 ]; then
            echo "WATCH_RESULT=FAIL"
            echo "BURNIN_STATUS=CADENCE_DEGRADED_MULTIPLE_SLOT_MISS"
            # Still exit 1 for visibility; catch-up (if allowed) already requested above.
            exit 1
          fi
          if [ "${FAIL_48}" -ge 1 ] && [ "${SUCCESS_48}" -eq 0 ]; then
            echo "WATCH_RESULT=FAIL"
            echo "BURNIN_STATUS=SCHEDULE_FAILURE_IN_WINDOW"
            exit 1
          fi
          if [ "${SUCCESS_48}" -ge 1 ]; then
            echo "WATCH_RESULT=PASS"
            echo "BURNIN_STATUS=VERIFIED_RECENT_SCHEDULE_SUCCESS"
            exit 0
          fi
          echo "WATCH_RESULT=PENDING"
          echo "BURNIN_STATUS=NO_SUCCESS_IN_48H_MANUAL_OR_DELAY"
          exit 0
