# Phase 3K / V42: watch real catalog-sync *schedule* runs (never treat workflow_dispatch as schedule).
# Does NOT publish. Does NOT arm CJ LIVE. Read-only Actions API.
# V42: run after each expected 3h slot (+30m buffer) so SLOT_MISS is visible the same day.
name: CJ Affiliate catalog-sync schedule watch

on:
  schedule:
    # After each catalog-sync cron :17 (+30m GitHub delay buffer) at hours 0/3/6/9/12/15/18/21 UTC
    - cron: "47 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

concurrency:
  group: cj-affiliate-catalog-sync-schedule-watch
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Slot-watch selftest (offline)
        run: node scripts/iu-cj-affiliate-phase3z-schedule-slot-watch-v42-selftest.mjs
      - name: Inspect last schedule runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_PATH: cj-affiliate-catalog-sync.yml
        run: |
          set -euo pipefail
          WF_ID="$(gh api "repos/${REPO}/actions/workflows" --jq \
            ".workflows[] | select(.path==\".github/workflows/${WORKFLOW_PATH}\") | .id")"
          if [ -z "${WF_ID}" ]; then
            echo "WATCH_RESULT=FAIL reason=workflow_not_found"
            exit 1
          fi
          echo "WORKFLOW_ID=${WF_ID}"
          RAW="$(gh api "repos/${REPO}/actions/workflows/${WF_ID}/runs?event=schedule&per_page=30")"
          echo "${RAW}" | jq -r '.workflow_runs[] | "\(.id)\t\(.conclusion // "null")\t\(.status)\t\(.created_at)\t\(.actor.login // "")"' \
            | tee /tmp/iu-cj-schedule-runs.tsv || true
          TOTAL="$(echo "${RAW}" | jq '.total_count')"
          echo "SCHEDULE_TOTAL_COUNT=${TOTAL}"
          CUTOFF="$(date -u -d '48 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-48H +%Y-%m-%dT%H:%M:%SZ)"
          echo "CUTOFF_UTC=${CUTOFF}"
          SUCCESS_48="$(echo "${RAW}" | jq --arg c "$CUTOFF" \
            '[.workflow_runs[] | select(.conclusion=="success" and .created_at >= $c)] | length')"
          FAIL_48="$(echo "${RAW}" | jq --arg c "$CUTOFF" \
            '[.workflow_runs[] | select(.conclusion=="failure" and .created_at >= $c)] | length')"
          CANCEL_48="$(echo "${RAW}" | jq --arg c "$CUTOFF" \
            '[.workflow_runs[] | select(.conclusion=="cancelled" and .created_at >= $c)] | length')"
          INPROG="$(echo "${RAW}" | jq \
            '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')"
          echo "SUCCESS_48H=${SUCCESS_48}"
          echo "FAIL_48H=${FAIL_48}"
          echo "CANCEL_48H=${CANCEL_48}"
          echo "IN_PROGRESS=${INPROG}"
          LATEST="$(echo "${RAW}" | jq -r '.workflow_runs[0] // empty | "\(.id) \(.conclusion) \(.created_at)"')"
          echo "LATEST_SCHEDULE=${LATEST:-none}"
          echo "${RAW}" > /tmp/iu-cj-schedule-raw.json
          # V42: authoritative slot classification (FAIL on multiple SLOT_MISS — do not mask with one 48h success).
          set +e
          node scripts/iu-cj-affiliate-phase3z-schedule-slot-watch-v42.mjs /tmp/iu-cj-schedule-raw.json | tee /tmp/iu-cj-slot-watch.txt
          SLOT_RC=$?
          set -e
          if [ "${INPROG}" -ge 1 ]; then
            echo "WATCH_RESULT=PENDING"
            echo "BURNIN_STATUS=SCHEDULE_IN_PROGRESS"
            exit 0
          fi
          if [ "${TOTAL}" -eq 0 ]; then
            echo "WATCH_RESULT=PENDING"
            echo "BURNIN_STATUS=NO_SCHEDULE_RUNS_YET"
            exit 0
          fi
          if [ "${SLOT_RC}" -ne 0 ]; then
            echo "WATCH_RESULT=FAIL"
            echo "BURNIN_STATUS=CADENCE_DEGRADED_MULTIPLE_SLOT_MISS"
            exit 1
          fi
          if [ "${FAIL_48}" -ge 1 ] && [ "${SUCCESS_48}" -eq 0 ]; then
            echo "WATCH_RESULT=FAIL"
            echo "BURNIN_STATUS=SCHEDULE_FAILURE_IN_WINDOW"
            exit 1
          fi
          if [ "${SUCCESS_48}" -ge 1 ]; then
            echo "WATCH_RESULT=PASS"
            echo "BURNIN_STATUS=VERIFIED_RECENT_SCHEDULE_SUCCESS"
            exit 0
          fi
          echo "WATCH_RESULT=PENDING"
          echo "BURNIN_STATUS=NO_SUCCESS_IN_48H_MANUAL_OR_DELAY"
          exit 0
