name: Layout guard status repost

# Posts the required `layout-guard` commit status for the dispatched ref SHA
# only when a successful Layout guard CheckRun already exists for that SHA.
# Used when push-event layout-guard hangs on Playwright install while
# pull_request_target already passed the same guards on the PR head.

permissions:
  actions: read
  checks: read
  contents: read
  statuses: write

on:
  workflow_dispatch:

jobs:
  layout-guard-status-repost:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CheckRun PASS then post layout-guard status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "sha=$SHA"
          FOUND="0"
          while IFS= read -r line; do
            name="$(printf '%s' "$line" | cut -d'|' -f1)"
            conclusion="$(printf '%s' "$line" | cut -d'|' -f2)"
            echo "check name=$name conclusion=$conclusion"
            if [ "$name" = "layout-guard" ] && [ "$conclusion" = "success" ]; then
              FOUND="1"
            fi
          done < <(gh api "repos/${{ github.repository }}/commits/${SHA}/check-runs" --paginate --jq '.check_runs[] | "\(.name)|\(.conclusion)"')
          if [ "$FOUND" != "1" ]; then
            echo "No successful layout-guard CheckRun for $SHA"
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
              -f state="success" \
              -f context="layout-guard" \
              -f description="Required status context (layout-guard)" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
              exit 0
            fi
            echo "status_post_retry=$attempt"
            sleep $((attempt * 5))
          done
          exit 1
