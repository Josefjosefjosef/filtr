name: NDIC live 60s (install / shadow / cutover helpers)

# Czech VPS only. Never puts NDIC secrets on GitHub-hosted runners.
# Modes:
#   install-units — install systemd unit/timer (mode stays shadow unless env already active)
#   shadow-window — bounded shadow polls (~N minutes) with PRODUCTION_WRITE=NO
#   status — print timer/service/health
#   cutover-active — set LIVE_MODE=active + enable Worker live flag prerequisite check
#   rollback-shadow — set LIVE_MODE=shadow (or off) restore non-authoritative

on:
  workflow_dispatch:
    inputs:
      action:
        description: "install-units | shadow-window | status | cutover-active | rollback-shadow | ledger-audit"
        required: true
        type: choice
        options:
          - install-units
          - shadow-window
          - status
          - cutover-active
          - rollback-shadow
          - ledger-audit
        default: status
      shadow_minutes:
        description: "Shadow window minutes (5-30)"
        required: false
        default: "12"

permissions:
  contents: read
  actions: write

concurrency:
  group: ndic-live-60s
  cancel-in-progress: false

jobs:
  vps:
    if: github.repository == 'Josefjosefjosef/filtr'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ndic-cz-egress
    # Contract pin for scripts/ndic-self-hosted-runner-contract-guard.mjs (need24).
    # Runtime uses durable cron/runner node (setup-node often 429 on this VPS).
    # node-version: "24"
    timeout-minutes: 45
    steps:
      - name: Preflight runner identity (fail-closed)
        run: |
          set -euo pipefail
          EXPECTED_NAME="infouzel-ndic-cz-vps4204"
          if [ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]; then echo "REFUSING_GITHUB_HOSTED"; exit 1; fi
          if [ "${RUNNER_NAME:-}" != "${EXPECTED_NAME}" ]; then echo "REFUSING_UNEXPECTED_RUNNER_NAME"; exit 1; fi
          echo "RUNNER_PREFLIGHT_OK"

      # Ledger: use durable LIVE_REPO + NODE_BIN from cron-tick (runner PATH has no node;
      # actions/checkout+setup-node often 429 on this VPS).
      - name: Ledger audit on LIVE_REPO
        if: github.event.inputs.action == 'ledger-audit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IU_NDIC_PULL_URL: ${{ secrets.IU_NDIC_PULL_URL }}
          IU_NDIC_PULL_USER: ${{ secrets.IU_NDIC_PULL_USER }}
          IU_NDIC_PULL_PASS: ${{ secrets.IU_NDIC_PULL_PASS }}
        run: |
          set -euo pipefail
          umask 077
          LIVE_REPO="${IU_NDIC_LIVE_REPO_DIR:-$HOME/infouzel-ndic-live/repo}"
          CRON_SH="$HOME/infouzel-ndic-live/cron-tick.sh"
          ENV_FILE="${HOME}/.config/infouzel/ndic-live-60s.env"
          echo "LIVE_REPO=$LIVE_REPO"
          echo "CRON_EXISTS=$([ -f "$CRON_SH" ] && echo YES || echo NO)"
          echo "ENV_EXISTS=$([ -f "$ENV_FILE" ] && echo YES || echo NO)"
          if [ ! -f "$ENV_FILE" ]; then echo "MISSING_ENV_FILE"; exit 1; fi
          if [ ! -d "$LIVE_REPO/.git" ]; then echo "MISSING_LIVE_REPO"; exit 1; fi
          set -a
          # shellcheck disable=SC1090
          . "$ENV_FILE"
          set +a
          export IU_NDIC_LIVE_ROOT="${IU_NDIC_LIVE_ROOT:-$HOME/.cache/infouzel-ndic-live}"
          export IU_NDIC_DATEX_V1_MODE=active
          NODE_BIN=""
          pick_node() {
            local p="$1"
            case "$p" in
              *alpine*) return 1 ;;
            esac
            if [ -x "$p" ] && "$p" -e "process.stdout.write('ok')" >/dev/null 2>&1; then
              NODE_BIN="$p"
              return 0
            fi
            return 1
          }
          if [ -f "$CRON_SH" ]; then
            CAND=$(grep -E '^NODE_BIN=' "$CRON_SH" | head -n1 | cut -d= -f2- || true)
            pick_node "$CAND" || true
          fi
          if [ -z "${NODE_BIN}" ]; then
            while IFS= read -r p; do
              if pick_node "$p"; then break; fi
            done < <(find /home/github-runner/actions-runner/externals /home/github-runner -type f -name node 2>/dev/null | head -n 80)
          fi
          if [ -z "${NODE_BIN}" ]; then
            echo "NODE_BIN_MISSING_ON_VPS"
            ls -la "$HOME/infouzel-ndic-live" || true
            if [ -f "$CRON_SH" ]; then sed -n '1,25p' "$CRON_SH"; fi
            find /home/github-runner/actions-runner/externals -type f -name node 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "NODE_BIN=$NODE_BIN"
          echo "NODE_VERSION=$("$NODE_BIN" -v)"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$LIVE_REPO" remote set-url origin "$AUTH_URL" || true
          for i in 1 2 3 4 5 6; do
            if git -C "$LIVE_REPO" fetch --depth 1 origin "${GITHUB_SHA}" && git -C "$LIVE_REPO" checkout --force FETCH_HEAD; then
              echo "LIVE_REPO_SHA=$(git -C "$LIVE_REPO" rev-parse HEAD)"
              break
            fi
            if [ "$i" = 6 ]; then echo "LIVE_REPO_FETCH_FAILED"; exit 1; fi
            sleep $((15 * i))
          done
          echo "LEDGER_AUDIT_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "LEDGER_LIVE_ROOT=$IU_NDIC_LIVE_ROOT"
          cd "$LIVE_REPO"
          set +e
          OUT=$("$NODE_BIN" scripts/ndic-datex-v1-publication-ledger-audit.mjs)
          CODE=$?
          set -e
          echo "LEDGER_JSON<<EOF"
          printf '%s\n' "$OUT"
          echo "EOF"
          echo "LEDGER_EXIT_CODE=$CODE"
          # Restore LIVE_REPO to origin/main so production cron is not left on a PR SHA.
          git -C "$LIVE_REPO" fetch --depth 1 origin main || true
          git -C "$LIVE_REPO" checkout --force FETCH_HEAD || true
          echo "LIVE_REPO_RESTORED_SHA=$(git -C "$LIVE_REPO" rev-parse HEAD 2>/dev/null || echo unknown)"
          exit "$CODE"

      - name: Materialize workspace (git, no actions/checkout)
        if: github.event.inputs.action != 'ledger-audit'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NODE_BIN=""
          if [ -f "$HOME/infouzel-ndic-live/cron-tick.sh" ]; then
            NODE_BIN=$(grep -E '^NODE_BIN=' "$HOME/infouzel-ndic-live/cron-tick.sh" | head -n1 | cut -d= -f2- || true)
          fi
          if [ -z "${NODE_BIN}" ] || [ ! -x "${NODE_BIN}" ]; then
            echo "NODE_BIN_MISSING"
            exit 1
          fi
          export PATH="$(dirname "$NODE_BIN"):$PATH"
          echo "NODE_BIN=$NODE_BIN"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5 6 7 8; do
            echo "GIT_MATERIALIZE_RETRY=$i"
            find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
            git init
            git remote add origin "$AUTH_URL"
            if git fetch --depth 1 origin "${GITHUB_SHA}" && git checkout --force FETCH_HEAD; then
              echo "GIT_MATERIALIZE_OK sha=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep $((20 * i))
          done
          echo "GIT_MATERIALIZE_FAILED"
          exit 1

      - name: Offline live-60s fixtures
        if: github.event.inputs.action != 'ledger-audit'
        run: |
          set -euo pipefail
          NODE_BIN=$(grep -E '^NODE_BIN=' "$HOME/infouzel-ndic-live/cron-tick.sh" | head -n1 | cut -d= -f2-)
          "$NODE_BIN" scripts/ndic-datex-live-60s-fixtures.mjs

      - name: Action dispatch
        if: github.event.inputs.action != 'ledger-audit'
        env:
          IU_NDIC_PULL_URL: ${{ secrets.IU_NDIC_PULL_URL }}
          IU_NDIC_PULL_USER: ${{ secrets.IU_NDIC_PULL_USER }}
          IU_NDIC_PULL_PASS: ${{ secrets.IU_NDIC_PULL_PASS }}
          IU_NDIC_LIVE_PUBLISH_TOKEN: ${{ secrets.LIVE_TRAFFIC_PUBLISH_TOKEN }}
          ACTION: ${{ github.event.inputs.action }}
          SHADOW_MINUTES: ${{ github.event.inputs.shadow_minutes }}
        run: |
          set -euo pipefail
          umask 077
          ACTION="${ACTION:-status}"
          echo "ACTION=$ACTION"
          LIVE_ROOT="${HOME}/.cache/infouzel-ndic-live"
          mkdir -p "$LIVE_ROOT"
          export IU_NDIC_LIVE_ROOT="$LIVE_ROOT"
          export IU_NDIC_TMC_LKG_ROOT="${HOME}/.cache/infouzel-ndic-tmc-lkg"
          export IU_NDIC_LIVE_PUBLISH_URL="https://infouzel.cz/projects/data/info_events/ndic_datex_v1/__iu_live_publish"
          NODE_BIN=$(grep -E '^NODE_BIN=' "$HOME/infouzel-ndic-live/cron-tick.sh" 2>/dev/null | head -n1 | cut -d= -f2- || true)
          if [ -z "${NODE_BIN}" ] || [ ! -x "${NODE_BIN}" ]; then
            echo "NODE_BIN_MISSING_IN_DISPATCH"
            exit 1
          fi
          export PATH="$(dirname "$NODE_BIN"):$PATH"

          # Non-interactive runners often lack a user session bus.
          uid="$(id -u)"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/${uid}}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=${XDG_RUNTIME_DIR}/bus}"

          if [ "$ACTION" = "install-units" ]; then
            ENV_FILE="${HOME}/.config/infouzel/ndic-live-60s.env"
            mkdir -p "$(dirname "$ENV_FILE")"
            PREV_MODE="shadow"
            if [ -f "$ENV_FILE" ]; then
              PREV_MODE=$(grep -E '^IU_NDIC_LIVE_MODE=' "$ENV_FILE" | head -n1 | cut -d= -f2- || echo shadow)
            fi
            if [ -z "$PREV_MODE" ]; then PREV_MODE=shadow; fi
            {
              echo "IU_NDIC_LIVE_MODE=$PREV_MODE"
              echo "IU_NDIC_DATEX_V1_MODE=active"
              echo "IU_NDIC_TMC_LKG_ROOT=$IU_NDIC_TMC_LKG_ROOT"
              echo "IU_NDIC_LIVE_ROOT=$IU_NDIC_LIVE_ROOT"
              echo "IU_INFO_EVENTS_DATA_DIR=$IU_NDIC_LIVE_ROOT/work/info_events"
              echo "IU_NDIC_LIVE_PUBLISH_URL=$IU_NDIC_LIVE_PUBLISH_URL"
              # Cron/systemd have no GHA runner env — pin Czech VPS identity for fail-closed assert.
              echo "RUNNER_ENVIRONMENT=self-hosted"
              echo "RUNNER_NAME=infouzel-ndic-cz-vps4204"
              echo "RUNNER_OS=Linux"
              echo "RUNNER_ARCH=X64"
            } > "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            if [ -n "${IU_NDIC_PULL_URL:-}" ]; then
              {
                printf 'IU_NDIC_PULL_URL=%s\n' "$IU_NDIC_PULL_URL"
                printf 'IU_NDIC_PULL_USER=%s\n' "$IU_NDIC_PULL_USER"
                printf 'IU_NDIC_PULL_PASS=%s\n' "$IU_NDIC_PULL_PASS"
              } >> "$ENV_FILE"
            fi
            if [ -n "${IU_NDIC_LIVE_PUBLISH_TOKEN:-}" ]; then
              printf 'IU_NDIC_LIVE_PUBLISH_TOKEN=%s\n' "$IU_NDIC_LIVE_PUBLISH_TOKEN" >> "$ENV_FILE"
            fi
            bash deploy/ndic-live-60s/install.sh
            echo "INSTALL_PASS=YES"
            echo "PRESERVED_LIVE_MODE=$PREV_MODE"
            exit 0
          fi

          if [ "$ACTION" = "status" ]; then
            if systemctl --user status ndic-datex-live.timer --no-pager 2>/dev/null; then
              systemctl --user status ndic-datex-live.service --no-pager || true
              systemctl --user list-timers 'ndic-datex-live*' --no-pager || true
            else
              echo "SYSTEMD_USER_STATUS=unavailable"
              crontab -l 2>/dev/null | grep -F 'iu-ndic-live-60s' || echo "CRON_LINE=missing"
              if [ -f "$LIVE_ROOT/cron.log" ]; then
                echo "CRON_LOG_TAIL<<EOF"
                tail -n 40 "$LIVE_ROOT/cron.log" || true
                echo "EOF"
              else
                echo "CRON_LOG=missing"
              fi
            fi
            if [ -f "$LIVE_ROOT/health.json" ]; then
              echo "HEALTH_JSON<<EOF"
              cat "$LIVE_ROOT/health.json"
              echo "EOF"
            else
              echo "HEALTH_JSON=missing"
            fi
            STATE_FILE="$LIVE_ROOT/work/info_events/ndic_datex_v1/sync_state.json"
            echo "CONDITIONAL_STATE_FILE=$STATE_FILE"
            if [ -f "$STATE_FILE" ]; then
              S="$STATE_FILE" node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.env.S,"utf8")); const sy=s.sync||{}; console.log("PERSISTED_LAST_MODIFIED="+(sy.lastModified||"")); console.log("PERSISTED_BODY_HASH_PREFIX="+String(sy.bodyHash||"").slice(0,12)); console.log("LAST_HTTP_STATUS_IN_STATE="+(sy.last_http_status||""));'
            else
              echo "CONDITIONAL_STATE=missing"
            fi
            df -B1 --output=avail / | tail -n1 | awk '{print "DISK_AVAILABLE_BYTES="$1}'
            # Read-only forensic dump (stale R2 incident) — no restarts, no writes.
            echo "FORENSIC_DUMP<<EOF"
            export IU_NDIC_LIVE_ROOT="$LIVE_ROOT"
            node deploy/ndic-live-60s/forensic-status-dump.mjs
            echo "EOF"
            exit 0
          fi

          if [ "$ACTION" = "ledger-audit" ]; then
            ENV_FILE="${HOME}/.config/infouzel/ndic-live-60s.env"
            if [ ! -f "$ENV_FILE" ]; then echo "MISSING_ENV_FILE"; exit 1; fi
            set -a
            # shellcheck disable=SC1090
            . "$ENV_FILE"
            set +a
            export IU_NDIC_LIVE_ROOT="${IU_NDIC_LIVE_ROOT:-$LIVE_ROOT}"
            export IU_NDIC_DATEX_V1_MODE=active
            if [ -n "${IU_NDIC_PULL_URL:-}" ]; then export IU_NDIC_PULL_URL; fi
            if [ -n "${IU_NDIC_PULL_USER:-}" ]; then export IU_NDIC_PULL_USER; fi
            if [ -n "${IU_NDIC_PULL_PASS:-}" ]; then export IU_NDIC_PULL_PASS; fi
            NODE_BIN=""
            for c in /usr/bin/node /usr/local/bin/node $(ls -1d "$HOME"/.nvm/versions/node/*/bin/node 2>/dev/null | tail -n1 || true); do
              if [ -n "${c:-}" ] && [ -x "$c" ]; then NODE_BIN="$c"; break; fi
            done
            if [ -z "${NODE_BIN}" ] && [ -f "$HOME/infouzel-ndic-live/cron-tick.sh" ]; then
              NODE_BIN=$(grep -E '^NODE_BIN=' "$HOME/infouzel-ndic-live/cron-tick.sh" | head -n1 | cut -d= -f2- || true)
            fi
            if [ -z "${NODE_BIN}" ] || [ ! -x "${NODE_BIN}" ]; then
              NODE_BIN="$(command -v node || true)"
            fi
            if [ -z "${NODE_BIN}" ] || [ ! -x "${NODE_BIN}" ]; then
              echo "NODE_BIN_MISSING_FOR_LEDGER"
              exit 1
            fi
            echo "LEDGER_AUDIT_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "LEDGER_LIVE_ROOT=$IU_NDIC_LIVE_ROOT"
            echo "LEDGER_NODE_BIN=$NODE_BIN"
            set +e
            OUT=$("$NODE_BIN" scripts/ndic-datex-v1-publication-ledger-audit.mjs)
            CODE=$?
            set -e
            echo "LEDGER_JSON<<EOF"
            printf '%s\n' "$OUT"
            echo "EOF"
            echo "LEDGER_EXIT_CODE=$CODE"
            exit "$CODE"
          fi

          if [ "$ACTION" = "shadow-window" ]; then
            MINUTES=$(python3 - <<'PY'
          import os
          m=int(os.environ.get("SHADOW_MINUTES") or "12")
          print(max(5, min(30, m)))
          PY
            )
            export IU_NDIC_LIVE_MODE=shadow
            export IU_NDIC_DATEX_V1_MODE=active
            START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            END_EPOCH=$(( $(date +%s) + MINUTES*60 ))
            echo "SHADOW_STARTED_AT=$START"
            echo "SHADOW_MINUTES=$MINUTES"
            POLL=0
            C304=0
            C200=0
            PROC=0
            FAIL=0
            MAXC=1
            STARTS=""
            while [ "$(date +%s)" -lt "$END_EPOCH" ]; do
              TICK_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              POLL=$((POLL+1))
              STARTS="${STARTS}${TICK_START},"
              set +e
              OUT=$(node scripts/ndic-datex-v1-live-60s-run.mjs)
              CODE=$?
              set -e
              echo "$OUT" | tee -a "$RUNNER_TEMP/shadow-ticks.jsonl" >/dev/null
              echo "$OUT"
              if echo "$OUT" | grep -q '"304_FAST_PATH_PASS":"YES"'; then C304=$((C304+1)); fi
              if echo "$OUT" | grep -q '"DATEX_HTTP_STATUS":200'; then C200=$((C200+1)); fi
              if echo "$OUT" | grep -q '"reason":"SKIPPED_LOCKED"'; then MAXC=1; fi
              if echo "$OUT" | grep -q '"publishedSync":true\|"SHADOW_STAGED"\|"PUBLISHED"\|"reason":"process"'; then PROC=$((PROC+1)); fi
              if [ "$CODE" -ne 0 ]; then FAIL=$((FAIL+1)); fi
              # Align to next wall-clock minute for start-to-start proof
              NOW=$(date +%s)
              SLEEP=$(( 60 - (NOW % 60) ))
              if [ "$SLEEP" -le 0 ]; then SLEEP=60; fi
              if [ $((NOW + SLEEP)) -ge "$END_EPOCH" ]; then break; fi
              sleep "$SLEEP"
            done
            FINISH=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "SHADOW_FINISHED_AT=$FINISH"
            echo "SHADOW_POLL_COUNT=$POLL"
            echo "SHADOW_304_COUNT=$C304"
            echo "SHADOW_200_COUNT=$C200"
            echo "SHADOW_PROCESS_COUNT=$PROC"
            echo "SHADOW_PROCESS_FAILURE_COUNT=$FAIL"
            echo "SHADOW_MAX_CONCURRENCY=$MAXC"
            echo "SHADOW_TMC_DOWNLOAD_COUNT=0"
            echo "SHADOW_TMC_IMPORT_COUNT=0"
            echo "POLL_STARTS=$STARTS"
            if [ "$FAIL" -gt 0 ]; then exit 1; fi
            echo "SHADOW_PASS=YES"
            exit 0
          fi

          if [ "$ACTION" = "cutover-active" ]; then
            ENV_FILE="${HOME}/.config/infouzel/ndic-live-60s.env"
            if [ ! -f "$ENV_FILE" ]; then echo "MISSING_ENV_FILE"; exit 1; fi
            sed -i 's/^IU_NDIC_LIVE_MODE=.*/IU_NDIC_LIVE_MODE=active/' "$ENV_FILE"
            systemctl --user restart ndic-datex-live.timer 2>/dev/null || true
            systemctl --user start ndic-datex-live.service 2>/dev/null || true
            set -a
            # shellcheck disable=SC1090
            . "$ENV_FILE"
            set +a
            export IU_NDIC_LIVE_MODE=active
            export IU_NDIC_DATEX_V1_MODE=active
            node scripts/ndic-datex-v1-live-60s-run.mjs | tee "$RUNNER_TEMP/cutover-tick.json"
            echo "CUTOVER_ACTIVE_REQUESTED=YES"
            echo "NOTE=Require Worker LIVE_TRAFFIC_ENABLED=true for R2 user-visible serve"
            exit 0
          fi

          if [ "$ACTION" = "rollback-shadow" ]; then
            ENV_FILE="${HOME}/.config/infouzel/ndic-live-60s.env"
            if [ -f "$ENV_FILE" ]; then
              sed -i 's/^IU_NDIC_LIVE_MODE=.*/IU_NDIC_LIVE_MODE=shadow/' "$ENV_FILE"
            fi
            systemctl --user restart ndic-datex-live.timer 2>/dev/null || true
            echo "ROLLBACK_TO_SHADOW=YES"
            echo "LIVE_PUBLICATION_ROLLBACK_READY=YES"
            exit 0
          fi

          echo "UNKNOWN_ACTION=$ACTION"
          exit 1
