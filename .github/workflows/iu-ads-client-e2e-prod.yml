# Production Client E2E for InfoUzel Ads (never prints codes/tokens).
name: IU Ads Client E2E (prod)

permissions:
  contents: read


on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: iu-ads-client-e2e
  cancel-in-progress: false

jobs:
  client-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/iu-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      ADS_CODE_PEPPER: ${{ secrets.ADS_CODE_PEPPER }}
      ADS_BASE_URL: "https://ads.infouzel.cz"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-ads/package-lock.json
      - name: Install
        run: npm ci
      - name: Secrets present (names only)
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "MISSING=CLOUDFLARE_API_TOKEN"; exit 1; fi
          if [ -z "${ADS_CODE_PEPPER}" ]; then echo "MISSING=ADS_CODE_PEPPER"; exit 1; fi
          echo "SECRETS=OK"
      - name: Client E2E prod
        run: node scripts/iu-ads-client-e2e-prod.mjs
