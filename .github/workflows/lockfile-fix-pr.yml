# One-off: create a PR that syncs package-lock.json and verifies npm ci. No production code changes.
name: Lockfile fix PR

on:
  workflow_dispatch:

jobs:
  lockfile-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install and verify lockfile only
        run: |
          npm install
          echo "--- Changed tracked files ---"
          git diff --name-only
          git diff --cached --name-only
          CHANGED=$( (git diff --name-only; git diff --cached --name-only) | sort -u )
          if echo "$CHANGED" | grep -v '^package-lock.json$' | grep -q .; then
            echo "Only package-lock.json may be changed. Aborting."
            exit 1
          fi
          if ! echo "$CHANGED" | grep -q 'package-lock.json'; then
            echo "package-lock.json must be changed. Nothing to do."
            exit 1
          fi
          npm ci

      - name: Create branch and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b fix/lockfile-sync-npm-ci
          git add package-lock.json
          git commit -m "Fix: sync package-lock for CI (npm ci)"
          git push origin fix/lockfile-sync-npm-ci

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head fix/lockfile-sync-npm-ci \
            --title "Fix: sync package-lock for CI (npm ci)" \
            --body "Synced package-lock.json via lockfile-fix workflow. npm ci verified. No production code changes."
