# Deploy InfoUzel Analytics (Cloudflare Worker + D1)
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN — Workers + D1 edit
#   IU_ANALYTICS_ADMIN_TOKEN — Bearer token for admin/ad report APIs
name: Deploy IU Analytics

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "cloudflare/iu-analytics/**"
      - ".github/workflows/deploy-iu-analytics.yml"

concurrency:
  group: deploy-iu-analytics
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/iu-analytics
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-analytics/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Ensure D1 database + patch wrangler.toml database_id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN missing"
            exit 1
          fi
          LIST_JSON=$(npx wrangler d1 list --json || echo "[]")
          export LIST_JSON
          ID=$(node <<'NODE'
          const raw = process.env.LIST_JSON || "[]";
          let arr = [];
          try { arr = JSON.parse(raw); } catch { arr = []; }
          const hit = (Array.isArray(arr) ? arr : []).find((x) => x && x.name === "iu-analytics");
          if (hit && (hit.uuid || hit.id)) {
            process.stdout.write(String(hit.uuid || hit.id));
            process.exit(0);
          }
          process.exit(2);
          NODE
          ) || true
          if [ -z "${ID:-}" ]; then
            CREATE_OUT=$(npx wrangler d1 create iu-analytics)
            echo "$CREATE_OUT"
            ID=$(printf '%s' "$CREATE_OUT" | sed -n 's/.*database_id[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
          fi
          if [ -z "${ID:-}" ]; then
            echo "ERROR: could not resolve D1 database_id"
            exit 1
          fi
          echo "D1_ID=$ID"
          export ID
          node <<'NODE'
          const fs = require("fs");
          const id = process.env.ID;
          let t = fs.readFileSync("wrangler.toml", "utf8");
          t = t.replace(/database_id\s*=\s*"[^"]*"/, 'database_id = "' + id + '"');
          fs.writeFileSync("wrangler.toml", t);
          NODE

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute iu-analytics --remote --file=./schema.sql

      - name: Put ADMIN_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IU_ANALYTICS_ADMIN_TOKEN: ${{ secrets.IU_ANALYTICS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IU_ANALYTICS_ADMIN_TOKEN:-}" ]; then
            echo "WARN: IU_ANALYTICS_ADMIN_TOKEN missing — admin/ad report APIs stay locked until secret is set and redeployed."
            exit 0
          fi
          printf '%s' "$IU_ANALYTICS_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Probe health
        run: |
          set -euo pipefail
          curl -fsS "https://infouzel-analytics.josef-zmrhal.workers.dev/health"
          echo ""
          curl -fsS "https://infouzel-analytics.josef-zmrhal.workers.dev/v1/public/stats" | head -c 2000
          echo ""
