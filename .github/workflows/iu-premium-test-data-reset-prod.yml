name: IU Premium test data reset (prod operator)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      operator_approved:
        description: "Must type APPROVED to allow destructive prod reset"
        type: string
        required: true

concurrency:
  group: iu-premium-test-data-reset-prod
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.operator_approved == 'APPROVED' }}
    defaults:
      run:
        working-directory: cloudflare/iu-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      ADS_PASSWORD_PEPPER: ${{ secrets.ADS_PASSWORD_PEPPER }}
      ADS_BASE_URL: "https://ads.infouzel.cz"
      IU_PREMIUM_TEST_RESET_APPROVED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-ads/package-lock.json
      - name: Install
        run: npm ci
      - name: Operator test data reset
        run: node scripts/iu-premium-test-data-reset-prod.mjs
