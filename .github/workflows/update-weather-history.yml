name: Update Weather History

concurrency:
  group: weather-history-writer
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build weather history dataset (RSS + oEmbed)
        run: python scripts/build_weather_history.py

      - name: Detect changes
        id: detect_changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- projects/data/weather_history_videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[DATA] No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[DATA] Changed."
          fi

      - name: Commit & push (only if changed)
        if: ${{ steps.detect_changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/data/weather_history_videos.json
          git commit -m "auto: update weather history dataset [skip ci]" || exit 0
          git push

name: Update weather history dataset

concurrency:
  group: data-writers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync with branch
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Build weather history dataset (retro YouTube)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build_weather_history.py

      - name: Detect data changes
        id: detect_changes
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain projects/data/weather_history_videos.json | grep -q .; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "[DATA] data_changed=true"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "[DATA] data_changed=false"
          fi

      - name: Commit & push (safe, rebase + retry)
        id: commit_push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "[DATA] No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "[DATA] Nothing staged after add."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "auto: update weather history dataset" || true

          for i in 1 2 3; do
            echo "[PUSH] Attempt $i/3"
            git fetch origin "${GITHUB_REF_NAME}"

            git rebase "origin/${GITHUB_REF_NAME}" || (git rebase --abort && exit 1)

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "[PUSH] Success."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "[PUSH] Failed, retrying..."
            sleep 2
          done

          echo "[PUSH] Failed after retries."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 1

