name: Update Weather History dataset

concurrency:
  group: data-writers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Ensure output folder
        run: |
          mkdir -p projects/data

      - name: Build weather history dataset (safe)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build_weather_history.py

      - name: Validate dataset JSON + gates
        run: |
          python - <<'PY'
          import json, sys
          p = "projects/data/weather_history_videos.json"
          with open(p, "r", encoding="utf-8") as f:
            d = json.load(f)
          items = d.get("items") if isinstance(d, dict) else None
          if not isinstance(items, list):
            print("ERROR: items not list")
            sys.exit(1)
          if len(items) <= 0:
            print("ERROR: dataset empty")
            sys.exit(1)
          if len(items) > 500:
            print("ERROR: dataset > 500")
            sys.exit(1)
          seen = set()
          for it in items:
            if not isinstance(it, dict):
              continue
            vid = str(it.get("id") or "").strip()
            if not vid:
              continue
            if vid in seen:
              print("ERROR: duplicate id", vid)
              sys.exit(1)
            seen.add(vid)
          print("OK: dataset valid items=", len(items))
          PY

      - name: Commit & push (safe, rebase + retry)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "[DATA] No changes to commit."
            exit 0
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "[DATA] Nothing staged after add."
            exit 0
          fi

          git commit -m "auto: update weather history dataset" || true

          BRANCH="main"
          for i in 1 2 3; do
            echo "[PUSH] Attempt $i/3"
            git fetch origin "${BRANCH}"

            git rebase "origin/${BRANCH}" || (git rebase --abort && exit 1)

            if git push origin "HEAD:${BRANCH}"; then
              echo "[PUSH] Success."
              exit 0
            fi

            echo "[PUSH] Failed, retrying..."
            sleep 2
          done

          echo "[PUSH] Failed after retries."
          exit 1

