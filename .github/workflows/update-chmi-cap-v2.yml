name: Update CHMI CAP v2

# CAP v2 sync every 5 min (GitHub schedule is best-effort; */5 leaves headroom for
# transform + data-only checks + auto-merge + Pages dispatch within 15 min E2E SLA).
# Completeness: newest bulletin per CAP product stream (no fixed maxFiles / first-N).
# Data PR must receive required checks and auto-merge; incomplete sync = FAIL (no silent healthy).
# After merge, explicitly dispatch pages.yml (bot GITHUB_TOKEN merges do not reliably trigger pushĂ˘â€ â€™pages).
#
# NARROW SHARED WRITER LOCK:
# - Prep (network/parse/validate/build candidate) runs WITHOUT info-events-data-writers.
# - Critical RMW/commit holds info-events-data-writers only briefly and RE-READS live feed/monitoring.
# - PR wait + Pages dispatch run AFTER lock release.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | shadow | active"
        required: false
        default: "active"
  schedule:
    # schedule-reregister: 2026-08-17T16:12Z — workflow was disabled_manually since
    # 2026-08-12 (root cause of stale CAP). Re-enabled + comment-only rebind.
    # Incident 2026-09-05: again disabled_manually → lastSuccessAt 2026-08-20;
    # freshness watchdog FAIL WORKFLOW_DISABLED; re-enabled via gh workflow enable.
    # Do NOT disable/enable for rebind; keep workflow active.
    - cron: "*/5 * * * *"

# One orchestrator at a time — overlapping schedule/dispatch must not cancel a running post-write E2E.
concurrency:
  group: update-chmi-cap-v2-orchestrator
  cancel-in-progress: false

# Intentionally NO workflow-level info-events-data-writers lock (overbroad / NDIC starvation).
# Shared lock lives only on job shared-write below.

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

env:
  AUTOMATION_BRANCH: automation/update-chmi-cap-v2
  PR_TITLE: "chore(data): refresh CHMI CAP v2 snapshot"
  IU_CHMI_E2E_SLA_MS: "900000"

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_ready: ${{ steps.pack.outputs.candidate_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: CAP v2 guard (fixtures)
        run: npm run iu-chmi-cap-v2-guard

      - name: CAP v2 architecture validation
        run: npm run iu-chmi-cap-v2-architecture-validation

      - name: Prep sandbox + Sync CHMI CAP v2 (no shared lock)
        id: sync
        env:
          IU_CHMI_CAP_V2_MODE: ${{ github.event.inputs.mode || vars.IU_CHMI_CAP_V2_MODE || 'active' }}
          IU_CHMI_CAP_V2_DISCOVERY: ${{ vars.IU_CHMI_CAP_V2_DISCOVERY || 'opendata_active_streams' }}
        run: |
          set -euo pipefail
          CAND="${RUNNER_TEMP}/chmi-ie-candidate"
          rm -rf "$CAND"
          mkdir -p "$CAND"
          cp -a projects/data/info_events/. "$CAND/"
          export IU_INFO_EVENTS_DATA_DIR="$CAND"
          echo "discoveredAt_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/chmi-cap-v2-prod-sync.mjs
          node scripts/chmi-cap-v2-orchestrator-e2e-record.mjs \
            --data-dir="$CAND" \
            --run-id="${{ github.run_id }}" \
            --run-attempt="${{ github.run_attempt }}" \
            --phase=prep \
            --outcome=source_processed
          echo "transformedAt_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "candidate_dir=$CAND" >> "$GITHUB_OUTPUT"

      - name: Pack candidate artifact
        id: pack
        run: |
          set -euo pipefail
          CAND="${RUNNER_TEMP}/chmi-ie-candidate"
          test -d "$CAND"
          echo "candidate_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload CHMI candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chmi-ie-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/chmi-ie-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  shared-write:
    needs: prep
    if: needs.prep.outputs.candidate_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: info-events-data-writers
      cancel-in-progress: false
      # FIFO queue (up to 100). Required on EVERY shared writer (CHMI/IE/NDIC).
      # Default single-pending cancels waiters (31250620970) and â€” when main CHMI lacked
      # queue max â€” cancelled running NDIC shared-write (31265716770 / MAIN_CHMI_MISSING_QUEUE_MAX).
      queue: max
    outputs:
      pushed: ${{ steps.commit_push.outputs.pushed }}
      committedAt_utc: ${{ steps.commit_push.outputs.committedAt_utc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Refresh main tip before shared write
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "${{ env.AUTOMATION_BRANCH }}" origin/main

      - name: Download CHMI candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chmi-ie-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/chmi-ie-candidate

      - name: Apply CHMI candidate (re-read live shared state)
        run: |
          set -euo pipefail
          node scripts/info-events-shared-writer-critical.mjs chmi \
            "${RUNNER_TEMP}/chmi-ie-candidate" \
            "projects/data/info_events"

      - name: Commit data if changed
        id: commit_push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/data/info_events
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          git commit -m "${{ env.PR_TITLE }}"
          git push -u origin "HEAD:refs/heads/${BRANCH}" --force
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "committedAt_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  orchestrator-noop-report:
    needs: [prep, shared-write]
    if: needs.shared-write.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download CHMI candidate (noop attempt record)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chmi-ie-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/chmi-ie-candidate

      - name: Write orchestrator noop summary (no repo commit)
        run: |
          set -euo pipefail
          CAND="${RUNNER_TEMP}/chmi-ie-candidate"
          node scripts/chmi-cap-v2-orchestrator-e2e-record.mjs \
            --data-dir="$CAND" \
            --run-id="${{ github.run_id }}" \
            --run-attempt="${{ github.run_attempt }}" \
            --phase=shared-write \
            --outcome=no_data_change \
            --pushed=false
          JSON="$CAND/chmi_cap_v2/orchestrator_e2e.json"
          test -f "$JSON"
          {
            echo "## CHMI orchestrator noop (NO_CHANGES)"
            echo '```json'
            cat "$JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload noop attempt artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chmi-orchestrator-noop-${{ github.run_id }}
          path: ${{ runner.temp }}/chmi-ie-candidate/chmi_cap_v2/orchestrator_e2e.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  post-write:
    needs: shared-write
    if: needs.shared-write.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # NO info-events-data-writers Ă˘â‚¬â€ť checks/Pages must not hold the shared writer lock.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUTOMATION_BRANCH }}
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: true

      - name: Create or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "[PR] Updated existing PR #$EXISTING"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "${{ env.PR_TITLE }}" \
            --body "Automated CHMI CAP v2 sync (*/5). Completeness: all CAP product-stream heads, union of active hazards, conditional GET + bulletin cache. Data-only auto-merge after required checks. Pages.yml is dispatched explicitly after merge (15 min E2E SLA). Shared writer lock held only during critical RMW/commit."
          NUM=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "[PR] Created PR #$NUM"

      - name: Merge latest main into PR head if behind
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && exit 0
          gh api --method PUT "repos/${{ github.repository }}/pulls/${NUM}/update-branch" || echo "[SYNC] update-branch skipped"

      - name: Diff scope check (data-only → allow auto-merge)
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && { echo "data_only=false" >> "$GITHUB_OUTPUT"; exit 1; }
          BASE=$(gh pr view "$NUM" --json baseRefOid -q .baseRefOid)
          HEAD=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
          echo "[SCOPE] pr=$NUM base=$BASE head=$HEAD"
          CHANGED=$(gh pr diff "$NUM" --name-only)
          echo "[SCOPE] PR changed files:"
          echo "$CHANGED"
          if [ -z "$(echo "$CHANGED" | tr -d '[:space:]')" ]; then
            echo "[SCOPE] empty PR diff — FAIL (no auto-merge)"
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          DATA_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              projects/data/info_events/*) ;;
              *) DATA_ONLY=false; break ;;
            esac
          done <<< "$CHANGED"
          if [ "$DATA_ONLY" = true ]; then
            echo "data_only=true" >> "$GITHUB_OUTPUT"
            echo "[SCOPE] data-only — auto-merge allowed"
          else
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "[SCOPE] non-data change — auto-merge disabled (FAIL)"
            exit 1
          fi

      - name: Dispatch required checks
        if: steps.scope.outputs.data_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ env.AUTOMATION_BRANCH }}"
          REPO="${{ github.repository }}"
          gh workflow run smoke.yml --ref "$REF" --repo "$REPO"
          gh workflow run layout-guard.yml --ref "$REF" --repo "$REPO"
          gh workflow run repo-guard.yml --ref "$REF" --repo "$REPO"
          echo "[CHECKS] Dispatched smoke, layout-guard, repo-guard on $REF"

      - name: Dispatch iu-ads-regression-freeze (bot PR workflow_dispatch)
        if: steps.scope.outputs.data_only == 'true'
        id: ensure_ads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          REPO="${{ github.repository }}"
          REF="${{ env.AUTOMATION_BRANCH }}"
          SHA=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
          echo "[ADS] dispatch pr=$NUM ref=$REF head=$SHA"
          gh workflow run iu-ads-regression-freeze.yml --ref "$REF" --repo "$REPO" -f "pr_number=${NUM}"
          for i in $(seq 1 36); do
            SHA=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
            echo "[ADS] wait attempt=$i sha=$SHA"
            CR=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name=="iu-ads-regression-freeze")] | sort_by(.started_at) | last // empty')
            if [ -n "$CR" ] && [ "$CR" != "null" ]; then
              APP=$(echo "$CR" | jq -r '.app.slug // ""')
              ST=$(echo "$CR" | jq -r '.status // ""')
              CO=$(echo "$CR" | jq -r '.conclusion // ""')
              echo "[ADS] check app=$APP status=$ST conclusion=$CO"
              if [ "$CO" = "success" ] && [ "$APP" = "github-actions" ]; then
                echo "ads_ok=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$CO" = "failure" ] || [ "$CO" = "timed_out" ]; then
                echo "[ADS] check failed"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "[ADS] timeout waiting for GHA iu-ads-regression-freeze on PR head"
          exit 1

      - name: Enable auto-merge (squash) when data-only
        if: steps.scope.outputs.data_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && exit 0
          gh pr merge "$NUM" --auto --squash
          echo "[AUTO-MERGE] Enabled for PR #$NUM"

      - name: Wait for required checks (fail if missing/failing)
        if: steps.scope.outputs.data_only == 'true'
        id: wait_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && exit 0
          SHA=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
          echo "[WAIT] PR #$NUM sha=$SHA"
          for i in $(seq 1 48); do
            MERGED=$(gh pr view "$NUM" --json state -q .state)
            if [ "$MERGED" = "MERGED" ]; then
              echo "[WAIT] PR already merged"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              echo "mergedAt_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SHA=$(gh pr view "$NUM" --json headRefOid -q .headRefOid)
            REPO="${{ github.repository }}"
            ROLLUP=$(gh pr view "$NUM" --json mergeStateStatus,statusCheckRollup -q '{m:.mergeStateStatus,c:[.statusCheckRollup[]? | {name:(.name // .context), conclusion:(.conclusion // .state)}]}')
            echo "[WAIT] attempt=$i sha=$SHA $ROLLUP"
            FAIL=$(echo "$ROLLUP" | jq -r '[.c[] | select(((.conclusion // "")|ascii_downcase) == "failure" or ((.conclusion // "")|ascii_downcase) == "cancelled" or ((.conclusion // "")|ascii_downcase) == "error")] | length')
            ADS_FAIL=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --jq '[.check_runs[] | select(.name=="iu-ads-regression-freeze" and (.conclusion=="failure" or .conclusion=="timed_out"))] | length')
            if [ "$FAIL" != "0" ] || [ "$ADS_FAIL" != "0" ]; then
              echo "[WAIT] required check failed rollup_fail=$FAIL ads_fail=$ADS_FAIL"
              gh pr checks "$NUM" || true
              exit 1
            fi
            HAVE=0
            for ctx in repo-guard smoke layout-guard; do
              HIT=$(echo "$ROLLUP" | jq -r --arg n "$ctx" '[.c[] | select((.name|ascii_downcase) == ($n|ascii_downcase) and ((.conclusion|ascii_downcase)=="success"))] | length')
              if [ "$HIT" != "0" ]; then HAVE=$((HAVE + 1)); fi
            done
            ADS_OK=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" --jq '[.check_runs[] | select(.name=="iu-ads-regression-freeze" and .conclusion=="success" and .app.slug=="github-actions")] | length')
            if [ "$ADS_OK" != "0" ]; then HAVE=$((HAVE + 1)); fi
            echo "[WAIT] required contexts ready ($HAVE/4) ads_ok=$ADS_OK"
            if [ "$HAVE" -lt 4 ]; then
              if [ "$ADS_OK" = "0" ] && [ "$i" = "6" ]; then
                echo "[WAIT] re-dispatch iu-ads-regression-freeze"
                gh workflow run iu-ads-regression-freeze.yml --ref "${{ env.AUTOMATION_BRANCH }}" --repo "$REPO" -f "pr_number=${NUM}" || true
              fi
              sleep 15
              continue
            fi
            echo "[WAIT] all 4 required contexts satisfied (iu-ads via check-runs API)"
            for _try in $(seq 1 36); do
              ST=$(gh pr view "$NUM" --json state -q .state)
              if [ "$ST" = "MERGED" ]; then
                echo "[WAIT] auto-merge completed (try=$_try)"
                echo "merged=true" >> "$GITHUB_OUTPUT"
                echo "mergedAt_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 10
            done
            MS=$(echo "$ROLLUP" | jq -r .m)
            echo "[WAIT] checks satisfied but PR not merged (mergeState=$MS) — leaving auto-merge enabled"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "[WAIT] timeout waiting for checks"
          gh pr checks "$NUM" || true
          exit 1

      - name: Dispatch Pages after successful data merge
        if: steps.scope.outputs.data_only == 'true' && steps.wait_merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[PAGES] publish_dispatch_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pages.yml --ref main --repo "${{ github.repository }}"
          echo "[PAGES] Dispatched pages.yml on main after CHMI data merge"
          gh workflow run pages-publish-from-main-data.yml --ref main --repo "${{ github.repository }}" || true
