name: Update CHMI CAP v2

# CAP v2 sync every 15 min. Completeness: top N concurrent bulletins (default 15),
# per-URL bulletin cache, union of active hazards. Feature flag via env/vars.
# Does NOT crawl the full CAP archive.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | shadow | active"
        required: false
        default: "active"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: update-chmi-cap-v2
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  AUTOMATION_BRANCH: automation/update-chmi-cap-v2
  PR_TITLE: "chore(data): refresh CHMI CAP v2 snapshot"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full-history clone can hang on this large repo (see smoke.yml).
          # Data sync only needs current tree + shallow push of automation branch.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CAP v2 guard (fixtures)
        run: npm run iu-chmi-cap-v2-guard

      - name: Sync CHMI CAP v2
        env:
          IU_CHMI_CAP_V2_MODE: ${{ github.event.inputs.mode || vars.IU_CHMI_CAP_V2_MODE || 'active' }}
          IU_CHMI_CAP_V2_DISCOVERY: ${{ vars.IU_CHMI_CAP_V2_DISCOVERY || 'opendata_newest_file' }}
          IU_CHMI_CAP_V2_MAX_FILES: ${{ vars.IU_CHMI_CAP_V2_MAX_FILES || '15' }}
        run: node scripts/chmi-cap-v2-prod-sync.mjs

      - name: Commit data if changed
        id: commit_push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/data/info_events
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          git checkout -B "$BRANCH"
          git commit -m "${{ env.PR_TITLE }}"
          git push -u origin "$BRANCH" --force
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch required checks
        if: steps.commit_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ env.AUTOMATION_BRANCH }}"
          REPO="${{ github.repository }}"
          gh workflow run smoke.yml --ref "$REF" --repo "$REPO"
          gh workflow run layout-guard.yml --ref "$REF" --repo "$REPO"
          gh workflow run repo-guard.yml --ref "$REF" --repo "$REPO"
          echo "[CHECKS] Dispatched smoke, layout-guard, repo-guard on $REF"

      - name: Create or update PR
        if: steps.commit_push.outputs.pushed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ env.AUTOMATION_BRANCH }}"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "[PR] Updated existing PR #$EXISTING"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "${{ env.PR_TITLE }}" \
            --body "Automated CHMI CAP v2 sync (15 min). Completeness: top-N concurrent bulletins, union of active hazards, conditional GET with per-URL bulletin cache."
          NUM=$(gh pr list --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "[PR] Created PR #$NUM"

      - name: Merge latest main into PR head if behind (unblock auto-merge)
        if: steps.commit_push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && exit 0
          gh api --method PUT "repos/${{ github.repository }}/pulls/${NUM}/update-branch" || echo "[SYNC] update-branch skipped"

      - name: Diff scope check (data-only → allow auto-merge)
        if: steps.commit_push.outputs.pushed == 'true'
        id: scope
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only main...HEAD)
          echo "[SCOPE] Changed files:"
          echo "$CHANGED"
          DATA_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              projects/data/info_events/*) ;;
              *) DATA_ONLY=false; break ;;
            esac
          done <<< "$CHANGED"
          if [ "$DATA_ONLY" = true ]; then
            echo "data_only=true" >> "$GITHUB_OUTPUT"
            echo "[SCOPE] data-only — auto-merge allowed"
          else
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "[SCOPE] non-data change — auto-merge disabled"
          fi

      - name: Enable auto-merge (squash) when data-only
        if: steps.commit_push.outputs.pushed == 'true' && steps.scope.outputs.data_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.pr_number }}"
          [ -z "$NUM" ] && exit 0
          gh pr merge "$NUM" --auto --squash
          echo "[AUTO-MERGE] Enabled for PR #$NUM"
