name: CI - Data Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-data-freshness.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-data-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          ls -la projects/data || true
          echo "---"
          test -f projects/data/articles.json && echo "articles.json exists" || echo "articles.json missing"
          test -f projects/data/videos.json && echo "videos.json exists" || echo "videos.json missing"

      # Repo freshness vs automation SLA: */5 publish check (GitHub min) + merge + Pages deploy.
      # 360m (6h) covers observed backlog (~255m) with margin; fails if main data older than 6h.
      - name: Freshness check (max age minutes)
        env:
          MAX_AGE_MINUTES: "360"
          PENDING_PR_GRACE_MINUTES: "420"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys, datetime, pathlib, subprocess

          max_age_minutes = int(os.environ.get("MAX_AGE_MINUTES","360"))
          pending_grace = int(os.environ.get("PENDING_PR_GRACE_MINUTES","420"))
          now = datetime.datetime.now(datetime.timezone.utc)

          def parse_iso(s):
            if not s: return None
            s = s.strip()
            if s.endswith("Z"):
              s = s[:-1] + "+00:00"
            try:
              dt = datetime.datetime.fromisoformat(s)
              if dt.tzinfo is None:
                dt = dt.replace(tzinfo=datetime.timezone.utc)
              return dt
            except Exception:
              return None

          def check(path, required=True):
            p = pathlib.Path(path)
            if not p.exists():
              if required:
                return (False, f"missing(required): {path}")
              return (True, f"missing(optional): {path}")
            try:
              data = json.loads(p.read_text(encoding="utf-8"))
            except Exception as e:
              return (False, f"invalid json: {path} ({e})")

            candidates = []
            if isinstance(data, dict):
              meta = data.get("meta") if isinstance(data.get("meta"), dict) else {}
              candidates += [
                meta.get("generatedAt"),
                meta.get("builtAt"),
                meta.get("updatedAt"),
                data.get("generatedAt"),
                data.get("builtAt"),
                data.get("updatedAt"),
              ]

            ts = None
            for c in candidates:
              ts = parse_iso(c) if isinstance(c, str) else None
              if ts:
                break

            if not ts:
              ts = datetime.datetime.fromtimestamp(p.stat().st_mtime, tz=datetime.timezone.utc)

            age = (now - ts).total_seconds() / 60.0
            ok = age <= max_age_minutes
            msg = f"{path}: ts={ts.isoformat()} age_min={age:.1f} limit={max_age_minutes}"
            return (ok, msg)

          def pending_data_pr_recent():
            repo = os.environ.get("GITHUB_REPOSITORY") or ""
            if not repo:
              return None
            try:
              out = subprocess.run(
                [
                  "gh", "pr", "list", "--repo", repo,
                  "--head", "automation/update-articles-data",
                  "--base", "main", "--state", "open",
                  "--json", "updatedAt,title,mergeStateStatus",
                ],
                capture_output=True, text=True, timeout=60,
                env={**os.environ},
              )
              if out.returncode != 0 or not out.stdout.strip():
                return None
              arr = json.loads(out.stdout)
              if not arr:
                return None
              pr = arr[0]
              u = parse_iso(pr.get("updatedAt") or "")
              if not u:
                return None
              age_min = (now - u).total_seconds() / 60.0
              return (age_min, pr.get("mergeStateStatus"), pr.get("title"))
            except Exception as e:
              print("[freshness] pending_pr_check_error", e)
              return None

          ok1, msg1 = check("projects/data/articles.json", required=True)
          ok2, msg2 = check("projects/data/videos.json", required=False)

          print("[freshness]", msg1)
          print("[freshness]", msg2)

          if not ok1:
            pend = pending_data_pr_recent()
            if pend is not None:
              age_min, mss, title = pend
              if age_min <= pending_grace:
                print("[freshness] main stale but open data PR updated %.0f min ago (mergeState=%s) title=%s — OK pending pipeline" % (age_min, mss, title))
                print("OK: freshness grace (pending data PR)")
                sys.exit(0)
              print("[freshness] open data PR is stale (%.0f min since update, grace=%s) — not a pending pipeline" % (age_min, pending_grace))
            print("FAIL: articles data too old or missing")
            sys.exit(1)

          print("OK: data freshness within limit")
          PY

      - name: Production articles freshness guard (live JSON)
        env:
          ARTICLES_JSON_URL: "https://infouzel.cz/projects/data/articles.json"
          MAX_GENERATED_AGE_HOURS: "48"
          MAX_SECTION_AGE_HOURS: "72"
        run: node scripts/articles-aggregator-freshness-guard.mjs
