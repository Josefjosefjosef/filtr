name: CI - Data Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - "projects/data/articles.json"
      - "projects/data/videos.json"
      - ".github/workflows/ci-data-freshness.yml"

permissions:
  contents: read

concurrency:
  group: ci-data-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          ls -la projects/data || true
          echo "---"
          test -f projects/data/articles.json && echo "articles.json exists" || echo "articles.json missing"
          test -f projects/data/videos.json && echo "videos.json exists" || echo "videos.json missing"

      - name: Freshness check (max age minutes)
        env:
          MAX_AGE_MINUTES: "90"
        run: |
          python - <<'PY'
          import json, os, sys, datetime, pathlib

          max_age_minutes = int(os.environ.get("MAX_AGE_MINUTES","90"))
          now = datetime.datetime.utcnow().replace(tzinfo=datetime.timezone.utc)

          def parse_iso(s):
            if not s: return None
            s = s.strip()
            if s.endswith("Z"):
              s = s[:-1] + "+00:00"
            try:
              return datetime.datetime.fromisoformat(s)
            except Exception:
              return None

          def check(path):
            p = pathlib.Path(path)
            if not p.exists():
              return (False, f"missing: {path}")
            try:
              data = json.loads(p.read_text(encoding="utf-8"))
            except Exception as e:
              return (False, f"invalid json: {path} ({e})")

            candidates = []
            if isinstance(data, dict):
              meta = data.get("meta") if isinstance(data.get("meta"), dict) else {}
              candidates += [
                meta.get("generatedAt"),
                meta.get("builtAt"),
                meta.get("updatedAt"),
                data.get("generatedAt"),
                data.get("builtAt"),
                data.get("updatedAt"),
              ]
            ts = None
            for c in candidates:
              ts = parse_iso(c) if isinstance(c, str) else None
              if ts:
                break

            if not ts:
              ts = datetime.datetime.fromtimestamp(p.stat().st_mtime, tz=datetime.timezone.utc)

            age = (now - ts).total_seconds() / 60.0
            ok = age <= max_age_minutes
            msg = f"{path}: ts={ts.isoformat()} age_min={age:.1f} limit={max_age_minutes}"
            return (ok, msg)

          ok1, msg1 = check("projects/data/articles.json")
          ok2, msg2 = check("projects/data/videos.json")
          print("[freshness]", msg1)
          print("[freshness]", msg2)

          if not (ok1 and ok2):
            print("FAIL: data too old or missing")
            sys.exit(1)
          print("OK: data freshness within limit")
          PY
