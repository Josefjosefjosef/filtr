name: CI data freshness

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check generatedAt timestamp
        run: |
          set -euo pipefail
          if [ ! -f projects/data/articles.json ]; then
            echo "Missing projects/data/articles.json"
            exit 1
          fi
          generated=$(python - <<'PY'
import json, datetime, sys

with open("projects/data/articles.json", "r", encoding="utf-8") as fh:
    data = json.load(fh)

ts = (
    data.get("generatedAt") or
    data.get("updatedAt") or
    data.get("buildAt")
)

if not ts:
    print("Missing timestamp")
    sys.exit(1)

try:
    parsed = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
except ValueError:
    print("Invalid timestamp:", ts)
    sys.exit(1)

age = datetime.datetime.utcnow() - parsed
print(f"generatedAt: {ts} (age minutes: {age.total_seconds()/60:.1f})")
print(f"{age.total_seconds()/60:.1f}")
print(age.total_seconds()/60 > 30)
sys.exit(1 if age.total_seconds()/60 > 30 else 0)
PY)

