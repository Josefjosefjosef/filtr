name: CI - Data Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-data-freshness.yml"

permissions:
  contents: read

concurrency:
  group: ci-data-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          ls -la projects/data || true
          echo "---"
          test -f projects/data/articles.json && echo "articles.json exists" || echo "articles.json missing"
          test -f projects/data/videos.json && echo "videos.json exists" || echo "videos.json missing"

      # Repo freshness vs automation SLA: */11 cron + build (~15m) + merge-queue + Pages (~25m).
      # 360m (6h) covers observed backlog (~255m) with margin; fails if main data older than 6h.
      - name: Freshness check (max age minutes)
        env:
          MAX_AGE_MINUTES: "360"
        run: |
          python - <<'PY'
          import json, os, sys, datetime, pathlib

          max_age_minutes = int(os.environ.get("MAX_AGE_MINUTES","360"))
          now = datetime.datetime.utcnow().replace(tzinfo=datetime.timezone.utc)

          def parse_iso(s):
            if not s: return None
            s = s.strip()
            if s.endswith("Z"):
              s = s[:-1] + "+00:00"
            try:
              dt = datetime.datetime.fromisoformat(s)
              if dt.tzinfo is None:
                dt = dt.replace(tzinfo=datetime.timezone.utc)
              return dt
            except Exception:
              return None

          def check(path, required=True):
            p = pathlib.Path(path)
            if not p.exists():
              if required:
                return (False, f"missing(required): {path}")
              return (True, f"missing(optional): {path}")
            try:
              data = json.loads(p.read_text(encoding="utf-8"))
            except Exception as e:
              return (False, f"invalid json: {path} ({e})")

            candidates = []
            if isinstance(data, dict):
              meta = data.get("meta") if isinstance(data.get("meta"), dict) else {}
              candidates += [
                meta.get("generatedAt"),
                meta.get("builtAt"),
                meta.get("updatedAt"),
                data.get("generatedAt"),
                data.get("builtAt"),
                data.get("updatedAt"),
              ]

            ts = None
            for c in candidates:
              ts = parse_iso(c) if isinstance(c, str) else None
              if ts:
                break

            if not ts:
              ts = datetime.datetime.fromtimestamp(p.stat().st_mtime, tz=datetime.timezone.utc)

            age = (now - ts).total_seconds() / 60.0
            ok = age <= max_age_minutes
            msg = f"{path}: ts={ts.isoformat()} age_min={age:.1f} limit={max_age_minutes}"
            return (ok, msg)

          ok1, msg1 = check("projects/data/articles.json", required=True)
          ok2, msg2 = check("projects/data/videos.json", required=False)

          print("[freshness]", msg1)
          print("[freshness]", msg2)

          if not ok1:
            print("FAIL: articles data too old or missing")
            sys.exit(1)

          print("OK: data freshness within limit")
          PY
