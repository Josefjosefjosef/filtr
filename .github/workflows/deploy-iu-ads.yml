# Deploy InfoUzel Ads (Cloudflare Worker + D1 iu-ads + R2)
#
# Preferred secret (least privilege for ads infra):
#   CLOUDFLARE_ADS_API_TOKEN — Account D1:Edit + Workers Scripts:Edit + Workers R2 Storage:Edit
# Fallback (existing):
#   CLOUDFLARE_API_TOKEN — used only if CLOUDFLARE_ADS_API_TOKEN is absent
# Optional Worker secret (set separately via wrangler secret put):
#   ADS_R2_SIGNING_SECRET
#
# Etapa 0/1: fail-closed feature flags; no public ads until later stages.
# Optional workflow_dispatch can enable Admin/Client API vars WITHOUT flipping public delivery.
name: Deploy IU Ads

on:
  workflow_dispatch:
    inputs:
      enable_admin_api:
        description: "Set ADS_ADMIN_API_ENABLED=true for this deploy only (committed wrangler default stays false). Does NOT enable public ads."
        type: boolean
        default: false
      enable_client_api:
        description: "Set ADS_CLIENT_API_ENABLED=true for this deploy only (committed wrangler default stays false). Does NOT enable public ads."
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "cloudflare/iu-ads/**"
      - ".github/workflows/deploy-iu-ads.yml"

concurrency:
  group: deploy-iu-ads
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare/iu-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-ads/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Token source (no values)
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.CLOUDFLARE_ADS_API_TOKEN }}" ]; then
            echo "TOKEN_SOURCE=CLOUDFLARE_ADS_API_TOKEN"
          elif [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "TOKEN_SOURCE=CLOUDFLARE_API_TOKEN_FALLBACK"
          else
            echo "TOKEN_SOURCE=MISSING"
            exit 1
          fi

      - name: Ensure D1 database + apply migrations
        run: |
          set -euo pipefail
          NAME="iu-ads"
          set +e
          LIST_JSON="$(npx wrangler d1 list --json 2>/tmp/d1-list.err)"
          LIST_EC=$?
          set -e
          if [ "$LIST_EC" != "0" ]; then
            echo "BLOCKER: cannot list D1"
            if [ -f /tmp/d1-list.err ]; then sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/d1-list.err | head -n 40 || true; fi
            exit 1
          fi
          ID="$(printf '%s' "$LIST_JSON" | node -e "
            let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{
              try {
                const arr=JSON.parse(s);
                const hit=(arr||[]).find(x=>x&&x.name==='iu-ads');
                const id=hit&&(hit.uuid||hit.id||'');
                process.stdout.write(id?String(id):'');
              } catch { process.stdout.write(''); }
            });
          ")"
          if [ -z "$ID" ]; then
            set +e
            CREATE_OUT="$(npx wrangler d1 create "$NAME" 2>/tmp/d1-create.err)"
            CREATE_EC=$?
            set -e
            if [ "$CREATE_EC" != "0" ]; then
              echo "BLOCKER: cannot create D1 iu-ads"
              if [ -f /tmp/d1-create.err ]; then sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/d1-create.err | head -n 40 || true; fi
              exit 1
            fi
            ID="$(printf '%s' "$CREATE_OUT" | node -e "
              let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{
                const m=s.match(/database_id\s*=\s*\"([0-9a-fA-F-]{36})\"/) || s.match(/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/);
                process.stdout.write(m&&m[1]?m[1]:'');
              });
            ")"
          fi
          if [ -z "$ID" ]; then
            echo "BLOCKER: could not resolve D1 database_id for iu-ads"
            exit 1
          fi
          echo "D1_ID_RESOLVED=yes"
          export ID
          ID="$ID" node -e "
            const fs=require('fs');
            let t=fs.readFileSync('wrangler.toml','utf8');
            t=t.replace(/database_id = \"[^\"]+\"/, 'database_id = \"'+process.env.ID+'\"');
            fs.writeFileSync('wrangler.toml',t);
          "
          npx wrangler d1 migrations apply iu-ads --remote

      - name: Ensure R2 buckets
        run: |
          set -euo pipefail
          ensure_bucket() {
            local NAME="$1"
            set +e
            LIST_OUT="$(npx wrangler r2 bucket list 2>/tmp/r2-list.err)"
            LIST_EC=$?
            set -e
            if [ "$LIST_EC" != "0" ]; then
              echo "BLOCKER: R2 list failed for $NAME"
              if [ -f /tmp/r2-list.err ]; then sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/r2-list.err | head -n 40 || true; fi
              if grep -Fq "10042" /tmp/r2-list.err 2>/dev/null; then
                echo "BLOCKER_CODE=10042"
                echo "BLOCKER_CAUSE=R2_NOT_ENABLED_ON_ACCOUNT"
                echo "MANUAL_STEP=Cloudflare Dashboard → R2 → Activate/Purchase R2 (free tier OK) for account 577868e9aac9c289e9323100f68fad16, then re-run Deploy IU Ads"
              elif grep -qiE 'Authentication|Unauthorized|10000|permission|not authorized' /tmp/r2-list.err 2>/dev/null; then
                echo "LIKELY_MISSING_PERMISSION=Account.Workers_R2_Storage.Edit"
                echo "REQUIRED_SECRET=CLOUDFLARE_ADS_API_TOKEN"
              fi
              exit 1
            fi
            if printf '%s' "$LIST_OUT" | grep -Fq "$NAME"; then
              echo "R2_BUCKET_EXISTS=$NAME"
              return 0
            fi
            set +e
            npx wrangler r2 bucket create "$NAME" 2>/tmp/r2-create.err
            CREATE_EC=$?
            set -e
            if [ "$CREATE_EC" != "0" ]; then
              echo "BLOCKER: cannot create R2 bucket $NAME"
              if [ -f /tmp/r2-create.err ]; then sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/r2-create.err | head -n 40 || true; fi
              if grep -Fq "10042" /tmp/r2-create.err 2>/dev/null; then
                echo "BLOCKER_CODE=10042"
                echo "BLOCKER_CAUSE=R2_NOT_ENABLED_ON_ACCOUNT"
                echo "MANUAL_STEP=Cloudflare Dashboard → R2 → Activate R2 for this account, then re-run Deploy IU Ads"
              else
                echo "LIKELY_MISSING_PERMISSION=Account.Workers_R2_Storage.Edit"
              fi
              exit 1
            fi
            echo "R2_BUCKET_CREATED=$NAME"
          }
          ensure_bucket "iu-ads-creatives"
          ensure_bucket "iu-ads-documents"
          ensure_bucket "iu-ads-backups"

      - name: Put optional auth secrets (names only; values never echoed)
        env:
          ADS_SESSION_SECRET: ${{ secrets.ADS_SESSION_SECRET }}
          ADS_PASSWORD_PEPPER: ${{ secrets.ADS_PASSWORD_PEPPER }}
          ADS_CLIENT_SESSION_SECRET: ${{ secrets.ADS_CLIENT_SESSION_SECRET }}
          ADS_CODE_PEPPER: ${{ secrets.ADS_CODE_PEPPER }}
          ADS_BACKUP_ENCRYPTION_KEY: ${{ secrets.ADS_BACKUP_ENCRYPTION_KEY }}
          ANALYTICS_ADMIN_TOKEN: ${{ secrets.ANALYTICS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          put_if_set() {
            local name="$1"
            local val="$2"
            if [ -n "${val:-}" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name"
              echo "SECRET_PUT=${name}=OK"
            else
              echo "SECRET_PUT=${name}=SKIPPED_MISSING_GITHUB_SECRET"
            fi
          }
          put_if_set ADS_SESSION_SECRET "${ADS_SESSION_SECRET:-}"
          put_if_set ADS_PASSWORD_PEPPER "${ADS_PASSWORD_PEPPER:-}"
          put_if_set ADS_CLIENT_SESSION_SECRET "${ADS_CLIENT_SESSION_SECRET:-}"
          put_if_set ADS_CODE_PEPPER "${ADS_CODE_PEPPER:-}"
          put_if_set ADS_BACKUP_ENCRYPTION_KEY "${ADS_BACKUP_ENCRYPTION_KEY:-}"
          put_if_set ANALYTICS_ADMIN_TOKEN "${ANALYTICS_ADMIN_TOKEN:-}"

      - name: Ensure Analytics report URL in D1 (names only; no tokens)
        run: |
          set -euo pipefail
          # Fail-closed stats need ANALYTICS_ADMIN_REPORT_URL + Worker secret ANALYTICS_ADMIN_TOKEN.
          # URL is a public Worker host — safe to set from CI. Never print secrets.
          URL="https://infouzel-analytics.josef-zmrhal.workers.dev"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          npx wrangler d1 execute iu-ads --remote --command \
            "INSERT INTO system_settings (key, value, updated_at) VALUES ('ANALYTICS_ADMIN_REPORT_URL', '${URL}', '${NOW}') ON CONFLICT(key) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at;"
          EC=$?
          set -e
          if [ "$EC" != "0" ]; then
            echo "ANALYTICS_URL_SET=FAIL"
            echo "BLOCKER: could not upsert ANALYTICS_ADMIN_REPORT_URL"
            exit 1
          fi
          echo "ANALYTICS_URL_SET=OK"
          echo "ANALYTICS_URL_HOST=infouzel-analytics.josef-zmrhal.workers.dev"

      - name: Deploy Worker
        env:
          # Push to main keeps Admin/Client API ON (ops default). Public delivery stays OFF.
          # workflow_dispatch still honors the checkboxes (can temporarily disable for drills).
          ENABLE_ADMIN_API: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_admin_api) }}
          ENABLE_CLIENT_API: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_client_api) }}
        run: |
          set -euo pipefail
          # Committed wrangler.toml defaults stay false. Optional dispatch flips runtime vars only.
          # NEVER flip ADS_PUBLIC_DELIVERY_ENABLED / ADS_SAFE_MODE here.
          EXTRA_VARS=(--var ADS_SAFE_MODE:true --var ADS_PUBLIC_DELIVERY_ENABLED:false)
          if [ "${ENABLE_ADMIN_API}" = "true" ]; then
            EXTRA_VARS+=(--var ADS_ADMIN_API_ENABLED:true)
            echo "DEPLOY_VAR_ADMIN_API=true"
          else
            EXTRA_VARS+=(--var ADS_ADMIN_API_ENABLED:false)
            echo "DEPLOY_VAR_ADMIN_API=false"
          fi
          if [ "${ENABLE_CLIENT_API}" = "true" ]; then
            EXTRA_VARS+=(--var ADS_CLIENT_API_ENABLED:true)
            echo "DEPLOY_VAR_CLIENT_API=true"
          else
            EXTRA_VARS+=(--var ADS_CLIENT_API_ENABLED:false)
            echo "DEPLOY_VAR_CLIENT_API=false"
          fi
          npx wrangler deploy "${EXTRA_VARS[@]}"

      - name: Deployment proof (version metadata, no secrets)
        run: |
          set -euo pipefail
          echo "DEPLOY_PROOF_HOST=ads.infouzel.cz"
          set +e
          npx wrangler deployments list 2>/tmp/iu-ads-deployments.err | head -n 40
          LIST_EC=$?
          set -e
          if [ "$LIST_EC" != "0" ]; then
            echo "DEPLOYMENTS_LIST=FAIL"
            if [ -f /tmp/iu-ads-deployments.err ]; then sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/iu-ads-deployments.err | head -n 20 || true; fi
            exit 1
          fi
          echo "DEPLOYMENTS_LIST=OK"

      - name: Health probe (official domain)
        run: |
          set -euo pipefail
          URL="https://ads.infouzel.cz/health"
          attempt=1
          while [ "$attempt" -le 30 ]; do
            echo "HEALTH_ATTEMPT=$attempt"
            CODE="$(curl -sS -o /tmp/iu-ads-health.json -w "%{http_code}" "$URL" || true)"
            echo "HEALTH_HTTP=$CODE URL_HOST=ads.infouzel.cz"
            if [ "$CODE" = "200" ]; then
              cat /tmp/iu-ads-health.json
              set +e
              node -e "
                const fs=require('fs');
                const j=JSON.parse(fs.readFileSync('/tmp/iu-ads-health.json','utf8'));
                if(j.service!=='infouzel-ads') process.exit(2);
                if(j.ok!==true) process.exit(7);
                if(j.safeMode!==true) process.exit(3);
                if(j.publicDeliveryEnabled!==false) process.exit(4);
                if(j.personalizedAds!==false) process.exit(5);
                if(j.storageMode!=='d1') process.exit(6);
                if(!j.r2 || j.r2.privateDocumentsPublicUrl!==false) process.exit(8);
                if(!j.r2.creativesBound || !j.r2.documentsBound || j.r2.ready!==true) process.exit(9);
                if(j.adminApiEnabled!==true && j.adminApiEnabled!==false) process.exit(10);
                if(j.clientApiEnabled!==true && j.clientApiEnabled!==false) process.exit(11);
                console.log('HEALTH_GATE=PASS host=ads.infouzel.cz adminApiEnabled='+j.adminApiEnabled+' clientApiEnabled='+j.clientApiEnabled);
              "
              GATE_EC=$?
              set -e
              if [ "$GATE_EC" = "0" ]; then
                exit 0
              fi
              echo "HEALTH_GATE_RETRY exit=$GATE_EC (possible edge/DNS/TLS propagation)"
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "HEALTH_GATE=FAIL code=$CODE host=ads.infouzel.cz"
          echo "BLOCKER: custom domain ads.infouzel.cz not healthy after deploy"
          echo "MANUAL_IF_NEEDED: Cloudflare Dashboard → Workers → infouzel-ads → Settings → Domains & Routes → add Custom Domain ads.infouzel.cz (zone infouzel.cz). Token needs Zone DNS Edit + Workers Routes."
          cat /tmp/iu-ads-health.json || true
          exit 1

      # Worker secret for signed private object access (never echoed).
      # ADS-002: never silently regenerate. Prefer GitHub secret put; if absent,
      # accept an already-configured Worker secret (fail only when signing missing).
      - name: Ensure ADS_R2_SIGNING_SECRET
        env:
          ADS_R2_SIGNING_SECRET: ${{ secrets.ADS_R2_SIGNING_SECRET }}
        run: |
          set -euo pipefail
          verify_signing() {
            attempt=1
            while [ "$attempt" -le 18 ]; do
              CODE="$(curl -sS -o /tmp/iu-ads-obj.json -w "%{http_code}" "https://ads.infouzel.cz/v1/objects/get?key=probe&bucket=DOCUMENTS&exp=1&sig=invalid" || true)"
              BODY="$(cat /tmp/iu-ads-obj.json || true)"
              echo "OBJECTS_GET_ATTEMPT=$attempt HTTP=$CODE"
              if ! echo "$BODY" | grep -Fq "signing_not_configured"; then
                echo "OBJECTS_GET_SIGNING=CONFIGURED"
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 5
            done
            return 1
          }
          if [ -n "${ADS_R2_SIGNING_SECRET:-}" ]; then
            echo "ADS_R2_SIGNING_SECRET_SOURCE=GITHUB_SECRET"
            printf '%s' "$ADS_R2_SIGNING_SECRET" | npx wrangler secret put ADS_R2_SIGNING_SECRET
            echo "ADS_R2_SIGNING_SECRET_STATUS=PUT_OK"
            if verify_signing; then
              exit 0
            fi
            echo "BLOCKER: ADS_R2_SIGNING_SECRET not active on Worker after retries"
            cat /tmp/iu-ads-obj.json || true
            exit 1
          fi
          echo "ADS_R2_SIGNING_SECRET_SOURCE=MISSING_GITHUB_SECRET"
          echo "ADS-002: silent openssl regen is forbidden"
          if verify_signing; then
            echo "ADS_R2_SIGNING_SECRET_STATUS=SKIP_PUT_ALREADY_CONFIGURED"
            echo "MANUAL_RECOMMENDED: set repo secret ADS_R2_SIGNING_SECRET to the active Worker value for future rotates"
            exit 0
          fi
          echo "BLOCKER: ADS_R2_SIGNING_SECRET GitHub secret is required (Worker signing not configured)"
          echo "MANUAL: set repo secret ADS_R2_SIGNING_SECRET, then re-run"
          cat /tmp/iu-ads-obj.json || true
          exit 1
