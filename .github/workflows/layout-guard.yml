name: Layout guard

permissions:
  contents: read
  statuses: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - automation/update-articles-data
      - automation/update-articles-fast-pool
      - automation/update-info-panel-snapshot
      - automation/update-chmi-cap-v2
      - automation/update-ndic-datex-v1
      - "fix/**"
  workflow_dispatch:

concurrency:
  group: layout-guard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  layout-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR head for pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - name: Checkout
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 64

      - name: Detect data-only scope (layout fast path)
        id: scope
        env:
          SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SMOKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/smoke-data-only-scope.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Cache Playwright browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # GitHub-hosted ubuntu images already include common Chromium deps; --with-deps
      # has been observed to hang indefinitely on apt. Cache + install chromium only.
      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install chromium
      - run: node scripts/check_layout.js
      - name: Pre-aggregator UI freeze guard
        run: npm run iu-pre-aggregator-stable-freeze-guard
      - name: Pre-aggregator cross-browser feature guard
        run: npm run iu-pre-aggregator-cross-browser-feature-guard

      - name: Data-only layout fast path proof (skip Playwright hero when data-only)
        if: steps.scope.outputs.data_only == 'true'
        run: |
          set -euo pipefail
          node scripts/smoke_data_only_scope_proof.mjs
          echo "LAYOUT_HERO_GUARD_SKIPPED=DATA_ONLY_FAST_PATH"

      - name: Prehled dne hero contract guard (banner+CTA seam/radius/visibility)
        if: steps.scope.outputs.data_only != 'true'
        env:
          IU_HERO_GUARD_MAX_MS: "900000"
        run: npm run iu-prehled-dne-hero-contract-guard
      - run: node scripts/silver-stack-guard.js
      - name: Silver home prefix first-tap static contract
        run: npm run silver-home-prefix-first-tap-static-guard
      - name: Perf stage-2 static contract
        run: npm run iu-perf-stage2-static-guard
      - name: Perf stage-3 static contract
        run: npm run iu-perf-stage3-static-guard
      - run: node scripts/tall-preview-first-row-badge-guard.js
      - name: Silver summary + calendar accent UI proof
        if: steps.scope.outputs.data_only != 'true'
        run: node scripts/silver-summary-ui-proof.mjs

      - name: Set required status context (layout-guard)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/post-required-status.sh
          scripts/ci/post-required-status.sh layout-guard
