name: Layout guard

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - automation/update-articles-data
      - automation/update-articles-fast-pool
      - automation/update-info-panel-snapshot
      - automation/update-chmi-cap-v2
      - automation/update-ndic-datex-v1
      - "fix/**"
  workflow_dispatch:
  merge_group:

concurrency:
  # Event-scoped: push must not cancel pull_request / merge_group (cancelled checks blocked merge).
  group: layout-guard-${{ github.event.merge_group.head_sha || github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  layout-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 64

      - name: Skip redundant push when open PR covers branch
        id: prgate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/skip-push-if-pr-open.sh
          scripts/ci/skip-push-if-pr-open.sh

      - name: Redundant push — success exit (PR owns required layout-guard)
        if: steps.prgate.outputs.skip == 'true'
        run: |
          set -euo pipefail
          echo "LAYOUT_GUARD_PUSH_SKIPPED_PR_OWNS_CHECK=YES"
          echo "LAYOUT_EARLY_EXIT=YES"
          # Do NOT post required status — PR owns layout-guard (same contract as smoke).

      - name: Merge-group SHA contract
        if: steps.prgate.outputs.skip != 'true' && github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          test "${GITHUB_SHA}" = "${CHECKED_OUT_SHA}"
          test "${GITHUB_SHA}" = "${{ github.event.merge_group.head_sha }}"
          echo "MERGE_GROUP_SHA_CONTRACT=PASS"

      - name: Detect data-only scope (layout fast path)
        if: steps.prgate.outputs.skip != 'true'
        id: scope
        env:
          SMOKE_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || '' }}
          SMOKE_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node scripts/smoke-data-only-scope.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.prgate.outputs.skip != 'true'
        with:
          node-version: "24"
      - run: npm ci
        if: steps.prgate.outputs.skip != 'true'
      - name: GHA immutable pin guard (SC-GHA-02)
        if: steps.prgate.outputs.skip != 'true'
        run: npm run iu-gha-immutable-pin-guard
      - name: Permissions-Policy guard (EXT-HDR-PERM-01)
        if: steps.prgate.outputs.skip != 'true'
        run: npm run iu-permissions-policy-guard
      - name: Secondary HTML CSP guard (EXT-CSP-SECONDARY-01)
        if: steps.prgate.outputs.skip != 'true'
        run: npm run iu-secondary-csp-guard
      - name: security.txt guard (EXT-SEC-TXT-01 / RFC 9116)
        if: steps.prgate.outputs.skip != 'true'
        run: npm run iu-security-txt-guard
      - name: Cache Playwright browser
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        id: pwcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # GitHub-hosted ubuntu images already include common Chromium deps; --with-deps
      # has been observed to hang indefinitely on apt. Cache + install chromium only.
      - name: Install Playwright browsers
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: node node_modules/playwright/cli.js install chromium
      - name: Data-only layout fast path proof
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only == 'true'
        run: |
          set -euo pipefail
          node scripts/smoke_data_only_scope_proof.mjs
          echo "LAYOUT_HERO_GUARD_SKIPPED=DATA_ONLY_FAST_PATH"

      - name: Run node scripts/check_layout.js
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: node scripts/check_layout.js
      - name: Pre-aggregator UI freeze guard
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: npm run iu-pre-aggregator-stable-freeze-guard
      - name: Pre-aggregator cross-browser feature guard
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: npm run iu-pre-aggregator-cross-browser-feature-guard

      - name: Prehled dne hero contract guard (banner+CTA seam/radius/visibility)
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        env:
          IU_HERO_GUARD_MAX_MS: "900000"
          IU_HERO_GUARD_FAST: "1"
        run: npm run iu-prehled-dne-hero-contract-guard
      - name: Silver stack guard
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: node scripts/silver-stack-guard.js
      - name: Silver home prefix first-tap static contract
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: npm run silver-home-prefix-first-tap-static-guard
      - name: Perf stage-2 static contract
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: npm run iu-perf-stage2-static-guard
      - name: Perf stage-3 static contract
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: npm run iu-perf-stage3-static-guard
      - name: Tall preview first-row badge guard
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: node scripts/tall-preview-first-row-badge-guard.js
      - name: Silver summary + calendar accent UI proof
        if: steps.prgate.outputs.skip != 'true' && steps.scope.outputs.data_only != 'true'
        run: node scripts/silver-summary-ui-proof.mjs

      - name: Set required status context (layout-guard)
        if: always() && steps.prgate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci/post-required-status.sh
          scripts/ci/post-required-status.sh layout-guard
