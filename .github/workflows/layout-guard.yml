name: Layout guard

on:
  pull_request:
  workflow_dispatch:

jobs:
  layout-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check_layout.js
      - run: node scripts/silver-stack-guard.js
