name: Layout guard

permissions:
  contents: read
  statuses: write

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - automation/update-articles-data
      - automation/update-articles-fast-pool
      - automation/update-info-panel-snapshot
      - automation/update-chmi-cap-v2
      - automation/update-ndic-datex-v1
      - "fix/**"
  workflow_dispatch:

jobs:
  layout-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (PR head for pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Install Playwright browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/check_layout.js
      - name: Pre-aggregator UI freeze guard
        run: npm run iu-pre-aggregator-stable-freeze-guard
      - name: Pre-aggregator cross-browser feature guard
        run: npm run iu-pre-aggregator-cross-browser-feature-guard
      - name: Prehled dne hero contract guard (banner+CTA seam/radius/visibility)
        run: npm run iu-prehled-dne-hero-contract-guard
      - run: node scripts/silver-stack-guard.js
      - name: Silver home prefix first-tap static contract
        run: npm run silver-home-prefix-first-tap-static-guard
      - name: Perf stage-2 static contract
        run: npm run iu-perf-stage2-static-guard
      - name: Perf stage-3 static contract
        run: npm run iu-perf-stage3-static-guard
      - run: node scripts/tall-preview-first-row-badge-guard.js
      - name: Silver summary + calendar accent UI proof
        run: node scripts/silver-summary-ui-proof.mjs

      - name: Set required status context (layout-guard)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          SHA="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
              -f state="$STATE" \
              -f context="layout-guard" \
              -f description="Required status context (layout-guard)" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
              exit 0
            fi
            echo "status_post_retry=$attempt"
            sleep $((attempt * 5))
          done
          exit 1
