name: Health Check (weather + namedays)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files under projects/data
        run: |
          echo "=== Checking files in projects/data ==="
          ls -la projects/data || true

          missing=0

          if [ -f projects/data/weather.json ]; then
            echo "OK: projects/data/weather.json"
            head -n 30 projects/data/weather.json || true
          else
            echo "MISSING: projects/data/weather.json"
            missing=1
          fi

          if [ -f projects/data/namedays.json ]; then
            echo "OK: projects/data/namedays.json"
            head -n 30 projects/data/namedays.json || true
          else
            echo "MISSING: projects/data/namedays.json"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "Health check FAILED: missing required files under projects/data"
            exit 1
          fi
