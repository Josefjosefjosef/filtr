# Manual one-shot: Premium approve-publish → LIVE on infoUzel.cz (writes prod D1/R2; not in smoke CI).
name: IU Premium approve-publish E2E (prod)

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: iu-premium-approve-publish-e2e-prod
  cancel-in-progress: false

jobs:
  premium-approve-publish-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      ADS_PASSWORD_PEPPER: ${{ secrets.ADS_PASSWORD_PEPPER }}
      ADS_CODE_PEPPER: ${{ secrets.ADS_CODE_PEPPER }}
      ADS_BASE_URL: "https://ads.infouzel.cz"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root deps (playwright)
        run: npm ci
      - name: Install cloudflare/iu-ads deps (wrangler)
        working-directory: cloudflare/iu-ads
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Secrets present (names only)
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "MISSING=CLOUDFLARE_API_TOKEN"; exit 1; fi
          if [ -z "${ADS_PASSWORD_PEPPER}" ]; then echo "MISSING=ADS_PASSWORD_PEPPER"; exit 1; fi
          if [ -z "${ADS_CODE_PEPPER}" ]; then echo "MISSING=ADS_CODE_PEPPER"; exit 1; fi
          echo "SECRETS=OK"
      - name: Premium approve-publish production E2E
        run: node scripts/iu-premium-approve-publish-e2e-prod.mjs
