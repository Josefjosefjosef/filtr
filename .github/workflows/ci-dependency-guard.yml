# CI dependency guard — verify Dependabot config and workflow structure (no production code changes)
name: CI dependency guard

permissions:
  contents: read


on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify dependabot config exists
        run: test -f .github/dependabot.yml

      - name: Verify workflow files exist
        run: |
          test -d .github/workflows
          ls -1 .github/workflows/

      - name: List workflow action references
        run: |
          grep -Rh "uses:" .github/workflows/ || true
