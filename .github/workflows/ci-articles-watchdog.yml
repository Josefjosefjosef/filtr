name: CI - Articles watchdog

on:
  push:
    paths:
      - "cloudflare/articles-watchdog/**"
      - ".github/workflows/ci-articles-watchdog.yml"
  pull_request:
    paths:
      - "cloudflare/articles-watchdog/**"
      - ".github/workflows/ci-articles-watchdog.yml"

permissions:
  contents: read

concurrency:
  group: ci-articles-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/articles-watchdog
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/articles-watchdog/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test
