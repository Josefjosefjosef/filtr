name: ci-heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write heartbeat json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > projects/data/ci_heartbeat.json <<'EOF'
{
  "generatedAt": "${NOW}",
  "repo": "${GITHUB_REPOSITORY}",
  "workflow": "${GITHUB_WORKFLOW}",
  "runId": "${GITHUB_RUN_ID}",
  "runNumber": "${GITHUB_RUN_NUMBER}",
  "attempt": "${GITHUB_RUN_ATTEMPT}",
  "ref": "${GITHUB_REF}",
  "sha": "${GITHUB_SHA}",
  "runUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
}
EOF
          echo "Wrote projects/data/ci_heartbeat.json:"
          cat projects/data/ci_heartbeat.json

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A projects/data/ci_heartbeat.json
          if git diff --cached --quiet; then
            echo "Nothing to commit (heartbeat unchanged)."
            exit 0
          fi

          git commit -m "ci: heartbeat"
          git push
