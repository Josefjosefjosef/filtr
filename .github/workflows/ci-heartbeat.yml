name: CI - Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: ci-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp
        run: |
          echo "Heartbeat UTC:"
          date -u

      - name: Verify data endpoints reachable (HTTP 200)
        run: |
          set -e
          for u in \
            "https://infoUzel.cz/projects/data/articles.json" \
            "https://infoUzel.cz/projects/data/videos.json"
          do
            echo "GET $u"
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$u")
            echo "HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAIL: $u returned $code"
              exit 1
            fi
          done
          echo "OK: endpoints reachable"
