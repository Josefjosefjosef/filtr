name: CI - Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: ci-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp
        run: |
          echo "Heartbeat UTC:"
          date -u

      - name: Verify data endpoints reachable (articles required, videos optional)
        shell: bash
        run: |
          set -euo pipefail

          req="https://infouzel.cz/projects/data/articles.json"
          opt="https://infouzel.cz/projects/data/videos.json"

          check_required () {
            local u="$1"
            echo "GET(required) $u"
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" "$u")
            ctype=$(curl -sS -L -I "$u" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}')
            echo "HTTP $code  CT=${ctype:-unknown}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAIL: required endpoint returned $code"
              exit 1
            fi
            if [[ "${ctype:-}" != *json* ]]; then
              echo "FAIL: required endpoint is not JSON (Content-Type=${ctype:-unknown})"
              exit 1
            fi
          }

          check_optional () {
            local u="$1"
            echo "GET(optional) $u"
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" "$u")
            ctype=$(curl -sS -L -I "$u" | tr -d '\r' | awk -F': 'tolower($1)=="content-type"{print tolower($2); exit}')
            echo "HTTP $code  CT=${ctype:-unknown}"

            if [ "$code" -eq 404 ] || [ "$code" -eq 204 ]; then
              echo "OK(optional): missing/empty is allowed ($code)"
              return 0
            fi

            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAIL: optional endpoint returned $code"
              exit 1
            fi
            if [[ "${ctype:-}" != *json* ]]; then
              echo "FAIL: optional endpoint is not JSON (Content-Type=${ctype:-unknown})"
              exit 1
            fi
          }

          check_required "$req"
          check_optional "$opt"

          echo "OK: heartbeat endpoints reachable"
