name: ci-heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write heartbeat json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/data
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > projects/data/ci_heartbeat.json <<'EOF'
{
  "generatedAt": "__NOW__",
  "repo": "__REPO__",
  "workflow": "__WORKFLOW__",
  "runId": "__RUN_ID__",
  "runNumber": "__RUN_NUMBER__",
  "attempt": "__RUN_ATTEMPT__"
}
EOF

          sed -i \
            -e "s/__NOW__/${NOW}/" \
            -e "s#__REPO__#${GITHUB_REPOSITORY}#" \
            -e "s#__WORKFLOW__#${GITHUB_WORKFLOW}#" \
            -e "s#__RUN_ID__#${GITHUB_RUN_ID}#" \
            -e "s#__RUN_NUMBER__#${GITHUB_RUN_NUMBER}#" \
            -e "s#__RUN_ATTEMPT__#${GITHUB_RUN_ATTEMPT}#" \
            projects/data/ci_heartbeat.json

          ls -la projects/data
          head -c 200 projects/data/ci_heartbeat.json || true

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A projects/data/ci_heartbeat.json
          if git diff --cached --quiet; then
            echo "Nothing to commit (heartbeat unchanged)."
            exit 0
          fi

          git commit -m "ci: heartbeat"
          git push
