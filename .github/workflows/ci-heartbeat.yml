name: CI - Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: ci-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp
        shell: bash
        run: |
          set -euo pipefail
          echo "Heartbeat UTC:"
          date -u

      - name: Verify data endpoints reachable (articles required, videos optional)
        shell: bash
        run: |
          set -euo pipefail

          REQ_URL="https://infouzel.cz/projects/data/articles.json"
          OPT_URL="https://infouzel.cz/projects/data/videos.json"

          echo "Checking required endpoint: $REQ_URL"
          out="$(curl -sS -L -o /dev/null -w "%{http_code} %{content_type}" "$REQ_URL")"
          code="${out%% *}"
          ctype="${out#* }"
          echo "HTTP $code  CT=${ctype:-unknown}"

          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "FAIL: required endpoint returned $code"
            exit 1
          fi
          case "${ctype:-}" in
            *json*) : ;;
            *) echo "FAIL: required endpoint is not JSON (Content-Type=${ctype:-unknown})"; exit 1 ;;
          esac

          echo "Checking optional endpoint: $OPT_URL"
          out="$(curl -sS -L -o /dev/null -w "%{http_code} %{content_type}" "$OPT_URL")"
          code="${out%% *}"
          ctype="${out#* }"
          echo "HTTP $code  CT=${ctype:-unknown}"

          if [ "$code" = "404" ] || [ "$code" = "204" ]; then
            echo "OK: optional endpoint missing/empty is allowed ($code)"
            exit 0
          fi

          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "FAIL: optional endpoint returned $code"
            exit 1
          fi
          case "${ctype:-}" in
            *json*) : ;;
            *) echo "FAIL: optional endpoint is not JSON (Content-Type=${ctype:-unknown})"; exit 1 ;;
          esac

          echo "OK: heartbeat endpoints reachable"
