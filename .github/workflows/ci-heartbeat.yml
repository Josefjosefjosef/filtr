name: CI - Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: ci-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp
        run: |
          echo "Heartbeat UTC:"
          date -u

      - name: Verify data endpoints reachable (articles required, videos optional)
        shell: bash
        run: |
          set -euo pipefail

          REQ_URL="https://infouzel.cz/projects/data/articles.json"
          OPT_URL="https://infouzel.cz/projects/data/videos.json"

          check_required() {
            local url="$1"
            echo "GET required: $url"

            http_code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$url")"
            content_type="$(curl -sS -L -I "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}')"

            echo "HTTP=${http_code} Content-Type=${content_type:-unknown}"

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 400 ]; then
              echo "FAIL: required endpoint returned HTTP $http_code"
              exit 1
            fi

            case "$content_type" in
              *json*) ;;
              *)
                echo "FAIL: required endpoint is not JSON"
                exit 1
                ;;
            esac
          }

          check_optional() {
            local url="$1"
            echo "GET optional: $url"

            http_code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$url")"
            content_type="$(curl -sS -L -I "$url" | tr -d '\r' | awk -F': 'tolower($1)=="content-type"{print tolower($2); exit}')"

            echo "HTTP=${http_code} Content-Type=${content_type:-unknown}"

            if [ "$http_code" -eq 404 ] || [ "$http_code" -eq 204 ]; then
              echo "OK: optional endpoint missing or empty"
              return 0
            fi

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 400 ]; then
              echo "FAIL: optional endpoint returned HTTP $http_code"
              exit 1
            fi

            case "$content_type" in
              *json*) ;;
              *)
                echo "FAIL: optional endpoint is not JSON"
                exit 1
                ;;
            esac
          }

          check_required "$REQ_URL"
          check_optional "$OPT_URL"

          echo "OK: heartbeat endpoints reachable"
