name: CI - Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: ci-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp
        run: |
          echo "Heartbeat UTC:"
          date -u

      - name: Verify data endpoints reachable
        shell: bash
        run: |
          set -euo pipefail

          REQ_URL="https://infouzel.cz/projects/data/articles.json"
          OPT_URL="https://infouzel.cz/projects/data/videos.json"

          check_required() {
            local url="$1"
            code=$(curl -sSL -o /dev/null -w "%{http_code}" "$url")
            ctype=$(curl -sSLI "$url" | awk -F': ' 'tolower($1)=="content-type"{print tolower($2)}')

            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAIL: required endpoint returned $code"
              exit 1
            fi

            case "$ctype" in
              *json*) ;;
              *) echo "FAIL: required endpoint is not JSON ($ctype)"; exit 1 ;;
            esac
          }

          check_optional() {
            local url="$1"
            code=$(curl -sSL -o /dev/null -w "%{http_code}" "$url")
            ctype=$(curl -sSLI "$url" | awk -F': 'tolower($1)=="content-type"{print tolower($2)})

            if [ "$code" = "404" ] || [ "$code" = "204" ]; then
              echo "OK: optional endpoint missing"
              return 0
            fi

            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "FAIL: optional endpoint returned $code"
              exit 1
            fi

            case "$ctype" in
              *json*) ;;
              *) echo "FAIL: optional endpoint is not JSON ($ctype)"; exit 1 ;;
            esac
          }

          check_required "$REQ_URL"
          check_optional "$OPT_URL"

          echo "OK: heartbeat endpoints reachable"
