name: CI - Heartbeat

on:
  workflow_dispatch:
  # TEMP PAUSED 2026-07-07: schedule disabled during PR batch — uncomment to re-enable
  # schedule:
  #   - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/ci-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: ci-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Timestamp
        shell: bash
        run: |
          set -euo pipefail
          echo "Heartbeat UTC:"
          date -u

      - name: Verify data endpoints reachable (articles required, videos optional)
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required: https://infouzel.cz/projects/data/articles.json"
          curl -fsS "https://infouzel.cz/projects/data/articles.json" -o /dev/null

          echo "Checking optional: https://infouzel.cz/projects/data/videos.json"
          curl -fsS "https://infouzel.cz/projects/data/videos.json" -o /dev/null || true

          echo "OK: endpoints reachable"
