name: IU Premium purge diagnostics (prod read-only)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      customer_order_code:
        description: "Premium customer_order_code (read-only purge-diagnostics probe)"
        type: string
        required: true
        default: "IU-26-DGRF-U8B2"

concurrency:
  group: iu-premium-purge-diagnostics-prod
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/iu-ads
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "577868e9aac9c289e9323100f68fad16"
      ADS_PASSWORD_PEPPER: ${{ secrets.ADS_PASSWORD_PEPPER }}
      ADS_BASE_URL: "https://ads.infouzel.cz"
      IU_PURGE_DIAG_ORDER_CODE: ${{ inputs.customer_order_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-ads/package-lock.json
      - name: Install
        run: npm ci
      - name: Purge diagnostics (read-only)
        run: node scripts/iu-premium-purge-diagnostics-prod.mjs
