name: Probe IU Analytics D1 permission
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/iu-analytics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/iu-analytics/package-lock.json
      - run: npm ci
      - name: Probe D1 list/create capability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "PROBE_START"
          set +e
          LIST_OUT=$(npx wrangler d1 list --json 2>/tmp/d1-list.err)
          LIST_EC=$?
          set -e
          echo "LIST_EXIT=$LIST_EC"
          if [ -f /tmp/d1-list.err ]; then
            # redact token-looking strings; keep error codes
            sed -E 's/[A-Za-z0-9_-]{30,}/[REDACTED]/g' /tmp/d1-list.err | head -n 40 || true
          fi
          if [ "$LIST_EC" = "0" ]; then
            echo "LIST_OK"
            echo "$LIST_OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const a=JSON.parse(s);console.log('DB_COUNT='+(Array.isArray(a)?a.length:0));console.log('HAS_IU='+(Array.isArray(a)&&a.some(x=>x&&x.name==='iu-analytics')));}catch(e){console.log('LIST_PARSE_FAIL')}});"
            exit 0
          fi
          echo "LIST_FAIL — likely missing Account D1:Edit (or Account:Read for list)"
          exit 1
