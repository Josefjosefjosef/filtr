<head>

  <title>infoUzel.cz</title>

  <meta http-equiv="refresh" content="0; url=/projects/" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0B1F33;
      color: transparent;
      font-size: 0;
      line-height: 0;
      overflow: hidden;
    }
    /* pojistka: i kdyby se někdo pokusil něco vložit */

  </style>

  <script>
    (function () {
      try {
        var target = "/projects/";
        if (location.pathname !== target) location.replace(target);
      } catch (e) {}
    })();
  </script>
