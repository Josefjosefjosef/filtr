<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>infoUzel.cz</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0B1F33;
      color: transparent;
      font-size: 0;
      line-height: 0;
      overflow: hidden;
    }
    /* pojistka: i kdyby se někdo pokusil něco vložit */
    body * { display: none !important; }
  </style>

  <script>
    (function () {
      try {
        var p = String(location.pathname || "").replace(/\\/g, "/");
        /* Fallback only when GitHub Pages deploy transform is absent.
           Production artifact replaces this file with projects/index.html (app at /).
           In raw git checkout, send users to /projects/ where the app shell still lives. */
        var target = "/projects/";
        if (p === target || p.indexOf("/projects/") === 0) return;
        var suffix = String(location.search || "") + String(location.hash || "");
        var host = String(location.hostname || "").toLowerCase();
        if (host === "www.infouzel.cz") {
          location.replace("https://infouzel.cz/projects/" + suffix);
          return;
        }
        location.replace(target + suffix);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <noscript></noscript>
</body>
</html>
